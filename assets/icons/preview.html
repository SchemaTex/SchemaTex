<title>Schematex · Diagram Icons</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#8a8a8a; --card:#fafafa; --border:#ececec; --accent:#f59e0b; }
  [data-theme="dark"] { --bg:#0f1115; --fg:#e8e8e8; --muted:#777; --card:#171a21; --border:#262b34; --accent:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px clamp(16px,4vw,56px) 64px; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  h1 { font-size:20px; margin:0; font-weight:650; }
  .sub { color:var(--muted); }
  .toolbar { position:sticky; top:0; z-index:5; display:flex; gap:18px; align-items:center; flex-wrap:wrap;
    padding:14px 0; margin-bottom:18px; background:var(--bg); border-bottom:1px solid var(--border); }
  .toolbar label { color:var(--muted); display:flex; align-items:center; gap:8px; }
  button { font:inherit; border:1px solid var(--border); background:var(--card); color:var(--fg);
    padding:6px 12px; border-radius:8px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:32px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px 12px 14px;
    border:1px solid var(--border); border-radius:12px; background:var(--card); position:relative; }
  .cell.is-new { border-color:var(--accent); }
  .cell .badge { position:absolute; top:8px; right:8px; font-size:10px; font-weight:600;
    color:var(--accent); letter-spacing:.04em; }
  .icobox { display:flex; align-items:center; gap:14px; min-height:52px; }
  .icobox svg { color:var(--fg); display:block; }
  .name { font-size:12px; color:var(--muted); }
</style>

<script>
  let size = 40, showPx = false;
  const tpls = [...document.querySelectorAll(".src")];
  function sized(svgText, px) {
    return svgText.replace(/\swidth="[^"]*"/, "").replace(/\sheight="[^"]*"/, "")
      .replace("<svg", '<svg width="' + px + '" height="' + px + '"');
  }
  function render(box) {
    const txt = box.dataset.svg; if (!txt) return;
    let html = sized(txt, size);
    if (showPx) html += sized(txt, 16);
    box.innerHTML = html;
  }
  function renderAll(){ document.querySelectorAll(".icobox").forEach(render); }
  function makeCell(name, isNew, svg) {
    const cell = document.createElement("div");
    cell.className = "cell" + (isNew ? " is-new" : "");
    if (isNew) { const b=document.createElement("span"); b.className="badge"; b.textContent="NEW"; cell.appendChild(b); }
    const box = document.createElement("div"); box.className="icobox"; box.dataset.svg=svg; cell.appendChild(box);
    const label = document.createElement("span"); label.className="name"; label.textContent=name; cell.appendChild(label);
    render(box); return cell;
  }
  const gNew = document.getElementById("grid-new"), gEx = document.getElementById("grid-existing");
  let nNew=0, nEx=0;
  for (const t of tpls) {
    const isNew = t.dataset.new === "true";
    const cell = makeCell(t.dataset.name, isNew, t.innerHTML.trim());
    if (isNew) { gNew.appendChild(cell); nNew++; } else { gEx.appendChild(cell); nEx++; }
  }
  document.getElementById("count").textContent = (nNew+nEx) + " icons · 24×24 grid · stroke 1.5";
  document.getElementById("theme").onclick = () => {
    const b=document.body; b.dataset.theme = b.dataset.theme==="dark" ? "light" : "dark";
  };
  const sizeEl = document.getElementById("size");
  sizeEl.oninput = () => { size=+sizeEl.value; document.getElementById("sizeval").textContent=size+"px"; renderAll(); };
  document.getElementById("showpx").onchange = (e) => { showPx=e.target.checked; renderAll(); };
</script>
