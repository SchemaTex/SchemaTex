<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-bd" viewBox="0 0 1114 290" width="1114" height="290" role="img" data-diagram-type="blockdiagram"><title>PID Closed-Loop Control System</title>
<desc>Block diagram with 3 blocks, 1 summing junctions, 6 signals</desc>
<defs><style>.schematex-bd { font-family: "Inter", "Helvetica Neue", Helvetica, sans-serif; }
.schematex-bd-block { stroke: #16202b; stroke-width: 1.5; }
.schematex-bd-tf { font-size: 14px; font-weight: 600; fill: #16202b; }
.schematex-bd-block-name { font: 10px sans-serif; fill: #63707f; }
.schematex-bd-sum { fill: #ffffff; stroke: #16202b; stroke-width: 1.5; }
.schematex-bd-sum-sign { font: bold 11px sans-serif; fill: #16202b; }
.schematex-bd-signal { stroke: #16202b; stroke-width: 1.5; fill: none; }
.schematex-bd-signal-discrete { stroke: #16202b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
.schematex-bd-signal-label-bg { fill: #ffffff; opacity: .94; stroke: none; }
.schematex-bd-signal-label { font-size: 12px; font-style: italic; fill: #63707f; }
.schematex-bd-port-label { font-size: 13px; fill: #16202b; }
.schematex-bd-title { font-size: 16px; font-weight: 700; fill: #16202b; }
.schematex-bd-branch { fill: #16202b; stroke: none; }</style>
<marker id="lt-bd-arrow" markerWidth="9" markerUnits="userSpaceOnUse" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#16202b"/></marker></defs>
<text x="34" y="24" text-anchor="start" class="schematex-bd-title">PID Closed-Loop Control System</text>
<g transform="translate(0, 40)"><g class="schematex-bd-signals"><path d="M 107 59 L 315 59" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="in" data-to="err"/>
<rect x="191" y="34" width="40" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="211" y="46" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="211" dy="0">R(s)</tspan></text>
<text x="307" y="64" text-anchor="middle" class="schematex-bd-sum-sign">+</text>
<path d="M 339 59 L 494 59" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="err" data-to="C"/>
<rect x="396.5" y="34" width="40" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="416.5" y="46" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="416.5" dy="0">E(s)</tspan></text>
<path d="M 620 59 L 724 59" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="C" data-to="G"/>
<rect x="652" y="34" width="40" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="672" y="46" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="672" dy="0">U(s)</tspan></text>
<path d="M 850 50 L 928.5 50 L 928.5 59 L 1007 59" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="G" data-to="out"/>
<rect x="947.75" y="34" width="40" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="967.75" y="46" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="967.75" dy="0">Y(s)</tspan></text>
<path d="M 850 68 L 902 68 L 902 155 L 954 155" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="G" data-to="H"/>
<rect x="908" y="130" width="40" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="928" y="142" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="928" dy="0">Y(s)</tspan></text>
<path d="M 1017 182 L 1017 216 L 327 216 L 327 71" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="H" data-to="err"/>
<rect x="334" y="134.5" width="58" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="363" y="146.5" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="363" dy="0">Y_m(s)</tspan></text>
<text x="319" y="81" text-anchor="middle" class="schematex-bd-sum-sign">+</text></g>
<g class="schematex-bd-nodes"><g transform="translate(494, 32)" data-block-id="C" data-block-role="controller"><rect width="126" height="54" fill="#dbeafe" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">C(s)</tspan></text></g>
<g transform="translate(724, 32)" data-block-id="G" data-block-role="plant"><rect width="126" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">G(s)</tspan></text></g>
<g transform="translate(954, 128)" data-block-id="H" data-block-role="sensor"><rect width="126" height="54" fill="#f3e8ff" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">H(s)</tspan></text></g>
<g data-sum-id="err"><circle cx="327" cy="59" r="12" class="schematex-bd-sum"/></g>
<g data-port-id="in"><text x="93" y="63" text-anchor="end" class="schematex-bd-port-label">in</text></g>
<g data-port-id="out"><text x="1021" y="63" text-anchor="start" class="schematex-bd-port-label">out</text></g></g>
<g class="schematex-bd-branches"><circle cx="850" cy="59" r="3.5" class="schematex-bd-branch"/></g></g></svg>