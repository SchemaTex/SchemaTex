.sx-pb-endzone { fill: rgba(255,255,255,0.10); }
.sx-pb-yardnum { font: 600 18px sans-serif; fill: rgba(255,255,255,0.85); }
.sx-pb-shot-double { stroke-width: 5; }
.sx-pb-shot-gap { fill: none; stroke: #6d9b73; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.sx-pb-rim { stroke: #f97316; stroke-width: 2.4; }
.sx-pb-pitch-dot { fill: #ffffff; }
.sx-pb-zone { fill: rgba(253,224,71,0.12); stroke: #fde047; stroke-width: 1.3; stroke-dasharray: 5 4; }
