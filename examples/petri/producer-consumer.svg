.sx-petri-rate { font: italic 9px sans-serif; fill: #475569; }
.sx-petri-arc { stroke: #334155; stroke-width: 2; fill: none; }
.sx-petri-arc-inhibitor, .sx-petri-arc-reset { stroke: #dc2626; }
.sx-petri-inhibitor-dot { fill: #ffffff; stroke: #dc2626; stroke-width: 2; }
.sx-petri-weight { font: 600 9px sans-serif; fill: #2563eb; }
.sx-petri-title { font: 700 16px sans-serif; fill: #0f172a; }</style>
