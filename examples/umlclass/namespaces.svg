.sx-umlclass-edge-name { fill: #475569; font-size: 12px; font-style: italic; }
.sx-umlclass-edge-name-halo { fill: #ffffff; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
.sx-umlclass-title { fill: #0f172a; font-size: 16px; font-weight: 700; }
.sx-umlclass-package { fill: rgba(100,116,139,0.06); stroke: #94a3b8; stroke-width: 1; }
.sx-umlclass-package-label { fill: #475569; font-size: 12px; font-weight: 600; }</style>
