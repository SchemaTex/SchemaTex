<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="550" height="452" viewBox="0 0 550 452" role="img" aria-label="Layered packages" data-diagram-type="umlclass"><title>Layered packages</title>
<desc>UML class diagram: 3 class; 2 directed.</desc>
<style>.sx-umlclass-bg { fill: #ffffff; }
