<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-diagram schematex-phylo" viewBox="0 0 360 226" width="360" height="226"><title>Dendrogram: Gene expression clusters</title>
<desc>Dendrogram with 5 taxa, dendrogram mode, rectangular layout, cut at 4 into 2 clusters</desc>
<style>.schematex-phylo {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
  font-family: system-ui, -apple-system, sans-serif;
}
.schematex-phylo-branch { fill: none; stroke: #0f172a; stroke-width: 2; stroke-linecap: round; }
.schematex-phylo-branch-connector { fill: none; stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-dendro-axis line { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-dendro-axis text { font-size: 10px; fill: #475569; text-anchor: middle; }
.schematex-phylo-dendro-cut { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.schematex-phylo-dendro-cut-label { font-size: 10px; fill: #dc2626; text-anchor: start; }
.schematex-phylo-clade-cut0 { stroke: #2563eb; }
.schematex-phylo-clade-cut1 { stroke: #059669; }
.schematex-phylo-clade-cut2 { stroke: #d97706; }
.schematex-phylo-clade-cut3 { stroke: #7c3aed; }
.schematex-phylo-clade-cut4 { stroke: #dc2626; }
.schematex-phylo-clade-cut5 { stroke: #0891b2; }
.schematex-phylo-clade-cut6 { stroke: #db2777; }
.schematex-phylo-clade-cut7 { stroke: #475569; }
.schematex-phylo-tip-label { font-size: 12px; fill: #0f172a; dominant-baseline: central; }
.schematex-phylo-tip-label-italic { font-style: italic; }
.schematex-phylo-support-label { font-size: 9px; fill: #475569; text-anchor: middle; dominant-baseline: auto; }
.schematex-phylo-support-dot { stroke: none; }
.schematex-phylo-scale-bar line { stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-scale-bar text { font-size: 10px; fill: #0f172a; text-anchor: middle; }
.schematex-phylo-scale-tick { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-title { font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
.schematex-phylo-clade-label { font-size: 13px; font-weight: bold; }
.schematex-phylo-root-marker { fill: none; stroke: #0f172a; stroke-width: 2; }</style>
<text x="180" y="20" class="schematex-phylo-title">Gene expression clusters</text>
<g class="schematex-phylo-branches" transform="translate(0,30)"><path d="M 20,54 V 108" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 20,54 H 124" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut0"/>
<path d="M 20,108 H 176" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut1"/>
<path d="M 124,36 V 72" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 124,36 H 228" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut0"/>
<path d="M 124,72 H 280" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut0"/>
<path d="M 228,24 V 48" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 228,24 H 280" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut0"/>
<path d="M 228,48 H 280" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut0"/>
<path d="M 176,96 V 120" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 176,96 H 280" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut1"/>
<path d="M 176,120 H 280" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-cut1"/></g>
<g class="schematex-phylo-nodes" transform="translate(0,30)"><circle cx="20" cy="81" r="5" class="schematex-phylo-root-marker"/></g>
<g class="schematex-phylo-labels" transform="translate(0,30)"><text x="286" y="24" class="schematex-phylo-tip-label" data-taxon-id="A">A</text>
<text x="286" y="48" class="schematex-phylo-tip-label" data-taxon-id="B">B</text>
<text x="286" y="72" class="schematex-phylo-tip-label" data-taxon-id="C">C</text>
<text x="286" y="96" class="schematex-phylo-tip-label" data-taxon-id="D">D</text>
<text x="286" y="120" class="schematex-phylo-tip-label" data-taxon-id="E">E</text></g>
<g transform="translate(0,30)"><g class="schematex-phylo-dendro-axis"><line x1="20" y1="168" x2="280" y2="168"/>
<line x1="280" y1="168" x2="280" y2="172"/>
<text x="280" y="184" text-anchor="middle">0</text>
<line x1="228" y1="168" x2="228" y2="172"/>
<text x="228" y="184" text-anchor="middle">1</text>
<line x1="176" y1="168" x2="176" y2="172"/>
<text x="176" y="184" text-anchor="middle">2</text>
<line x1="124" y1="168" x2="124" y2="172"/>
<text x="124" y="184" text-anchor="middle">3</text>
<line x1="72" y1="168" x2="72" y2="172"/>
<text x="72" y="184" text-anchor="middle">4</text>
<line x1="20" y1="168" x2="20" y2="172"/>
<text x="20" y="184" text-anchor="middle">5</text>
<text x="150" y="196" text-anchor="middle" font-size="9" fill="#475569">cluster distance</text></g></g>
<g transform="translate(0,30)"><g><line x1="72" y1="8" x2="72" y2="164" class="schematex-phylo-dendro-cut"/>
<text x="76" y="12" class="schematex-phylo-dendro-cut-label">cut = 4</text></g></g></svg>