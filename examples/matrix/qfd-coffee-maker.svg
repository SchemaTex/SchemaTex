<text x="211" y="24" class="sx-matrix-title" text-anchor="middle">Coffee maker</text>
<g class="sx-qfd-roof"><title>Roof: engineering correlation matrix</title>
<g class="sx-qfd-roof-pair" data-pair="0,1" data-corr="--"><title>Fan RPM ↔ Heater watts: strong negative</title>
<polygon points="306,106.5 329,129.5 306,152.5 283,129.5" class="sx-qfd-roof-cell-filled"/>
