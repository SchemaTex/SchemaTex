<g class="sx-qfd-roof-pair" data-pair="1,2" data-corr="+"><title>Heater watts ↔ Insulation: positive</title>
<polygon points="352,106.5 375,129.5 352,152.5 329,129.5" class="sx-qfd-roof-cell-filled"/>
