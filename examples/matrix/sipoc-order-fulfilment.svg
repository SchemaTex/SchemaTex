<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-matrix sx-sipoc" data-diagram-type="matrix" data-mode="sipoc" width="888" height="304" viewBox="0 0 888 304" role="graphics-document"><title>SIPOC — Order fulfilment</title>
<desc>SIPOC scoping table — 2 supplier(s), 2 input(s), 4 process step(s), 2 output(s), 2 customer(s)</desc>
