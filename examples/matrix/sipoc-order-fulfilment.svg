<rect x="360" y="236" width="168" height="44" class="sx-sipoc-process"/>
<text x="444" y="258" class="sx-sipoc-step">4. Ship</text></g>
<rect x="528" y="64" width="168" height="40" fill="#0891b2" class="sx-sipoc-headbox"/>
<text x="612" y="84" class="sx-sipoc-header">Outputs</text>
