<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schematex · P&ID Preview</title>
<style>
  body { font-family: system-ui; background: #f5f5f5; margin: 0; padding: 20px; }
  nav { font-size: 13px; color: #888; margin-bottom: 16px; }
  nav a { color: #555; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  h1 { font-size: 18px; color: #333; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
  h2 { font-size: 14px; color: #666; margin-top: 30px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  pre.src { background: #f7f7f7; padding: 10px; font-size: 12px; border-radius: 6px; margin: 6px 0; border: 1px solid #eee; white-space: pre-wrap; }
  .svg-container { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 10px 0; overflow-x: auto; }
  .svg-container svg { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
<nav><a href="index.html">← All Diagrams</a></nav>
<h1>Piping &amp; Instrumentation Diagram (P&amp;ID)</h1>
<div class="subtitle">ISA-5.1 / ISO 10628 — equipment, valves, instrument bubbles (4 categories), process / signal lines, manhattan routing.</div>
<div id="output"></div>
<script type="module">
import { render } from '../src/index.ts';

const cases = [
  ['TC-PID-01 · Tank → pump → control valve', `pid "Pump with Flow Control"

equip T-101 : tank_atm [tag: "Feed Tank"]
equip P-101 : pump_centrifugal [tag: "P-101"]
equip V-101 : valve_control [tag: "V-101"]
equip F-101 : filter [tag: "Filter"]
equip V-201 : vessel_v [tag: "V-201"]

line L1 from T-101.bottom to P-101.in [size: "4\\"", service: "water", type: "process"]
line L2 from P-101.out to V-101.in [size: "4\\"", type: "process"]
line L3 from V-101.out to F-101.in [size: "4\\"", type: "process"]
line L4 from F-101.out to V-201.in [size: "4\\"", type: "process"]

inst FT-101 : field_discrete
  measures P-101
inst FIC-101 : cr_shared
  controls V-101`],

  ['TC-PID-02 · 4 instrument categories side by side', `pid "Instrument Bubble Catalog"

equip V-1 : vessel_v [tag: "V-1"]
equip V-2 : vessel_v [tag: "V-2"]
equip V-3 : vessel_v [tag: "V-3"]
equip V-4 : vessel_v [tag: "V-4"]

inst FT-101 : field_discrete
  measures V-1
inst FIC-102 : cr_shared
  measures V-2
inst FY-103 : cr_computer
  measures V-3
inst FZ-104 : cr_plc
  measures V-4`],

  ['TC-PID-03 · Distillation column with reboiler & condenser', `pid "Distillation T-201"

equip T-201 : column_tray [tag: "T-201"]
equip E-201 : condenser [tag: "Overhead Cond"]
equip D-201 : vessel_h [tag: "Reflux Drum"]
equip P-201 : pump_centrifugal [tag: "Reflux Pump"]
equip E-202 : reboiler [tag: "Reboiler"]

line L1 from T-201.top to E-201.shell_in [size: "8\\"", service: "vapor", type: "process"]
line L2 from E-201.shell_out to D-201.in [size: "8\\"", type: "process"]
line L3 from D-201.bottom to P-201.in [size: "3\\"", type: "process"]
line L4 from P-201.out to T-201.reflux [size: "3\\"", type: "process"]
line L5 from T-201.bottom to E-202.in [size: "6\\"", type: "process"]

inst PT-201 : field_discrete
  measures T-201
inst LIC-201 : cr_shared
  measures D-201
inst TIC-201 : cr_shared
  measures T-201`],

  ['TC-PID-04 · All 5 line types', `pid "Line Type Catalog"

equip A : vessel_v [tag: "A"]
equip B : vessel_v [tag: "B"]
equip C : vessel_v [tag: "C"]
equip D : vessel_v [tag: "D"]
equip E : vessel_v [tag: "E"]
equip F : vessel_v [tag: "F"]

line p1 from A.right to B.left [type: "process"]
line p2 from B.right to C.left [type: "process_minor"]
line p3 from C.right to D.left [type: "pneumatic"]
line p4 from D.right to E.left [type: "electric"]
line p5 from E.right to F.left [type: "capillary"]`],

  ['TC-PID-05 · Safety relief valve + pressure transmitter', `pid "Pressure Relief"

equip V-301 : vessel_v [tag: "V-301"]
equip V-303 : valve_psv [tag: "V-303 · 150 psig"]
equip V-302 : valve_control [tag: "V-302 (FC)"]
equip B-301 : tank_atm [tag: "Blowdown"]

line L1 from V-301.top to V-303.in [size: "3\\"", type: "process"]
line L2 from V-303.out to B-301.top [size: "3\\"", type: "process"]
line L3 from V-301.right to V-302.in [size: "4\\"", type: "process"]

inst PT-301 : field_discrete
  measures V-301
inst PSHH-301 : cr_plc
  measures V-301
  controls V-302`],

  ['TC-PID-06 · Valve symbol catalog', `pid "Valve Catalog"

equip V1 : valve_gate [tag: "Gate"]
equip V2 : valve_ball [tag: "Ball"]
equip V3 : valve_globe [tag: "Globe"]
equip V4 : valve_butterfly [tag: "Butterfly"]
equip V5 : valve_check [tag: "Check"]
equip V6 : valve_control [tag: "Control"]
equip V7 : valve_psv [tag: "PSV"]`],

  ['TC-PID-07 · Reactor + filter chain with line tags', `pid "CSTR Reactor Train"

equip T-1 : tank_atm [tag: "Feed Tank"]
equip P-1 : pump_centrifugal [tag: "P-1"]
equip R-1 : reactor_cstr [tag: "R-1"]
equip F-1 : filter [tag: "Polish Filter"]
equip V-1 : vessel_h [tag: "Storage"]

line L1 from T-1.bottom to P-1.in [size: "4\\"", service: "feed", tag: "4\\"-FD-101-A"]
line L2 from P-1.out to R-1.in [size: "4\\"", service: "feed", tag: "4\\"-FD-102-A"]
line L3 from R-1.bottom to F-1.in [size: "4\\"", service: "product", tag: "4\\"-PR-201-B"]
line L4 from F-1.out to V-1.in [size: "4\\"", service: "product", tag: "4\\"-PR-202-B"]

inst TIC-101 : cr_shared
  measures R-1
inst FT-101 : field_discrete
  measures P-1`],

  ['TC-PID-08 · Specialty equipment showcase', `pid "Equipment Catalog"

equip T1 : tank_cone_roof [tag: "Cone Roof"]
equip T2 : sphere [tag: "Sphere"]
equip T3 : column_packed [tag: "Packed Col"]
equip H1 : hx_air_cooled [tag: "Air Cooler"]
equip C1 : compressor [tag: "Compressor"]
equip CY : cyclone [tag: "Cyclone"]
equip CT : cooling_tower [tag: "Cooling Twr"]
equip FL : flare [tag: "Flare"]`],
];

const out = document.getElementById('output');
for (const [title, src] of cases) {
  const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
  const pre = document.createElement('pre'); pre.className = 'src'; pre.textContent = src; out.appendChild(pre);
  const div = document.createElement('div'); div.className = 'svg-container';
  try {
    div.innerHTML = render(src);
  } catch (e) {
    div.innerHTML = '<code style="color:#c00">' + (e.message || e) + '</code>';
  }
  out.appendChild(div);
}
</script>
</body>
</html>
