<path d="M 550,125 L 618,125 L 618,160 L 630,160" class="schematex-logic-wire-clearance"/><path d="M 550,125 L 618,125 L 618,160 L 630,160" class="schematex-logic-wire" data-from="Cout" data-to="$out$Cout"/></g>
