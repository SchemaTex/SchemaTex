<path d="M 60,125 L 142,125 L 142,190 L 180,190" class="schematex-logic-wire-clearance"/><path d="M 60,125 L 142,125 L 142,190 L 180,190" class="schematex-logic-wire" data-from="B" data-to="c1"/>
