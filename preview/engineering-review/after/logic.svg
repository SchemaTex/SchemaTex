<path d="M 60,125 L 148,125 L 148,90 L 172,90" class="schematex-logic-wire-clearance"/><path d="M 60,125 L 148,125 L 148,90 L 172,90" class="schematex-logic-wire" data-from="B" data-to="s1"/>
<path d="M 230,75 L 308,75 L 308,60 L 332,60" class="schematex-logic-wire-clearance"/><path d="M 230,75 L 308,75 L 308,60 L 332,60" class="schematex-logic-wire" data-from="s1" data-to="Sum"/>
