<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schematex · State Diagram Preview</title>
<style>
  body { font-family: system-ui; background: #f5f5f5; margin: 0; padding: 20px; }
  nav { font-size: 13px; color: #888; margin-bottom: 16px; }
  nav a { color: #555; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  h1 { font-size: 18px; color: #333; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
  h2 { font-size: 14px; color: #666; margin-top: 30px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  pre.src { background: #f7f7f7; padding: 10px; font-size: 12px; border-radius: 6px; margin: 6px 0; border: 1px solid #eee; white-space: pre-wrap; }
  .svg-container { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 10px 0; overflow-x: auto; }
  .svg-container svg { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
<nav><a href="index.html">← All Diagrams</a></nav>
<h1>State Diagram</h1>
<div class="subtitle">UML 2.5 / Harel statechart — simple states, composite, pseudo-states (initial / final / choice / fork / join / history), transitions with trigger [guard] / action.</div>
<div id="output"></div>
<script type="module">
import { render } from '../src/index.ts';

const cases = [
  ['TC-ST-01 · Minimal traffic light', `state "Traffic Light" [direction: LR]

initial i
final f

i -> Red
Red -> Green : timer
Green -> Yellow : timer
Yellow -> Red : timer
Red -> f : power_off`],

  ['TC-ST-02 · Mermaid [*] alias', `state

[*] -> Loading
Loading -> Ready : ok
Ready -> [*]`],

  ['TC-ST-03 · Login flow with guard + action', `state "Login Flow"

initial i
i -> Idle

Idle -> Authenticating : submit [form_valid] / clearErrors()
Authenticating -> Authenticated : ok / storeToken()
Authenticating -> Idle : fail [retries < 3] / incrementRetries()
Authenticating -> Locked : fail [retries >= 3]

choice Decide
Authenticated -> Decide
Decide -> Admin : [role == "admin"]
Decide -> User  : [role == "user"]`],

  ['TC-ST-04 · Composite state with entry/exit/do activities', `state "Media Player"

initial i
i -> Stopped

Stopped -> Playing : play / loadSource()
Playing -> Paused : pause
Paused -> Playing : play
Playing -> Stopped : stop / releaseSource()

composite Playing {
  entry / startBuffer()
  exit / stopBuffer()
  do / decodeFrames()

  initial pi
  pi -> Buffering
  Buffering -> Streaming : buffer_full
  Streaming -> Buffering : underflow
}`],

  ['TC-ST-05 · Fork / Join', `state "Session" [direction: LR]

initial i
fork F
join J
final f

i -> F
F -> A
F -> B
A -> J : done_a
B -> J : done_b
J -> f`],

  ['TC-ST-06 · Choice pseudo-state', `state "Role Routing"

choice C
initial i
i -> C
C -> Admin : [role == "admin"]
C -> Guest : [role == "guest"]
C -> User  : [role == "user"]`],

  ['TC-ST-07 · History pseudo-state', `state "Document Editor"

initial i
i -> Editing

composite Editing {
  history H
  initial ei
  ei -> Normal
  Normal -> Selecting : click_drag
  Selecting -> Normal : release
  Normal -> Inserting : key_press
  Inserting -> Normal : escape
}

Editing -> Paused : user_idle
Paused -> H : user_active`],

  ['TC-ST-08 · Self-transition + Notes', `state "Auth Flow"

initial i
i -> Idle
Idle -> Idle : poll / refresh()
Idle -> Checking : submit
Checking -> Idle : fail
Checking -> Done : ok

note right_of Checking : Calls /api/verify synchronously.
note left_of Idle : Anonymous user landing state`],

  ['TC-ST-09 · Top-down direction', `state "Order Lifecycle" [direction: TB]

initial i
final f

i -> Pending
Pending -> Paid : pay [amount > 0] / charge()
Paid -> Shipped : ship
Shipped -> Delivered : confirm
Delivered -> f
Pending -> Cancelled : cancel / refund()
Cancelled -> f`],

  ['TC-ST-10 · Terminate + Junction', `state "Critical Process"

initial i
junction J
terminate T

i -> Running
Running -> J : event
J -> Recovered : [recoverable]
J -> T : [fatal]`],
];

const out = document.getElementById('output');
for (const [title, src] of cases) {
  const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
  const pre = document.createElement('pre'); pre.className = 'src'; pre.textContent = src; out.appendChild(pre);
  const div = document.createElement('div'); div.className = 'svg-container';
  try {
    div.innerHTML = render(src);
  } catch (e) {
    div.innerHTML = '<code style="color:#c00">' + (e.message || e) + '</code>';
  }
  out.appendChild(div);
}
</script>
</body>
</html>
