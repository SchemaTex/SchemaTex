<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">555 Astable LED Flasher — ideal visual contract</title>
  <desc id="desc">An electrically coherent 555 astable circuit with shared rails, orthogonal wiring, and collision-free labels.</desc>
  <defs>
    <style>
      .wire{fill:none;stroke:#19242f;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
      .body{fill:#fff;stroke:#19242f;stroke-width:4}
      .junction{fill:#19242f}
      .title{font:700 34px 'IBM Plex Sans','Helvetica Neue',sans-serif;fill:#19242f}
      .label{font:600 22px 'IBM Plex Sans','Helvetica Neue',sans-serif;fill:#19242f}
      .value{font:400 19px 'IBM Plex Sans','Helvetica Neue',sans-serif;fill:#4b5865}
      .pin{font:600 17px 'IBM Plex Sans','Helvetica Neue',sans-serif;fill:#19242f}
      .pin-no{font:500 14px 'IBM Plex Mono','SFMono-Regular',monospace;fill:#65727f}
      .rail{font:700 20px 'IBM Plex Mono','SFMono-Regular',monospace;fill:#23658a}
      .note{font:500 15px 'IBM Plex Sans','Helvetica Neue',sans-serif;fill:#65727f}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#19242f"/></marker>
  </defs>
  <rect width="1400" height="1000" fill="#fff"/>
  <text x="700" y="55" text-anchor="middle" class="title">555 Astable LED Flasher</text>

  <path class="wire" d="M110 110H1290 M110 900H1290"/>
  <circle class="body" cx="95" cy="110" r="10"/><circle class="body" cx="95" cy="900" r="10"/>
  <text x="30" y="118" class="rail">+9 V</text><text x="30" y="908" class="rail">GND</text>

  <!-- BAT1 across the rails -->
  <path class="wire" d="M175 110V325 M175 515V900"/>
  <line class="wire" x1="145" y1="360" x2="205" y2="360"/><line class="wire" x1="158" y1="385" x2="192" y2="385"/>
  <line class="wire" x1="145" y1="425" x2="205" y2="425"/><line class="wire" x1="158" y1="450" x2="192" y2="450"/>
  <path class="wire" d="M175 325V360 M175 450V515"/>
  <circle class="junction" cx="175" cy="110" r="7"/><circle class="junction" cx="175" cy="900" r="7"/>
  <text x="132" y="340" class="label">BAT1</text><text x="140" y="492" class="value">9 V</text>
  <text x="216" y="365" class="label">+</text><text x="216" y="455" class="label">−</text>

  <!-- Functionally arranged 555 block -->
  <rect class="body" x="530" y="235" width="310" height="465" rx="3"/>
  <text x="685" y="440" text-anchor="middle" class="label">U1</text><text x="685" y="472" text-anchor="middle" class="value">NE555</text>
  <path class="wire" d="M490 330H530 M490 410H530 M490 490H530"/>
  <text x="550" y="337" class="pin">DISCH</text><text x="510" y="317" class="pin-no">7</text>
  <text x="550" y="417" class="pin">TRIG</text><text x="510" y="397" class="pin-no">2</text>
  <text x="550" y="497" class="pin">THR</text><text x="510" y="477" class="pin-no">6</text>
  <path class="wire" d="M840 390H880 M840 545H880"/>
  <text x="820" y="397" text-anchor="end" class="pin">OUT</text><text x="852" y="377" class="pin-no">3</text>
  <text x="820" y="552" text-anchor="end" class="pin">CTRL</text><text x="852" y="532" class="pin-no">5</text>
  <path class="wire" d="M650 235V110 M740 235V110 M685 700V900"/>
  <circle class="junction" cx="650" cy="110" r="7"/><circle class="junction" cx="740" cy="110" r="7"/><circle class="junction" cx="685" cy="900" r="7"/>
  <text x="650" y="270" text-anchor="middle" class="pin">VCC</text><text x="632" y="220" class="pin-no">8</text>
  <text x="740" y="270" text-anchor="middle" class="pin">RESET</text><text x="722" y="220" class="pin-no">4</text>
  <text x="685" y="675" text-anchor="middle" class="pin">GND</text><text x="700" y="720" class="pin-no">1</text>

  <!-- R1: +9 V to DISCH -->
  <path class="wire" d="M350 110V155 L338 167 L362 185 L338 203 L362 221 L338 239 L362 257 L350 269 V330H490"/>
  <circle class="junction" cx="350" cy="110" r="7"/><circle class="junction" cx="350" cy="330" r="7"/>
  <text x="385" y="205" class="label">R1</text><text x="385" y="233" class="value">10 kΩ</text>

  <!-- R2: DISCH to timing node -->
  <path class="wire" d="M350 330V350 L338 362 L362 380 L338 398 L362 416 L338 434 L362 452 L350 464 V490H490"/>
  <text x="385" y="407" class="label">R2</text><text x="385" y="435" class="value">100 kΩ</text>

  <!-- TRIG and THR share the timing node -->
  <path class="wire" d="M490 410H430V490"/>
  <circle class="junction" cx="430" cy="490" r="7"/><circle class="junction" cx="350" cy="490" r="7"/>
  <text x="300" y="520" class="note">TIMING</text>

  <!-- C1: timing node to GND -->
  <path class="wire" d="M350 490V610 M318 610H382 M318 634H382 M350 634V900"/>
  <circle class="junction" cx="350" cy="900" r="7"/>
  <text x="397" y="615" class="label">C1</text><text x="397" y="643" class="value">10 µF</text><text x="318" y="598" class="label">+</text>

  <!-- C2: CTRL bypass to GND -->
  <path class="wire" d="M880 545H925V650 M893 650H957 M893 674H957 M925 674V900"/>
  <circle class="junction" cx="925" cy="900" r="7"/>
  <text x="975" y="655" class="label">C2</text><text x="975" y="683" class="value">10 nF</text>

  <!-- OUT through R3 and LED1 to GND -->
  <path class="wire" d="M880 390H1080V430 L1068 442 L1092 460 L1068 478 L1092 496 L1068 514 L1092 532 L1080 544V620"/>
  <text x="1115" y="480" class="label">R3</text><text x="1115" y="508" class="value">470 Ω</text>
  <path class="wire" d="M1080 620V650 M1048 650H1112 L1080 702 Z M1048 702H1112 M1080 702V900"/>
  <path class="wire" d="M1110 656L1140 631 M1118 676L1148 651" marker-end="url(#arrow)"/>
  <circle class="junction" cx="1080" cy="900" r="7"/><text x="1155" y="694" class="label">LED1</text>

  <text x="700" y="963" text-anchor="middle" class="note">Shared rails · explicit junctions · orthogonal wires · collision-free labels</text>
</svg>
