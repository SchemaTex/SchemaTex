<svg xmlns="http://www.w3.org/2000/svg" width="104" height="72" viewBox="0 0 104 72" role="img">
<title>Schmitt-trigger buffer</title>
<desc>Schmitt-trigger buffer, IEEE 91 logic convention; IEEE 315-1975 §16.2 triangle context only. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: in (8,36), out (96,36).</desc>
<path d="M 24,8 L 80,36 L 24,64 Z" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="8" y1="36" x2="24" y2="36" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="80" y1="36" x2="96" y2="36" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="34,44 42,44 42,28 54,28" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="34,44 48,44 48,28 54,28" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
