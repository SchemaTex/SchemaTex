<svg xmlns="http://www.w3.org/2000/svg" width="136" height="96" viewBox="0 0 136 96" role="img">
<title>Oscilloscope</title>
<desc>Oscilloscope, IEEE 315-1975 §12.1. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (32,8), end (32,88).</desc>
<circle cx="32" cy="48" r="24" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="32" y1="8" x2="32" y2="24" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="32" y1="72" x2="32" y2="88" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 18,48 C 23,35 27,35 32,48 C 37,61 41,61 46,48" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="68" y="54" font-size="18" fill="#17212B">SCOPE</text>
</g>
</svg>
