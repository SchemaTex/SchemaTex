<svg xmlns="http://www.w3.org/2000/svg" width="48" height="80" viewBox="0 0 48 80" role="img">
<title>Varactor</title>
<desc>Varactor, IEEE 315-1975 §8.5.2. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (24,8), end (24,72).</desc>
<line x1="24" y1="8" x2="24" y2="20" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 8,20 L 40,20 L 24,48 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="8" y1="48" x2="40" y2="48" stroke="#17212B" stroke-width="3" stroke-linecap="round"/>
<line x1="8" y1="56" x2="40" y2="56" stroke="#17212B" stroke-width="3.5" stroke-linecap="round"/>
<line x1="24" y1="56" x2="24" y2="72" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
