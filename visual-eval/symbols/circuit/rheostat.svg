<line x1="33" y1="98" x2="33" y2="108" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="86" x2="58" y2="30" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 58,30 L 53.82,43.69 L 44.87,35.7 Z" fill="#17212B"/>
