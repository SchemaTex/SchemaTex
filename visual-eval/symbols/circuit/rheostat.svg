<svg xmlns="http://www.w3.org/2000/svg" width="66" height="116" viewBox="0 0 66 116" role="img">
<title>Rheostat</title>
<desc>Rheostat, IEEE 315-1975 §2.1.4 continuously adjustable resistor, rheostat. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (33,8), end (33,108).</desc>
