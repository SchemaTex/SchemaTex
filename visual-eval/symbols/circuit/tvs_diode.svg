<svg xmlns="http://www.w3.org/2000/svg" width="58" height="88" viewBox="0 0 58 88" role="img">
<title>TVS diode</title>
<desc>TVS diode, IEEE 315-1975 §8.5.6.2 bidirectional breakdown diode. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (29,8), end (29,80).</desc>
<line x1="29" y1="8" x2="29" y2="20" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="29" y1="68" x2="29" y2="80" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 13,20 L 45,20 L 29,40 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 13,68 L 45,68 L 29,48 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="8,47 13,40 45,40 50,33" fill="none" stroke="#17212B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="8,55 13,48 45,48 50,41" fill="none" stroke="#17212B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="29" y1="40" x2="29" y2="48" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
