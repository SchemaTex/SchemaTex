<svg xmlns="http://www.w3.org/2000/svg" width="96" height="86" viewBox="0 0 96 86" role="img">
<title>Mains socket</title>
<desc>Mains socket, IEC 60617-11 socket-outlet convention. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (8,58), end (88,58).</desc>
<path d="M 24,38 A 20,20 0 0 1 24,78" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="8" y1="58" x2="24" y2="58" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="24" y1="58" x2="72" y2="58" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="72" y1="58" x2="88" y2="58" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="72" y1="42" x2="72" y2="74" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="48" y="22" font-size="18" fill="#17212B" text-anchor="middle">SOCKET</text>
</g>
</svg>
