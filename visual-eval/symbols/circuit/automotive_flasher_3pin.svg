<svg xmlns="http://www.w3.org/2000/svg" width="132" height="118" viewBox="0 0 132 118" role="img">
<title>Automotive flasher, 3-pin</title>
<desc>Automotive flasher, 3-pin, IEEE 315-1975 §4.22 interrupter context; §16.1 functional assembly block. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: b (8,72), l (124,50), p (124,94).</desc>
<rect x="24" y="34" width="84" height="76" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="72" x2="24" y2="72" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="108" y1="50" x2="124" y2="50" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="108" y1="94" x2="124" y2="94" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="32" y="78" font-size="18" fill="#17212B">B</text>
<text x="84" y="56" font-size="18" fill="#17212B">L</text>
<text x="84" y="100" font-size="18" fill="#17212B">P</text>
<text x="66" y="22" font-size="18" fill="#17212B" text-anchor="middle">FLASHER</text>
</g>
</svg>
