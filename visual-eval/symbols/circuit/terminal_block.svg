<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160" role="img">
<title>Terminal block (4 terminals)</title>
<desc>Terminal block (4 terminals), IEEE 315-1975 §5.1.1.1 terminal board or terminal strip, with terminals shown. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: terminal 1 (8,26), terminal 2 (8,62), terminal 3 (8,98), terminal 4 (8,134).</desc>
<rect x="24" y="8" width="64" height="144" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="24" y1="44" x2="88" y2="44" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="24" y1="80" x2="88" y2="80" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="24" y1="116" x2="88" y2="116" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="26" x2="39.5" y2="26" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="44" cy="26" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="62" x2="39.5" y2="62" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="44" cy="62" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="98" x2="39.5" y2="98" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="44" cy="98" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="134" x2="39.5" y2="134" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="44" cy="134" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="68" y="31" font-size="14" fill="#52606D" text-anchor="middle">1</text>
<text x="68" y="67" font-size="14" fill="#52606D" text-anchor="middle">2</text>
<text x="68" y="103" font-size="14" fill="#52606D" text-anchor="middle">3</text>
<text x="68" y="139" font-size="14" fill="#52606D" text-anchor="middle">4</text>
</g>
