<svg xmlns="http://www.w3.org/2000/svg" width="272" height="324" viewBox="0 0 272 324" role="img">
<title>555 timer</title>
<desc>555 timer, IEEE 315-1975 §16.1 functional circuit element, rectangular IC block. Drawn at U1's place in the Schematex circuit exemplar (exemplar viewBox 656 353 272 324) with the same pins, revised as the manifest notes say; one unit is one exemplar pixel. Pins: gnd (136,283), trg (8,147), out (264,115), rst (184,11), ctl (264,207), thr (8,207), dis (8,87), vcc (88,11).</desc>
<rect x="24" y="27" width="224" height="240" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="136" y1="267" x2="136" y2="283" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="147" x2="24" y2="147" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="248" y1="115" x2="264" y2="115" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="184" y1="11" x2="184" y2="27" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="248" y1="207" x2="264" y2="207" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="207" x2="24" y2="207" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="87" x2="24" y2="87" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="88" y1="11" x2="88" y2="27" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="136" y="255" font-size="15" fill="#17212B" text-anchor="middle">GND</text>
<text x="129" y="281" font-size="14" fill="#52606D" text-anchor="end">1</text>
<text x="36" y="152" font-size="15" fill="#17212B">TRIG</text>
<text x="16" y="140" font-size="14" fill="#52606D" text-anchor="middle">2</text>
<text x="236" y="120" font-size="15" fill="#17212B" text-anchor="end">OUT</text>
<text x="256" y="108" font-size="14" fill="#52606D" text-anchor="middle">3</text>
<text x="184" y="49" font-size="15" fill="#17212B" text-anchor="middle">RESET</text>
<text x="177" y="19" font-size="14" fill="#52606D" text-anchor="end">4</text>
<text x="236" y="212" font-size="15" fill="#17212B" text-anchor="end">CTRL</text>
<text x="256" y="200" font-size="14" fill="#52606D" text-anchor="middle">5</text>
<text x="36" y="212" font-size="15" fill="#17212B">THR</text>
<text x="16" y="200" font-size="14" fill="#52606D" text-anchor="middle">6</text>
<text x="36" y="92" font-size="15" fill="#17212B">DISCH</text>
<text x="16" y="80" font-size="14" fill="#52606D" text-anchor="middle">7</text>
<text x="88" y="49" font-size="15" fill="#17212B" text-anchor="middle">VCC</text>
<text x="81" y="19" font-size="14" fill="#52606D" text-anchor="end">8</text>
<text x="136" y="311" font-size="18" fill="#17212B" text-anchor="middle">555 TIMER</text>
</g>
</svg>
