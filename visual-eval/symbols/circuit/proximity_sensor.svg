<svg xmlns="http://www.w3.org/2000/svg" width="124" height="98" viewBox="0 0 124 98" role="img">
<title>Proximity sensor</title>
<desc>Proximity sensor, No dedicated IEEE 315 section; IEC 60617 part 7 proximity-detector convention. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (8,62), end (116,62).</desc>
<rect x="24" y="34" width="76" height="56" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="62" x2="24" y2="62" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="100" y1="62" x2="116" y2="62" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 62,48 Q 74,62 62,76 M 72,42 Q 90,62 72,82" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="62" y="22" font-size="18" fill="#17212B" text-anchor="middle">PROX</text>
</g>
</svg>
