<svg xmlns="http://www.w3.org/2000/svg" width="116" height="116" viewBox="0 0 116 116" role="img">
<title>PTC thermistor</title>
<desc>PTC thermistor, IEEE 315-1975 §2.1.12.1.3 positive-temperature-coefficient thermistor. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (36,8), end (36,108).</desc>
<polyline points="36,18 36,28 47,33 25,43 47,53 25,63 47,73 25,83 36,88 36,98" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="36" y1="8" x2="36" y2="18" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="36" y1="98" x2="36" y2="108" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="8,76 16,84 56,32 64,40" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="72" y="64" font-size="18" fill="#17212B">PTC</text>
</g>
</svg>
