<svg xmlns="http://www.w3.org/2000/svg" width="98" height="88" viewBox="0 0 98 88" role="img">
<title>Solar cell</title>
<desc>Solar cell, IEEE 315-1975 §8.7 photovoltaic cell; §1.3.1 radiation. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: plus (44,8), minus (44,80).</desc>
