<line x1="44" y1="52" x2="44" y2="80" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="72" y1="14" x2="56" y2="30" stroke="#17212B" stroke-width="2" stroke-linecap="round"/>
<path d="M 56,30 L 58.83,21.51 L 64.49,27.17 Z" fill="#17212B"/>
