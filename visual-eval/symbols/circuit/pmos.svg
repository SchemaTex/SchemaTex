<svg xmlns="http://www.w3.org/2000/svg" width="96" height="80" viewBox="0 0 96 80" role="img">
<title>P-channel MOSFET (enhancement)</title>
<desc>P-channel MOSFET (enhancement), IEEE 315-1975 §8.6.11 P-channel insulated-gate FET: §8.2.3 enhancement channel, §8.2.8 insulated gate, bulk tied to source. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: drain (88,72), gate (8,40), source (88,8).</desc>
