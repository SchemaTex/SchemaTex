<svg xmlns="http://www.w3.org/2000/svg" width="76" height="96" viewBox="0 0 76 96" role="img">
<title>Triac</title>
<desc>Triac, IEEE 315-1975 §8.6.15 bidirectional triode thyristor. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: mt1 (40,8), mt2 (40,88), g (8,20).</desc>
<line x1="40" y1="8" x2="40" y2="32" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="40" y1="64" x2="40" y2="88" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="12" y1="32" x2="68" y2="32" stroke="#17212B" stroke-width="3" stroke-linecap="round"/>
<line x1="12" y1="64" x2="68" y2="64" stroke="#17212B" stroke-width="3" stroke-linecap="round"/>
<path d="M 12,32 L 36,32 L 24,64 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 44,64 L 68,64 L 56,32 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="8,20 8,24 16,32" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
