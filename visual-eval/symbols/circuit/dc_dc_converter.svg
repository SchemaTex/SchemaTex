<svg xmlns="http://www.w3.org/2000/svg" width="116" height="96" viewBox="0 0 116 96" role="img">
<title>DC-DC converter</title>
<desc>DC-DC converter, IEEE 315-1975 §16.1. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: vin (8,24), gin (8,72), vout (108,24), gout (108,72).</desc>
<rect x="24" y="8" width="68" height="80" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="24" x2="24" y2="24" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="72" x2="24" y2="72" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="92" y1="24" x2="108" y2="24" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="92" y1="72" x2="108" y2="72" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="32" y1="78" x2="84" y2="18" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="30" y="36" font-size="18" fill="#17212B">DC</text>
<text x="56" y="74" font-size="18" fill="#17212B">DC</text>
</g>
</svg>
