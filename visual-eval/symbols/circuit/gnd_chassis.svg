<svg xmlns="http://www.w3.org/2000/svg" width="58" height="50" viewBox="0 0 58 50" role="img">
<title>Chassis ground</title>
<desc>Chassis ground, IEEE 315-1975 §3.9.2 chassis or frame connection. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (10,8), end (50,8).</desc>
<line x1="10" y1="8" x2="50" y2="8" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="30" y1="8" x2="30" y2="30" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="10" y1="30" x2="50" y2="30" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="16" y1="30" x2="8" y2="42" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="30" y1="30" x2="22" y2="42" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="44" y1="30" x2="36" y2="42" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
