<circle cx="13" cy="76" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="15.25" y1="39.89" x2="35" y2="74" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="13" y1="8" x2="13" y2="16" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="13" y1="96" x2="13" y2="104" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
