<svg xmlns="http://www.w3.org/2000/svg" width="208" height="176" viewBox="0 0 208 176" role="img">
<title>Integrated circuit (generic block)</title>
<desc>Integrated circuit (generic block), IEEE 315-1975 §16.1 circuit element (rectangle); pin names inside and numbers outside per the exemplar's U1 and Horowitz &amp; Hill. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: pin 1 (8,40), pin 2 (8,72), pin 3 (8,104), pin 4 (8,136), pin 5 (200,136), pin 6 (200,104), pin 7 (200,72), pin 8 (200,40).</desc>
<rect x="24" y="8" width="160" height="160" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="40" x2="24" y2="40" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="72" x2="24" y2="72" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="104" x2="24" y2="104" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="136" x2="24" y2="136" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="184" y1="136" x2="200" y2="136" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="184" y1="104" x2="200" y2="104" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="184" y1="72" x2="200" y2="72" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="184" y1="40" x2="200" y2="40" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="16" y="33" font-size="14" fill="#52606D" text-anchor="middle">1</text>
<text x="16" y="65" font-size="14" fill="#52606D" text-anchor="middle">2</text>
<text x="16" y="97" font-size="14" fill="#52606D" text-anchor="middle">3</text>
<text x="16" y="129" font-size="14" fill="#52606D" text-anchor="middle">4</text>
<text x="192" y="129" font-size="14" fill="#52606D" text-anchor="middle">5</text>
<text x="192" y="97" font-size="14" fill="#52606D" text-anchor="middle">6</text>
<text x="192" y="65" font-size="14" fill="#52606D" text-anchor="middle">7</text>
<text x="192" y="33" font-size="14" fill="#52606D" text-anchor="middle">8</text>
</g>
</svg>
