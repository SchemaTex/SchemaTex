<svg xmlns="http://www.w3.org/2000/svg" width="72" height="88" viewBox="0 0 72 88" role="img">
<title>Diac</title>
<desc>Diac, IEEE 315-1975 §8.5.9. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (36,8), end (36,80).</desc>
<line x1="36" y1="8" x2="36" y2="28" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="36" y1="60" x2="36" y2="80" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="28" x2="64" y2="28" stroke="#17212B" stroke-width="3" stroke-linecap="round"/>
<line x1="8" y1="60" x2="64" y2="60" stroke="#17212B" stroke-width="3" stroke-linecap="round"/>
<path d="M 8,28 L 32,28 L 20,60 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 40,60 L 64,60 L 52,28 Z" fill="#17212B" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
