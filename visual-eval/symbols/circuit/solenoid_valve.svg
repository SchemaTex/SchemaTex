<svg xmlns="http://www.w3.org/2000/svg" width="104" height="116" viewBox="0 0 104 116" role="img">
<title>Solenoid valve</title>
<desc>Solenoid valve, IEEE 315-1975 §4.5.3. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (8,8), end (8,108).</desc>
<path d="M 8,18 L 8,28 A 10,10 0 0 1 8,48 A 10,10 0 0 1 8,68 A 10,10 0 0 1 8,88 L 8,98" fill="none" stroke="#17212B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="8" y1="8" x2="8" y2="18" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="98" x2="8" y2="108" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="36" y="64" font-size="18" fill="#17212B">VALVE</text>
</g>
</svg>
