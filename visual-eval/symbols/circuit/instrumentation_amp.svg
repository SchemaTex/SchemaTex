<title>Instrumentation amplifier</title>
<desc>Instrumentation amplifier, IEEE 315-1975 §16.2 amplifier; instrumentation function qualifier. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: inp (8,50), inn (8,98), out (108,74).</desc>
