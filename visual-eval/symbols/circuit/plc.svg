<svg xmlns="http://www.w3.org/2000/svg" width="156" height="138" viewBox="0 0 156 138" role="img">
<title>PLC module</title>
<desc>PLC module, IEEE 315-1975 §16.1 functional circuit block; PLC function is modern application practice. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (8,66), end (148,66), pwr (8,114), out (148,114).</desc>
<rect x="24" y="34" width="108" height="96" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="8" y1="66" x2="24" y2="66" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="114" x2="24" y2="114" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="132" y1="66" x2="148" y2="66" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="132" y1="114" x2="148" y2="114" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="78" y="22" font-size="18" fill="#17212B" text-anchor="middle">PLC</text>
</g>
</svg>
