<svg xmlns="http://www.w3.org/2000/svg" width="159" height="68" viewBox="0 0 159 68" role="img">
<title>Selector switch</title>
<desc>Selector switch, IEEE 315-1975 §4.13 selector switch; §4.3.2 make contact. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (13,8), end (13,60).</desc>
<line x1="13" y1="8" x2="13" y2="15.5" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="13" y1="52.5" x2="13" y2="60" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="13" cy="20" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<circle cx="13" cy="48" r="4.5" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="15.36" y1="23.83" x2="29" y2="46" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="21" y1="34" x2="47" y2="34" stroke="#17212B" stroke-width="2" stroke-dasharray="5 4"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="55" y="40" font-size="18" fill="#17212B">SELECTOR</text>
</g>
</svg>
