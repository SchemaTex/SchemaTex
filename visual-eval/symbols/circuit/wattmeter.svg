<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96" role="img">
<title>Wattmeter</title>
<desc>Wattmeter, IEEE 315-1975 §12.1. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: start (32,8), end (32,88).</desc>
<circle cx="32" cy="48" r="24" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5"/>
<line x1="32" y1="8" x2="32" y2="24" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="32" y1="72" x2="32" y2="88" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="32" y="54.5" font-size="18" fill="#17212B" text-anchor="middle">W</text>
</g>
</svg>
