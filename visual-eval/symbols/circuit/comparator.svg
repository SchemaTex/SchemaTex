<svg xmlns="http://www.w3.org/2000/svg" width="116" height="96" viewBox="0 0 116 96" role="img">
<title>Comparator</title>
<desc>Comparator, IEEE 315-1975 §16.2.3 amplifier with two inputs, used as comparator. Not in the Schematex circuit exemplar; drawn to its rules with pins on the engine's anchors; one unit is one exemplar pixel. Pins: plus (8,28), minus (8,68), out (108,48).</desc>
<path d="M 24,8 L 92,48 L 24,88 Z" fill="#FFFFFF" stroke="#17212B" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="8" y1="28" x2="24" y2="28" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="8" y1="68" x2="24" y2="68" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="92" y1="48" x2="108" y2="48" stroke="#17212B" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="36" y="34" font-size="17" fill="#52606D" text-anchor="middle">+</text>
<text x="36" y="74" font-size="17" fill="#52606D" text-anchor="middle">−</text>
</g>
</svg>
