<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1209 1136" width="1209" height="1136" role="img">
<title>CI CD Supply Chain STRIDE</title>
<desc>A STRIDE threat model of CI CD Supply Chain STRIDE, drawn as a data-flow diagram over 3 trust zones: Developer Internet, Build Zone, Production. 2 external entities are drawn as rectangles, 2 processes as circles, and 3 data stores as two parallel horizontal lines with the label between them. Each element carries the STRIDE letters that apply to its kind. Of the 6 data flows, 4 cross a trust boundary — Software Developer to Source Repository, CI Runner to Source Repository, CI Runner to Package Registry, CI Runner to Artifact Store — and those are the only ones drawn in red, because a boundary crossing is where the spoofing, tampering and disclosure threats actually bite.</desc>
