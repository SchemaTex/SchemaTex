<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="459" height="600" viewBox="-20 -20 459 600" class="schematex schematex-threatmodel" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="CI CD Supply Chain STRIDE"><title>CI CD Supply Chain STRIDE</title>
<desc>STRIDE threat model: 2 external entities, 2 process(es), 3 data store(s), 6 data flow(s). 4 boundary-crossing flow(s): Developer→Source, CI→Source, CI→Registry, CI→Artifacts. Developer (external) → Spoofing, Repudiation. Registry (external) → Spoofing, Repudiation. CI (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Deploy (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Source (store) → Tampering, Information disclosure, Denial of service. Artifacts (store) → Tampering, Information disclosure, Denial of service. Audit (store) → Tampering, Repudiation, Information disclosure, Denial of service.</desc>
<style>.sx-tm-bg { fill: #ffffff; }
.sx-tm-title { fill: #0f172a; font-size: 16px; font-weight: 700; }
.sx-tm-external { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
.sx-tm-process { fill: #ffffff; stroke: #334155; stroke-width: 2; }
.sx-tm-store-line { fill: none; stroke: #334155; stroke-width: 2; }
.sx-tm-store-bg { fill: #ffffff; stroke: none; }
.sx-tm-label { fill: #0f172a; font-size: 12px; font-weight: 600; }
.sx-tm-flow { fill: none; stroke: #334155; stroke-width: 2; }
.sx-tm-flow[data-crossing="true"] { stroke: #c62828; stroke-width: 3; }
.sx-tm-arrow { fill: #334155; stroke: none; }
.sx-tm-arrow[data-crossing="true"] { fill: #c62828; }
.sx-tm-flow-label { fill: #0f172a; font-size: 9px; }
.sx-tm-flow-label[data-crossing="true"] { fill: #c62828; font-weight: 700; }
.sx-tm-flow-halo { fill: #ffffff; stroke: none; }
.sx-tm-boundary { fill: none; stroke: #c62828; stroke-width: 2; stroke-dasharray: 6 4; }
.sx-tm-boundary-label { fill: #c62828; font-size: 9px; font-weight: 700; }
.sx-tm-badge { fill: #2563eb; }
.sx-tm-badge[data-cond-r="true"] { fill: #c62828; }
.sx-tm-badge-text { fill: #ffffff; font-size: 9px; font-weight: 700; }</style>
<defs><marker id="sx-tm-mk" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 9,4 0,8" class="sx-tm-arrow"/></marker>
