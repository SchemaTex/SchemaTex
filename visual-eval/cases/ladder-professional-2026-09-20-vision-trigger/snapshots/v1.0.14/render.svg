<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="lt-ladder" role="img" aria-labelledby="lt-ladder-title lt-ladder-desc" width="366.4" height="650" viewBox="0 0 366.4 650"><title>Y0 Vision Trigger - Trigger Delay + 10ms 固定脈波</title>
<desc>PLC ladder logic diagram with 5 rungs</desc>
<style>.lt-ladder { font-family: system-ui, -apple-system, sans-serif; }
.lt-ladder-rail { stroke: #111111; stroke-width: 4; stroke-linecap: square; }
.lt-ladder-wire { stroke: #222222; stroke-width: 1.5; fill: none; }
.lt-ladder-element { stroke: #222222; stroke-width: 2; fill: none; }
