<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<title>Three-Op-Amp Instrumentation Amplifier</title>
<rect width="1600" height="1040" fill="white"/>
<defs>
<style>
.w{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.s{fill:white;stroke:#17212b;stroke-width:2.5}.t{font-family:Helvetica,Arial,sans-serif;fill:#17212b;font-size:20px}.small{font-size:17px}.label{font-weight:bold}.rail{fill:none;stroke:#526779;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#17212b}
</style>
<g id="ground" class="w"><path d="M0 0v10m-14 0h28m-10 7h20m-15 7h10"/></g>
<g id="rh" class="s"><rect x="-42" y="-9" width="84" height="18"/></g>
</defs>
<g class="t">
<text x="60" y="55" font-size="30" font-weight="bold">Three-Op-Amp Instrumentation Amplifier</text>
<text x="60" y="88" class="small">OPA197 · ±15 V supplies · Matched difference network</text>
</g>
<!-- Input op-amps: upper has noninverting input above; lower is mirrored. -->
<path class="s" d="M450 220L450 340L570 280Z"/>
<path class="s" d="M450 580L450 700L570 640Z"/>
<g class="t"><text x="461" y="260">+</text><text x="461" y="320">−</text><text x="461" y="620">−</text><text x="461" y="680">+</text>
<text x="445" y="172" class="label">U1 INPUT BUFFER A</text><text x="445" y="198">OPA197</text>
<text x="445" y="755" class="label">U2 INPUT BUFFER B</text><text x="445" y="781">OPA197</text></g>
<!-- AC input voltage sources -->
<circle class="s" cx="140" cy="315" r="29"/><path class="w" d="M119 315c7-23 14-23 21 0s14 23 21 0M140 286V250H450M140 344V365"/>
<use href="#ground" x="140" y="365"/>
<circle class="s" cx="140" cy="735" r="29"/><path class="w" d="M119 735c7-23 14-23 21 0s14 23 21 0M140 706V670H450M140 764V785"/>
<use href="#ground" x="140" y="785"/>
<g class="t"><text x="70" y="223" class="label">V1 · VIN+</text><text x="184" y="312" class="small">10 mV differential input</text><text x="70" y="643" class="label">V2 · VIN−</text><text x="184" y="740" class="small">10 mV differential input</text></g>
<!-- Gain-setting network, with dedicated inner feedback loops -->
<path class="w" d="M450 310H380V451M380 469V610H450M570 280H650V390H562M478 390H380M570 640H650V530H562M478 530H380"/>
<rect class="s" x="371" y="418" width="18" height="84"/>
<use href="#rh" x="520" y="390"/><use href="#rh" x="520" y="530"/>
<g class="t"><text x="350" y="445" text-anchor="end" class="label">RG GAIN SET</text><text x="350" y="473" text-anchor="end">1 kΩ</text>
<text x="520" y="365" text-anchor="middle">R1 · 10 kΩ</text><text x="520" y="571" text-anchor="middle">R2 · 10 kΩ</text><text x="359" y="332" text-anchor="end" class="small">N1</text><text x="359" y="599" text-anchor="end" class="small">N2</text></g>
<!-- Difference stage input resistors -->
<path class="w" d="M650 280H750V420H798M882 420H1060M650 640H750V500H798M882 500H1060"/>
<use href="#rh" x="840" y="420"/><use href="#rh" x="840" y="500"/>
<g class="t"><text x="840" y="363" text-anchor="middle" class="label">R3</text><text x="840" y="391" text-anchor="middle">10 kΩ, 0.1%</text><text x="840" y="545" text-anchor="middle" class="label">R5</text><text x="840" y="572" text-anchor="middle">10 kΩ, 0.1%</text><text x="671" y="264" class="small">OA1OUT</text><text x="671" y="672" class="small">OA2OUT</text></g>
<path class="s" d="M1060 390V530L1200 460Z"/>
<g class="t"><text x="1071" y="428">−</text><text x="1071" y="508">+</text><text x="1265" y="610" class="label" text-anchor="middle">U3 DIFFERENCE AMP</text><text x="1265" y="638" text-anchor="middle">OPA197</text></g>
<!-- R4 feedback and R6 reference leg -->
<path class="w" d="M970 420V285H1078M1162 285H1300V460M1200 460H1450M970 500V631M970 715V745"/>
<use href="#rh" x="1120" y="285"/>
<rect class="s" x="961" y="631" width="18" height="84"/>
<use href="#ground" x="970" y="745"/>
<circle class="s" cx="1456" cy="460" r="6"/>
<g class="t"><text x="1120" y="231" text-anchor="middle" class="label">R4</text><text x="1120" y="258" text-anchor="middle">10 kΩ, 0.1%</text><text x="1001" y="671" class="label">R6</text><text x="1001" y="699">10 kΩ, 0.1%</text><text x="1480" y="467" class="label">OUT</text><text x="982" y="445" class="small">NDIFF</text><text x="982" y="484" class="small">PDIFF</text></g>
<!-- Every supply pin is wired to named global supply nets. -->
<g class="rail"><path d="M505 247V216H605M505 313V345H605M505 607V580H605M505 673V709H605M1125 422V359H1208M1125 498V554H1208"/></g>
<g class="t small"><text x="613" y="222">+15 V</text><text x="613" y="351">−15 V</text><text x="613" y="586">+15 V</text><text x="613" y="715">−15 V</text><text x="1216" y="365">+15 V</text><text x="1216" y="560">−15 V</text></g>
<g class="dot"><circle cx="380" cy="390" r="4.5"/><circle cx="380" cy="530" r="4.5"/><circle cx="650" cy="280" r="4.5"/><circle cx="650" cy="640" r="4.5"/><circle cx="970" cy="420" r="4.5"/><circle cx="970" cy="500" r="4.5"/><circle cx="1300" cy="460" r="4.5"/></g>
<!-- Actual DC sources defining the named global supply nets. -->
<path d="M60 838H1540" stroke="#cbd2d8"/>
<g class="t"><text x="60" y="876" class="label">POWER SUPPLIES</text></g>
<circle class="s" cx="410" cy="930" r="27"/><path class="rail" d="M410 903V877H470M410 957V981"/><use href="#ground" x="410" y="981"/>
<circle class="s" cx="820" cy="930" r="27"/><path class="rail" d="M820 903V877H880M820 957V981"/><use href="#ground" x="820" y="981"/>
<g class="t"><text x="410" y="924" text-anchor="middle">+</text><text x="410" y="947" text-anchor="middle">−</text><text x="820" y="924" text-anchor="middle">+</text><text x="820" y="947" text-anchor="middle">−</text><text x="480" y="883">+15 V · VPOS</text><text x="455" y="931" class="label">VP · V+ SUPPLY</text><text x="455" y="959">15 V</text><text x="890" y="883">−15 V · VNEG</text><text x="865" y="931" class="label">VN · V− SUPPLY</text><text x="865" y="959">−15 V</text><text x="1180" y="917" class="small">Identical supply labels are connected.</text><text x="1180" y="946" class="small">All ground symbols share GND.</text></g>
</svg>
