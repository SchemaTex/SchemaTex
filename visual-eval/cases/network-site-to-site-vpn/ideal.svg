<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1100" viewBox="0 0 1780 1100">
<title>HQ to Branch Site-to-Site VPN — Two independently segmented sites joined by an IPsec tunnel over the public Internet</title>
<desc>Two site boundaries drawn side by side with the public Internet between them. Each site holds the same chain read bottom to top: analyst workstation, LAN switch, firewall, edge router, then out to the Internet on its own ISP link; the branch also has a printer. Inside each site a dashed boundary marks the local subnet, 10.10.0.0/24 at headquarters and 10.20.0.0/24 at the branch, around the switch and the devices behind it. The two firewalls are joined by a violet dashed IPsec tunnel that runs up out of each site and across the gap under the Internet cloud, so the encrypted path is visibly separate from the two plain ISP links.</desc>
