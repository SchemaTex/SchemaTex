<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 743.4 406" class="schematex-diagram schematex-genogram" width="743.4" height="406"><title>Genogram</title>
<desc>Genogram diagram with 8 individuals across 2 generations</desc>
<defs></defs>
<style>
.schematex-genogram {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
}
.schematex-genogram-shape { fill: #ffffff; stroke: #334155; stroke-width: 2; stroke-linejoin: round; }
.schematex-genogram-male .schematex-genogram-shape { fill: #dbeafe; }
.schematex-genogram-female .schematex-genogram-shape { fill: #fce7f3; }
.schematex-genogram-unknown .schematex-genogram-shape { fill: #f5f5f5; }
.schematex-genogram-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; text-anchor: middle; fill: #0f172a; }
.schematex-genogram-vitals { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
.schematex-genogram-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; fill: #475569; }
.schematex-genogram-edge { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.schematex-genogram-edge-cohabiting path { stroke-dasharray: 6,4; }
.schematex-genogram-edge-cohabiting-ended path { stroke-dasharray: 6,4; }
.schematex-genogram-edge-divorced .schematex-genogram-divorce-mark { stroke: #94a3b8; stroke-width: 2; }
.schematex-genogram-edge-separated .schematex-genogram-separation-mark { stroke: #94a3b8; stroke-width: 2; }
.schematex-genogram-edge-cohabiting-ended .schematex-genogram-separation-mark { stroke: #94a3b8; stroke-width: 2; }
/* Secondary parent-child link (foster/adopted "current caregiver") — dotted, muted */
.schematex-genogram-edge-secondary path { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 2,4; fill: none; opacity: 0.85; }
/* Sibling-of bracket (known relative, unknown ancestry) — dashed */
.schematex-genogram-sibling-of path { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,3; fill: none; opacity: 0.7; }
.schematex-genogram-unknown-siblings-mark { fill: #0f172a; pointer-events: none; }
.schematex-genogram-deceased-mark { stroke: #b71c1c; stroke-width: 2; stroke-linecap: round; }
/* Inline fill on each .schematex-genogram-condition-fill element comes from cond.color. The CSS only sets a default for elements that did not receive an inline fill attribute. */
.schematex-genogram-condition-fill:not([fill]) { fill: #1565c0; }
.schematex-genogram-age { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; pointer-events: none; }
.schematex-genogram-title { fill: #0f172a; }
.schematex-genogram-edge-label { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; }
.schematex-genogram-index-border { stroke: #d97706; stroke-width: 3; fill: none; }
</style>
<g><g><g class="schematex-genogram-edges"><g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="arthur" data-to="eleanor"><path d="M 260 60 L 340 60" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur" data-to="eleanor"><path d="M 300 60 L 300 141" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur" data-to="eleanor"><path d="M 60 141 L 540 141" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur+eleanor" data-to="dana"><path d="M 60 141 L 60 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur+eleanor" data-to="paul"><path d="M 180 141 L 180 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur+eleanor" data-to="@care: &quot;lives with eleanor; daily personal care&quot;"><path d="M 300 141 L 300 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur+eleanor" data-to="@burden: &quot;exhausted; no regular respite&quot;"><path d="M 420 141 L 420 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur+eleanor" data-to="@care: &quot;lives separately; weekly transport&quot;"><path d="M 540 141 L 540 206" class="schematex-genogram-edge-path"/></g></g>
<g class="schematex-genogram-sibling-of-edges"></g>
<g class="schematex-genogram-emotional-edges"><g class="schematex-genogram-emotional schematex-genogram-emotional-close" data-from="dana" data-to="eleanor" data-relationship-type="close"><path d="M 60 226 Q 410 143 360 60" fill="none" stroke="#4caf50" stroke-width="3"/>
<text x="235" y="178.5" class="schematex-genogram-edge-label" text-anchor="middle" font-size="10" fill="#4caf50">Daily care and support</text></g>
<g class="schematex-genogram-emotional schematex-genogram-emotional-close" data-from="paul" data-to="eleanor" data-relationship-type="close"><path d="M 180 226 Q 410 143 360 60" fill="none" stroke="#4caf50" stroke-width="3"/>
<text x="295" y="178.5" class="schematex-genogram-edge-label" text-anchor="middle" font-size="10" fill="#4caf50">Weekly transport</text></g>
<g class="schematex-genogram-emotional schematex-genogram-emotional-conflict" data-from="dana" data-to="paul" data-relationship-type="conflict"><path d="M 60 246 Q 120 276 180 246" fill="none" stroke="#e53935" stroke-width="2" style="stroke-dasharray: 8,3,2,3;"/>
<text x="90" y="255" class="schematex-genogram-edge-label" text-anchor="middle" font-size="10" fill="#e53935">Unequal care workload</text></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-0" data-generation="0"><g class="schematex-genogram-node schematex-genogram-male schematex-genogram-deceased" data-individual-id="arthur" transform="translate(240, 60)"><title>Arthur (1940-2019)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/>
<line x1="-20" y1="-20" x2="20" y2="20" class="schematex-genogram-deceased-mark" stroke="#333" stroke-width="2"/>
<line x1="20" y1="-20" x2="-20" y2="20" class="schematex-genogram-deceased-mark" stroke="#333" stroke-width="2"/>
<text x="0" y="5" class="schematex-genogram-age" text-anchor="middle" font-size="11">79</text></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="eleanor" transform="translate(360, 60)"><title>Eleanor (1942)</title>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/>
<text x="0" y="5" class="schematex-genogram-age" text-anchor="middle" font-size="11">84</text></g>
