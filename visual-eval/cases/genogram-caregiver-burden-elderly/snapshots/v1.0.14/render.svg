<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-1" data-generation="1"><g class="schematex-genogram-node schematex-genogram-female schematex-genogram-index-person" data-individual-id="dana" transform="translate(60, 226)"><title>Dana (1968)</title>
<circle cx="0" cy="0" r="24" class="schematex-genogram-index-border"/>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/>
<text x="0" y="5" class="schematex-genogram-age" text-anchor="middle" font-size="11">58</text></g>
<g class="schematex-genogram-node schematex-genogram-male" data-individual-id="paul" transform="translate(180, 226)"><title>Paul (1971)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/>
<text x="0" y="5" class="schematex-genogram-age" text-anchor="middle" font-size="11">55</text></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="@care: &quot;lives with eleanor; daily personal care&quot;" transform="translate(300, 226)"><title>@care: &quot;Lives with Eleanor; daily personal care&quot;</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g>
