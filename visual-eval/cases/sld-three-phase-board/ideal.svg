<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1468 805" width="1468" height="805" role="img">
<title>Three-Phase Distribution Board</title>
<desc>A 400 V utility supply runs down through the 250 A main breaker and the multifunction meter onto the DB-1 three-phase busbar. Six outgoing ways tap the bus, each through its own C-curve breaker and each labelled with its cable: lighting, socket outlets, an AHU fan motor, a kitchen distribution board, a workshop panel and a spare feeder.</desc>
