<path class="edge" d="M780 630V735"/>
<path class="edge" d="M727.5 597.5V626Q727.5 630 723.5 630H454Q450 630 450 634V654"/>
<path class="edge" d="M670 800H604Q600 800 600 796V684Q600 680 596 680H575"/>
