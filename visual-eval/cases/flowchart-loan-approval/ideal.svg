<path class="rail" d="M545 965H776Q780 965 780 969"/>
<path class="edge" d="M780 1018V1054"/>
<path class="edge" d="M780 1106V1153"/>
<!-- All thirteen DSL nodes. -->
<rect class="node end" x="683" y="104" width="194" height="44" rx="22"/>
<text x="780" y="131">Application submitted</text>
<rect class="node" x="712" y="184" width="136" height="52" rx="4"/>
<text x="780" y="215">Verify identity</text>
<path class="node decision" d="M780 284 864 330 780 376 696 330Z"/>
<text x="780" y="326"><tspan x="780">Identity</tspan><tspan x="780" dy="17">verified?</tspan></text>
<path class="node data" d="M690 420C690 407 870 407 870 420V462C870 475 690 475 690 462Z"/>
<ellipse class="node data" cx="780" cy="420" rx="90" ry="10"/>
<text x="780" y="447">Run credit check</text>
<path class="node decision" d="M780 500 885 565 780 630 675 565Z"/>
<text x="780" y="561"><tspan x="780">Credit score</tspan><tspan x="780" dy="17">meets policy?</tspan></text>
<path class="node decision" d="M780 735 890 800 780 865 670 800Z"/>
<text x="780" y="796"><tspan x="780">Debt-to-income</tspan><tspan x="780" dy="17">within limit?</tspan></text>
<rect class="node" x="325" y="654" width="250" height="52" rx="4"/>
<path class="rail" d="M336 654V706M564 654V706"/>
<text x="450" y="685">Manual underwriting review</text>
<path class="node decision" d="M450 785 535 835 450 885 365 835Z"/>
<text x="450" y="831"><tspan x="450">Request more</tspan><tspan x="450" dy="17">evidence?</tspan></text>
<rect class="node" x="95" y="809" width="210" height="52" rx="4"/>
<text x="200" y="840">Collect supporting documents</text>
<path class="node decision" d="M450 915 545 965 450 1015 355 965Z"/>
<text x="450" y="961"><tspan x="450">Approved by</tspan><tspan x="450" dy="17">underwriter?</tspan></text>
<rect class="node end" x="80" y="1058" width="190" height="44" rx="22"/>
<text x="175" y="1085">Decline application</text>
<rect class="node" x="694" y="1054" width="172" height="52" rx="4"/>
<text x="780" y="1085">Generate loan offer</text>
<rect class="node end" x="711" y="1153" width="138" height="44" rx="22"/>
<text x="780" y="1180">Offer issued</text>
<!-- Outcome pills sit beside, never on, their edges. -->
<g><rect class="pill" x="650" y="305" width="28" height="19" rx="5"/><text class="outcome" x="664" y="318">No</text></g>
<g><rect class="pill" x="792" y="384" width="34" height="19" rx="5"/><text class="outcome" x="809" y="397">Yes</text></g>
<g><rect class="pill" x="629" y="540" width="28" height="19" rx="5"/><text class="outcome" x="643" y="553">No</text></g>
<g><rect class="pill" x="792" y="666" width="34" height="19" rx="5"/><text class="outcome" x="809" y="679">Yes</text></g>
