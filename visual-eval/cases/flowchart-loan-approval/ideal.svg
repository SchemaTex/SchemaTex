<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260">
<title>Consumer loan application decisioning and manual review</title>
<defs>
 <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#1B2430"/></marker>
 <style>
  text{font-family:Inter,Helvetica,Arial,sans-serif;fill:#1B2430;font-size:13px;text-anchor:middle}
  .title{font-size:21px;font-weight:600;text-anchor:start}.subtitle{font-size:12px;fill:#5F6B7A;text-anchor:start}
  .node{stroke:#1B2430;stroke-width:1.5;fill:#FFFFFF;stroke-linejoin:round}
  .end{fill:#DFEBE0}.decision{fill:#FBEDCE}.data{fill:#E2EDF9}
  .edge{fill:none;stroke:#1B2430;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
  .rail{fill:none;stroke:#1B2430;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
  .pill{fill:#FFFFFF;stroke:#D8DFE8;stroke-width:1}
  .outcome{font-size:11px;font-weight:500}.legend{font-size:11px;fill:#5F6B7A;text-anchor:start}
 </style>
</defs>
<rect width="1200" height="1260" fill="#FFFFFF"/>
<text class="title" x="56" y="52">Consumer loan application decisioning</text>
<text class="subtitle" x="56" y="74">Consumer lending · identity verification, automated decisioning, manual review</text>
<path d="M56 88H1144" stroke="#D8DFE8" stroke-width="1"/>
