<g><rect class="pill" x="562" y="940" width="34" height="19" rx="5"/><text class="outcome" x="579" y="953">Yes</text></g>
<!-- Symbol vocabulary, matching the exemplar's quiet legend. -->
<g transform="translate(957 1010)">
<text class="legend" x="0" y="0" style="font-weight:600;letter-spacing:1px">LEGEND</text>
<rect class="node end" x="0" y="22" width="34" height="15" rx="7.5"/><text class="legend" x="46" y="34">Start / end</text>
<rect class="node" x="0" y="48" width="34" height="15" rx="3"/><text class="legend" x="46" y="60">Process step</text>
<path class="node decision" d="M17 74 34 81.5 17 89 0 81.5Z"/><text class="legend" x="46" y="86">Decision</text>
<path class="node data" d="M0 105C0 100 34 100 34 105V113C34 119 0 119 0 113Z"/><ellipse class="node data" cx="17" cy="105" rx="17" ry="4"/><text class="legend" x="46" y="112">System of record</text>
<rect class="node" x="0" y="126" width="34" height="15" rx="3"/><path class="rail" d="M5 126V141M29 126V141"/><text class="legend" x="46" y="138">Predefined process</text>
<path class="rail" stroke-dasharray="6 5" d="M0 160H34"/><text class="legend" x="46" y="164">Rework loop</text>
</g>
</svg>
