<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-bd" viewBox="0 0 1516 466" width="1516" height="466" role="img" data-diagram-type="blockdiagram"><title>PID Control Loop</title>
<desc>Block diagram with 4 blocks, 1 summing junctions, 8 signals</desc>
<defs><style>.schematex-bd { font-family: system-ui, -apple-system, sans-serif; }
.schematex-bd-block { stroke: #334155; stroke-width: 2; }
.schematex-bd-tf { font: italic 14px serif; fill: #0f172a; }
.schematex-bd-block-name { font: 10px sans-serif; fill: #64748b; }
.schematex-bd-sum { fill: #ffffff; stroke: #334155; stroke-width: 2; }
.schematex-bd-sum-sign { font: bold 11px sans-serif; fill: #334155; }
.schematex-bd-signal { stroke: #334155; stroke-width: 2; fill: none; }
.schematex-bd-signal-discrete { stroke: #334155; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
.schematex-bd-signal-label-bg { fill: #ffffff; opacity: .94; stroke: none; }
.schematex-bd-signal-label { font: italic 12px serif; fill: #334155; }
.schematex-bd-port-label { font: italic 13px serif; fill: #0f172a; }
.schematex-bd-title { font: 700 16px sans-serif; fill: #0f172a; }
.schematex-bd-branch { fill: #334155; stroke: none; }</style>
<marker id="lt-bd-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#334155"/></marker></defs>
<text x="758" y="18" text-anchor="middle" class="schematex-bd-title">PID Control Loop</text>
