<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="prisma" role="img" aria-label="AI-supported formative assessment in schools" width="760" height="716" viewBox="0 0 760 716"><title>AI-supported formative assessment in schools</title>
<desc>PRISMA 2020 flow diagram (2020-single, scoping-review) — 7 boxes, 6 arrows</desc>
<style>.prisma { font-family: system-ui, -apple-system, sans-serif; }
.prisma-title { font: 700 16px sans-serif; fill: #0f172a; }
.prisma-subtitle { font: 400 12px sans-serif; fill: #475569; }

.prisma-stage { stroke-width: 1.1; stroke: #90a4ae; }
.prisma-stage-identification { fill: #e8f1fb; }
.prisma-stage-screening { fill: #e3f5f7; }
.prisma-stage-included { fill: #e9f6ea; }
.prisma-exclusion { stroke-width: 1.1; stroke: #90a4ae; fill: #f4fafb; }
.prisma-stage-previous { stroke-width: 1.4; stroke-dasharray: 5 3; fill: #e8f1fb; stroke: #1976d2; }

.prisma-stage-label { font: 600 13px sans-serif; fill: #0f172a; }
.prisma-stage-count { font: 700 13px sans-serif; fill: #0f172a; }
.prisma-stage-source { font: 400 11.5px sans-serif; fill: #475569; }
.prisma-stage-subtitle { font: italic 500 11.5px sans-serif; fill: #475569; }
.prisma-exclusion-reason { font: 400 11.5px sans-serif; fill: #475569; }

.prisma-arrow-main { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#prisma-arrow); }
.prisma-arrow-exclusion { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#prisma-arrow); }
.prisma-arrow-merge-leg { fill: none; stroke: #475569; stroke-width: 1.6; }
.prisma-arrow-merge-trunk { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#prisma-arrow); }
.prisma-arrow-previous { fill: none; stroke: #1976d2; stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#prisma-arrow-accent); }
.prisma-warning { font: italic 400 11px sans-serif; fill: #d97706; }

.prisma-band { stroke: none; }
.prisma-band-identification { fill: #1565c0; }
.prisma-band-screening { fill: #00838f; }
.prisma-band-included { fill: #2e7d32; }
.prisma-band-label { font: 700 12px sans-serif; fill: #ffffff; letter-spacing: 0.8px; text-transform: uppercase; }

.prisma-col-header { stroke: #90a4ae; stroke-width: 1.1; }
.prisma-col-header-databases { fill: #ef8a3c; }
.prisma-col-header-other { fill: #6b8694; }
.prisma-col-header-label { font: 600 12px sans-serif; fill: #ffffff; }</style>
<defs><marker id="prisma-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="prisma-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="380" y="40" class="prisma-title" text-anchor="middle">AI-supported formative assessment in schools</text>
<g class="prisma-bands"><g data-band="identification"><rect x="24" y="96" width="34" height="129" rx="17" ry="17" class="prisma-band prisma-band-identification" data-stage="identification"/>
<text x="41" y="160.5" class="prisma-band-label" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 41 160.5)">Identification</text></g>
<g data-band="screening"><rect x="24" y="281" width="34" height="280" rx="17" ry="17" class="prisma-band prisma-band-screening" data-stage="screening"/>
<text x="41" y="421" class="prisma-band-label" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 41 421)">Screening</text></g>
<g data-band="included"><rect x="24" y="617" width="34" height="79" rx="17" ry="17" class="prisma-band prisma-band-included" data-stage="included"/>
<text x="41" y="656.5" class="prisma-band-label" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 41 656.5)">Included</text></g></g>
<g class="prisma-col-headers"><g data-header="databases"><rect x="92" y="56" width="644" height="28" rx="14" ry="14" class="prisma-col-header prisma-col-header-databases" data-column="databases"/>
<text x="414" y="74" class="prisma-col-header-label" text-anchor="middle">Identification of sources via databases and registers</text></g></g>
<g class="prisma-edges"><path d="M 390 126 L 462 126" class="prisma-arrow-exclusion" data-edge="id-databases-&gt;id-removed"/>
<path d="M 241 225 L 241 273" class="prisma-arrow-main" data-edge="id-databases-&gt;screening"/>
<path d="M 241 342 L 241 441" class="prisma-arrow-main" data-edge="screening-&gt;eligibility"/>
<path d="M 241 510 L 241 609" class="prisma-arrow-main" data-edge="eligibility-&gt;included"/>
<path d="M 390 311.5 L 462 311.5" class="prisma-arrow-exclusion" data-edge="screening-&gt;screening-excluded"/>
<path d="M 390 479.5 L 462 479.5" class="prisma-arrow-exclusion" data-edge="eligibility-&gt;eligibility-excluded"/></g>
<g class="prisma-boxes"><g data-prisma-role="id-databases" data-prisma-variant="main" data-prisma-stage="identification"><rect x="92" y="96" width="298" height="129" rx="8" ry="8" class="prisma-stage prisma-stage-identification" data-role="id-databases"/>
<text x="241" y="122" class="prisma-stage-label" text-anchor="middle">Sources identified from:</text>
<text x="173.8" y="140" class="prisma-stage-source">ERIC (n = 650)</text>
<text x="173.8" y="157" class="prisma-stage-source">Scopus (n = 600)</text>
<text x="173.8" y="174" class="prisma-stage-source">PsycINFO (n = 450)</text>
<text x="173.8" y="191" class="prisma-stage-source">IEEE Xplore (n = 400)</text>
<text x="241" y="209" class="prisma-stage-count" text-anchor="middle">Total (n = 2,100)</text></g>
<g data-prisma-role="id-removed" data-prisma-variant="exclusion" data-prisma-stage="identification"><rect x="470" y="96" width="266" height="60" rx="8" ry="8" class="prisma-exclusion prisma-stage-identification" data-role="id-removed"/>
<text x="603" y="122" class="prisma-stage-label" text-anchor="middle">Sources removed before screening</text>
<text x="491" y="140" class="prisma-exclusion-reason">Duplicate records removed (n = 420)</text></g>
<g data-prisma-role="screening" data-prisma-variant="main" data-prisma-stage="screening"><rect x="92" y="281" width="298" height="61" rx="8" ry="8" class="prisma-stage prisma-stage-screening" data-role="screening"/>
<text x="241" y="307" class="prisma-stage-label" text-anchor="middle">Sources screened</text>
<text x="241" y="326" class="prisma-stage-count" text-anchor="middle">n = 1,680</text></g>
<g data-prisma-role="screening-excluded" data-prisma-variant="exclusion" data-prisma-stage="screening"><rect x="470" y="281" width="266" height="112" rx="8" ry="8" class="prisma-exclusion prisma-stage-screening" data-role="screening-excluded"/>
<text x="603" y="307" class="prisma-stage-label" text-anchor="middle">Sources excluded</text>
<text x="603" y="326" class="prisma-stage-count" text-anchor="middle">n = 1,410</text>
<text x="494.2" y="343" class="prisma-exclusion-reason">not education (n = 500)</text>
<text x="494.2" y="360" class="prisma-exclusion-reason">not formative assessment (n = 490)</text>
<text x="494.2" y="377" class="prisma-exclusion-reason">not AI (n = 420)</text></g>
<g data-prisma-role="eligibility" data-prisma-variant="main" data-prisma-stage="screening"><rect x="92" y="449" width="298" height="61" rx="8" ry="8" class="prisma-stage prisma-stage-screening" data-role="eligibility"/>
<text x="241" y="475" class="prisma-stage-label" text-anchor="middle">Sources assessed for eligibility</text>
<text x="241" y="494" class="prisma-stage-count" text-anchor="middle">n = 270</text></g>
<g data-prisma-role="eligibility-excluded" data-prisma-variant="exclusion" data-prisma-stage="screening"><rect x="470" y="449" width="266" height="112" rx="8" ry="8" class="prisma-exclusion prisma-stage-screening" data-role="eligibility-excluded"/>
<text x="603" y="475" class="prisma-stage-label" text-anchor="middle">Sources excluded, with reasons:</text>
<text x="603" y="494" class="prisma-stage-count" text-anchor="middle">n = 198</text>
<text x="503.8" y="511" class="prisma-exclusion-reason">wrong publication type (n = 72)</text>
<text x="503.8" y="528" class="prisma-exclusion-reason">no full text (n = 51)</text>
<text x="503.8" y="545" class="prisma-exclusion-reason">wrong setting (n = 75)</text></g>
<g data-prisma-role="included" data-prisma-variant="main" data-prisma-stage="included"><rect x="92" y="617" width="298" height="79" rx="8" ry="8" class="prisma-stage prisma-stage-included" data-role="included"/>
<text x="241" y="643" class="prisma-stage-label" text-anchor="middle">Sources of evidence included in review</text>
<text x="241" y="662" class="prisma-stage-count" text-anchor="middle">Sources of evidence included (n = 72)</text>
<text x="241" y="680" class="prisma-stage-count" text-anchor="middle">Reports of included sources (n = 72)</text></g></g></svg>