<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc">
  <title id="title">AI-supported formative assessment in schools — PRISMA-ScR evidence selection</title>
  <desc id="desc">Four-stage scoping review flow. 2,100 database records minus 420 duplicates yields 1,680 screened. 1,410 records excluded leaves 270 full-text reports assessed. 198 full-text reports excluded leaves 72 sources of evidence, comprising 72 studies and 72 reports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#263746"/></marker>
    <style>
      text {font-family: Georgia, 'Times New Roman', serif; fill: #172b3a; font-size: 21px;}
      .heading {font-size: 30px; font-weight: bold;}
      .subheading {font-size: 20px; fill: #526271;}
      .box {fill: #fff; stroke: #263746; stroke-width: 2;}
      .stage {fill: #eaf0f4; stroke: #aab9c4; stroke-width: 1.5;}
      .label {font-size: 21px; font-weight: bold;}
      .strong {font-weight: bold;}
      .flow {fill: none; stroke: #263746; stroke-width: 2; marker-end: url(#arrow);}
      .rule {stroke: #d9e0e5; stroke-width: 1;}
    </style>
  </defs>
  <rect width="1400" height="1190" fill="white"/>
  <text x="50" y="55" class="heading">AI-supported formative assessment in schools</text>
  <text x="50" y="90" class="subheading">PRISMA-ScR · Scoping review · Single database identification pathway (2020)</text>

  <line x1="50" y1="120" x2="1350" y2="120" class="rule"/>
  <line x1="50" y1="420" x2="1350" y2="420" class="rule"/>
  <line x1="50" y1="645" x2="1350" y2="645" class="rule"/>
  <line x1="50" y1="930" x2="1350" y2="930" class="rule"/>

  <!-- Identification -->
  <rect x="50" y="150" width="190" height="240" class="stage"/>
  <text x="145" y="278" text-anchor="middle" class="label">Identification</text>
  <rect x="280" y="150" width="530" height="240" class="box"/>
  <text x="305" y="187" class="strong">Records identified from databases</text>
  <text x="305" y="222" class="strong">n = 2,100</text>
  <text x="305" y="261">ERIC (n = 650)</text>
  <text x="305" y="296">Scopus (n = 600)</text>
  <text x="305" y="331">PsycINFO (n = 450)</text>
  <text x="305" y="366">IEEE Xplore (n = 400)</text>
  <rect x="900" y="225" width="450" height="110" class="box"/>
  <text x="925" y="268" class="strong">Duplicate records removed</text>
  <text x="925" y="306">n = 420</text>
  <path d="M810 280 H900" class="flow"/>
  <path d="M545 390 V475" class="flow"/>

  <!-- Screening -->
  <rect x="50" y="450" width="190" height="165" class="stage"/>
  <text x="145" y="541" text-anchor="middle" class="label">Screening</text>
  <rect x="280" y="475" width="530" height="115" class="box"/>
  <text x="305" y="520" class="strong">Records screened</text>
  <text x="305" y="559">n = 1,680</text>
  <rect x="900" y="450" width="450" height="165" class="box"/>
  <text x="925" y="485" class="strong">Records excluded (n = 1,410)</text>
  <text x="925" y="523">Not education (n = 500)</text>
  <text x="925" y="559">Not formative assessment (n = 490)</text>
  <text x="925" y="595">Not AI (n = 420)</text>
  <path d="M810 532 H900" class="flow"/>
  <path d="M545 590 V720" class="flow"/>

  <!-- Eligibility -->
  <rect x="50" y="680" width="190" height="215" class="stage"/>
  <text x="145" y="796" text-anchor="middle" class="label">Eligibility</text>
  <rect x="280" y="720" width="530" height="135" class="box"/>
  <text x="305" y="758" class="strong">Full-text reports assessed</text>
  <text x="305" y="789" class="strong">for eligibility</text>
  <text x="305" y="829">n = 270</text>
  <rect x="900" y="680" width="450" height="215" class="box"/>
  <text x="925" y="718" class="strong">Full-text reports excluded</text>
  <text x="925" y="751" class="strong">n = 198</text>
  <text x="925" y="792">Wrong publication type (n = 72)</text>
  <text x="925" y="831">No full text (n = 51)</text>
  <text x="925" y="870">Wrong setting (n = 75)</text>
  <path d="M810 787 H900" class="flow"/>
  <path d="M545 855 V970" class="flow"/>

  <!-- Included -->
  <rect x="50" y="970" width="190" height="170" class="stage"/>
  <text x="145" y="1063" text-anchor="middle" class="label">Included</text>
  <rect x="280" y="970" width="530" height="170" fill="#edf4f3" stroke="#263746" stroke-width="2"/>
  <text x="305" y="1010" class="strong">Sources of evidence included</text>
  <text x="305" y="1042" class="strong">in the scoping review (n = 72)</text>
  <text x="305" y="1084">Reports (n = 72)</text>
  <text x="305" y="1119">Studies (n = 72)</text>
</svg>
