<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1313 958" width="1313" height="958" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Regulatory reporting release delay</title>
<desc>Ishikawa (fishbone) cause-and-effect diagram drawn as a fish in outline. A forked tail at the far left starts a straight horizontal spine that runs right and ends in an arrowhead entering the fish head: a single closed outline with a curved back tapering to a blunt nose, drawn in dark slate on a near-white fill, with one hairline gill curve and no eye or mouth. The head carries the effect statement "Release missed the statutory deadline" under a small letterspaced EFFECT label. 4 category bones leave the spine at 60 degrees in 2 mirrored pairs that meet the spine at shared V junctions: People, Process above and Platform, Partners below. Each category owns one colour, used for its bone, its cause rules and its sub-cause twigs, with the category name in white on a solid pill of that colour at the bone tip. 17 causes are horizontal rules that underline their text and end in an arrowhead touching the bone. 4 sub-causes hang off those rules as short twigs slanted at the same 60 degrees as the bone, pointing back toward the spine, each with its label sitting at the free end. Colour appears only on the bones, rules and twigs; the fish, the effect statement and all cause text are neutral slate.</desc>
<rect width="1313" height="958" fill="#FFFFFF"/>
<defs>
<marker id="ca0" viewBox="0 0 9 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#1E5FA8"/></marker>
<marker id="ca1" viewBox="0 0 9 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#0E7C6B"/></marker>
<marker id="ca2" viewBox="0 0 9 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#B25E12"/></marker>
<marker id="ca3" viewBox="0 0 9 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#6A3D9A"/></marker>
</defs>
