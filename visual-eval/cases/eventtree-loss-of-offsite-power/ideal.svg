<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="575" viewBox="0 0 1660 575" role="img" font-family="Helvetica Neue, Helvetica, sans-serif"><title>Loss of offsite power</title><desc>Independent reference drawing following the current exemplar. Conditional safety functions · success continues straight; failure drops to a new sequence</desc><rect width="1660" height="575" fill="white"/><text x="40" y="45" font-size="25" fill="#0f172a" text-anchor="start" font-weight="600">Loss of offsite power</text><text x="40" y="73" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Conditional safety functions · success continues straight; failure drops to a new sequence</text><rect x="40" y="104" width="1580" height="102" rx="0" fill="#f1f5f9" stroke="none" stroke-width="1.5"/><text x="55" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Initiating event</text><text x="55" y="158" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Loss of offsite power</text><text x="345" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Emergency diesel generator</text><text x="345" y="152" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">starts and loads</text><text x="345" y="190" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.03</text><path d="M330 104V480" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 5"/><text x="575" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Station battery supports</text><text x="575" y="152" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">essential DC loads</text><text x="575" y="190" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.02</text><path d="M560 104V480" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 5"/><text x="815" y="137" font-size="16" fill="#0f172a" text-anchor="start" font-weight="600">Outcome</text><text x="1605" y="137" font-size="16" fill="#0f172a" text-anchor="end" font-weight="600">Frequency</text><path d="M55 245H330" stroke="#334155" stroke-width="1.8" fill="none" /><text x="55" y="232" font-size="15" fill="#2563eb" text-anchor="start" font-weight="400">f₀ = 0.05</text><path d="M330 245V245H560" stroke="#334155" stroke-width="1.8" fill="none" /><text x="348" y="233" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">1s  0.97</text><path d="M560 245H790" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M330 245V340H560" stroke="#334155" stroke-width="1.8" fill="none" /><text x="348" y="328" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">1f  0.03</text><path d="M560 340V340H790" stroke="#334155" stroke-width="1.8" fill="none" /><text x="578" y="328" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">2s  0.98</text><path d="M790 340H790" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M560 340V435H790" stroke="#334155" stroke-width="1.8" fill="none" /><text x="578" y="423" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">2f  0.02</text><path d="M790 435H790" stroke="#334155" stroke-width="1.8" fill="none" /><text x="805" y="250" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">01</text><text x="840" y="248.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Essential power restored by generator</text><text x="1605" y="250" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">4.850e-02</text><path d="M802 291H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="805" y="345" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">02</text><text x="840" y="343.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Essential DC power maintained by battery</text><text x="1605" y="345" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">1.470e-03</text><path d="M802 386H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="805" y="440" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">03</text><text x="840" y="438.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Loss of essential AC and DC power</text><text x="1605" y="440" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">3.000e-05</text><path d="M802 481H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="40" y="526" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">s = success · f = failure · * = later function not evaluated</text><text x="40" y="549" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">All sequence frequencies sum to 0.05, the initiating frequency.</text></svg>