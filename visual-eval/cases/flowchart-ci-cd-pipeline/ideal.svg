<g class="pill"><rect x="512.0" y="1084" width="34" height="19" rx="5"/><text x="529" y="1097.5">Yes</text></g>
<g class="pill"><rect x="375.0" y="1274" width="28" height="19" rx="5"/><text x="389" y="1287.5">No</text></g>
<g class="pill"><rect x="512.0" y="1364" width="34" height="19" rx="5"/><text x="529" y="1377.5">Yes</text></g>
<g class="legend" transform="translate(790 1375)">
<text x="0" y="0" style="font-weight:600;letter-spacing:.8px">LEGEND</text>
<rect class="node end" x="0" y="22" width="34" height="15" rx="8"/><text x="46" y="34">Start / end</text>
<rect class="node" x="0" y="48" width="34" height="15" rx="3"/><text x="46" y="60">Process step</text>
<path class="node decision" d="M0 82L17 74L34 82L17 90Z"/><text x="46" y="86">Decision</text>
<path class="node" d="M6 100H28L34 108L28 116H6L0 108Z"/><text x="46" y="112">Preparation</text>
<path d="M0 134H34" fill="none" stroke="#1B2430" stroke-width="1.5" stroke-dasharray="6 5"/><text x="46" y="138">Rework loop</text>
</g>
</svg>