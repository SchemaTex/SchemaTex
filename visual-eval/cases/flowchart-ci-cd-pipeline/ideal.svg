<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3220 840" width="3220" height="840">
<title>Continuous delivery pipeline with quality gates and production rollback</title>
<rect width="3220" height="840" fill="white"/>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4L0 8Z" fill="#334155"/></marker>
 <marker id="boldArrow" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6L0 12Z" fill="#183f63"/></marker>
 <style>
 .node{fill:#f8fafc;stroke:#334155;stroke-width:2.5}
 .gate{fill:#fff8e8;stroke:#805b20;stroke-width:2.5}
 .terminal{fill:#edf5fa;stroke:#183f63;stroke-width:2.5}
 .edge{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow);stroke-linejoin:round}
 .loop{stroke-dasharray:7 6}
 text{font-family:Helvetica,Arial,sans-serif;font-size:22px;fill:#172b3d;text-anchor:middle;dominant-baseline:middle}
 .label{font-size:19px;fill:#475569}
 </style>
</defs>
<!-- Main flow: commit, build, tests, and security gates. -->
<path d="M210 300H260" fill="none" stroke="#183f63" stroke-width="6" marker-end="url(#boldArrow)"/>
<path class="edge" d="M430 300H480"/>
<path class="edge" d="M680 300H740"/>
<path class="edge" d="M910 300H960"/>
<path class="edge" d="M1160 300H1220"/>
<path class="edge" d="M1420 300H1470"/>
<path class="edge" d="M1710 300H1770"/>
<path class="edge" d="M1950 300H2010"/>
<path class="edge" d="M2200 300H2250"/>
<path class="edge" d="M2480 300H2540"/>
<path class="edge" d="M2740 300H2790"/>
<!-- Successful production health check -->
<path class="edge" d="M2905 185V100H3115V260"/>
<!-- Failed quality gates converge at the notification bus. -->
<path d="M580 405V580H1060M1060 405V580H1590V420" fill="none" stroke="#334155" stroke-width="2.5"/>
<path class="edge" d="M1060 580V650"/>
<circle cx="1060" cy="580" r="4" fill="#334155"/>
<path class="edge loop" d="M960 690H125V340"/>
<!-- Approval hold and return. -->
<path class="edge" d="M2365 415V515"/>
<path class="edge loop" d="M2470 555H2510V150H2365V185"/>
<!-- Production rollback and incident. -->
<path class="edge" d="M2905 415V515"/>
<path class="edge" d="M2905 595V680"/>
<!-- Symbols -->
<rect class="terminal" x="40" y="260" width="170" height="80" rx="40"/>
<text x="125" y="300">Commit merged</text>
<rect class="node" x="260" y="260" width="170" height="80"/>
<text x="345" y="300">Build artifact</text>
<polygon class="gate" points="580,195 680,300 580,405 480,300"/>
<text x="580" y="288"><tspan x="580">Build</tspan><tspan x="580" dy="27">succeeds?</tspan></text>
<rect class="node" x="740" y="260" width="170" height="80"/>
<text x="825" y="288"><tspan x="825">Run unit</tspan><tspan x="825" dy="27">tests</tspan></text>
<polygon class="gate" points="1060,195 1160,300 1060,405 960,300"/>
<text x="1060" y="288"><tspan x="1060">Tests</tspan><tspan x="1060" dy="27">pass?</tspan></text>
<polygon class="node" points="1245,250 1395,250 1420,300 1395,350 1245,350 1220,300"/>
<text x="1320" y="288"><tspan x="1320">Security</tspan><tspan x="1320" dy="27">scan</tspan></text>
<polygon class="gate" points="1590,180 1710,300 1590,420 1470,300"/>
<text x="1590" y="288"><tspan x="1590">Findings</tspan><tspan x="1590" dy="27">acceptable?</tspan></text>
<rect class="node" x="1770" y="260" width="180" height="80"/>
<text x="1860" y="288"><tspan x="1860">Deploy to</tspan><tspan x="1860" dy="27">staging</tspan></text>
<rect class="node" x="2010" y="260" width="190" height="80"/>
<text x="2105" y="288"><tspan x="2105">Run integration</tspan><tspan x="2105" dy="27">tests</tspan></text>
<polygon class="gate" points="2365,185 2480,300 2365,415 2250,300"/>
<text x="2365" y="288"><tspan x="2365">Release</tspan><tspan x="2365" dy="27">approved?</tspan></text>
<rect class="node" x="2540" y="260" width="200" height="80"/>
<text x="2640" y="288"><tspan x="2640">Deploy</tspan><tspan x="2640" dy="27">production</tspan></text>
<polygon class="gate" points="2905,185 3020,300 2905,415 2790,300"/>
<text x="2905" y="288"><tspan x="2905">Health checks</tspan><tspan x="2905" dy="27">pass?</tspan></text>
<rect class="terminal" x="3040" y="260" width="150" height="80" rx="40"/>
<text x="3115" y="288"><tspan x="3115">Release</tspan><tspan x="3115" dy="27">complete</tspan></text>
<rect class="node" x="960" y="650" width="200" height="80"/>
<text x="1060" y="690">Notify developer</text>
<rect class="node" x="2260" y="515" width="210" height="80"/>
<text x="2365" y="555">Hold release</text>
<rect x="2795" y="515" width="220" height="80" fill="#fff1ee" stroke="#943f35" stroke-width="2.5"/>
<text x="2905" y="543"><tspan x="2905">Rollback</tspan><tspan x="2905" dy="27">production</tspan></text>
<rect class="terminal" x="2800" y="680" width="210" height="80" rx="40"/>
<text x="2905" y="720">Incident opened</text>
<!-- Branch labels -->
<text class="label" x="710" y="280">Yes</text>
<text class="label" x="1190" y="280">Yes</text>
<text class="label" x="1740" y="280">Yes</text>
<text class="label" x="2509" y="280">Yes</text>
<text class="label" x="603" y="448">No</text>
<text class="label" x="1083" y="448">No</text>
<text class="label" x="1613" y="455">No</text>
<text class="label" x="2388" y="465">No</text>
<text class="label" x="2928" y="465">No</text>
<text class="label" x="2930" y="155">Yes</text>
</svg>
