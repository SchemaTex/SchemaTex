<svg xmlns="http://www.w3.org/2000/svg" width="1710" height="800" viewBox="0 0 1710 800" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img"><title>Web Application Architecture</title><rect width="1710" height="800" fill="white" /><text x="50" y="46" font-size="24" fill="#16202B" font-weight="600">Web Application Architecture</text><text x="50" y="73" font-size="14" fill="#63707F">Two application servers share a cache, queue and database; two workers process queued jobs.</text><path d="M50 91H1660" stroke="#C9D2DC" /><defs><marker id="a" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3L0 6Z" fill="#16202B" /></marker></defs><path data-from="client" data-to="cdn" d="M200 310 L270 310" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="230" y="299" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">HTTPS</text><path data-from="cdn" data-to="lb" d="M420 310 L490 310" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="455" y="279" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">origin HTTPS</text><path data-from="lb" data-to="app1" d="M640 310 L690 310 L690 210 L760 210" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="721" y="198" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">requests</text><path data-from="lb" data-to="app2" d="M640 310 L690 310 L690 420 L760 420" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="721" y="408" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">requests</text><path data-from="app1" data-to="cache" d="M920 195 L1130 195" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1016" y="183" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">cache read/write</text><path data-from="app2" data-to="cache" d="M920 405 L960 405 L960 200 Q970 195 960 190 L960 140 L1085 140 L1085 190 Q1095 195 1085 200 L1085 225 L1130 225" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1019" y="128" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">cache read/write</text><path data-from="app1" data-to="queue" d="M920 225 L1020 225 L1020 405 L1130 405" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1065" y="393" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">enqueue jobs</text><path data-from="app2" data-to="queue" d="M920 435 L1130 435" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1015" y="455" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">enqueue jobs</text><path data-from="queue" data-to="worker1" d="M1290 405 L1360 405 L1360 370 L1450 370" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1395" y="358" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">job message</text><path data-from="queue" data-to="worker2" d="M1290 435 L1360 435 L1360 500 L1450 500" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1395" y="520" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">job message</text><path data-from="app1" data-to="db" d="M830 234 L830 270 L730 270 L730 415 Q740 420 730 425 L730 570 L1150 570 L1150 656" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="948" y="558" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">SQL</text><path data-from="app2" data-to="db" d="M870 444 L870 565 Q880 570 870 575 L870 610 L1190 610 L1190 656" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="969" y="598" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">SQL</text><path data-from="worker1" data-to="db" d="M1610 370 L1650 370 L1650 680 L1360 680" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1510" y="668" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">result write</text><path data-from="worker2" data-to="db" d="M1530 524 L1530 610 L1280 610 L1280 656" fill="none" stroke="#16202B" stroke-width="1.5" marker-end="url(#a)" /><text x="1399" y="599" font-size="12" fill="#63707F" text-anchor="middle" font-style="italic">result write</text><rect data-id="client" x="50" y="286" width="150" height="48" rx="4" fill="#E0F2FE" stroke="#16202B" stroke-width="1.5" /><text x="125" y="315" text-anchor="middle" font-size="14" fill="#16202B">Browser Client</text><rect data-id="cdn" x="270" y="286" width="150" height="48" rx="4" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5" /><text x="345" y="315" text-anchor="middle" font-size="14" fill="#16202B">CDN / WAF</text><rect data-id="lb" x="490" y="286" width="150" height="48" rx="4" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5" /><text x="565" y="315" text-anchor="middle" font-size="14" fill="#16202B">Load Balancer</text><rect data-id="app1" x="760" y="186" width="160" height="48" rx="4" fill="#DBEAFE" stroke="#16202B" stroke-width="1.5" /><text x="840" y="215" text-anchor="middle" font-size="14" fill="#16202B">App Server A</text><rect data-id="app2" x="760" y="396" width="160" height="48" rx="4" fill="#DBEAFE" stroke="#16202B" stroke-width="1.5" /><text x="840" y="425" text-anchor="middle" font-size="14" fill="#16202B">App Server B</text><rect data-id="cache" x="1130" y="186" width="160" height="48" rx="4" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5" /><text x="1210" y="215" text-anchor="middle" font-size="14" fill="#16202B">Redis Cache</text><rect data-id="queue" x="1130" y="396" width="160" height="48" rx="4" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5" /><text x="1210" y="425" text-anchor="middle" font-size="14" fill="#16202B">Job Queue</text><rect data-id="worker1" x="1450" y="346" width="160" height="48" rx="4" fill="#DCFCE7" stroke="#16202B" stroke-width="1.5" /><text x="1530" y="375" text-anchor="middle" font-size="14" fill="#16202B">Worker A</text><rect data-id="worker2" x="1450" y="476" width="160" height="48" rx="4" fill="#DCFCE7" stroke="#16202B" stroke-width="1.5" /><text x="1530" y="505" text-anchor="middle" font-size="14" fill="#16202B">Worker B</text><rect data-id="db" x="1120" y="656" width="240" height="48" rx="4" fill="#FFFFFF" stroke="#16202B" stroke-width="1.5" /><text x="1240" y="685" text-anchor="middle" font-size="14" fill="#16202B">PostgreSQL Database</text><path d="M50 747H1660" stroke="#C9D2DC" /><text x="50" y="775" font-size="12" fill="#63707F">Arrows identify the consumer of each data flow. Curved bridges indicate crossings without a connection.</text></svg>
