<title>Web Application Architecture</title>
<desc>A functional block diagram of Web Application Architecture. 10 blocks carry the forward signal path. Every wire is orthogonal, every arrowhead lands on a block edge, signal names are set in italic beside the wire they name, and a legend at the foot states the line codes.</desc>
