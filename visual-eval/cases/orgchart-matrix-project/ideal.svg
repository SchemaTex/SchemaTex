<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Orion Systems · Matrix Delivery</title>
<desc id="desc">Nine people across three reporting levels. Alex Morgan leads Engineering, Design and Delivery. Solid lines show functional reports. Dashed arrows assign Morgan Lee and Taylor King to Ari Bennett's Atlas project, and Riley Scott to Skyler Diaz's Beacon project.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#31865E"/></marker></defs>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#12161C}.name{font-size:13px;font-weight:600}.job{font-size:11.5px;fill:#5C6672}.dept{font-size:9.5px;font-weight:600;letter-spacing:.7px;fill:#8B95A2}.initials{font-size:12px;font-weight:600;fill:white;text-anchor:middle}.solid{fill:none;stroke:#98A3B1;stroke-width:1.5;stroke-linejoin:round}.project{fill:none;stroke:#31865E;stroke-width:1.15;stroke-dasharray:6 4;stroke-linejoin:round;stroke-linecap:round}.legend{font-size:11.5px;fill:#5C6672}</style>
