<text x="600" y="1348" font-size="11.5" fill="#64748B" text-anchor="start">c–f are buffered bits and g = A + B in this partial driver</text>
<text x="46" y="56" font-size="20" fill="#1E293B" text-anchor="start" font-weight="600">BCD Seven-Segment Driver</text>
<text x="46" y="80" font-size="11.5" fill="#64748B" text-anchor="start">ANSI / IEEE Std 91 distinctive-shape gates · signal flow left to right</text>
<text x="974" y="80" font-size="11.5" fill="#64748B" text-anchor="end">filled dot = junction · plain crossing = no connection</text>
