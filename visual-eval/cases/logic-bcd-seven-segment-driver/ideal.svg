<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1390" viewBox="0 0 1020 1390" role="img">
<title>BCD Seven-Segment Driver</title>
<desc>Partial gate-level BCD to seven-segment driver in ANSI/IEEE Std 91 distinctive-shape symbols. The four BCD bits A, B, C and D enter on the left as the input bus; each drives a buffer that becomes one of the pass-through segment outputs c, d, e and f, and each also drops into an inverter, so all four complements nA, nB, nC and nD are generated. The bits and their complements then run down the sheet as labelled vertical literal rails. Segment a is the OR of three inverted-input AND terms a1, a2 and a3; segment b is the OR of its own three AND terms b1, b2 and b3; each term taps the rails for the literals it needs, with a filled dot at every connection. Segment g is the OR of A and B. All seven outputs a to g leave on the right margin. A wire that crosses a rail without a dot is not connected to it.</desc>
