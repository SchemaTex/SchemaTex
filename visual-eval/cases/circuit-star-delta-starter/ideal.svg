<text x="1060" y="1194" class="label" text-anchor="start">CONTROL SEQUENCE</text>
<text x="1060" y="1226" class="" text-anchor="start">START → KM1 seals in; KT1 begins timing.</text>
<text x="1060" y="1258" class="" text-anchor="start">Before delay → NC star output energizes KM2.</text>
<text x="1060" y="1290" class="" text-anchor="start">After delay → NO delta output energizes KM3.</text>
<text x="1060" y="1322" class="small" text-anchor="start">Opposite-contactor NC contacts prevent simultaneous pickup.</text>
<text x="990" y="1390" class="small" text-anchor="start">Drafting note: interlocks are shown in series with the opposite coils.</text>
<text x="990" y="1415" class="small" text-anchor="start">COM is the control return; no connection to PE is implied.</text>
