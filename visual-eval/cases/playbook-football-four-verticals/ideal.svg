<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1033" viewBox="0 0 1012 654" role="img" aria-labelledby="title desc">
<title id="title">Four Verticals vs Cover 3</title>
<desc id="desc">Third and nine on the offense's own 30, college hash marks. Spread 2 by 2 offense attacks upward. X and Z run go routes, H and Y run seams, and the running back checks then releases to the left flat. A full eleven-player Cover 3 defense has two deep corners and a middle free safety, with three deep-third coverage zones.</desc>
<defs>
<marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5 L0 10 Z" fill="#15233B"/></marker>
<style>
text {font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#15233B}
.caption {font-size:12.5px;fill:#5B6675}
.zone {fill:#fff;fill-opacity:.12;stroke:#15233B;stroke-opacity:.4;stroke-width:1.2;stroke-dasharray:5 4}
.zone-label {font-size:10px;font-weight:600;letter-spacing:.8px;fill:#15233B;fill-opacity:.7;text-anchor:middle}
.route {fill:none;stroke:#15233B;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.offense {fill:#fff;stroke:#15233B;stroke-width:2.2}
.player-label {font-size:11.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.def-label {font-size:10.5px;font-weight:700;fill:#B42318;stroke:white;stroke-width:2.8;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.yard {font-size:46.9px;font-weight:700;fill:white;opacity:.5;text-anchor:middle;dominant-baseline:central}
</style>
</defs>
