<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1300" viewBox="0 0 1760 1300">
<title>DC1 Spine-Leaf Fabric — Two spines, four leaves, a complete Clos mesh and a separate out-of-band management path</title>
<desc>A two-spine, four-leaf Clos fabric. Both spine switches sit in one row above the four leaf switches, and every leaf carries an uplink to each spine, so the eight fabric links form a complete two-by-four mesh — the only crossings in the drawing, and the ones the topology requires. One named server hangs below each leaf on a 25G link: three compute nodes and one storage node. The out-of-band management path is drawn apart from the fabric as a thin dashed grey bus along the foot, with a riser to every spine and every leaf, an OOB management switch sitting on the bus and the management gateway below it.</desc>
