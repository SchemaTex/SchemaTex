<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Martin Luther King Jr. and Malcolm X</title>
  <rect width="1600" height="900" fill="white"/>
  <g fill="none" stroke="#46515c" stroke-width="3" stroke-linejoin="round">
    <!-- Shared traits connect to both central figures. -->
    <path d="M610 450 H640 V190 H660 M940 190 H960 V450 H990"/>
    <path d="M610 450 H660 M940 450 H990"/>
    <path d="M610 450 H640 V710 H660 M940 710 H960 V450 H990"/>
    <!-- Unique traits connect only to their respective figure. -->
    <path d="M350 450 H320 V265 H290 M350 450 H320 V635 H290"/>
    <path d="M1250 450 H1280 V265 H1310 M1250 450 H1280 V635 H1310"/>
  </g>
  <g stroke-width="3">
    <ellipse cx="480" cy="450" rx="130" ry="100" fill="#e7eff9" stroke="#355675"/>
    <ellipse cx="1120" cy="450" rx="130" ry="100" fill="#f8ecdf" stroke="#81552c"/>
    <ellipse cx="800" cy="190" rx="140" ry="80" fill="#edf3ed" stroke="#526c56"/>
    <ellipse cx="800" cy="450" rx="140" ry="80" fill="#edf3ed" stroke="#526c56"/>
    <ellipse cx="800" cy="710" rx="140" ry="90" fill="#edf3ed" stroke="#526c56"/>
    <ellipse cx="155" cy="265" rx="135" ry="85" fill="#e7eff9" stroke="#355675"/>
    <ellipse cx="155" cy="635" rx="135" ry="105" fill="#e7eff9" stroke="#355675"/>
    <ellipse cx="1445" cy="265" rx="135" ry="85" fill="#f8ecdf" stroke="#81552c"/>
    <ellipse cx="1445" cy="635" rx="135" ry="95" fill="#f8ecdf" stroke="#81552c"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#202c36" font-size="24">
    <text x="480" y="428" font-size="29" font-weight="bold"><tspan x="480">Martin Luther</tspan><tspan x="480" dy="38">King Jr.</tspan></text>
    <text x="1120" y="460" font-size="30" font-weight="bold">Malcolm X</text>
    <text x="800" y="183"><tspan x="800">Civil-rights</tspan><tspan x="800" dy="31">leadership</tspan></text>
    <text x="800" y="443"><tspan x="800">Powerful public</tspan><tspan x="800" dy="31">speaking</tspan></text>
    <text x="800" y="688"><tspan x="800">Sought Black</tspan><tspan x="800" dy="31">dignity and</tspan><tspan x="800" dy="31">equality</tspan></text>
    <text x="155" y="258"><tspan x="155">Nonviolent</tspan><tspan x="155" dy="31">direct action</tspan></text>
    <text x="155" y="597"><tspan x="155">Southern</tspan><tspan x="155" dy="31">Christian</tspan><tspan x="155" dy="31">Leadership</tspan><tspan x="155" dy="31">Conference</tspan></text>
    <text x="1445" y="243"><tspan x="1445">Black</tspan><tspan x="1445" dy="31">nationalism</tspan><tspan x="1445" dy="31">emphasis</tspan></text>
    <text x="1445" y="628"><tspan x="1445">Nation of Islam</tspan><tspan x="1445" dy="31">spokesperson</tspan></text>
  </g>
</svg>
