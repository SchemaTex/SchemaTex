<circle class="trait" cx="316" cy="352" r="89" fill="#28598C" stroke="#28598C"/>
<text class="subject">
<tspan x="316" y="340.5" dominant-baseline="central">Martin Luther</tspan>
<tspan x="316" y="363.5" dominant-baseline="central">King Jr.</tspan>
</text>
<circle class="trait" cx="804" cy="352" r="89" fill="#6B4F8C" stroke="#6B4F8C"/>
<text class="subject">
<tspan x="804" y="352.0" dominant-baseline="central">Malcolm X</tspan>
</text>
<circle class="trait" cx="560" cy="185" r="70" fill="#FFFFFF" stroke="#5F6B7A"/>
<text class="">
<tspan x="560" y="176.5" dominant-baseline="central">Civil-rights</tspan>
<tspan x="560" y="193.5" dominant-baseline="central">leadership</tspan>
</text>
<circle class="trait" cx="560" cy="352" r="70" fill="#FFFFFF" stroke="#5F6B7A"/>
<text class="">
<tspan x="560" y="343.5" dominant-baseline="central">Powerful public</tspan>
<tspan x="560" y="360.5" dominant-baseline="central">speaking</tspan>
</text>
<circle class="trait" cx="560" cy="519" r="70" fill="#FFFFFF" stroke="#5F6B7A"/>
<text class="">
<tspan x="560" y="502.0" dominant-baseline="central">Sought Black</tspan>
<tspan x="560" y="519.0" dominant-baseline="central">dignity and</tspan>
<tspan x="560" y="536.0" dominant-baseline="central">equality</tspan>
</text>
<circle class="trait" cx="170" cy="205" r="70" fill="#E5EDF5" stroke="#28598C"/>
<text class="">
<tspan x="170" y="196.5" dominant-baseline="central">Nonviolent</tspan>
<tspan x="170" y="213.5" dominant-baseline="central">direct action</tspan>
</text>
<circle class="trait" cx="170" cy="499" r="70" fill="#E5EDF5" stroke="#28598C"/>
<text class="">
<tspan x="170" y="482.0" dominant-baseline="central">Southern Christian</tspan>
<tspan x="170" y="499.0" dominant-baseline="central">Leadership</tspan>
<tspan x="170" y="516.0" dominant-baseline="central">Conference</tspan>
</text>
<circle class="trait" cx="950" cy="205" r="70" fill="#EDE8F3" stroke="#6B4F8C"/>
<text class="">
<tspan x="950" y="196.5" dominant-baseline="central">Black nationalism</tspan>
<tspan x="950" y="213.5" dominant-baseline="central">emphasis</tspan>
</text>
<circle class="trait" cx="950" cy="499" r="70" fill="#EDE8F3" stroke="#6B4F8C"/>
<text class="">
<tspan x="950" y="490.5" dominant-baseline="central">Nation of Islam</tspan>
<tspan x="950" y="507.5" dominant-baseline="central">spokesperson</tspan>
</text>
<text class="caption" x="223" y="642" style="fill:#28598C">Only Martin Luther King Jr.</text>
<text class="caption" x="560" y="642" style="fill:#5F6B7A">Both</text>
<text class="caption" x="897" y="642" style="fill:#6B4F8C">Only Malcolm X</text>
