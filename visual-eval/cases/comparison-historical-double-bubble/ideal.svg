.caption{font-size:13px;font-weight:600}
.link{stroke:#ACB8C7;stroke-width:1.5;fill:none}
.trait{stroke-width:1.25}
</style>
<text class="heading" x="48" y="58">Martin Luther King Jr. and Malcolm X</text>
