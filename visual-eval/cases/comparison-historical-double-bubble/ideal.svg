<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="973" viewBox="0 0 1120 681" role="img" aria-labelledby="title">
<title id="title">Martin Luther King Jr. and Malcolm X</title>
<rect width="1120" height="681" fill="#FFFFFF"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1B2430;text-anchor:middle;font-size:13.5px;font-weight:400}
