<polygon points="115.5,187 122.26,194.45 113.6,196.88" class="sx-cld-arrow"/>
<text x="110.32042827230731" y="204.8106703642093" class="sx-cld-polarity" text-anchor="middle">+</text>
<line x1="144.70380592228744" y1="248.96776695296634" x2="151.06776695296637" y2="242.60380592228742" class="sx-cld-delay"/>
<line x1="147.53223304703366" y1="251.79619407771256" x2="153.89619407771258" y2="245.43223304703363" class="sx-cld-delay"/></g>
<g class="sx-cld-link-g" data-from="Inbound deliveries" data-to="Inventory" data-polarity="+"><path d="M 115.5 161 Q 136.1 87.6 209.5 67" class="sx-cld-link"/>
