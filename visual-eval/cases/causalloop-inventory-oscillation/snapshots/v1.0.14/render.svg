<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="485" height="379" viewBox="0 0 485 379" role="img" aria-label="Causal loop diagram" data-diagram-type="causalloop"><title>Causal loop diagram</title>
<desc>Causal loop diagram: 4 variables, 4 causal links. 1 feedback loop: 0 reinforcing (R), 1 balancing (B). B1 &quot;Replenishment with delay&quot; (balancing, 1 negative link): Inventory → Perceived stock gap → Order rate → Inbound deliveries → Inventory. Line 3: unrecognised line: &quot;causalloop &quot;Retail inventory oscillation&quot;&quot;</desc>
<style>.sx-cld-bg { fill: #ffffff; }
.sx-cld-link { fill: none; stroke: #1a1a1a; stroke-width: 2; }
.sx-cld-arrow { fill: #1a1a1a; stroke: none; }
.sx-cld-var { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
.sx-cld-polarity { fill: #1a1a1a; font-size: 14px; font-weight: 700; }
.sx-cld-link-label { fill: #1a1a1a; font-size: 9px; }
.sx-cld-delay { stroke: #1a1a1a; stroke-width: 2; }
.sx-cld-glyph { fill: none; stroke: #1d6fd6; stroke-width: 2; }
.sx-cld-glyph-head { fill: #1d6fd6; stroke: none; }
.sx-cld-glyph-label { fill: #1d6fd6; font-size: 12px; font-weight: 700; }
.sx-cld-glyph-phrase { fill: #1d6fd6; font-size: 10px; font-style: italic; }
.sx-cld-title { fill: #1a1a1a; font-size: 16px; font-weight: 700; }</style>
<rect x="0" y="0" width="485" height="379" class="sx-cld-bg"/>
<g transform="translate(20, 20)" font-family="system-ui, -apple-system, sans-serif"><g class="sx-cld-link-g" data-from="Inventory" data-to="Perceived stock gap" data-polarity="-"><path d="M 235.5 67 Q 308.9 87.6 329.5 161" class="sx-cld-link"/>
