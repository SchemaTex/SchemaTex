<g class="sx-cld-link-g" data-from="Perceived stock gap" data-to="Order rate" data-polarity="+"><path d="M 329.5 187 Q 308.9 260.4 235.5 281" class="sx-cld-link"/>
<polygon points="235.5,281 242.95,274.24 245.38,282.9" class="sx-cld-arrow"/>
<text x="249.31067036420927" y="290.1795717276927" class="sx-cld-polarity" text-anchor="middle">+</text></g>
