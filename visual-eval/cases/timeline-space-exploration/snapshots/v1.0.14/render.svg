<circle cx="615.2597182860275" cy="198" r="5" fill="#2563eb" class="st-event-dot" data-event-id="ev-11"/>
<path d="M888.85,188.00 L891.20,194.76 L898.36,194.91 L892.66,199.24 L894.73,206.09 L888.85,202.00 L882.97,206.09 L885.05,199.24 L879.34,194.91 L886.50,194.76 Z" fill="#d97706" class="st-milestone" data-event-id="ev-12"/>
<circle cx="904.9999999999991" cy="198" r="5" fill="#2563eb" class="st-event-dot" data-event-id="ev-13"/></g><g class="st-labels"><text x="155.0000000000009" y="76" text-anchor="middle" class="st-milestone-label">Sputnik 1</text>
<text x="195.76604204560124" y="108" text-anchor="middle" class="st-event-label">First human orbital flight</text>
<text x="291.54244744300263" y="144" text-anchor="middle" class="st-milestone-label">Apollo 11 lunar landing</text>
<line x1="330.94589421961416" y1="132" x2="330.94589421961416" y2="148" class="st-label-leader"/>
<text x="330.94589421961416" y="158" text-anchor="middle" class="st-event-label">Apollo 17 final Moonwalk</text>
<text x="385.66917643077704" y="180" text-anchor="middle" class="st-event-label">Voyager 1 launch</text>
<text x="529.7620659024584" y="148" text-anchor="middle" class="st-event-label">Pale Blue Dot image</text>
<text x="615.2597182860275" y="184" text-anchor="middle" class="st-event-label">Mars Pathfinder landing</text>
<text x="888.8522059134526" y="184" text-anchor="middle" class="st-milestone-label">Perseverance rover landing</text>
<text x="904.9999999999991" y="216" text-anchor="middle" class="st-event-label">JWST first images</text></g><g class="st-notes"></g>
