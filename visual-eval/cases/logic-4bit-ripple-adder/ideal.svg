<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1080" viewBox="0 0 880 1080" role="img">
<title>4-bit Ripple-Carry Adder</title>
<desc>Gate-level 4-bit ripple-carry adder in ANSI/IEEE Std 91 distinctive-shape symbols, drawn as four identical full-adder stages stacked one above the other, bit 0 at the top. In each stage the two addend bits Ak and Bk enter on the left, drive an exclusive-OR whose output xk is the half sum and an AND whose output ak is the carry generate; a second exclusive-OR adds the incoming carry to xk to give the sum bit Sk, a second AND combines xk with the incoming carry to give the carry propagate bk, and an OR gate sums ak and bk into that stage's carry out. Cin enters the top stage from the left; every other stage takes its carry from the stage above along a lane that runs back across the sheet, which is the ripple the name refers to. The four sum bits and Cout leave on the right margin. All wires are orthogonal; filled dots mark junctions and plain crossings mark wires that pass without connecting.</desc>
