<text x="46" y="1038" font-size="11.5" fill="#64748B" text-anchor="start">Each bit is a full adder: Sk = Ak ⊕ Bk ⊕ ck−1</text>
<text x="380" y="1038" font-size="11.5" fill="#64748B" text-anchor="start">ck = Ak·Bk + (Ak ⊕ Bk)·ck−1 — the carry ripples down the chain</text>
<text x="46" y="56" font-size="20" fill="#1E293B" text-anchor="start" font-weight="600">4-bit Ripple-Carry Adder</text>
<text x="46" y="80" font-size="11.5" fill="#64748B" text-anchor="start">ANSI / IEEE Std 91 distinctive-shape gates · signal flow left to right</text>
<text x="834" y="80" font-size="11.5" fill="#64748B" text-anchor="end">filled dot = junction · plain crossing = no connection</text>
