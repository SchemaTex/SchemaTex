<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="834" viewBox="0 0 1600 834" role="img" aria-labelledby="title desc">
<title id="title">Ward 4B escape plan</title><desc id="desc">Hospital ward evacuation plan posted at the Nurse Station. The solid primary route leads east and the dashed alternative route leads west through EI60 fire doors to separate final exits.</desc>
<defs>
