<rect x="457" y="623" width="572" height="168" rx="4" fill="white" stroke="#CCD3D9"/><text x="475" y="648" class="panelhead">IF YOU DISCOVER A FIRE</text><path d="M475 657H1010" stroke="#CCD3D9"/>

<circle cx="483.5" cy="678" r="8.5" fill="#1B2430"/><text x="483.5" y="682" text-anchor="middle" font-size="11" font-weight="700" style="fill:white">1</text><text x="503" y="682" class="legendtext">Raise the alarm and notify ward staff immediately.</text>
<circle cx="483.5" cy="702" r="8.5" fill="#1B2430"/><text x="483.5" y="706" text-anchor="middle" font-size="11" font-weight="700" style="fill:white">2</text><text x="503" y="706" class="legendtext">Follow the green route and staff instructions — never use a lift.</text>
<circle cx="483.5" cy="726" r="8.5" fill="#1B2430"/><text x="483.5" y="730" text-anchor="middle" font-size="11" font-weight="700" style="fill:white">3</text><text x="503" y="730" class="legendtext">Close every door behind you.</text>
<circle cx="483.5" cy="750" r="8.5" fill="#1B2430"/><text x="483.5" y="754" text-anchor="middle" font-size="11" font-weight="700" style="fill:white">4</text><text x="503" y="754" class="legendtext">Go to the assembly point and report to your fire marshal.</text>
<text x="475" y="775" class="caption">Patients requiring assistance: follow the ward evacuation procedure.</text>
