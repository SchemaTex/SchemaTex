<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="840" viewBox="0 0 1090 840" role="img">
<title>4-to-1 Multiplexer</title>
<desc>Gate-level 4-to-1 multiplexer in ANSI/IEEE Std 91 distinctive-shape symbols. Data inputs D0 to D3 enter on the left and each drives the top pin of its own three-input AND gate. Select inputs S1 and S0 enter below and drive two inverters; the four select literals S1, nS1, S0 and nS0 then run as vertical rails, each tapped by the two product terms it qualifies, so exactly one of p0 to p3 can be high. The four product terms are combined by two OR gates, o01 and o23, whose outputs feed a final OR to give Y. All wires are orthogonal; filled dots mark junctions and plain crossings mark wires that pass without connecting.</desc>
