<text x="46" y="798" font-size="11.5" fill="#64748B" text-anchor="start">Y = D0·S1′·S0′ + D1·S1′·S0 + D2·S1·S0′ + D3·S1·S0</text>
<text x="46" y="56" font-size="20" fill="#1E293B" text-anchor="start" font-weight="600">4-to-1 Multiplexer</text>
<text x="46" y="80" font-size="11.5" fill="#64748B" text-anchor="start">ANSI / IEEE Std 91 distinctive-shape gates · signal flow left to right</text>
<text x="1044" y="80" font-size="11.5" fill="#64748B" text-anchor="end">filled dot = junction · plain crossing = no connection</text>
<text x="54" y="146.5" font-size="13" fill="#1E293B" text-anchor="end">D0</text>
<text x="54" y="266.5" font-size="13" fill="#1E293B" text-anchor="end">D1</text>
