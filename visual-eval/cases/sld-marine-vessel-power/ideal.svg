<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 816" width="1672" height="816" role="img">
<title>Offshore Support Vessel · Main Power</title>
<desc>Two 1000 kW diesel generators and an interlocked shore connection each feed the 440 V main switchboard through their own breaker; the switchboard serves the 750 kW propulsion drive and the hotel services board. To the right, and deliberately not tied to it, the 250 kW emergency generator feeds its own emergency switchboard and the emergency lighting and navigation load.</desc>
