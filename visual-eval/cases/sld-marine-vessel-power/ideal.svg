<text x="46" y="770" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">The shore breaker is mechanically interlocked against the two generator breakers.</text>
<text x="1250" y="770" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">The emergency switchboard has no tie to the main switchboard.</text>
