<title id="title">Riverside Hospital · Medicine Directorate</title>
<desc id="desc">Dr Helen Ward, Chief of Medicine, leads acute medicine, cardiology, nursing and allied health. Consultants retain registrar supervision. A dashed clinical coordination arrow connects Dr Amir Khan to Elena Cruz.</desc>
