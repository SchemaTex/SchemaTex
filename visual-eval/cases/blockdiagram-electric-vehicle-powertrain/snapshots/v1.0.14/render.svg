<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-bd" viewBox="0 0 1574 394" width="1574" height="394" role="img" data-diagram-type="blockdiagram"><title>Electric vehicle powertrain</title>
<desc>Block diagram with 7 blocks, 0 summing junctions, 7 signals</desc>
<defs><style>.schematex-bd { font-family: system-ui, -apple-system, sans-serif; }
.schematex-bd-block { stroke: #334155; stroke-width: 2; }
