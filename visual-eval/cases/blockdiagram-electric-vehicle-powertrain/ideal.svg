<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1493 380" width="1493" height="380" role="img">
<title>Electric vehicle powertrain</title>
<desc>A functional block diagram of Electric vehicle powertrain. 7 blocks carry the forward signal path. Every wire is orthogonal, every arrowhead lands on a block edge, signal names are set in italic beside the wire they name, and a legend at the foot states the line codes.</desc>
<rect x="0" y="0" width="1493" height="380" fill="#ffffff" />
<text x="46" y="48" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#16202B">Electric vehicle powertrain</text>
<text x="46" y="70" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#63707F">this functional architecture follows energy flow from charging source to traction and vehicle motion</text>
