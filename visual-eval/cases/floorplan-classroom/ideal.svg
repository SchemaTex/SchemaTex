<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030">
<title>Classroom for 28 Students — dimensioned floor plan</title>
<desc>Four rows of seven student desk and chair units face the north whiteboard. Three desks per row are west of a clear 1.6 metre central aisle and four are east. An inward swinging south entrance connects to the aisle. Teacher desk and chair and storage occupy the front teaching area.</desc>
