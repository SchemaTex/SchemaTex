<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-seq" role="img" aria-label="UML sequence diagram" width="713" height="761" viewBox="0 0 713 761" data-diagram-type="sequence"><title>Sequence Diagram</title>
<desc>5 participants, 13 messages, 3 combined fragments.</desc>
<style>.sx-seq { font-family: system-ui, -apple-system, sans-serif; }
.sx-seq-axis { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 4; }
.sx-seq-head rect, .sx-seq-head path { fill: #e8f0fb; stroke: #5b85c0; stroke-width: 1.4; }
.sx-seq-head-name { font: 600 12.5px sans-serif; fill: #0f172a; }
.sx-seq-head-stereo { font: italic 10px sans-serif; fill: #475569; }
.sx-seq-actor line, .sx-seq-actor circle { stroke: #334155; stroke-width: 1.6; fill: none; stroke-linecap: round; }
.sx-seq-actor-head { fill: #ffffff; }
.sx-seq-icon { fill: #ffffff; stroke: #5b85c0; stroke-width: 1.6; }
.sx-seq-icon-line { stroke: #5b85c0; stroke-width: 1.6; fill: none; stroke-linecap: round; }
.sx-seq-icon-fill { fill: #5b85c0; stroke: none; }
.sx-seq-act { fill: #ffffff; stroke: #5b85c0; stroke-width: 1.2; }
.sx-seq-msg { stroke: #334155; stroke-width: 1.5; fill: none; }
.sx-seq-msg-reply { stroke: #334155; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
.sx-seq-msg-label { font: 11px sans-serif; fill: #0f172a; }
.sx-seq-msg-num { font: 600 10px sans-serif; fill: #475569; }
.sx-seq-endpoint { fill: #334155; }
.sx-seq-frame { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
.sx-seq-frame-neg { fill: #dc2626; fill-opacity: 0.06; }
.sx-seq-frame-sep { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5 4; }
.sx-seq-frame-tab { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
.sx-seq-frame-op { font: 700 11px sans-serif; fill: #0f172a; }
.sx-seq-guard { font: italic 10.5px sans-serif; fill: #475569; }
.sx-seq-ref-name { font: 600 12px sans-serif; fill: #0f172a; }
.sx-seq-note rect { fill: #fdf6da; stroke: #d9c97e; stroke-width: 1.1; }
.sx-seq-note path { fill: #efe2a6; stroke: #d9c97e; stroke-width: 1.1; }
.sx-seq-note-text { font: 11px sans-serif; fill: #0f172a; }
.sx-seq-div line { stroke: #94a3b8; stroke-width: 1; }
.sx-seq-div rect { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
.sx-seq-div-text { font: 600 11px sans-serif; fill: #475569; }
.sx-seq-inv rect { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; }
.sx-seq-inv-text { font: italic 10.5px sans-serif; fill: #475569; }
.sx-seq-destroy { stroke: #dc2626; stroke-width: 2; }
.sx-seq-title { font: 700 16px sans-serif; fill: #0f172a; }</style>
<defs><marker id="sx-seq-filled" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="11" markerHeight="9" orient="auto"><polygon points="0,0 11,5 0,10" fill="#334155"/></marker>
