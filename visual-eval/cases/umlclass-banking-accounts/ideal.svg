<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="982" viewBox="0 0 1600 982">
<title>Retail bank — accounts, policies and ledger entries</title>
<desc>UML class diagram with eight classifiers and eight relationships. Three account subclasses generalize Account. Customer owns accounts. Accounts compose ledger entries and statements. SavingsAccount uses InterestPolicy, which has a dependency back to SavingsAccount.</desc>
