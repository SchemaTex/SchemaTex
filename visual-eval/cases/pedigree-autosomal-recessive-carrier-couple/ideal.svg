<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440">
<title>Autosomal recessive carrier couple</title>
<desc>Two-generation autosomal recessive pedigree. Carrier male I-1 and carrier female I-2 are mated; both are drawn with the left half of the symbol filled. Their three children hang from one sibship line: unaffected male II-1, affected female II-2 marked as the proband with a P arrow, and unaffected male II-3.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="620" height="440" fill="#ffffff"/>
<rect x="22" y="338" width="394.59000000000003" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="310" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">Autosomal recessive carrier couple</text>
<text x="26" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
<text x="26" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">II</text>
<line x1="270" y1="90" x2="330" y2="90" stroke="#334155" stroke-width="2"/>
<line x1="300" y1="90" x2="300" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="190" y1="170" x2="410" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="190" y1="170" x2="190" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="300" y1="170" x2="300" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="410" y1="170" x2="410" y2="240" stroke="#334155" stroke-width="2"/>
<g class="person" data-id="I-1"><rect x="230" y="70" width="20" height="40" fill="#1565c0"/><rect x="230" y="70" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="250" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">I-1</text></g>
<g class="person" data-id="I-2"><path d="M 350 70 A 20 20 0 0 0 350 110 Z" fill="#1565c0"/><circle cx="350" cy="90" r="20" fill="none" stroke="#334155" stroke-width="2"/><text x="350" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">I-2</text></g>
<g class="person" data-id="II-1"><rect x="170" y="240" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="190" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-1</text></g>
<g class="person" data-id="II-2"><circle cx="300" cy="260" r="20" fill="#1565c0"/><circle cx="300" cy="260" r="20" fill="none" stroke="#334155" stroke-width="2"/><text x="300" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-2</text></g>
<g class="person" data-id="II-3"><rect x="390" y="240" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="410" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-3</text></g>
<line x1="258" y1="302" x2="282" y2="278" stroke="#334155" stroke-width="2" marker-end="url(#pa)"/><text x="246" y="307" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">P</text>
<text x="34" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.6" fill="#475569">GENETIC STATUS</text>
<rect x="156" y="350" width="18" height="18" fill="#1565c0" stroke="#334155" stroke-width="1.5"/>
<text x="182" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Affected</text>
<rect x="254.92000000000002" y="350" width="9" height="18" fill="#1565c0"/><rect x="254.92000000000002" y="350" width="18" height="18" fill="none" stroke="#334155" stroke-width="1.5"/>
<text x="280.92" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Carrier (heterozygote)</text>
<text x="34" y="393" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.6" fill="#475569">SYMBOLS</text>
<line x1="156" y1="398" x2="171" y2="383" stroke="#334155" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="182" y="393" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Proband (P)</text>
</svg>
