<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 472 388" class="schematex-diagram schematex-pedigree" width="472" height="388"><title>Autosomal recessive carrier couple</title>
<desc>Pedigree chart with 5 individuals across 2 generations</desc>
<defs><clipPath id="schematex-pedigree-clip-carrier-rect"><rect x="0" y="0" width="50%" height="100%"/></clipPath>
<clipPath id="schematex-pedigree-clip-carrier-circle"><rect x="-50" y="-50" width="50" height="100"/></clipPath>
<marker id="schematex-pedigree-proband-arrow" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<style>
.schematex-pedigree {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
}
.schematex-pedigree-shape { fill: #ffffff; stroke: #334155; stroke-width: 2; stroke-linejoin: round; }
.schematex-pedigree-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; text-anchor: middle; fill: #0f172a; }
.schematex-pedigree-gen-label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
.schematex-pedigree-edge { stroke: #334155; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.schematex-pedigree-deceased-mark { stroke: #b71c1c; stroke-width: 2; stroke-linecap: round; }
.schematex-pedigree-affected-fill { fill: #1565c0; }
.schematex-pedigree-carrier-fill { fill: #1565c0; }
.schematex-pedigree-carrier-x-dot { fill: #1565c0; }
.schematex-pedigree-presymptomatic-mark { stroke: #1565c0; stroke-width: 2; }
.schematex-pedigree-proband-arrow-line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#schematex-pedigree-proband-arrow); }
.schematex-pedigree-proband-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #334155; }
.schematex-pedigree-loss-shape { fill: #334155; stroke: #334155; stroke-width: 2; stroke-linejoin: round; }
.schematex-pedigree-tab-slash { stroke: #b71c1c; stroke-width: 2; stroke-linecap: round; }
.schematex-pedigree-status-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #0f172a; }
.schematex-pedigree-legend { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #0f172a; }
.schematex-pedigree-legend-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
</style>
<g transform="translate(11, 0)"><g class="schematex-pedigree-generation-labels"><text x="25" y="65" class="schematex-pedigree-gen-label">I</text>
<text x="25" y="231" class="schematex-pedigree-gen-label">II</text></g>
<g class="schematex-pedigree-edges"><g class="schematex-pedigree-edge schematex-pedigree-edge-married" data-from="i-1" data-to="i-2"><path d="M 206 60 L 254 60" class="schematex-pedigree-edge-path"/></g>
<g class="schematex-pedigree-edge schematex-pedigree-edge-parent-child" data-from="i-1" data-to="i-2"><path d="M 230 60 L 230 141" class="schematex-pedigree-edge-path"/></g>
<g class="schematex-pedigree-edge schematex-pedigree-edge-parent-child" data-from="i-1" data-to="i-2"><path d="M 70 141 L 390 141" class="schematex-pedigree-edge-path"/></g>
<g class="schematex-pedigree-edge schematex-pedigree-edge-parent-child" data-from="i-1+i-2" data-to="ii-1"><path d="M 70 141 L 70 206" class="schematex-pedigree-edge-path"/></g>
<g class="schematex-pedigree-edge schematex-pedigree-edge-parent-child" data-from="i-1+i-2" data-to="ii-2"><path d="M 230 141 L 230 206" class="schematex-pedigree-edge-path"/></g>
<g class="schematex-pedigree-edge schematex-pedigree-edge-parent-child" data-from="i-1+i-2" data-to="ii-3"><path d="M 390 141 L 390 206" class="schematex-pedigree-edge-path"/></g></g>
<g class="schematex-pedigree-generation schematex-pedigree-generation-0" data-generation="0"><g class="schematex-pedigree-node schematex-pedigree-male schematex-pedigree-carrier" data-individual-id="i-1" transform="translate(186, 60)"><title>I-1 (carrier)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-pedigree-shape"/>
<rect x="-20" y="-20" width="40" height="40" class="schematex-pedigree-carrier-fill" clip-path="url(#schematex-pedigree-clip-carrier-rect)"/></g>
<g class="schematex-pedigree-node schematex-pedigree-female schematex-pedigree-carrier" data-individual-id="i-2" transform="translate(274, 60)"><title>I-2 (carrier)</title>
<circle cx="0" cy="0" r="20" class="schematex-pedigree-shape"/>
<circle cx="0" cy="0" r="20" class="schematex-pedigree-carrier-fill" clip-path="url(#schematex-pedigree-clip-carrier-circle)"/></g></g>
<g class="schematex-pedigree-generation schematex-pedigree-generation-1" data-generation="1"><g class="schematex-pedigree-node schematex-pedigree-male schematex-pedigree-unaffected" data-individual-id="ii-1" transform="translate(70, 226)"><title>II-1</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-pedigree-shape"/></g>
<g class="schematex-pedigree-node schematex-pedigree-female schematex-pedigree-affected" data-individual-id="ii-2" transform="translate(230, 226)"><title>II-2 (affected)</title>
<circle cx="0" cy="0" r="20" class="schematex-pedigree-shape"/>
<circle cx="0" cy="0" r="20" class="schematex-pedigree-affected-fill"/>
<line x1="-40" y1="40" x2="-22" y2="22" class="schematex-pedigree-proband-arrow-line"/>
<text x="-44" y="44" class="schematex-pedigree-proband-label" text-anchor="end">P</text></g>
<g class="schematex-pedigree-node schematex-pedigree-male schematex-pedigree-unaffected" data-individual-id="ii-3" transform="translate(390, 226)"><title>II-3</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-pedigree-shape"/></g></g>
<g class="schematex-pedigree-labels"><text x="186" y="98" class="schematex-pedigree-label" data-individual-id="i-1">I-1</text>
<text x="274" y="98" class="schematex-pedigree-label" data-individual-id="i-2">I-2</text>
<text x="70" y="264" class="schematex-pedigree-label" data-individual-id="ii-1">II-1</text>
<text x="230" y="264" class="schematex-pedigree-label" data-individual-id="ii-2">II-2</text>
<text x="390" y="264" class="schematex-pedigree-label" data-individual-id="ii-3">II-3</text></g></g>
<g class="schematex-legend"><style>
.schematex-legend { font-family: system-ui, -apple-system, sans-serif; }
.schematex-legend-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
.schematex-legend-section { font-size: 9px; font-weight: 600; fill: #475569; letter-spacing: 0.6px; }
.schematex-legend-label { font-size: 11px; fill: #0f172a; dominant-baseline: alphabetic; }
</style>
<text x="16" y="348.5" class="schematex-legend-section">GENETIC STATUS</text>
<g class="schematex-legend-row" data-legend-key="status.affected" data-legend-section="status"><rect x="138.1" y="340" width="20" height="10" fill="#1565c0" stroke="#334155"/>
<text x="167.1" y="348.5" class="schematex-legend-label">Affected</text></g>
<g class="schematex-legend-row" data-legend-key="status.carrier" data-legend-section="status"><rect x="239.1" y="340" width="20" height="10" fill="transparent" stroke="#334155"/><rect x="239.1" y="340" width="10" height="10" fill="#1565c0"/>
<text x="268.1" y="348.5" class="schematex-legend-label">Carrier</text></g>
<text x="16" y="366.5" class="schematex-legend-section">SYMBOLS</text>
<g class="schematex-legend-row" data-legend-key="marker.proband" data-legend-section="symbols"><text x="148.1" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P</text>
<text x="167.1" y="366.5" class="schematex-legend-label">Proband (P) — first affected case identified</text></g></g></svg>