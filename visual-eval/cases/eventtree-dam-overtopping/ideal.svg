<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="765" viewBox="0 0 1660 765" role="img" font-family="Helvetica Neue, Helvetica, sans-serif"><title>Dam overtopping</title><desc>Independent reference drawing following the current exemplar. Conditional safety functions · success continues straight; failure drops to a new sequence</desc><rect width="1660" height="765" fill="white"/><text x="40" y="45" font-size="25" fill="#0f172a" text-anchor="start" font-weight="600">Dam overtopping</text><text x="40" y="73" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Conditional safety functions · success continues straight; failure drops to a new sequence</text><rect x="40" y="104" width="1580" height="102" rx="0" fill="#f1f5f9" stroke="none" stroke-width="1.5"/><text x="55" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Initiating event</text><text x="55" y="158" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Extreme inflow exceeds reservoir</text><text x="55" y="177" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">design level</text><text x="345" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Flood warning issued</text><text x="345" y="190" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.05</text><path d="M330 104V670" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 5"/><text x="575" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Emergency spillway</text><text x="575" y="152" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">operates</text><text x="575" y="190" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.03</text><path d="M560 104V670" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 5"/><text x="805" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Downstream evacuation</text><text x="805" y="152" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">succeeds</text><text x="805" y="190" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.1</text><path d="M790 104V670" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 5"/><text x="1045" y="137" font-size="16" fill="#0f172a" text-anchor="start" font-weight="600">Outcome</text><text x="1605" y="137" font-size="16" fill="#0f172a" text-anchor="end" font-weight="600">Frequency</text><path d="M55 245H330" stroke="#334155" stroke-width="1.8" fill="none" /><text x="55" y="232" font-size="15" fill="#2563eb" text-anchor="start" font-weight="400">f₀ = 0.002</text><path d="M330 245V245H560" stroke="#334155" stroke-width="1.8" fill="none" /><text x="348" y="233" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">1s  0.95</text><path d="M560 245V245H790" stroke="#334155" stroke-width="1.8" fill="none" /><text x="578" y="233" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">2s  0.97</text><path d="M790 245V245H1020" stroke="#334155" stroke-width="1.8" fill="none" /><text x="808" y="233" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">3s  0.9</text><path d="M1020 245H1020" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M790 245V340H1020" stroke="#334155" stroke-width="1.8" fill="none" /><text x="808" y="328" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">3f  0.1</text><path d="M1020 340H1020" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M560 245V435H790" stroke="#334155" stroke-width="1.8" fill="none" /><text x="578" y="423" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">2f  0.03</text><path d="M790 435V435H1020" stroke="#334155" stroke-width="1.8" fill="none" /><text x="808" y="423" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">3s  0.9</text><path d="M1020 435H1020" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M790 435V530H1020" stroke="#334155" stroke-width="1.8" fill="none" /><text x="808" y="518" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">3f  0.1</text><path d="M1020 530H1020" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M330 245V625H560" stroke="#334155" stroke-width="1.8" fill="none" /><text x="348" y="613" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">1f  0.05</text><path d="M560 625H1020" stroke="#334155" stroke-width="1.8" fill="none" /><text x="1035" y="250" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">01</text><text x="1070" y="248.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Controlled release; population safe</text><text x="1605" y="250" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">1.659e-03</text><path d="M1032 291H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="1035" y="345" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">02</text><text x="1070" y="343.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Controlled release; evacuation casualties</text><text x="1605" y="345" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">1.843e-04</text><path d="M1032 386H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="1035" y="440" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">03</text><text x="1070" y="438.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Overtopping; population evacuated</text><text x="1605" y="440" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">5.130e-05</text><path d="M1032 481H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="1035" y="535" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">04</text><text x="1070" y="533.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Overtopping; severe downstream losses</text><text x="1605" y="535" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">5.700e-06</text><path d="M1032 576H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="1035" y="630" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">05</text><text x="1070" y="628.0" font-size="16" fill="#0f172a" text-anchor="start" font-weight="400">Unwarned flood; severe downstream losses</text><text x="1605" y="630" font-size="16" fill="#2563eb" text-anchor="end" font-weight="600">1.000e-04</text><path d="M1032 671H1620" stroke="#e2e8f0" stroke-width="1" fill="none" /><text x="40" y="716" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">s = success · f = failure · * = later function not evaluated</text><text x="40" y="739" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">All sequence frequencies sum to 0.002, the initiating frequency.</text></svg>