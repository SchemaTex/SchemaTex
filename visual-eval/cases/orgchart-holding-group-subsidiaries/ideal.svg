<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="638" viewBox="0 0 1600 638">
<title>Harbour Group · Subsidiary Structure</title>
<desc>Harbour Group plc owns Harbour Technology Ltd at 100%, Harbour Retail Ltd at 80%, Harbour Property Ltd at 100%, and a 60% joint venture interest in Harbour Ventures Ltd. Cloud Services and Data Products are Technology divisions, Store Operations is a Retail division, and Asset Management is a Property division.</desc>
