<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="656" viewBox="0 0 1600 656">
  <title>Buy versus lease a packaging line</title>
  <rect width="1600" height="656" fill="#FFFFFF"/>
  <defs>
    <g id="yes">
      <circle r="16.5" fill="#E5F1E9" stroke="#2E7A4E" stroke-width="2"/>
      <path d="M-7 0 L-1.5 5.5 L8 -5.5" fill="none" stroke="#2E7A4E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="no">
      <circle r="16.5" fill="#F7E6E6" stroke="#B03A3A" stroke-width="2"/>
      <path d="M-5.5 -5.5 L5.5 5.5 M5.5 -5.5 L-5.5 5.5" fill="none" stroke="#B03A3A" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1B2430">
    <text x="79" y="96" font-size="37" font-weight="600">Buy versus lease a packaging line</text>
    <g font-size="24" font-weight="600" text-anchor="middle">
      <text x="800" y="200">Buy</text>
      <text x="1280" y="200">Lease</text>
    </g>
    <path d="M79 228.5 H1521" stroke="#1B2430" stroke-width="2.5"/>
    <rect x="79" y="305" width="1442" height="76" fill="#F4F6F9"/>
    <rect x="79" y="457" width="1442" height="77" fill="#F4F6F9"/>
    <g font-size="22.5" font-weight="500">
      <text x="105" y="275">Up-front cash</text>
      <text x="105" y="351">Maintenance responsibility</text>
      <text x="105" y="427">Technology upgrade</text>
      <text x="105" y="503">Asset ownership</text>
    </g>
    <g font-size="22.5" font-weight="400" text-anchor="middle">
      <text x="800" y="275">High capital outlay</text>
      <text x="1280" y="275">Lower monthly payments</text>
      <text x="800" y="351">Internal team</text>
      <text x="1280" y="351">Included service plan</text>
    </g>
    <use href="#no" x="800" y="419"/>
    <use href="#yes" x="1280" y="419"/>
    <use href="#yes" x="800" y="495"/>
    <use href="#no" x="1280" y="495"/>
    <path d="M79 534 H1521" fill="none" stroke="#E4E9EE" stroke-width="1.5"/>
    <g font-size="21" fill="#5F6B7A">
      <use href="#yes" transform="translate(94.5 583) scale(.9)"/>
      <text x="119" y="590">Yes</text>
      <use href="#no" transform="translate(206.5 583) scale(.9)"/>
      <text x="231" y="590">No</text>
    </g>
  </g>
</svg>
