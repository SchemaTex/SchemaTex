<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" width="820" height="610" role="img">
<title>One parent, three unions</title>
<desc>Maya&#x27;s mother Dana has three unions: Mark (m. 1995, div. 2004), Chris (m. 2006, div. 2015) and Rick (living together since 2018). Mark and Chris stand to Dana&#x27;s left in the order she met them, Rick to her right. The union with Mark passes over Chris instead of through him, so every union line touches exactly its two partners, and Maya, Leo and Tess each hang from their own parents&#x27; union.</desc>
