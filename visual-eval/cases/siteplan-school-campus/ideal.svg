<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>Meadowbrook School Campus — Site Plan</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1F2328;font-size:17px} .title{font-size:32px;font-weight:700}.subtitle{font-size:19px;fill:#74808D}.heading{font-size:14px;letter-spacing:1.5px;font-weight:700;fill:#74808D}.building{font-size:18px;font-weight:700;letter-spacing:.7px}.note{font-size:15px;fill:#74808D}.label{font-size:16px;fill:#55606C}.rule{stroke:#A3ABB4;stroke-width:1}.boundary{stroke:#1F2328;stroke-width:3.5;stroke-dasharray:34 6 6 6 6 6;fill:none}.footprint{fill:#D5DAE0;stroke:#1F2328;stroke-width:2.6}.paving{fill:#EDEFF2;stroke:#55606C;stroke-width:1.6}.center{stroke:#A3ABB4;stroke-width:1.2;stroke-dasharray:28 8 6 8;fill:none}
</style>
</defs>
<rect width="1600" height="1120" fill="#FFFFFF"/>
<text x="62" y="77" class="title">Meadowbrook School Campus — Site Plan</text>
<text x="62" y="112" class="subtitle">Campus circulation concept · buildings, parking and play space · dimensions in feet</text>
<path d="M62 136H1538" class="rule"/>
<!-- Campus: 420 × 300 ft, drawn at 2.2 units per foot. -->
<rect x="80" y="230" width="924" height="660" fill="#F7F5EF"/>
<text x="542" y="207" text-anchor="middle">CAMPUS BOUNDARY · 420.00′</text>
<text x="55" y="560" text-anchor="middle" transform="rotate(-90 55 560)">300.00′</text>
<!-- Field and parking zones -->
<rect x="124" y="769" width="506" height="99" fill="#E8F5E9" stroke="#55606C" stroke-width="1.5"/>
<text x="245" y="813" text-anchor="middle" class="building">PLAY FIELDS</text>
<text x="245" y="839" text-anchor="middle" class="note">230′ × 45′</text>
<rect x="697" y="604" width="264" height="143" fill="#E3F2FD" stroke="#55606C" stroke-width="1.5"/>
<text x="829" y="666" text-anchor="middle" class="building">STAFF PARKING</text>
<text x="829" y="693" text-anchor="middle" class="label">48 spaces</text>
<!-- Fire access: continuous orthogonal route, avoiding building footprints -->
<path d="M124 516H762V571H982V769H674V923" fill="none" stroke="#55606C" stroke-width="38.4" stroke-linejoin="miter"/>
<path d="M124 516H762V571H982V769H674V923" fill="none" stroke="#EDEFF2" stroke-width="35.2" stroke-linejoin="miter"/>
<path d="M124 516H762V571H982V769H674V923" class="center"/>
<rect x="336" y="503" width="294" height="25" fill="#EDEFF2"/>
<text x="483" y="521" text-anchor="middle" class="label" letter-spacing="1">FIRE ACCESS ROUTE · 16′</text>
<!-- Student walkway: continuous path from main entry to academic buildings -->
<path d="M399 897V747H245V549H399V483H575" fill="none" stroke="#55606C" stroke-width="16" stroke-linejoin="miter"/>
<path d="M399 897V747H245V549H399V483H575" fill="none" stroke="#FFFFFF" stroke-width="13.2" stroke-linejoin="miter"/>
<!-- Separate building footprints -->
<rect x="157" y="329" width="209" height="132" class="footprint"/>
<text x="261.5" y="389" text-anchor="middle" class="building">ADMINISTRATION</text>
<text x="261.5" y="417" text-anchor="middle" class="note">95′ × 60′</text>
<rect x="421" y="307" width="319" height="176" class="footprint"/>
<text x="580.5" y="388" text-anchor="middle" class="building">PRIMARY BUILDING</text>
<text x="580.5" y="416" text-anchor="middle" class="note">145′ × 80′</text>
<rect x="784" y="351" width="176" height="198" class="footprint"/>
<text x="872" y="443" text-anchor="middle" class="building">GYMNASIUM</text>
<text x="872" y="471" text-anchor="middle" class="note">80′ × 90′</text>
<rect x="278" y="571" width="363" height="154" class="footprint"/>
<text x="459.5" y="641" text-anchor="middle" class="building">MIDDLE SCHOOL</text>
<text x="459.5" y="669" text-anchor="middle" class="note">165′ × 70′</text>
<text x="225" y="647" text-anchor="middle" transform="rotate(-90 225 647)" class="label">STUDENT WALKWAY · 6′</text>
<!-- Hydrant conventional circle, cap and side outlets -->
<g transform="translate(685 516)" stroke="#1F2328" stroke-width="1.8" fill="#FFFFFF">
<path d="M-11-3H11V3H-11Z"/>
<circle r="7"/>
<path d="M-3-7V-11H3V-7"/>
</g>
<path d="M685 501V485" stroke="#55606C" stroke-width="1.2"/>
<text x="685" y="474" class="label" text-anchor="middle">Hydrant</text>
<!-- Turning area leader kept outside adjacent parking label -->
<path d="M960 769L916 714" fill="none" stroke="#55606C" stroke-width="1.3"/>
<circle cx="916" cy="714" r="2.5" fill="#55606C"/>
<path d="M960 769L1019 807H1040" fill="none" stroke="#55606C" stroke-width="1.3"/>
<text x="1036" y="832" text-anchor="end" class="label">Fire appliance</text>
<text x="1036" y="853" text-anchor="end" class="label">turning area</text>
<!-- Boundary and connected frontage -->
<rect x="80" y="230" width="924" height="660" class="boundary"/>
<rect x="14" y="897" width="1056" height="52.8" fill="#EDEFF2"/>
<path d="M14 897H390M408 897H655M693 897H1070M14 949.8H1070" fill="none" stroke="#55606C" stroke-width="1.7"/>
<path d="M14 923.4H429M657 923.4H1070" class="center"/>
<text x="543" y="929" text-anchor="middle" class="building" letter-spacing="2">SCHOOL DRIVE</text>
<!-- Main entry at the foot of the student walkway -->
<g transform="translate(399 802)" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.8">
<path d="M-12 10L0-12L12 10Z"/>
</g>
<path d="M414 802H442" stroke="#55606C" stroke-width="1.2"/>
<text x="453" y="808" class="label">Main entry</text>
<!-- Right-hand data panel in the exemplar's restrained table idiom -->
<text x="1110" y="215" class="heading">SITE DATA</text>
<text x="1110" y="247">Campus area 126,000 sf</text>
<text x="1110" y="275" class="label">420.00′ × 300.00′</text>
<text x="1110" y="326" class="heading">BUILDING</text>
<text x="1538" y="326" class="heading" text-anchor="end">AREA (SF)</text>
<path d="M1110 338H1538" stroke="#55606C" stroke-width="1.3"/>
<text x="1110" y="369">Administration</text><text x="1538" y="369" text-anchor="end">5,700</text>
<text x="1110" y="403">Primary Building</text><text x="1538" y="403" text-anchor="end">11,600</text>
<text x="1110" y="437">Gymnasium</text><text x="1538" y="437" text-anchor="end">7,200</text>
<text x="1110" y="471">Middle School</text><text x="1538" y="471" text-anchor="end">11,550</text>
<path d="M1110 487H1538" class="rule"/>
<text x="1110" y="518" font-weight="700">Building coverage</text><text x="1538" y="518" font-weight="700" text-anchor="end">36,050</text>
<text x="1110" y="548" class="note">28.6% of campus area</text>
<text x="1110" y="612" class="heading">LEGEND</text>
<path d="M1110 645H1180" class="boundary"/><text x="1198" y="651">Campus boundary</text>
<rect x="1120" y="671" width="50" height="22" class="footprint"/><text x="1198" y="689">Academic building</text>
<rect x="1120" y="709" width="50" height="22" class="paving"/><path d="M1120 720H1170" class="center"/><text x="1198" y="727">Fire access / drive</text>
<rect x="1120" y="747" width="50" height="12" fill="#FFFFFF" stroke="#55606C" stroke-width="1.3"/><text x="1198" y="761">Student walkway</text>
<rect x="1120" y="783" width="50" height="22" fill="#E3F2FD" stroke="#55606C" stroke-width="1.3"/><text x="1198" y="800">Staff parking</text>
<rect x="1120" y="821" width="50" height="22" fill="#E8F5E9" stroke="#55606C" stroke-width="1.3"/><text x="1198" y="838">Play fields</text>
<g transform="translate(1145 870)" stroke="#1F2328" stroke-width="1.7" fill="#FFFFFF"><path d="M-11-3H11V3H-11Z"/><circle r="7"/><path d="M-3-7V-11H3V-7"/></g><text x="1198" y="876">Hydrant</text>
<path d="M1133 919L1145 897L1157 919Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.7"/><text x="1198" y="915">Main entry</text>
<!-- Graphic scale: one 50-foot interval equals 110 drawing units -->
<g transform="translate(1110 1014)">
<text x="0" y="-10" text-anchor="middle" class="note">0</text><text x="110" y="-10" text-anchor="middle" class="note">50</text><text x="220" y="-10" text-anchor="middle" class="note">100</text>
<rect width="110" height="9" fill="#1F2328"/><rect x="110" width="110" height="9" fill="#FFFFFF" stroke="#1F2328" stroke-width="1"/>
<text x="239" y="9" class="note">ft</text><text x="0" y="40" class="heading">GRAPHIC SCALE</text>
</g>
<g transform="translate(1503 1015)"><text y="-37" text-anchor="middle" font-size="18" font-weight="700">N</text><circle r="27" fill="#FFFFFF" stroke="#A3ABB4" stroke-width="1.5"/><path d="M0-23L-10 14L0 7Z" fill="#1F2328"/><path d="M0-23L10 14L0 7Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/></g>
</svg>
