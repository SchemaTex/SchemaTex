<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1050" width="1080" height="1050">
<title>Boutique Retail Shop — floor plan</title>
<defs>
<style>
text{font-family: 'Helvetica Neue',Helvetica,sans-serif;fill:#23333c} .wall{fill:none;stroke:#26343b;stroke-width:18;stroke-linejoin:miter}.partition{stroke:#26343b;stroke-width:9;fill:none}.fixture{fill:#edf1f2;stroke:#526570;stroke-width:1.8}.detail{fill:none;stroke:#6e808a;stroke-width:1.3}.door{fill:none;stroke:#344d5b;stroke-width:1.8}.label{font-size:14px;text-anchor:middle}.room{font-size:20px;font-weight:600;letter-spacing:1px;text-anchor:middle}.dim{font-size:13px;fill:#687981;text-anchor:middle}
</style>
<g id="rack"><rect class="fixture" width="75" height="75" rx="2"/><path class="detail" d="M10 16H65 M10 59H65 M18 11V24 M28 11V24 M38 11V24 M48 11V24 M58 11V24 M18 52V64 M28 52V64 M38 52V64 M48 52V64 M58 52V64"/><text class="label" x="37.5" y="37" style="font-size:12px">Feature</text><text class="label" x="37.5" y="51" style="font-size:12px">Rack</text></g>
<g id="cubicle"><path class="fixture" d="M0 138V0H75V138Z"/><path d="M8 138H67" stroke="white" stroke-width="4"/><path class="detail" d="M8 138q5 -9 10 0t10 0t10 0t10 0t10 0t9 0"/><rect x="8" y="9" width="59" height="15" class="fixture"/><path class="detail" d="M69 36V99"/></g>
</defs>
<rect width="1080" height="1050" fill="white"/>
<text x="110" y="54" font-size="28" font-weight="600">Boutique Retail Shop</text>
