<path d="M152 949.8H308 M389 949.8H461 M503 949.8H659" stroke="white" stroke-width="21"/>
<g fill="#e6f3f7" stroke="#467a91" stroke-width="1.7">
<rect x="152" y="943.8" width="156" height="12"/><rect x="503" y="943.8" width="156" height="12"/>
</g>
<path d="M152 949.8H308 M503 949.8H659" stroke="#467a91" stroke-width="1.3"/>
<path class="door" d="M461 949.8V1021.8 M389 949.8A72 72 0 0 0 461 1021.8"/>
