<!-- overall dimension -->
<path d="M110 116H950 M110 107V125 M950 107V125" class="detail"/>
<text x="530" y="108" class="dim">14.00 m</text>
<!-- plan: 60 pixels per metre; origin NW 110,150 -->
<path class="wall" d="M110 949.8V150H950V949.8H110"/>
<path class="partition" d="M740 150V949.8 M740 570H950"/>
<!-- sales / fitting doorway at 45% of 7m -->
<path d="M740 312V366" stroke="white" stroke-width="12"/>
<path class="door" d="M740 312H686 M686 312A54 54 0 0 0 740 366"/>
<!-- sales / stock doorway at 55% of 6.33m -->
<path d="M740 751.9V805.9" stroke="white" stroke-width="12"/>
