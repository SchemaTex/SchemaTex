<rect x="761" y="597" width="42" height="288" class="fixture"/><rect x="833" y="597" width="42" height="288" class="fixture"/>
<path class="detail" d="M761 645H803 M761 693H803 M761 741H803 M761 789H803 M761 837H803 M833 645H875 M833 693H875 M833 741H875 M833 789H875 M833 837H875"/>
<text x="784" y="705" class="label" transform="rotate(-90 784 705)" style="font-size:12px">Stock Shelves</text>
