<text x="587" y="318" class="label" style="font-size:11px;letter-spacing:1px">KEEP CLEAR</text>
<rect x="131" y="177" width="33" height="498" class="fixture"/>
<path class="detail" d="M142 177V675 M131 232H164 M131 287H164 M131 342H164 M131 397H164 M131 452H164 M131 507H164 M131 562H164 M131 617H164"/>
