<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 615" width="880" height="615">
<title>X-linked Recessive Hemophilia A</title>
<desc>Three-generation X-linked recessive pedigree. Unaffected male I-1 is mated to carrier female I-2, drawn with a central dot; their children are affected male II-1, carrier female II-4 and unaffected male II-5. Affected II-1 with unaffected II-2 has unaffected son III-1 and carrier daughter III-2. Unaffected II-3 with carrier II-4 has affected son III-3, the proband, and unaffected daughter III-4. Unaffected II-5 with unaffected II-6 has unaffected son III-5. Affected males are solid-filled squares, carrier females are circles with a central dot, and no affected son descends from the affected father II-1.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
