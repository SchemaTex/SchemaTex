<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1178 812" width="1178" height="812" role="img">
<title>EV Charging Hub · 12 Bay</title>
<desc>An 11 kV utility supply feeds a 1600 kVA charging-hub transformer and a 2500 A main low-voltage breaker onto the 400 V charging distribution board. Four ways leave the board: two 630 A feeders to the DC charger banks, a 250 A feeder to the AC chargers, and a direct way to the dynamic load-management controller.</desc>
