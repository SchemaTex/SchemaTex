<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1363 1154" width="1363" height="1154" role="img">
<title>Hospital Essential Electrical System</title>
<desc>The normal utility service feeds the main service breaker and the normal switchboard, drawn as a heavy vertical bus down the left. The 1250 kW emergency generator feeds an emergency bus drawn the same way down the right. Between them sit three automatic transfer switches, one per NEC 517 branch — equipment, critical and life safety — each with its normal side closed on the normal switchboard and its emergency side dashed back to the generator bus. Each transfer switch runs right into its own branch panel and that branch's load: essential HVAC, the OR and ICU critical loads, and egress lighting with fire alarm.</desc>
