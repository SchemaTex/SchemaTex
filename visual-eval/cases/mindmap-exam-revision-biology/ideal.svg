<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<title>Biology Revision — structured revision map</title>
<rect width="1600" height="980" fill="white"/>
<style>
text{font-family:Verdana, sans-serif;text-anchor:middle;dominant-baseline:middle;fill:#172c37} .root{font-size:29px;font-weight:700;fill:white}.area{font-size:23px;font-weight:700}.sub{font-size:20px;font-weight:700}.leaf{font-size:18px}.wire{fill:none;stroke-width:2.5;stroke-linejoin:round}.box{stroke-width:2}
</style>
<!-- Orthogonal branches from the central root -->
<g class="wire" stroke="#426477">
<path d="M655 490 H610 V195 H585"/>
<path d="M655 490 H610 V745 H585"/>
<path d="M945 490 H990 V195 H1015"/>
<path d="M945 490 H990 V745 H1015"/>
</g>
<!-- Cell Biology -->
<g class="wire" stroke="#277967">
<path d="M365 195 H330 V130 H300 M330 195 V290 H300"/>
<path d="M190 155 V190 M190 315 V350"/>
</g>
<rect class="box" x="365" y="162" width="220" height="66" rx="8" fill="#dceee8" stroke="#277967"/>
<text class="area" x="475" y="195">Cell Biology</text>
<rect class="box" x="80" y="105" width="220" height="50" rx="5" fill="#f0f7f4" stroke="#277967"/>
<text class="sub" x="190" y="130">Organelles</text>
<rect x="30" y="190" width="320" height="70" rx="4" fill="#f6faf8" stroke="#a0c3b7"/>
<text class="leaf" x="190" y="214">Mitochondria and</text><text class="leaf" x="190" y="239">chloroplasts</text>
<rect class="box" x="80" y="265" width="220" height="50" rx="5" fill="#f0f7f4" stroke="#277967"/>
<text class="sub" x="190" y="290">Transport</text>
<rect x="30" y="350" width="320" height="55" rx="4" fill="#f6faf8" stroke="#a0c3b7"/>
<text class="leaf" x="190" y="378">Diffusion and osmosis</text>
<!-- Genetics -->
<g class="wire" stroke="#78649d">
<path d="M365 745 H330 V680 H300 M330 745 V840 H300"/>
<path d="M190 705 V740 M190 865 V900"/>
</g>
<rect class="box" x="365" y="712" width="220" height="66" rx="8" fill="#ebe5f3" stroke="#78649d"/>
<text class="area" x="475" y="745">Genetics</text>
<rect class="box" x="80" y="655" width="220" height="50" rx="5" fill="#f6f3fa" stroke="#78649d"/>
<text class="sub" x="190" y="680">DNA and genes</text>
<rect x="30" y="740" width="320" height="55" rx="4" fill="#faf8fc" stroke="#bcb0cf"/>
<text class="leaf" x="190" y="768">Protein synthesis</text>
<rect class="box" x="80" y="815" width="220" height="50" rx="5" fill="#f6f3fa" stroke="#78649d"/>
<text class="sub" x="190" y="840">Inheritance</text>
<rect x="30" y="900" width="320" height="55" rx="4" fill="#faf8fc" stroke="#bcb0cf"/>
<text class="leaf" x="190" y="928">Punnett squares</text>
<!-- Human Physiology -->
<g class="wire" stroke="#af6941">
<path d="M1275 195 H1300 V90 H1410 V105 M1300 195 V290 H1320"/>
<path d="M1440 155 V190 M1440 315 V350"/>
</g>
<rect class="box" x="1015" y="162" width="260" height="66" rx="8" fill="#f5e6da" stroke="#af6941"/>
<text class="area" x="1145" y="195">Human Physiology</text>
<rect class="box" x="1320" y="105" width="250" height="50" rx="5" fill="#fcf5ee" stroke="#af6941"/>
<text class="sub" x="1445" y="130">Circulatory system</text>
<rect x="1320" y="190" width="250" height="55" rx="4" fill="#fdf9f5" stroke="#d4b59d"/>
<text class="leaf" x="1445" y="218">Gas exchange</text>
<rect class="box" x="1320" y="265" width="250" height="50" rx="5" fill="#fcf5ee" stroke="#af6941"/>
<text class="sub" x="1445" y="290">Immunity</text>
<rect x="1320" y="350" width="250" height="55" rx="4" fill="#fdf9f5" stroke="#d4b59d"/>
<text class="leaf" x="1445" y="378">Vaccination</text>
<!-- Ecology -->
<g class="wire" stroke="#437da5">
<path d="M1275 745 H1300 V630 H1445 V655 M1300 745 V840 H1320"/>
<path d="M1445 705 V740 M1445 865 V900"/>
</g>
<rect class="box" x="1015" y="712" width="260" height="66" rx="8" fill="#e0edf6" stroke="#437da5"/>
<text class="area" x="1145" y="745">Ecology</text>
<rect class="box" x="1320" y="655" width="250" height="50" rx="5" fill="#f0f6fa" stroke="#437da5"/>
<text class="sub" x="1445" y="680">Ecosystems</text>
<rect x="1320" y="740" width="250" height="55" rx="4" fill="#f7fafc" stroke="#a7c4d8"/>
<text class="leaf" x="1445" y="768">Food webs</text>
<rect class="box" x="1320" y="815" width="250" height="50" rx="5" fill="#f0f6fa" stroke="#437da5"/>
<text class="sub" x="1445" y="840">Evolution</text>
<rect x="1320" y="900" width="250" height="55" rx="4" fill="#f7fafc" stroke="#a7c4d8"/>
<text class="leaf" x="1445" y="928">Natural selection</text>
<!-- Central root -->
<rect x="655" y="441" width="290" height="98" rx="12" fill="#203e50" stroke="#142d3c" stroke-width="3"/>
<text class="root" x="800" y="490">Biology Revision</text>
</svg>
