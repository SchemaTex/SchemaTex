    <text x="768" y="111" font-size="32" font-weight="600">IEC 61131-3 · Sequential Function Chart (SFC)</text>
  </g>
  <!-- Continuous sequence spine; step boxes mask the spine within each step. -->
  <g fill="none" stroke="black" stroke-width="3">
    <path d="M340 184 V932 H88 V224 H198" marker-end="url(#arrow)"/>
    <path d="M308 310 H372 M308 490 H372 M308 670 H372 M308 860 H372"/>
    <path d="M482 224 H666 M482 400 H666 M482 580 H666 M482 760 H666"/>
  </g>
