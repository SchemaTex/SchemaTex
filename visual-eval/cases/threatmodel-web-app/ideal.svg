<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1155 752" width="1155" height="752" role="img">
<title>Web Application STRIDE</title>
<desc>A STRIDE threat model of Web Application STRIDE, drawn as a data-flow diagram over 3 trust zones: Internet, DMZ, Internal. 2 external entities are drawn as rectangles, 2 processes as circles, and 2 data stores as two parallel horizontal lines with the label between them. Each element carries the STRIDE letters that apply to its kind. Of the 6 data flows, 5 cross a trust boundary — Customer Browser to Web Application, Authentication Service to Customer Database, Web Application to Customer Database, Web Application to Audit Log, Web Application to Shipping API — and those are the only ones drawn in red, because a boundary crossing is where the spoofing, tampering and disclosure threats actually bite.</desc>
