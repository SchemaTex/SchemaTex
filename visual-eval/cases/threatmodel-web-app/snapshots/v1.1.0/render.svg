<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="732.5159974861317" height="508.218085389129" viewBox="-20 -20 732.5159974861317 508.218085389129" class="schematex schematex-threatmodel" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Web Application STRIDE"><title>Web Application STRIDE</title>
<desc>STRIDE threat model: 2 external entities, 2 process(es), 2 data store(s), 6 data flow(s). 5 boundary-crossing flow(s): User→Web, Auth→Users, Web→Users, Web→Audit, Web→API. User (external) → Spoofing, Repudiation. API (external) → Spoofing, Repudiation. Web (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Auth (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Users (store) → Tampering, Information disclosure, Denial of service. Audit (store) → Tampering, Repudiation, Information disclosure, Denial of service.</desc>
<style>.sx-tm-bg { fill: #ffffff; }
