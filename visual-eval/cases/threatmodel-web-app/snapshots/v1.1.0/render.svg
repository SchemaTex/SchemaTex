.sx-tm-label { fill: #0f172a; font-size: 12px; font-weight: 600; }
.sx-tm-flow { fill: none; stroke: #334155; stroke-width: 2; }
.sx-tm-flow[data-crossing="true"] { stroke: #dc2626; stroke-width: 2; }
.sx-tm-arrow { fill: #334155; stroke: none; }
.sx-tm-arrow[data-crossing="true"] { fill: #dc2626; }
.sx-tm-flow-label { fill: #0f172a; font-size: 9px; }
.sx-tm-flow-label[data-crossing="true"] { fill: #dc2626; font-weight: 700; }
.sx-tm-flow-halo { fill: #ffffff; stroke: none; }
.sx-tm-boundary { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 4; }
.sx-tm-boundary-label { fill: #475569; font-size: 9px; font-weight: 700; }
.sx-tm-badge { fill: #2563eb; }
.sx-tm-badge[data-cond-r="true"] { fill: #dc2626; }
.sx-tm-badge-text { fill: #ffffff; font-size: 9px; font-weight: 700; }</style>
