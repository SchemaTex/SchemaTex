<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="985" viewBox="0 0 1600 985">
  <title>Vessel Level Control and Shutdown</title>
  <desc>Vessel level is measured by LT-101 and regulated by control-room LIC-101 through pneumatic actuation of LV-101. Independent LSHH-202 closes inlet valve XV-202 by electrical signal.</desc>
  <rect width="1600" height="985" fill="#FFFFFF"/>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1E293B; }
    .title { font-size: 20px; font-weight: 600; }
    .tag { font-size: 12px; font-weight: 600; }
    .secondary { font-size: 11.5px; fill: #64748B; }
    .letters { font-size: 11.5px; font-weight: 600; }
    .number { font-size: 11.5px; }
    .zone { font-size: 10px; letter-spacing: 1px; fill: #64748B; }
    .process { fill: none; stroke: #1E293B; stroke-width: 2.5; stroke-linejoin: miter; }
    .symbol { fill: #FFFFFF; stroke: #1E293B; stroke-width: 1.6; stroke-linejoin: round; }
    .signal { fill: none; stroke: #1E293B; stroke-width: 1.4; }
    .electric { fill: none; stroke: #1E293B; stroke-width: 1.4; stroke-dasharray: 7 5; }
  </style>

  <!-- Sheet furniture -->
  <text class="title" x="47" y="45">Vessel Level Control and Shutdown</text>
  <text class="secondary" x="47" y="70">ISA-5.1 instrumentation on ISO 10628 equipment · process flows left to right</text>
  <text class="secondary" x="1553" y="70" text-anchor="end">solid dot = connection · jumper = crossing, not connected</text>
  <path d="M47 98.5 H1553 M47 859.5 H1553" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M47 256.5 H1553" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="12 4 3 4"/>
  <text class="zone" x="1553" y="246" text-anchor="end">CONTROL ROOM / DCS</text>
  <text class="zone" x="1553" y="279" text-anchor="end">FIELD</text>

  <!-- Complete process connections: tank bottom, shutoff, vessel top, vessel bottom, outlet valve, product tank top -->
  <path class="process" d="M174 626 V657 H316 M360 657 H512 V349 H635 V388"/>
  <path class="process" d="M635 720 V770 H903 V657 H1168 M1212 657 H1282 V410 H1415 V456"/>

  <!-- Independent high-level trip, direct from LSHH-202 to the solenoid -->
  <path class="electric" d="M441 444 V349 H338 V607"/>
  <!-- DCS measurement -->
  <path class="electric" d="M810 516 V205 H905"/>
  <!-- Pneumatic control to diaphragm, with diagonal marks -->
  <path class="signal" d="M941 205 H1190 V606"/>
  <path class="signal" d="M954 201 l9 9 M989 201 l9 9 M1024 201 l9 9 M1059 201 l9 9 M1094 201 l9 9 M1129 201 l9 9 M1164 201 l9 9 M1185.5 223 l9 -9 M1185.5 258 l9 -9 M1185.5 293 l9 -9 M1185.5 328 l9 -9 M1185.5 363 l9 -9 M1185.5 398 l9 -9 M1185.5 433 l9 -9 M1185.5 468 l9 -9 M1185.5 503 l9 -9 M1185.5 538 l9 -9 M1185.5 573 l9 -9 M1185.5 606 l9 -9"/>

  <!-- Capillary sensing: a small jumper clears the inlet riser -->
  <path d="M460 462 H503 Q503 453 512 453 Q521 453 521 462 H574" stroke="#FFFFFF" stroke-width="6" fill="none"/>
  <path class="signal" d="M460 462 H503 Q503 453 512 453 Q521 453 521 462 H574 M697 534 H792"/>
  <g fill="#1E293B">
    <circle cx="468" cy="462" r="2"/><circle cx="483" cy="462" r="2"/><circle cx="498" cy="462" r="2"/>
    <circle cx="524" cy="462" r="2"/><circle cx="539" cy="462" r="2"/><circle cx="554" cy="462" r="2"/><circle cx="569" cy="462" r="2"/>
    <circle cx="704" cy="534" r="2"/><circle cx="719" cy="534" r="2"/><circle cx="734" cy="534" r="2"/><circle cx="749" cy="534" r="2"/><circle cx="764" cy="534" r="2"/><circle cx="779" cy="534" r="2"/><circle cx="791" cy="534" r="2"/>
  </g>

  <!-- Atmospheric feed tank -->
  <path class="symbol" d="M92 626 V483 C92 446 256 446 256 483 V626 Z"/>
  <text class="tag" x="174" y="550" text-anchor="middle">TK-100</text>
  <text class="secondary" x="174" y="571" text-anchor="middle">Feed Tank</text>

  <!-- Solenoid-actuated fail-closed inlet valve -->
  <path class="symbol" d="M316 643 L360 671 V643 L316 671 Z"/>
  <path class="signal" d="M338 643 V633"/>
  <rect class="symbol" x="325" y="607" width="26" height="26"/>
  <text class="tag" x="338" y="625" text-anchor="middle">S</text>
  <text class="tag" x="362" y="616">FC</text>
  <text class="tag" x="338" y="708" text-anchor="middle">XV-202</text>
  <text class="secondary" x="338" y="729" text-anchor="middle">High-level Shutoff</text>

  <!-- Vertical vessel with elliptical heads -->
  <path class="symbol" d="M574 410 C574 380 697 380 697 410 V698 C697 728 574 728 574 698 Z"/>
  <text class="tag" x="635.5" y="550" text-anchor="middle">V-101</text>
  <text class="secondary" x="635.5" y="571" text-anchor="middle">Level Vessel</text>

  <!-- Field instrument bubbles -->
  <circle class="symbol" cx="441" cy="462" r="18"/>
  <text x="441" y="459" text-anchor="middle" font-size="9" font-weight="600">LSHH</text>
  <text class="number" x="441" y="475" text-anchor="middle">202</text>
  <circle class="symbol" cx="810" cy="534" r="18"/>
  <text class="letters" x="810" y="531" text-anchor="middle">LT</text>
  <text class="number" x="810" y="547" text-anchor="middle">101</text>

  <!-- Shared-display control-room instrument: hexagon and horizontal location mark -->
  <circle class="symbol" cx="923" cy="205" r="18"/>
  <path d="M923 187 L938.6 196 V214 L923 223 L907.4 214 V196 Z M905 205 H941" fill="none" stroke="#1E293B" stroke-width="1.4"/>
  <text class="letters" x="923" y="202" text-anchor="middle">LIC</text>
  <text class="number" x="923" y="218" text-anchor="middle">101</text>

  <!-- Diaphragm-actuated fail-open outlet valve -->
  <path class="symbol" d="M1168 643 L1212 671 V643 L1168 671 Z"/>
  <path class="signal" d="M1190 643 V620"/>
  <path class="symbol" d="M1170 620 C1170 601.3 1210 601.3 1210 620 Z"/>
  <text class="tag" x="1220" y="616">FO</text>
  <text class="tag" x="1190" y="708" text-anchor="middle">LV-101</text>
  <text class="secondary" x="1190" y="729" text-anchor="middle">Level Outlet Valve</text>

  <!-- Atmospheric product tank -->
  <path class="symbol" d="M1333 626 V483 C1333 446 1497 446 1497 483 V626 Z"/>
  <text class="tag" x="1415" y="550" text-anchor="middle">TK-102</text>
  <text class="secondary" x="1415" y="571" text-anchor="middle">Product Tank</text>

  <!-- Line-type legend, at actual drawing weights -->
  <path class="process" d="M47 901 H92"/>
  <text class="secondary" x="102" y="905">Process</text>
  <path d="M188 901 H233" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <text class="secondary" x="243" y="905">Process, minor</text>
  <path class="electric" d="M366 901 H411"/>
  <text class="secondary" x="421" y="905">Electric signal</text>
  <path class="signal" d="M537 901 H582 M550 897 l9 9"/>
  <text class="secondary" x="592" y="905">Pneumatic signal</text>
  <path class="signal" d="M726 901 H771"/>
  <g fill="#1E293B"><circle cx="732" cy="901" r="2"/><circle cx="747" cy="901" r="2"/><circle cx="762" cy="901" r="2"/></g>
  <text class="secondary" x="781" y="905">Capillary / filled system</text>
  <text class="secondary" x="47" y="944">LSHH-202 trips XV-202 directly, so the high-level inlet shutdown stays independent of the LIC-101 loop running in the DCS.</text>
</svg>
