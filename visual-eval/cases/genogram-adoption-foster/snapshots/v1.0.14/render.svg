<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-male" data-individual-id="theo" transform="translate(79.8, 226)"><title>Theo Hughes (2014)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="ivy" transform="translate(199.8, 226)"><title>Ivy Hughes (2017)</title>
