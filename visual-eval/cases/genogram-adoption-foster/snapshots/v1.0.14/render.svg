<g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="adam" data-to="maya"><path d="M 379.8 60 L 459.8 60" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="noel" data-to="rae"><path d="M 659.8 60 L 739.8 60" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="noel" data-to="rae"><path d="M 699.8 60 L 699.8 141" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="noel+rae" data-to="finn"><path d="M 699.8 60 L 699.8 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-secondary schematex-genogram-edge-secondary-adopted" data-from="adam+maya" data-to="theo"><path d="M 419.8 84 L 419.8 143 L 79.8 143 L 79.8 202" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-secondary schematex-genogram-edge-secondary-foster" data-from="noel+rae" data-to="ivy"><path d="M 699.8 84 L 699.8 143 L 199.8 143 L 199.8 202" class="schematex-genogram-edge-path"/></g></g>
