<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850.6800000000001 410" class="schematex-diagram schematex-genogram" width="850.6800000000001" height="410"><title>Genogram: Hughes Family · Permanency Plan</title>
<desc>Genogram diagram with 9 individuals across 2 generations</desc>
