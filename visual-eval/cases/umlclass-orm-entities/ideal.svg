<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="982" viewBox="0 0 1600 982">
<title>Clinical appointments — persistent entities and relationships</title>
<desc>Eight UML classifiers. Patient, Practitioner, Appointment and Clinic inherit BaseEntity. Appointment points to Patient and Practitioner, owns AppointmentNote, and references AppointmentStatus. AppointmentRepository depends on Appointment.</desc>
