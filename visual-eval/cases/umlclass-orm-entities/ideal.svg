.name{font-size:13.5px;font-weight:600}.keyword{font-size:11px;fill:#2563EB}.abstract{font-size:11px;fill:#64748B}
.member{font-size:12px}.visibility{fill:#64748B}.type{fill:#475569}.role{font-size:11.5px;fill:#475569}.mult{font-size:12px;font-weight:500}.legend{font-size:11.5px;fill:#475569}
.edge{fill:none;stroke:#334155;stroke-width:1.4;stroke-linejoin:miter}.rule{stroke:#334155;stroke-width:1}.dash{stroke-dasharray:6 4}
</style>
