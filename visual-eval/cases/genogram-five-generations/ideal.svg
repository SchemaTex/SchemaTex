<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1103 933" width="1103" height="933" role="img">
<title>Five Generations of the Montgomery Family</title>
<desc>Five evenly pitched Montgomery generations preserve every full given and family name, with each sibship centred beneath its own couple and Sophia identified by a teal double outline. Birth years remain visible for everyone. Squares indicate males and circles indicate females. Each vertical descent reaches its own partnership and sibling line.</desc>
