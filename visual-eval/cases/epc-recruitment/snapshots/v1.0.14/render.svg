<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="492" height="1480" viewBox="0 0 492 1480" role="img" aria-label="Event-driven process chain" data-diagram-type="epc"><title>Event-driven process chain</title>
<desc>Event-driven process chain: 8 events, 5 functions, 2 connectors. 2 rule violations. Function &quot;Post job advert&quot; has 2 incoming arcs — an event or function must have a single input. The join belongs on a connector (and/or/xor) placed before it. Function &quot;Interview candidates&quot; has 2 incoming arcs — an event or function must have a single input. The join belongs on a connector (and/or/xor) placed before it.</desc>
<style>.sx-epc-bg { fill: #ffffff; }
.sx-epc-event { fill: #f6a5b8; stroke: #1f2937; stroke-width: 2; stroke-linejoin: round; }
.sx-epc-func { fill: #86d29a; stroke: #1f2937; stroke-width: 2; }
.sx-epc-conn { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
.sx-epc-node[data-flagged="true"] .sx-epc-event,
.sx-epc-node[data-flagged="true"] .sx-epc-func,
.sx-epc-node[data-flagged="true"] .sx-epc-conn { stroke: #dc2626; stroke-width: 3; }
.sx-epc-flagring { fill: none; stroke: #dc2626; stroke-width: 1; stroke-dasharray: 4 3; }
.sx-epc-label { fill: #1f2937; font-size: 12px; font-weight: 600; }
.sx-epc-glyph { fill: #111827; font-size: 17px; font-weight: 700; }
.sx-epc-edge { fill: none; stroke: #334155; stroke-width: 2; }
.sx-epc-edge[data-back="true"] { stroke: #94a3b8; stroke-dasharray: 5 4; }
.sx-epc-arrow { fill: #334155; stroke: none; }
.sx-epc-arrow-back { fill: #94a3b8; stroke: none; }
.sx-epc-edge-label { fill: #475569; font-size: 9px; }
.sx-epc-title { fill: #1f2937; font-size: 16px; font-weight: 700; }</style>
