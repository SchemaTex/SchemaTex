<svg xmlns="http://www.w3.org/2000/svg" width="864" height="1076" viewBox="0 0 864 1076" role="img" aria-labelledby="title desc">
<title id="title">Recruitment</title>
<desc id="desc">Event-driven process chain for an approved vacancy. Post job advert, receive applications, and screen applicants. A shortlist leads to interviews; no suitable applicant returns to posting the advert. After selecting a candidate and making an offer, acceptance leads to onboarding and an employee starting; a declined offer returns to interviews.</desc>
