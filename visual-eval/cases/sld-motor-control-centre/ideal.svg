<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1138 904" width="1138" height="904" role="img">
<title>Motor Control Centre Section</title>
<desc>The 480 V plant supply enters through the MCC-1 800 A main breaker onto the MCC-1 480 V bus. Three identical motor-starter columns tap the bus, each built the same way top to bottom: feeder breaker, contactor, overload relay, motor — a process pump, a cooling fan and a conveyor drive, each with its own cable size.</desc>
