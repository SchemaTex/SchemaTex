<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1551 558" width="1551" height="558" role="img">
<title>Radar Receiver</title>
<desc>A functional block diagram of Radar Receiver. 10 blocks carry the forward signal path, folded into 2 rows joined by a labelled channel so the chain stays readable. Every wire is orthogonal, every arrowhead lands on a block edge, signal names are set in italic beside the wire they name, and a legend at the foot states the line codes.</desc>
