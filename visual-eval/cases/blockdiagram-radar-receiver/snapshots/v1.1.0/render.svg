<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-bd" viewBox="0 0 2945 290" width="2945" height="290" role="img" data-diagram-type="blockdiagram"><title>Radar Receiver</title>
<desc>Block diagram with 10 blocks, 0 summing junctions, 9 signals</desc>
<defs><style>.schematex-bd { font-family: "Inter", "Helvetica Neue", Helvetica, sans-serif; }
.schematex-bd-block { stroke: #16202b; stroke-width: 1.5; }
.schematex-bd-tf { font-size: 14px; font-weight: 600; fill: #16202b; }
.schematex-bd-block-name { font: 10px sans-serif; fill: #63707f; }
.schematex-bd-sum { fill: #ffffff; stroke: #16202b; stroke-width: 1.5; }
.schematex-bd-sum-sign { font: bold 11px sans-serif; fill: #16202b; }
.schematex-bd-signal { stroke: #16202b; stroke-width: 1.5; fill: none; }
.schematex-bd-signal-discrete { stroke: #16202b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
.schematex-bd-signal-label-bg { fill: #ffffff; opacity: .94; stroke: none; }
.schematex-bd-signal-label { font-size: 12px; font-style: italic; fill: #63707f; }
.schematex-bd-port-label { font-size: 13px; fill: #16202b; }
.schematex-bd-title { font-size: 16px; font-weight: 700; fill: #16202b; }
.schematex-bd-branch { fill: #16202b; stroke: none; }</style>
<marker id="lt-bd-arrow" markerWidth="9" markerUnits="userSpaceOnUse" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#16202b"/></marker></defs>
<text x="34" y="24" text-anchor="start" class="schematex-bd-title">Radar Receiver</text>
<g transform="translate(0, 40)"><g class="schematex-bd-signals"><path d="M 176 59 L 282 59 L 282 107 L 388 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="antenna" data-to="duplexer"/>
<rect x="288" y="82" width="94" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="335" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="335" dy="0">received RF</tspan></text>
<path d="M 514 107 L 604 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="duplexer" data-to="lna"/>
<rect x="542.5" y="82" width="33" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="559" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="559" dy="0">RF</tspan></text>
<path d="M 774 107 L 880 107 L 880 98 L 986 98" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="lna" data-to="mixer"/>
<rect x="886" y="73" width="94" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="933" y="85" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="933" dy="0">amplified RF</tspan></text>
<path d="M 175.5 155 L 962 155 L 962 116 L 986 116" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="lo" data-to="mixer"/>
<rect x="862" y="126.5" width="93" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="908.5" y="138.5" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="908.5" dy="0">LO injection</tspan></text>
<path d="M 1170 107 L 1520 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="mixer" data-to="ifamp"/>
<rect x="1263.5" y="82" width="163" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1345" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1345" dy="0">intermediate frequency</tspan></text>
<path d="M 1646 107 L 1726 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="ifamp" data-to="filter"/>
<rect x="1672" y="82" width="28" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1686" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1686" dy="0">IF</tspan></text>
<path d="M 1894 107 L 2078 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="filter" data-to="adc"/>
<rect x="1946" y="82" width="80" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1986" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1986" dy="0">filtered IF</tspan></text>
<path d="M 2204 107 L 2450 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="adc" data-to="processor"/>
<rect x="2271.5" y="82" width="111" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="2327" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="2327" dy="0">digital samples</tspan></text>
<path d="M 2647 107 L 2785 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="processor" data-to="display"/>
<rect x="2687.5" y="82" width="57" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="2716" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="2716" dy="0">tracks</tspan></text></g>
<g class="schematex-bd-nodes"><g transform="translate(34, 32)" data-block-id="antenna" data-block-role="input"><rect width="142" height="54" fill="#e0f2fe" class="schematex-bd-block" rx="4"/>
<text x="71" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="71" dy="0">Receive Antenna</tspan></text></g>
<g transform="translate(388, 80)" data-block-id="duplexer" data-block-role="generic"><rect width="126" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">Duplexer</tspan></text></g>
<g transform="translate(604, 80)" data-block-id="lna" data-block-role="generic"><rect width="170" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="85" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="85" dy="0">Low-Noise Amplifier</tspan></text></g>
<g transform="translate(986, 80)" data-block-id="mixer" data-block-role="generic"><rect width="184" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="92" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="92" dy="0">Downconversion Mixer</tspan></text></g>
<g transform="translate(1520, 80)" data-block-id="ifamp" data-block-role="generic"><rect width="126" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">IF Amplifier</tspan></text></g>
<g transform="translate(1726, 80)" data-block-id="filter" data-block-role="generic"><rect width="168" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="84" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="84" dy="0">IF Band-Pass Filter</tspan></text></g>
<g transform="translate(2078, 80)" data-block-id="adc" data-block-role="generic"><rect width="126" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">ADC</tspan></text></g>
<g transform="translate(2450, 80)" data-block-id="processor" data-block-role="controller"><rect width="197" height="54" fill="#dbeafe" class="schematex-bd-block" rx="4"/>
<text x="98.5" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="98.5" dy="0">Radar Signal Processor</tspan></text></g>
<g transform="translate(2785, 80)" data-block-id="display" data-block-role="output"><rect width="126" height="54" fill="#ecfccb" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">Track Display</tspan></text></g>
<g transform="translate(34.5, 128)" data-block-id="lo" data-block-role="reference"><rect width="141" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="70.5" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="70.5" dy="0">Local Oscillator</tspan></text></g></g>
<g class="schematex-bd-branches"></g></g></svg>