<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="700" viewBox="0 0 1720 700" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img"><title>Aircraft engine failure in cruise</title><rect width="1720" height="700" fill="white"/><text x="40" y="45" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">Aircraft engine failure in cruise</text><text x="40" y="72" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Success continues on the upper branch; failure moves to the next sequence.</text><rect x="40" y="104" width="1640" height="83" fill="#f1f5f9"/><text x="55" y="132" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Initiating event</text><text x="55" y="157" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">Single engine fails in cruise</text><text x="336" y="132" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Crew identifies and</text><text x="336" y="151" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">manages failure</text><text x="336" y="178" font-size="12" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.02</text><path d="M320 104V610" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="566" y="132" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Standby systems support</text><text x="566" y="151" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">flight</text><text x="566" y="178" font-size="12" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.01</text><path d="M550 104V610" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="796" y="132" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">Diversion and landing</text><text x="796" y="151" font-size="14" fill="#0f172a" text-anchor="start" font-weight="400">succeeds</text><text x="796" y="178" font-size="12" fill="#2563eb" text-anchor="start" font-weight="400">p(failure) = 0.005</text><path d="M780 104V610" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="1040" y="136" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Sequence / outcome</text><text x="1620" y="136" font-size="15" fill="#0f172a" text-anchor="end" font-weight="600">Frequency</text><path d="M55 230H320" fill="none" stroke="#334155" stroke-width="1.8"/><text x="65" y="215" font-size="14" fill="#2563eb" text-anchor="start" font-weight="400">f₀ = 0.004</text><path d="M320 230V230H550" fill="none" stroke="#334155" stroke-width="1.8"/><text x="338" y="220" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">1s  0.98</text><path d="M550 230V230H780" fill="none" stroke="#334155" stroke-width="1.8"/><text x="568" y="220" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">2s  0.99</text><path d="M780 230V230H1010" fill="none" stroke="#334155" stroke-width="1.8"/><text x="798" y="220" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">3s  0.995</text><path d="M780 230V310H1010" fill="none" stroke="#334155" stroke-width="1.8"/><text x="798" y="300" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">3f  0.005</text><path d="M550 230V390H780" fill="none" stroke="#334155" stroke-width="1.8"/><text x="568" y="380" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">2f  0.01</text><path d="M780 390V390H1010" fill="none" stroke="#334155" stroke-width="1.8"/><text x="798" y="380" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">3s  0.995</text><path d="M780 390V470H1010" fill="none" stroke="#334155" stroke-width="1.8"/><text x="798" y="460" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">3f  0.005</text><path d="M320 230V550H550" fill="none" stroke="#334155" stroke-width="1.8"/><text x="338" y="540" font-size="13" fill="#2563eb" text-anchor="start" font-weight="400">1f  0.02</text><path d="M550 550H1010" fill="none" stroke="#334155" stroke-width="1.8"/><path d="M1025 272H1680" stroke="#e2e8f0"/><text x="1040" y="235" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">01</text><text x="1080" y="235" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Safe diversion and landing</text><text x="1650" y="235" font-size="15" fill="#2563eb" text-anchor="end" font-weight="600">3.861e-3</text><path d="M1025 352H1680" stroke="#e2e8f0"/><text x="1040" y="315" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">02</text><text x="1080" y="315" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Diversion landing accident</text><text x="1650" y="315" font-size="15" fill="#2563eb" text-anchor="end" font-weight="600">1.940e-5</text><path d="M1025 432H1680" stroke="#e2e8f0"/><text x="1040" y="395" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">03</text><text x="1080" y="395" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Reduced capability; safe landing</text><text x="1650" y="395" font-size="15" fill="#2563eb" text-anchor="end" font-weight="600">3.900e-5</text><path d="M1025 512H1680" stroke="#e2e8f0"/><text x="1040" y="475" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">04</text><text x="1080" y="475" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Loss of control risk</text><text x="1650" y="475" font-size="15" fill="#2563eb" text-anchor="end" font-weight="600">1.960e-7</text><path d="M1025 592H1680" stroke="#e2e8f0"/><text x="1040" y="555" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">05</text><text x="1080" y="555" font-size="15" fill="#0f172a" text-anchor="start" font-weight="400">Unmanaged engine failure; emergency outcome</text><text x="1650" y="555" font-size="15" fill="#2563eb" text-anchor="end" font-weight="600">8.000e-5</text><text x="40" y="645" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">s = success    f = failure    * = later functions not evaluated</text><text x="40" y="670" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">Sequence frequency = initiating frequency × conditional branch probabilities</text></svg>