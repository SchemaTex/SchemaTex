<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="985" viewBox="0 0 1600 985">
<title>Shell and Tube Heat Exchanger — separate hot glycol and cooling water circuits with outlet temperature control</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1E293B} .title{font-size:20px;font-weight:600}.tag{font-size:12px;font-weight:600}.secondary{font-size:11.5px;fill:#64748B}.instrument{font-size:11.5px}.letters{font-size:11.5px;font-weight:600}.line-tag{font-size:9.5px;letter-spacing:.25px}.pipe{fill:none;stroke:#1E293B;stroke-width:2.5;stroke-linejoin:miter}.minor{fill:none;stroke:#1E293B;stroke-width:1.5}.symbol{fill:#FFFFFF;stroke:#1E293B;stroke-width:1.6;stroke-linejoin:round}.signal{fill:none;stroke:#1E293B;stroke-width:1.4}.electric{fill:none;stroke:#1E293B;stroke-width:1.4;stroke-dasharray:7 5}.hairline{stroke:#E2E8F0;stroke-width:1}
</style>
<g id="gate"><path class="symbol" d="M-22-14 22 14V-14L-22 14Z"/></g>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#1E293B"/></marker>
</defs>
<rect width="1600" height="985" fill="#FFFFFF"/>
<text x="47" y="45" class="title">Shell and Tube Heat Exchanger</text>
<text x="47" y="70" class="secondary">ISA-5.1 instrumentation on ISO 10628 equipment · process flow left to right · metric</text>
<text x="1553" y="70" text-anchor="end" class="secondary">solid dot = connection · jumper = crossing, not connected</text>
<path d="M47 98.5H1553" class="hairline"/>
<path d="M47 256.5H1553" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="12 4 3 4"/>
<text x="1553" y="246" text-anchor="end" class="secondary" style="font-size:10px;letter-spacing:1px">CONTROL ROOM / DCS</text>
<text x="1553" y="279" text-anchor="end" class="secondary" style="font-size:10px;letter-spacing:1px">FIELD</text>

<!-- Two physically separate process circuits: shell nozzles top/bottom, tube nozzles at ends. -->
<path class="pipe" d="M100 400H650V490 M870 650V730H1500"/>
<path class="pipe" d="M100 570H580 M940 570H1500"/>
<path d="M100 400H124 M100 570H124 M1474 570H1500 M1474 730H1500" class="minor" marker-end="url(#arrow)"/>
<text x="100" y="354" class="tag">HOT GLYCOL SUPPLY</text>
<text x="100" y="374" class="secondary">Shell inlet</text>
<text x="100" y="522" class="tag">COOLING WATER SUPPLY</text>
<text x="100" y="542" class="secondary">Tube inlet</text>
<text x="1500" y="522" text-anchor="end" class="tag">COOLING WATER RETURN</text>
<text x="1500" y="542" text-anchor="end" class="secondary">Tube outlet</text>
<text x="1500" y="779" text-anchor="end" class="tag">HOT GLYCOL RETURN</text>
<text x="1500" y="800" text-anchor="end" class="secondary">Shell outlet</text>

<!-- Exchanger shell and straight tube bundle, with separate shell-side ports. -->
<path class="symbol" d="M620 490H900C924 490 940 514 940 538V602C940 626 924 650 900 650H620C596 650 580 626 580 602V538C580 514 596 490 620 490Z"/>
<path class="minor" d="M617 491V649 M903 491V649 M617 544H903 M617 557H903 M617 583H903 M617 596H903 M580 570H617 M903 570H940"/>
<path class="minor" d="M700 511V535 M760 605V630 M820 511V535"/>
<text x="760" y="456" text-anchor="middle" class="tag">E-101</text>
<text x="760" y="476" text-anchor="middle" class="secondary">Shell-and-Tube Exchanger</text>
<text x="760" y="574" text-anchor="middle" class="secondary">TUBE BUNDLE</text>

<!-- Isolation valves -->
<use href="#gate" x="340" y="400"/>
<text x="340" y="449" text-anchor="middle" class="tag">XV-101</text>
<text x="340" y="470" text-anchor="middle" class="secondary">Hot Inlet Isolation</text>
<use href="#gate" x="340" y="570"/>
<text x="340" y="620" text-anchor="middle" class="tag">XV-201</text>
<text x="340" y="641" text-anchor="middle" class="secondary">Cold Inlet Isolation</text>
<use href="#gate" x="1170" y="570"/>
<text x="1170" y="620" text-anchor="middle" class="tag">XV-202</text>
<text x="1170" y="641" text-anchor="middle" class="secondary">Cold Outlet Isolation</text>
<use href="#gate" x="1100" y="730"/>
<text x="1100" y="779" text-anchor="middle" class="tag">XV-102</text>
<text x="1100" y="800" text-anchor="middle" class="secondary">Hot Outlet Isolation</text>

<!-- Pipe size plates -->
<g class="line-tag" text-anchor="middle">
<rect x="460" y="390" width="60" height="21" rx="1.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1"/><text x="490" y="404">DN80</text>
<rect x="425" y="560" width="60" height="21" rx="1.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1"/><text x="455" y="574">DN65</text>
<rect x="1375" y="560" width="60" height="21" rx="1.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1"/><text x="1405" y="574">DN65</text>
<rect x="990" y="720" width="60" height="21" rx="1.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1"/><text x="1020" y="734">DN80</text>
<rect x="1375" y="720" width="60" height="21" rx="1.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1"/><text x="1405" y="734">DN80</text>
</g>

<!-- Maintenance branches connect to the tube inlet and outlet, with solid tee dots. -->
<path class="minor" d="M1010 570V326" marker-end="url(#arrow)"/>
<circle cx="1010" cy="570" r="3.2" fill="#1E293B"/>
<use href="#gate" transform="translate(1010 395) rotate(90)"/>
<text x="1038" y="387" class="tag">XV-301</text>
<text x="1038" y="408" class="secondary">High-point Vent</text>
<text x="1038" y="343" class="secondary">DN15 · vent</text>
<path class="minor" d="M520 570V810" marker-end="url(#arrow)"/>
<circle cx="520" cy="570" r="3.2" fill="#1E293B"/>
<use href="#gate" transform="translate(520 730) rotate(90)"/>
<text x="548" y="727" class="tag">XV-302</text>
<text x="548" y="748" class="secondary">Low-point Drain</text>
<text x="548" y="805" class="secondary">DN15 · drain</text>

<!-- Hot outlet temperature tap -->
<path class="signal" d="M970 730V688"/>
<g fill="#1E293B"><circle cx="970" cy="730" r="3.2"/><circle cx="970" cy="717" r="2"/><circle cx="970" cy="703" r="2"/><circle cx="970" cy="690" r="2"/></g>
<circle cx="970" cy="670" r="18" class="symbol"/>
<text x="970" y="667" text-anchor="middle" class="letters">TT</text>
<text x="970" y="682" text-anchor="middle" class="instrument">101</text>
<!-- Electric transmitter signal: bridge over cooling-water return, no connection. -->
<path class="electric" d="M970 652V579 M970 561V300H810V205H882"/>
<path class="signal" d="M970 579C982 579 982 561 970 561"/>
<!-- Shared control-room temperature indicating controller -->
<circle cx="900" cy="205" r="18" class="symbol"/>
<path class="signal" d="M900 187 915.6 196V214L900 223 884.4 214V196Z M882 205H918"/>
<text x="900" y="202" text-anchor="middle" class="letters">TIC</text>
<text x="900" y="218" text-anchor="middle" class="instrument">101</text>
<!-- Pneumatic command to diaphragm, crossing the cold outlet with a jumper. -->
<path class="signal" d="M918 205H1300V561C1312 561 1312 579 1300 579V680"/>
<path class="signal" d="m1000 201 9 9 m35-9 9 9 m35-9 9 9 m35-9 9 9 m35-9 9 9 m35-9 9 9 m35-9 9 9 M1296 225l9-9 m-9 44 9-9 m-9 44 9-9 m-9 44 9-9 m-9 44 9-9 m-9 44 9-9 m-9 44 9-9 m-9 44 9-9 m-9 44 9-9 M1296 604l9-9 m-9 44 9-9 m-9 44 9-9"/>
<use href="#gate" x="1300" y="730"/>
<path class="minor" d="M1300 716V694"/>
<path class="symbol" d="M1280 694C1280 675.3 1320 675.3 1320 694Z"/>
<text x="1330" y="690" class="tag">FO</text>
<text x="1300" y="779" text-anchor="middle" class="tag">TV-101</text>
<text x="1300" y="800" text-anchor="middle" class="secondary">Hot Outlet Temperature Valve</text>

<!-- Exemplar footer and five-line legend -->
<path d="M47 859.5H1553" class="hairline"/>
<path d="M47 901H92" class="pipe"/><text x="102" y="905" class="secondary">Process</text>
<path d="M188 901H233" class="minor"/><text x="243" y="905" class="secondary">Process, minor</text>
<path d="M366 901H411" class="electric"/><text x="421" y="905" class="secondary">Electric signal</text>
<path d="M538 901H583 m-32-4 9 9" class="signal"/><text x="593" y="905" class="secondary">Pneumatic signal</text>
<path d="M726 901H771" class="signal"/><g fill="#1E293B"><circle cx="733" cy="901" r="2"/><circle cx="748" cy="901" r="2"/><circle cx="762" cy="901" r="2"/></g>
<text x="781" y="905" class="secondary">Capillary / filled system</text>
<text x="47" y="944" class="secondary">TT-101 senses the hot glycol outlet; TIC-101 modulates fail-open TV-101. Shell and tube circuits remain separate; vent and drain connect to the tube side.</text>
</svg>
