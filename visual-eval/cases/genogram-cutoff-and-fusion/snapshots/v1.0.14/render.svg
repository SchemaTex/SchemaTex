<g class="schematex-genogram-generation schematex-genogram-generation-0" data-generation="0"><g class="schematex-genogram-node schematex-genogram-male" data-individual-id="minh" transform="translate(259.8, 60)"><title>Minh Nguyen (1950)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
