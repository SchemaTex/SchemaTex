<g class="schematex-genogram-emotional schematex-genogram-emotional-distant" data-from="chi" data-to="bao" data-relationship-type="distant"><path d="M 439.8 246 Q 379.8 276 319.8 246" fill="none" stroke="#9e9e9e" stroke-width="2" style="stroke-dasharray: 6,4;"/></g>
