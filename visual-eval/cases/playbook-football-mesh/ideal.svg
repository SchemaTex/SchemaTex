<title>Mesh Concept — Trips right against Cover 1</title>
<desc>First and ten on own 25, NFL hash marks. X runs a two-yard drag right; Y runs a three-yard drag left; Z runs a corner; H runs a seam; RB runs a wheel right. Offense attacks upward. Small gaps at crossing routes indicate no connection.</desc>
