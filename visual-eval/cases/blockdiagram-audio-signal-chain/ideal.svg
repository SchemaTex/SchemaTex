<text x="46" y="48" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#16202B">Audio Signal Chain</text>
<text x="46" y="70" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#63707F">Studio audio playback chain from source signal to loudspeaker output</text>
