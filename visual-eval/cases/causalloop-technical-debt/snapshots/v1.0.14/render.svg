<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="452" height="375" viewBox="0 0 452 375" role="img" aria-label="Causal loop diagram" data-diagram-type="causalloop"><title>Causal loop diagram</title>
<desc>Causal loop diagram: 5 variables, 6 causal links. 2 feedback loops: 2 reinforcing (R), 0 balancing (B). R1 &quot;Debt spiral&quot; (reinforcing, 0 negative links): Delivery pressure → Shortcutting → Technical debt → Development effort → Delivery pressure. R2 (reinforcing, 0 negative links): Delivery pressure → Shortcutting → Technical debt → Defect rate → Development effort → Delivery pressure. Line 3: unrecognised line: &quot;causalloop &quot;Technical-debt spiral&quot;&quot;</desc>
<style>.sx-cld-bg { fill: #ffffff; }
.sx-cld-link { fill: none; stroke: #1a1a1a; stroke-width: 2; }
.sx-cld-arrow { fill: #1a1a1a; stroke: none; }
.sx-cld-var { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
.sx-cld-polarity { fill: #1a1a1a; font-size: 14px; font-weight: 700; }
.sx-cld-link-label { fill: #1a1a1a; font-size: 9px; }
.sx-cld-delay { stroke: #1a1a1a; stroke-width: 2; }
.sx-cld-glyph { fill: none; stroke: #1d6fd6; stroke-width: 2; }
.sx-cld-glyph-head { fill: #1d6fd6; stroke: none; }
.sx-cld-glyph-label { fill: #1d6fd6; font-size: 12px; font-weight: 700; }
.sx-cld-glyph-phrase { fill: #1d6fd6; font-size: 10px; font-style: italic; }
.sx-cld-title { fill: #1a1a1a; font-size: 16px; font-weight: 700; }</style>
