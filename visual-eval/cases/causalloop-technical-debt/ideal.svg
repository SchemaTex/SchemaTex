<text x="46" y="48" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#16202B">Technical-debt spiral</text>
<text x="46" y="70" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#63707F">delivery pressure and technical debt form a reinforcing software-product loop</text>
