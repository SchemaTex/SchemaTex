<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" role="img">
<title>Technical-debt spiral</title>
<desc>A causal-loop diagram of Technical-debt spiral. 5 variables are joined by 6 causal links, each carrying its polarity beside the arrowhead. The engine's job here is to find the feedback loops and classify them by Sterman's even/odd rule, and this drawing shows that answer: R1 runs Delivery pressure → Shortcutting → Technical debt → Defect rate → Development effort → Delivery pressure with 0 negative links, so it reinforces; R2 runs Delivery pressure → Shortcutting → Technical debt → Development effort → Delivery pressure with 0 negative links, so it reinforces. Each loop glyph is a circular arrow curling in the loop's own direction, labelled with the computed letter and the loop's name.</desc>
