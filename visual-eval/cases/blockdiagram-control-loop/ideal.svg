<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1401 464" width="1401" height="464" role="img">
<title>Heat Exchanger Temperature Control Loop</title>
<desc>A functional block diagram of Heat Exchanger Temperature Control Loop. 5 blocks carry the forward signal path. A summing junction takes the reference on its left input and the measurement on its bottom input, with the signs set just outside the circle. The feedback path — Outlet Temperature Sensor — returns in its own band below the forward chain and is the only terracotta on the page. Every wire is orthogonal, every arrowhead lands on a block edge, signal names are set in italic beside the wire they name, and a legend at the foot states the line codes.</desc>
