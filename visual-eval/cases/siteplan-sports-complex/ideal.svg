<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<title>Community sports complex — concept site plan in metres</title>
<defs>
  <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M-1 1L1-1M0 11L11 0M10 12L12 10" fill="none" stroke="#A3ABB4" stroke-width="1"/></pattern>
  <style>
    text{font-family:Helvetica,Arial,sans-serif;fill:#1F2328;font-size:17px}
    .title{font-size:31px;font-weight:700}.subtitle{font-size:18px;fill:#74808E}
    .heading{font-size:14px;letter-spacing:1.5px;font-weight:700;fill:#74808E}
    .name{font-size:19px;font-weight:700;letter-spacing:1px}
    .note{font-size:16px;fill:#74808E}.small{font-size:14px;fill:#74808E}
    .boundary{fill:none;stroke:#1F2328;stroke-width:3.5;stroke-dasharray:32 6 6 6 6 6}
    .dim{fill:none;stroke:#A3ABB4;stroke-width:1}.tick{stroke:#1F2328;stroke-width:2}
    .rule{stroke:#A3ABB4;stroke-width:1}.paving{fill:#EDEFF2;stroke:#55606C;stroke-width:1.5}
  </style>
</defs>
<rect width="1600" height="1100" fill="#FFFFFF"/>
<text x="62" y="73" class="title">Community sports complex — Site Plan</text>
<text x="62" y="108" class="subtitle">Concept plan · 46,800 m² campus · sports facilities, vehicle access and pedestrian circulation · dimensions in metres</text>
<path d="M62 133H1538" class="rule"/>
<!-- Plan coordinates: x = 130 + 3.2x; y = 230 + 3.2y. -->
<rect x="130" y="230" width="832" height="576" fill="#F7F5EF"/>
<!-- Field areas -->
<rect x="210" y="550" width="320" height="144" fill="#E8F5E9" stroke="#55606C" stroke-width="1.5"/>
<rect x="578" y="518" width="320" height="144" fill="#E8F5E9" stroke="#55606C" stroke-width="1.5"/>
<!-- Vehicle access loop, 12 m wide -->
<path d="M178 742V278H834V486" fill="none" stroke="#55606C" stroke-width="40" stroke-linejoin="miter"/>
<path d="M178 742V278H834V486" fill="none" stroke="#EDEFF2" stroke-width="37" stroke-linejoin="miter"/>
<!-- Parking footprint, intersected by Stadium Avenue -->
<rect x="594" y="678" width="320" height="96" class="paving"/>
<!-- Street pavement and curb lines -->
<path d="M50 703.6H1042V748.4H50Z" fill="#EDEFF2"/>
<path d="M50 703.6H158M198 703.6H594M914 703.6H1042M50 748.4H594M914 748.4H1042" fill="none" stroke="#55606C" stroke-width="1.6"/>
<path d="M50 726H214M436 726H1042" stroke="#A3ABB4" stroke-width="1" stroke-dasharray="28 8 6 8"/>
<text x="280" y="731" text-anchor="middle" style="font-size:14px" font-weight="700" letter-spacing="1">STADIUM AVENUE</text>
<!-- Stall ticks are a conventional parking symbol, not an individual space count -->
<path d="M614 678V698M634 678V698M654 678V698M674 678V698M694 678V698M714 678V698M734 678V698M754 678V698M774 678V698M794 678V698M814 678V698M834 678V698M854 678V698M874 678V698M894 678V698M614 754V774M634 754V774M654 754V774M674 754V774M694 754V774M714 754V774M734 754V774M754 754V774M774 754V774M794 754V774M814 754V774M834 754V774M854 754V774M874 754V774M894 754V774" fill="none" stroke="#A3ABB4" stroke-width="1"/>
<!-- Pedestrian concourse: exact DSL polyline, 5 m wide -->
<path d="M386 726V502H690V438" fill="none" stroke="#55606C" stroke-width="18" stroke-linejoin="miter"/>
<path d="M386 726V502H690V438" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linejoin="miter"/>
<!-- Facility footprints -->
<rect x="242" y="310" width="288" height="192" fill="#D5DAE0" stroke="#1F2328" stroke-width="2.7"/>
<rect x="594" y="326" width="192" height="112" fill="#D5DAE0" stroke="#1F2328" stroke-width="2.7"/>
<text x="386" y="399" text-anchor="middle" class="name">MULTI-USE ARENA</text>
<text x="386" y="426" text-anchor="middle" class="note">90 × 60 m · 5,400 m²</text>
<text x="690" y="367" text-anchor="middle" class="name">CHANGING</text>
<text x="690" y="391" text-anchor="middle" class="name">PAVILION</text>
<text x="690" y="418" text-anchor="middle" class="note">60 × 35 m · 2,100 m²</text>
<text x="293" y="603" text-anchor="middle" class="name">FOOTBALL</text>
<text x="293" y="629" text-anchor="middle" class="name">PITCH</text>
<text x="293" y="655" text-anchor="middle" class="note">100 × 45 m</text>
<text x="738" y="582" text-anchor="middle" class="name">TRAINING FIELD</text>
<text x="738" y="609" text-anchor="middle" class="note">100 × 45 m · 4,500 m²</text>
<!-- Closed property boundary -->
<rect x="130" y="230" width="832" height="576" class="boundary"/>
<text x="546" y="213" text-anchor="middle">SPORTS COMPLEX BOUNDARY · 260.00 m</text>
<text x="112" y="518" transform="rotate(-90 112 518)" text-anchor="middle">180.00 m</text>
<text x="984" y="518" transform="rotate(-90 984 518)" text-anchor="middle">180.00 m</text>
<text x="546" y="832" text-anchor="middle">260.00 m</text>
<!-- Supporting annotations -->
<text x="485" y="264" class="note" text-anchor="middle">VEHICLE ACCESS LOOP · 12 m WIDE</text>
<text x="198" y="455" class="small" transform="rotate(-90 198 455)" text-anchor="middle">VEHICLE ACCESS LOOP</text>

<!-- Hydrant, centered at 130,85 -->
<g transform="translate(546 502)" fill="#FFFFFF" stroke="#55606C" stroke-width="1.8">
<circle r="10"/><path d="M-13-3H-9M9-3H13M-3-13V-9M-4 4V-4H4V4M-4 0H4" fill="none"/>
</g>
<path d="M546 489V460H554" fill="none" stroke="#55606C" stroke-width="1.2"/>
<text x="560" y="465" class="note">Hydrant</text>
<!-- Coach drop-off callout from 220,80 to pavilion corner 205,65 -->
<path d="M786 438H817V486H852" fill="none" stroke="#55606C" stroke-width="1.4"/>
<circle cx="786" cy="438" r="3" fill="#55606C"/>
<text x="855" y="468" class="note">Team coach</text>
<text x="855" y="488" class="note">drop-off</text>
<!-- Main entry marker at 80,155, 10 m -->
<g transform="translate(386 726)"><rect x="-16" y="-5" width="32" height="10" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/><path d="M0-8V-25M-6-19L0-25L6-19" fill="none" stroke="#1F2328" stroke-width="2"/></g>
<path d="M386 736V870H358" fill="none" stroke="#55606C" stroke-width="1.2"/>
<text x="348" y="867" text-anchor="end" class="name">MAIN SPECTATOR ENTRY</text>
<text x="348" y="892" text-anchor="end" class="note">10 m entrance · 5 m pedestrian concourse</text>
<path d="M754 774V870H787" fill="none" stroke="#55606C" stroke-width="1.2"/>
<text x="799" y="867" class="name">SPECTATOR PARKING</text>
<text x="799" y="892" class="note">180 spaces · 100 × 30 m</text>
<!-- Side panel -->
<text x="1085" y="215" class="heading">SITE DATA</text>
<text x="1085" y="247">Campus area 46,800 m²</text>
<text x="1085" y="274" class="note">260.00 m × 180.00 m</text>
<text x="1085" y="320" class="heading">FACILITY</text><text x="1538" y="320" class="heading" text-anchor="end">AREA (m²)</text>
<path d="M1085 331H1538" stroke="#55606C" stroke-width="1.5"/>
<text x="1085" y="360">Multi-use Arena</text><text x="1538" y="360" text-anchor="end">5,400</text>
<text x="1085" y="391">Changing Pavilion</text><text x="1538" y="391" text-anchor="end">2,100</text>
<path d="M1085 405H1538" class="rule"/>
<text x="1085" y="435" font-weight="700">Building footprints</text><text x="1538" y="435" text-anchor="end" font-weight="700">7,500</text>
<path d="M1085 449H1538" class="rule"/>
<text x="1085" y="479">Football Pitch</text><text x="1538" y="479" text-anchor="end">4,500</text>
<text x="1085" y="510">Training Field</text><text x="1538" y="510" text-anchor="end">4,500</text>
<text x="1085" y="541">Spectator Parking</text><text x="1538" y="541" text-anchor="end">3,000</text>
<text x="1085" y="583" class="note">Concept arrangement for facility relationships</text>
<text x="1085" y="606" class="note">and circulation. Not a permit drawing.</text>
<text x="1085" y="665" class="heading">LEGEND</text>
<path d="M1085 699H1153" class="boundary"/><text x="1173" y="705">Site boundary</text>
<rect x="1095" y="723" width="49" height="21" fill="#D5DAE0" stroke="#1F2328" stroke-width="2.5"/><text x="1173" y="740">Building footprint</text>
<rect x="1095" y="758" width="49" height="21" fill="#E8F5E9" stroke="#55606C" stroke-width="1.5"/><text x="1173" y="775">Sports field</text>
<rect x="1095" y="793" width="49" height="21" class="paving"/><text x="1173" y="810">Road, vehicle loop / parking</text>
<rect x="1095" y="833" width="49" height="10" fill="#FFFFFF" stroke="#55606C" stroke-width="1.5"/><text x="1173" y="845">Pedestrian concourse</text>
<path d="M1105 878H1135M1120 881V861M1114 867L1120 861L1126 867" fill="none" stroke="#1F2328" stroke-width="2"/><text x="1173" y="880">Main spectator entry</text>
<g transform="translate(1120 910)" fill="#FFFFFF" stroke="#55606C" stroke-width="1.7"><circle r="10"/><path d="M-13-3H-9M9-3H13M-3-13V-9M-4 4V-4H4V4M-4 0H4" fill="none"/></g><text x="1173" y="915">Hydrant</text>
<!-- Graphic scale, 25 m increments, true to plan scale -->
<g transform="translate(1085 1000)">
<text x="0" y="-8" class="small" text-anchor="middle">0</text><text x="80" y="-8" class="small" text-anchor="middle">25</text><text x="160" y="-8" class="small" text-anchor="middle">50</text><text x="240" y="-8" class="small" text-anchor="middle">75</text><text x="320" y="-8" class="small" text-anchor="middle">100</text>
<rect width="80" height="9" fill="#1F2328"/><rect x="80" width="80" height="9" fill="#FFFFFF" stroke="#1F2328"/><rect x="160" width="80" height="9" fill="#1F2328"/><rect x="240" width="80" height="9" fill="#FFFFFF" stroke="#1F2328"/>
<text x="337" y="10" class="small">m</text><text x="0" y="38" class="heading">GRAPHIC SCALE</text>
</g>
<g transform="translate(1510 1001)"><circle r="26" fill="#FFFFFF" stroke="#A3ABB4" stroke-width="1.5"/><text x="0" y="-35" text-anchor="middle" font-weight="700">N</text><path d="M0-21L-9 13L0 7L9 13Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.6"/><path d="M0-21L-9 13L0 7Z" fill="#1F2328"/></g>
</svg>
