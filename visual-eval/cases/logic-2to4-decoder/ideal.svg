<circle cx="536" cy="462" r="3.5"/>
<circle cx="512" cy="250" r="3.5"/>
<circle cx="470" cy="200" r="3.5"/>
<circle cx="470" cy="400" r="3.5"/>
</g>
<g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="276" y="161" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">nS1</text>
<text x="320" y="241" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">nS0</text>
<text x="456" y="191" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">e0</text>
<text x="456" y="391" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">e1</text>
<text x="46" y="558" font-size="11.5" fill="#64748B" text-anchor="start">Y0 = E·S1′·S0′</text>
<text x="210" y="558" font-size="11.5" fill="#64748B" text-anchor="start">Y1 = E·S1′·S0</text>
<text x="370" y="558" font-size="11.5" fill="#64748B" text-anchor="start">Y2 = E·S1·S0′</text>
<text x="530" y="558" font-size="11.5" fill="#64748B" text-anchor="start">Y3 = E·S1·S0</text>
<text x="46" y="56" font-size="20" fill="#1E293B" text-anchor="start" font-weight="600">Enabled 2-to-4 Decoder</text>
<text x="46" y="80" font-size="11.5" fill="#64748B" text-anchor="start">ANSI / IEEE Std 91 distinctive-shape gates · signal flow left to right</text>
<text x="744" y="80" font-size="11.5" fill="#64748B" text-anchor="end">filled dot = junction · plain crossing = no connection</text>
<text x="54" y="124.5" font-size="13" fill="#1E293B" text-anchor="end">E</text>
<text x="54" y="174.5" font-size="13" fill="#1E293B" text-anchor="end">S1</text>
<text x="54" y="254.5" font-size="13" fill="#1E293B" text-anchor="end">S0</text>
<text x="700" y="154.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">Y0</text>
<text x="700" y="254.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">Y1</text>
<text x="700" y="354.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">Y2</text>
<text x="700" y="454.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">Y3</text>
</g>
</svg>
