<polyline points="486,400 486,438 570,438"/>
<polyline points="630,150 690,150"/>
<polyline points="630,250 690,250"/>
<polyline points="630,350 690,350"/>
<polyline points="630,450 690,450"/>
</g>
<g fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round">
<path d="M 190,148 L 190,192 L 232,170 Z"/>
<circle cx="237" cy="170" r="5" stroke-width="1.5"/>
<path d="M 190,228 L 190,272 L 232,250 Z"/>
<circle cx="237" cy="250" r="5" stroke-width="1.5"/>
<path d="M 380,176 H 416 A 24,24 0 0 1 416,224 H 380 Z"/>
<path d="M 380,376 H 416 A 24,24 0 0 1 416,424 H 380 Z"/>
<path d="M 570,126 H 606 A 24,24 0 0 1 606,174 H 570 Z"/>
<path d="M 570,226 H 606 A 24,24 0 0 1 606,274 H 570 Z"/>
