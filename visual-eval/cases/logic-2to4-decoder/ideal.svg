<svg xmlns="http://www.w3.org/2000/svg" width="790" height="600" viewBox="0 0 790 600" role="img">
<title>Enabled 2-to-4 Decoder</title>
<desc>Gate-level enabled 2-to-4 decoder in ANSI/IEEE Std 91 distinctive-shape symbols. Enable E and select lines S1 and S0 enter as labelled stubs on the left. Two inverters produce the complements nS1 and nS0. E is qualified by S1 and by nS1 in a pair of AND gates, giving the half-decode nets e0 and e1, and each of those is combined with S0 or nS0 in a final AND to give one of the four active-high outputs Y0 to Y3. The S0 and nS0 literals run as vertical rails tapped twice each; all wires are orthogonal, filled dots mark junctions and plain crossings mark wires that pass without connecting.</desc>
<rect x="0" y="0" width="790" height="600" fill="#FFFFFF"/>
<line x1="46" y1="96" x2="744" y2="96" stroke="#E2E8F0" stroke-width="1"/>
<line x1="46" y1="530" x2="744" y2="530" stroke="#E2E8F0" stroke-width="1"/>
<g fill="none" stroke="#1E293B" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter">
<polyline points="62,120 300,120 300,188 380,188"/>
<polyline points="300,188 300,388 380,388"/>
