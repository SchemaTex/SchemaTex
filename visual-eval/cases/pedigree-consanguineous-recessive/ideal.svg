<rect x="22" y="678" width="690.4100000000001" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="380" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">Consanguineous Recessive Family</text>
<text x="26" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
