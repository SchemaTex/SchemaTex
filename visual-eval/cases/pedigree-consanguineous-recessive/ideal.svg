<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" width="760" height="790">
<title>Consanguineous Recessive Family</title>
<desc>Four-generation consanguineous autosomal recessive pedigree. Deceased carrier male I-1, drawn half-filled with a diagonal slash, is mated to unaffected female I-2; their children are carrier male II-1 and carrier female II-4. II-1 mates unaffected female II-2 and has carrier son III-1; II-3, an unaffected male who married in, mates carrier II-4 and has carrier daughter III-2. First cousins III-1 and III-2 are joined by a double consanguinity line; their children are affected female IV-1, the proband, unaffected male IV-2, and IV-3, a spontaneous abortion drawn as a small open triangle.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
