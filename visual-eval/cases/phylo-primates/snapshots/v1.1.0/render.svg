<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-diagram schematex-phylo" viewBox="0 0 522 206" width="522" height="206"><title>Phylogenetic Tree: Primate Phylogeny</title>
<desc>Phylogenetic tree with 5 taxa, phylogram mode, rectangular layout. Dotted tip extensions align labels and do not represent branch distance.</desc>
<style>.schematex-phylo {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
  font-family: system-ui, -apple-system, sans-serif;
}
.schematex-phylo-branch { fill: none; stroke: #0f172a; stroke-width: 2; stroke-linecap: round; }
.schematex-phylo-branch-connector { fill: none; stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-dendro-axis line { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-dendro-axis text { font-size: 10px; fill: #475569; text-anchor: middle; }
.schematex-phylo-dendro-cut { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.schematex-phylo-dendro-cut-label { font-size: 10px; fill: #dc2626; text-anchor: start; }

.schematex-phylo-tip-label { font-size: 12px; fill: #0f172a; dominant-baseline: central; }
.schematex-phylo-tip-label-italic { font-style: italic; }
.schematex-phylo-support-label { font-size: 9px; fill: #475569; text-anchor: end; dominant-baseline: auto; }
.schematex-phylo-support-dot { stroke: none; }
.schematex-phylo-scale-bar line { stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-scale-bar text { font-size: 10px; fill: #0f172a; text-anchor: start; }
.schematex-phylo-scale-tick { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-title { font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
.schematex-phylo-clade-label { font-size: 13px; font-weight: bold; }
.schematex-phylo-root-marker { fill: none; stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-clade-Homininae { stroke: #1E88E5; }
.schematex-phylo-clade-bg-Homininae { fill: #1E88E5; fill-opacity: 0.12; }
.schematex-phylo-clade-label-Homininae { fill: #1E88E5; }</style>
<text x="261" y="20" class="schematex-phylo-title">Primate Phylogeny</text>
<g class="schematex-phylo-clade-highlights" transform="translate(0,30)"><path d="M 420,14 H 424 V 82 H 420" fill="none" stroke="#1E88E5" stroke-width="1" class="schematex-phylo-clade-bracket"/>
<text x="430" y="48" class="schematex-phylo-clade-label schematex-phylo-clade-label-Homininae" fill="#1E88E5" font-weight="bold" font-size="13" dominant-baseline="central">Homininae</text></g>
<g class="schematex-phylo-branches" transform="translate(0,30)"><path d="M 32,75 V 120" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 32,75 H 157" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 32,120 H 312" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 157,54 V 96" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 157,54 H 247" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Homininae" stroke="#1E88E5"/>
<path d="M 157,96 H 312" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 247,36 V 72" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 247,36 H 282" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Homininae" stroke="#1E88E5"/>
<path d="M 247,72 H 312" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Homininae" stroke="#1E88E5"/>
<path d="M 282,24 V 48" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 282,24 H 312" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Homininae" stroke="#1E88E5"/>
<path d="M 282,48 H 312" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Homininae" stroke="#1E88E5"/>
<line x1="312" y1="24" x2="324" y2="24" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/>
<line x1="312" y1="48" x2="324" y2="48" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/>
<line x1="312" y1="72" x2="324" y2="72" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/>
<line x1="312" y1="96" x2="324" y2="96" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/>
<line x1="312" y1="120" x2="324" y2="120" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/></g>
<g class="schematex-phylo-nodes" transform="translate(0,30)"><circle cx="32" cy="97.5" r="2.5" class="schematex-phylo-root-marker"/></g>
<g class="schematex-phylo-labels" transform="translate(0,30)"><text x="330" y="24" class="schematex-phylo-tip-label" data-taxon-id="Human">Human</text>
<text x="330" y="48" class="schematex-phylo-tip-label" data-taxon-id="Chimpanzee">Chimpanzee</text>
<text x="330" y="72" class="schematex-phylo-tip-label" data-taxon-id="Gorilla">Gorilla</text>
<text x="330" y="96" class="schematex-phylo-tip-label" data-taxon-id="Orangutan">Orangutan</text>
<text x="330" y="120" class="schematex-phylo-tip-label" data-taxon-id="Gibbon">Gibbon</text></g>
<g transform="translate(0,30)"><g class="schematex-phylo-scale-bar"><line x1="20" y1="140" x2="120" y2="140" class="schematex-phylo-scale-bar"/>
<line x1="20" y1="136" x2="20" y2="144" class="schematex-phylo-scale-tick"/>
<line x1="120" y1="136" x2="120" y2="144" class="schematex-phylo-scale-tick"/>
<text x="20" y="156" text-anchor="start" class="schematex-phylo-scale-bar">0.02</text>
<text x="20" y="168" text-anchor="start" font-size="9" fill="#475569">substitutions/site</text></g></g></svg>