<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <title>Primate Phylogeny</title>
  <rect width="1100" height="650" fill="white"/>
  <text x="65" y="65" font-family="Helvetica, sans-serif" font-size="32" font-weight="600" fill="#202830">Primate Phylogeny</text>
  <!-- Horizontal distances use 12,000 drawing units per substitution/site.
       Root: 0; great apes: .025; Homininae: .043; Human/Chimpanzee: .050; tips: .056. -->
  <g fill="none" stroke="#424A52" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M100 296.25 V490 H772"/>
    <path d="M100 296.25 H400 M400 215 V377.5 H772"/>
  </g>
  <g fill="none" stroke="#1E88E5" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M400 215 H616"/>
    <path d="M616 160 V270 H772"/>
    <path d="M616 160 H700"/>
    <path d="M700 110 V210"/>
    <path d="M700 110 H772 M700 210 H772"/>
  </g>
  <g font-family="Helvetica, sans-serif" font-size="25" fill="#202830">
    <text x="797" y="118">Human</text>
    <text x="797" y="218">Chimpanzee</text>
    <text x="797" y="278">Gorilla</text>
    <text x="797" y="385.5">Orangutan</text>
    <text x="797" y="498">Gibbon</text>
  </g>
  <text x="430" y="185" font-family="Helvetica, sans-serif" font-size="23" font-weight="600" fill="#1E88E5">Homininae</text>
  <g stroke="#424A52" stroke-width="2" fill="none">
    <path d="M100 560 H220 M100 554 V566 M220 554 V566"/>
  </g>
  <text x="100" y="600" font-family="Helvetica, sans-serif" font-size="20" fill="#424A52">0.01 substitutions/site</text>
</svg>
