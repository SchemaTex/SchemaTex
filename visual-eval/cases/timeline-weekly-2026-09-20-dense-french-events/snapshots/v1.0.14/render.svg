    .st-era-rect { opacity: 0.55; }
    .st-era-strip { opacity: 0.14; }
    .st-era-label { font-size: 11px; font-weight: 500; fill: var(--st-era-label); }
    .st-event-dot { stroke: var(--st-marker-fill); stroke-width: 1.5; }
