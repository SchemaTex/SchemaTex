<g transform="translate(120, 0)"><text x="120" y="98" class="schematex-timing-bus-label" text-anchor="middle">START</text><text x="200" y="98" class="schematex-timing-bus-label" text-anchor="middle">D0</text><text x="280" y="98" class="schematex-timing-bus-label" text-anchor="middle">D1</text><text x="360" y="98" class="schematex-timing-bus-label" text-anchor="middle">D2</text><text x="440" y="98" class="schematex-timing-bus-label" text-anchor="middle">D3</text><text x="520" y="98" class="schematex-timing-bus-label" text-anchor="middle">D4</text><text x="600" y="98" class="schematex-timing-bus-label" text-anchor="middle">D5</text><text x="680" y="98" class="schematex-timing-bus-label" text-anchor="middle">D6</text><text x="760" y="98" class="schematex-timing-bus-label" text-anchor="middle">D7</text><text x="840" y="98" class="schematex-timing-bus-label" text-anchor="middle">STOP</text></g>
<g transform="translate(120, 0)"></g></g>
<g class="schematex-timing-names"><text x="112" y="62" class="schematex-timing-name" text-anchor="end">TX</text>
