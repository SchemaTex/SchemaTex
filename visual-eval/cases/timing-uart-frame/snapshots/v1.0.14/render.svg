<line x1="1080" y1="40" x2="1080" y2="158" class="schematex-timing-grid"/></g>
<g class="schematex-timing-waves"><g transform="translate(120, 0)" data-signal="TX"><path class="schematex-timing-wave" d="M 0,46 L 80,46 L 80,70 L 160,70 L 160,46 L 240,46 L 240,70 L 320,70 L 320,46 L 400,46 L 400,70 L 480,70 L 480,46 L 560,46 L 560,70 L 640,70 L 640,46 L 720,46 L 720,70 L 800,70 L 800,46 L 880,46 L 960,46"/></g>
