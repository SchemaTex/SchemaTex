<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1140" viewBox="0 0 1040 760">
<title>Storefront schema — core e-commerce orders</title>
<desc>Six entities and six relationships. Customer places zero or many orders and saves zero or many addresses. Each order contains one or more line items and has zero or many payments. Each product appears in zero or many line items. Each address is the shipping address for zero or many orders.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:12px}
.structure{fill:none;stroke:#334155;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.entity{fill:white;stroke:#334155;stroke-width:1.5}
.name{font-size:13px;font-weight:600;letter-spacing:.5px}
.dtype{fill:#475569}.pk{font-weight:600;text-decoration:underline}
.key{fill:#fff;font-size:10px;font-weight:700;text-anchor:middle}
.caption{font-size:10.5px;fill:#475569;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}
</style>
