<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1214" viewBox="0 0 1160 880">
  <title>Binary divisibility by three — complete DFA</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 0.5 L 9 5 L 1 9.5" fill="none" stroke="#4A5568" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family: Helvetica, Arial, sans-serif;}
      .state {fill:#FFFFFF;stroke:#16202E;stroke-width:1.5;}
      .edge {fill:none;stroke:#4A5568;stroke-width:1.25;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round;}
      .name {font-size:13px;font-weight:500;fill:#16202E;text-anchor:middle;}
      .label {font-size:11px;fill:#64708A;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:6;stroke-linejoin:round;}
      .legend {font-size:10.5px;fill:#64708A;}
    </style>
  </defs>
  <rect width="1160" height="880" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="19" font-weight="600" fill="#16202E">Binary Divisibility by Three</text>
  <text x="40" y="68" font-size="11.5" fill="#64708A">Complete DFA · binary input · accepting state R0 · transition labels read 0 or 1</text>

  <!-- Initial entry and all six transitions. Paired edges use separate lanes. -->
  <circle cx="220" cy="210" r="6" fill="#16202E"/>
  <path class="edge" d="M220 216 V350"/>

  <!-- True circular self-transition: leaves top, returns on the right. -->
  <path class="edge" d="M266 350 A30 30 0 1 1 295 367"/>
  <text class="label" x="340" y="326">0</text>

  <path class="edge" d="M295 370 H505"/>
  <text class="label" x="400" y="358">1</text>
  <path class="edge" d="M505 390 H295"/>
  <text class="label" x="400" y="413">1</text>

  <path class="edge" d="M655 370 H865"/>
  <text class="label" x="760" y="358">0</text>
  <path class="edge" d="M865 390 H655"/>
  <text class="label" x="760" y="413">0</text>

  <path class="edge" d="M986 350 A30 30 0 1 1 1015 367"/>
  <text class="label" x="1060" y="326">1</text>

  <!-- A double boundary identifies acceptance without adding a final pseudo-state. -->
  <rect class="state" x="145" y="350" width="150" height="60" rx="10"/>
  <rect class="state" x="150" y="355" width="140" height="50" rx="10"/>
  <text class="name" x="220" y="385">R0</text>
  <rect class="state" x="505" y="350" width="150" height="60" rx="10"/>
  <text class="name" x="580" y="385">R1</text>
  <rect class="state" x="865" y="350" width="150" height="60" rx="10"/>
  <text class="name" x="940" y="385">R2</text>

  <!-- Exemplar-style bottom legend, restricted to symbols present in this DFA. -->
  <path d="M40 792 H1120" fill="none" stroke="#EEF2F7" stroke-width="1.25"/>
  <circle cx="46" cy="824" r="6" fill="#16202E"/>
  <text class="legend" x="61" y="828">initial pseudo-state</text>
  <rect class="state" x="270" y="814" width="30" height="20" rx="10"/>
  <rect class="state" x="274" y="818" width="22" height="12" rx="6"/>
  <text class="legend" x="310" y="828">accepting state</text>
  <rect class="state" x="480" y="814" width="30" height="20" rx="10"/>
  <text class="legend" x="520" y="828">state</text>
  <path class="edge" d="M650 824 H686"/>
  <text class="legend" x="700" y="828">transition — input symbol 0 or 1</text>
</svg>
