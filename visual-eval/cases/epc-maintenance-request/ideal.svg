      .connector { fill: #E5E7EB; stroke: #1F1B2E; stroke-width: 1.4; }
      .flow { fill: none; stroke: #1F1B2E; stroke-width: 1.5; marker-end: url(#arrow); }
      .operator { fill: none; stroke: #1F1B2E; stroke-width: 2; stroke-linecap: round; }
