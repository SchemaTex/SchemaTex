<text x="119" y="438" class="lt-ladder-fb-name">ADD</text>
<line x1="73" y1="452" x2="79" y2="452" class="lt-ladder-wire"/>
<line x1="159" y1="452" x2="165" y2="452" class="lt-ladder-wire"/>
<text x="83" y="452" class="lt-ladder-pin">name=TERM_A := Input + 2</text>
<text x="119" y="420" class="lt-ladder-tag">TERM_A</text></g>
