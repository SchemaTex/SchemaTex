<text x="121.69999999999999" y="216" class="lt-ladder-name">BOOL</text>
<text x="121.69999999999999" y="227" class="lt-ladder-name">controller tag</text>
<text x="121.69999999999999" y="238" class="lt-ladder-tag">Decrement</text></g>
<g data-element="contact" data-tag="DECR_ONS"><line x1="213.09999999999997" y1="254" x2="217.09999999999997" y2="254" class="lt-ladder-wire"/>
