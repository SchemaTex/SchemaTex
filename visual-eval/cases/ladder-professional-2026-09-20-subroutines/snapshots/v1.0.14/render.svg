<text x="121.69999999999999" y="97" class="lt-ladder-name">Convert - BOOL</text>
<text x="121.69999999999999" y="108" class="lt-ladder-name">controller tag</text>
<text x="121.69999999999999" y="119" class="lt-ladder-name">enables R_Calc</text>
<text x="121.69999999999999" y="130" class="lt-ladder-tag">Convert</text></g>
