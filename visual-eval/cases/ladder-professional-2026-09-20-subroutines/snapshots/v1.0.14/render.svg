<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="lt-ladder" role="img" aria-labelledby="lt-ladder-title lt-ladder-desc" width="405.34999999999997" height="1095" viewBox="0 0 405.34999999999997 1095"><title>ControlLogix Lab - Tasks, Subroutines and Passed Parameters</title>
<desc>PLC ladder logic diagram with 9 rungs</desc>
<style>.lt-ladder { font-family: system-ui, -apple-system, sans-serif; }
.lt-ladder-rail { stroke: #111111; stroke-width: 4; stroke-linecap: square; }
.lt-ladder-wire { stroke: #222222; stroke-width: 1.5; fill: none; }
.lt-ladder-element { stroke: #222222; stroke-width: 2; fill: none; }
.lt-ladder-coil { stroke: #222222; stroke-width: 2; fill: none; }
.lt-ladder-fb { fill: #ffffff; stroke: #222222; stroke-width: 2; }
.lt-ladder-fb-name { font: bold 11px sans-serif; fill: #111111; text-anchor: middle; }
.lt-ladder-pin { font: 8px sans-serif; fill: #222222; }
.lt-ladder-name { font: 9px sans-serif; fill: #111111; text-anchor: middle; }
.lt-ladder-tag { font: 600 9px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4e89; text-anchor: middle; }
.lt-ladder-addr { font: 600 8.5px ui-monospace, monospace; fill: #cc0000; text-anchor: middle; }
.lt-ladder-rung-num { font: 10px sans-serif; fill: #555555; text-anchor: end; }
.lt-ladder-comment { font: italic 10px sans-serif; fill: #555555; }
.lt-ladder-title { font: 700 16px sans-serif; fill: #111111; }
.lt-ladder-symbol-label { font: bold 10px sans-serif; fill: #222222; text-anchor: middle; }
.lt-ladder-rung-handle { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 3; }
.lt-ladder-rung-grip { fill: #2563eb; }</style>
<text x="202.67499999999998" y="20" class="lt-ladder-title" text-anchor="middle">ControlLogix Lab - Tasks, Subroutines and Passed Parameters</text>
<g transform="translate(0, 30)"><line x1="60" y1="0" x2="60" y2="1065" class="lt-ladder-rail"/>
<line x1="375.34999999999997" y1="0" x2="375.34999999999997" y2="1065" class="lt-ladder-rail"/>
<text x="54" y="149" class="lt-ladder-rung-num">Rung 001</text>
<text x="70" y="80" class="lt-ladder-comment">— P_Continuous / R_Main: call R_Calc while Convert is ON (Input := Furlongs, Kroners := Output) —</text>
<text x="54" y="257" class="lt-ladder-rung-num">Rung 002</text>
<text x="70" y="188" class="lt-ladder-comment">— P_Continuous / R_Main: call R_Decr once per rising edge of Decrement (ONS one-shot) —</text>
<text x="54" y="348" class="lt-ladder-rung-num">Rung 003</text>
<text x="70" y="296" class="lt-ladder-comment">— R_Calc: input parameter pass - local DINT Input := controller tag Furlongs —</text>
<text x="54" y="455" class="lt-ladder-rung-num">Rung 004</text>
<text x="70" y="403" class="lt-ladder-comment">— R_Calc: TERM_A := Input + 2 —</text>
<text x="54" y="562" class="lt-ladder-rung-num">Rung 005</text>
<text x="70" y="510" class="lt-ladder-comment">— R_Calc: TERM_B := Input - 2 —</text>
<text x="54" y="669" class="lt-ladder-rung-num">Rung 006</text>
<text x="70" y="617" class="lt-ladder-comment">— R_Calc: Output := TERM_A x TERM_B  =&gt;  Output = (Input+2)*(Input-2) —</text>
<text x="54" y="776" class="lt-ladder-rung-num">Rung 007</text>
<text x="70" y="724" class="lt-ladder-comment">— R_Calc: return parameter pass - controller tag Kroners := local DINT Output —</text>
<text x="54" y="883" class="lt-ladder-rung-num">Rung 008</text>
<text x="70" y="831" class="lt-ladder-comment">— R_Decr (no parameters): decrement controller DINT Counts by 1000 per active call —</text>
<text x="54" y="990" class="lt-ladder-rung-num">Rung 009</text>
<text x="70" y="938" class="lt-ladder-comment">— P_Periodic / R_Main (periodic task, 10 ms): increment controller DINT Counts by 1 every scan —</text>
