<line x1="159" y1="345" x2="165" y2="345" class="lt-ladder-wire"/>
<text x="83" y="345" class="lt-ladder-pin">name=Input := Furlongs</text>
<text x="119" y="313" class="lt-ladder-tag">Input</text></g>
