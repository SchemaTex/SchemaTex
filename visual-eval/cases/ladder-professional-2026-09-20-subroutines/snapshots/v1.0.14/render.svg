<text x="229.09999999999997" y="257" class="lt-ladder-symbol-label">↑</text>
<text x="229.09999999999997" y="205" class="lt-ladder-name">One-shot - JSR</text>
<text x="229.09999999999997" y="216" class="lt-ladder-name">active only</text>
<text x="229.09999999999997" y="227" class="lt-ladder-name">once per</text>
<text x="229.09999999999997" y="238" class="lt-ladder-tag">DECR_ONS</text></g>
<g data-element="coil" data-tag="CALL_R_DECR"><path d="M 317.34999999999997 242 A 10 12 0 0 0 317.34999999999997 266" class="lt-ladder-coil"/>
<path d="M 337.34999999999997 242 A 10 12 0 0 1 337.34999999999997 266" class="lt-ladder-coil"/>
<line x1="311.34999999999997" y1="254" x2="317.34999999999997" y2="254" class="lt-ladder-wire"/>
<line x1="337.34999999999997" y1="254" x2="343.34999999999997" y2="254" class="lt-ladder-wire"/>
<text x="327.34999999999997" y="227" class="lt-ladder-name">JSR R_Decr</text>
<text x="327.34999999999997" y="238" class="lt-ladder-tag">CALL_R_DECR</text></g>
