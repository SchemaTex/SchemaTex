<text x="46" y="648.06" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b02a37">5 of 6 flows cross a trust boundary</text>
<text x="46" y="666.06" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569">Mobile Customer → Mobile App Backend   ·   Identity Service → Core Accounts Store   ·   Mobile App Backend → Core Accounts Store   ·   Mobile App Backend → Transaction Audit Log   ·   Mobile App Backend → SMS Gateway</text>
<text x="46" y="690.06" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Rectangle = external entity (S·R)  —  Circle = process (S·T·R·I·D·E)  —  Parallel lines = data store (T·R?·I·D)  —  Every data flow carries T·I·D</text>
<text x="46" y="708.06" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Trust boundaries are drawn neutral; red is reserved for the flows that cross one, which is where spoofing, tampering and disclosure bite.</text>
</svg>
