<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1182 755" width="1182" height="755" role="img">
<title>Mobile Banking STRIDE</title>
<desc>A STRIDE threat model of Mobile Banking STRIDE, drawn as a data-flow diagram over 3 trust zones: Mobile Network, Bank Edge, Core Banking. 2 external entities are drawn as rectangles, 2 processes as circles, and 2 data stores as two parallel horizontal lines with the label between them. Each element carries the STRIDE letters that apply to its kind. Of the 6 data flows, 5 cross a trust boundary — Mobile Customer to Mobile App Backend, Identity Service to Core Accounts Store, Mobile App Backend to Core Accounts Store, Mobile App Backend to Transaction Audit Log, Mobile App Backend to SMS Gateway — and those are the only ones drawn in red, because a boundary crossing is where the spoofing, tampering and disclosure threats actually bite.</desc>
