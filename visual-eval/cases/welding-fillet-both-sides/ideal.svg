 x="668" y="228" font-size="16" font-weight="400" text-anchor="end" fill="#20272B">8</text><text x="724" y="228" font-size="16" font-weight="400" text-anchor="start" fill="#20272B">100</text><text x="924" y="237" font-size="14" font-weight="400" text-anchor="start" fill="#20272B">GMAW;</text><text x="924" y="258" font-size="14" font-weight="400" text-anchor="start" fill="#20272B">WPS-18</text><text x="90" y="395" font-size="17" font-weight="600" text-anchor="start" fill="#20272B">T-joint, both sides</text><text x="90" y="420" font-size="14" font-weight="400" text-anchor="start" fill="#59636B">8 mm fillet welds on both sides; each weld is 100 mm long.</text><text x="48" y="473" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">Arrow side below the reference line · Other side above · Tail identifies the welding process / WPS.</text></svg>
