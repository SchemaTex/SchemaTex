.sx-punnett-footer-head { font: 700 13px sans-serif; fill: #111827; }
.sx-punnett-legend { font: 500 12.5px sans-serif; fill: #1f2937; dominant-baseline: central; }
.sx-punnett-geno-ratio { font: 500 12px sans-serif; fill: #374151; }
.sx-punnett-hint { font: 500 13px sans-serif; fill: #6b7280; text-anchor: middle; }</style>
