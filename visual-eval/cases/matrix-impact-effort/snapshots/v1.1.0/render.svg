<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-matrix" data-diagram-type="matrix" data-mode="quadrant" width="880" height="560" viewBox="0 0 880 560" role="graphics-document"><title>Matrix diagram</title>
<desc>Matrix diagram (impact-effort template), quadrant mode, 5 point(s)</desc>
<defs><style>.sx-matrix { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
