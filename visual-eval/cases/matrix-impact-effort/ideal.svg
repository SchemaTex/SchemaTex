<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800" role="img" aria-labelledby="title desc">
  <title id="title">University digital accessibility — next release</title>
  <desc id="desc">Impact–effort matrix with five initiatives. Fix alt-text audit is a quick win at effort 0.18 and impact 0.78. Add caption editor is a major project at 0.70 and 0.84. Improve course search is a major project at 0.63 and 0.58. Rename help links is a fill-in at 0.20 and 0.30. Rebuild discussion tool is a low-impact, high-effort task at 0.88 and 0.24.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; }
      .title { font-size:22px; font-weight:600; }
      .subtitle { font-size:13px; fill:#475569; }
      .quadrant { font-size:13px; font-weight:600; fill:#475569; }
      .action { font-size:11px; fill:#64748b; }
      .item { font-size:12px; font-weight:500; }
      .axis { font-size:12px; font-weight:600; }
      .end { font-size:11px; fill:#475569; }
      .legend-head { font-size:11px; font-weight:600; letter-spacing:.6px; fill:#475569; }
      .legend-item { font-size:12px; }
      .rule { stroke:#e2e8f0; stroke-width:1; }
      .accessibility { fill:#24618c; fill-opacity:.85; stroke:#1b4963; stroke-width:1.5; }
      .product { fill:#3f8f7a; fill-opacity:.85; stroke:#306959; stroke-width:1.5; }
      .content { fill:#c08a2e; fill-opacity:.85; stroke:#8e6522; stroke-width:1.5; }
    </style>
  </defs>
  <rect width="1060" height="800" fill="#ffffff"/>
  <text class="title" x="48" y="46">University digital accessibility — next release</text>
  <text class="subtitle" x="48" y="74">Prioritise improvements by impact and effort. Effort increases to the right; impact increases upward.</text>

  <rect x="132" y="124" width="300" height="300" fill="#E6E9ED"/>
  <rect x="432" y="124" width="300" height="300" fill="#F6F5F4"/>
  <rect x="132" y="424" width="300" height="300" fill="#F1F3F6"/>
  <rect x="432" y="424" width="300" height="300" fill="#FCFBFB"/>
  <rect x="132" y="124" width="600" height="600" fill="none" class="rule"/>
  <path d="M432 124V724 M132 424H732" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <text class="quadrant" x="148" y="152">Quick wins</text>
  <text class="action" x="148" y="167">Prioritise for the next release</text>
  <text class="quadrant" x="716" y="152" text-anchor="end">Major projects</text>
  <text class="action" x="716" y="167" text-anchor="end">Plan and invest</text>
  <text class="quadrant" x="148" y="690">Fill-ins</text>
  <text class="action" x="148" y="705">Fit in when capacity allows</text>
  <text class="quadrant" x="716" y="690" text-anchor="end">Low priority</text>
  <text class="action" x="716" y="705" text-anchor="end">Reconsider the effort</text>

  <g aria-label="Fix alt-text audit: accessibility, effort 0.18, impact 0.78">
    <circle class="accessibility" cx="240" cy="256" r="23"/>
    <text class="item" x="272" y="260">Fix alt-text audit</text>
  </g>
  <g aria-label="Add caption editor: accessibility, effort 0.70, impact 0.84">
    <circle class="accessibility" cx="552" cy="220" r="23"/>
    <text class="item" x="584" y="224">Add caption editor</text>
  </g>
  <g aria-label="Improve course search: product, effort 0.63, impact 0.58">
    <circle class="product" cx="510" cy="376" r="23"/>
    <text class="item" x="542" y="380">Improve course search</text>
  </g>
  <g aria-label="Rename help links: content, effort 0.20, impact 0.30">
    <circle class="content" cx="252" cy="544" r="23"/>
    <text class="item" x="284" y="548">Rename help links</text>
  </g>
  <g aria-label="Rebuild discussion tool: product, effort 0.88, impact 0.24">
    <circle class="product" cx="660" cy="580" r="23"/>
    <text class="item" x="628" y="584" text-anchor="end">Rebuild discussion tool</text>
  </g>

  <path d="M132 108V724H750" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <path d="M132 100L127.5 110H136.5Z M756 724L746 719.5V728.5Z" fill="#1e293b"/>
  <text class="axis" x="78" y="424" text-anchor="middle" transform="rotate(-90 78 424)">Impact</text>
  <text class="end" x="104" y="124" text-anchor="end" transform="rotate(-90 104 124)">High impact</text>
  <text class="end" x="104" y="724" transform="rotate(-90 104 724)">Low impact</text>
  <text class="end" x="132" y="750">Low effort</text>
  <text class="end" x="732" y="750" text-anchor="end">High effort</text>
  <text class="axis" x="432" y="774" text-anchor="middle">Effort</text>

  <rect x="776" y="124" width="236" height="260" rx="6" fill="#ffffff" class="rule"/>
  <text class="legend-head" x="794" y="150">CATEGORY</text>
  <circle class="accessibility" cx="801" cy="168" r="6.5"/>
  <text class="legend-item" x="814" y="172">Accessibility</text>
  <circle class="product" cx="801" cy="194" r="6.5"/>
  <text class="legend-item" x="814" y="198">Product</text>
  <circle class="content" cx="801" cy="220" r="6.5"/>
  <text class="legend-item" x="814" y="224">Content</text>
  <line x1="794" y1="252" x2="994" y2="252" class="rule"/>
  <text class="legend-head" x="794" y="280">NEXT RELEASE</text>
  <text x="794" y="302" font-size="13" font-weight="600">5 initiatives</text>
  <text class="end" x="794" y="320">across 3 categories</text>
  <text class="end" x="794" y="352">2 accessibility improvements</text>
</svg>
