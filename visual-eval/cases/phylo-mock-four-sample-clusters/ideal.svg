<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="982" viewBox="0 0 1140 700">
  <title>Four sample clusters (mock) — rectangular dendrogram with a cut at 1.5</title>
  <desc>Eight synthetic samples share an aligned leaf baseline at merge height zero. A1 and A2 merge at 0.4, B1 and B2 at 0.8, C1 and C2 at 1.0, and D1 and D2 at 1.2. All four pairs merge at height 5.0. A cut at height 1.5 identifies four clusters.</desc>
  <rect width="1140" height="700" fill="#ffffff"/>
  <style>
    text{font-family:Verdana,sans-serif;fill:#1e293b} .title{font-family:'Trebuchet MS',sans-serif;font-size:28px;font-weight:700}.subtitle{font-size:13px;fill:#64748b}.section{font-size:12px;fill:#64748b;letter-spacing:1px}.label{font-size:16px}.note{font-size:11px;fill:#64748b}.height{font-size:12px}.cluster{font-size:12px;font-weight:700}.branch{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="48" y="48" class="title">Four sample clusters (mock)</text>
  <text x="48" y="76" class="subtitle">Rectangular dendrogram · merge height and a cut at 1.5</text>
  <path d="M48 99H1092" stroke="#dbe1e9"/>
  <text x="80" y="133" class="section">MERGE HEIGHT</text>
  <text x="684" y="133" class="section">SAMPLE</text>
  <text x="967" y="133" class="section">CLUSTER</text>
  <!-- Linear merge-height scale: x = 630 - 110h. All leaves lie at h = 0. -->
  <g fill-opacity="0.045">
    <rect x="668" y="148" width="424" height="88" rx="3" fill="#0f766e"/>
    <rect x="668" y="268" width="424" height="88" rx="3" fill="#2563eb"/>
    <rect x="668" y="388" width="424" height="88" rx="3" fill="#a16207"/>
    <rect x="668" y="508" width="424" height="88" rx="3" fill="#64748b"/>
  </g>
  <path d="M630 148V596" stroke="#cbd5e1" stroke-width="1"/>
  <g stroke="#b6c3d6" stroke-width="1" stroke-dasharray="2.5 4.5">
    <path d="M630 170H671M630 214H671M630 290H671M630 334H671M630 410H671M630 454H671M630 530H671M630 574H671"/>
  </g>
  <g class="branch" stroke="#1e293b">
    <path d="M80 192V552M80 192H586M80 312H542M80 432H520M80 552H498"/>
  </g>
  <g class="branch">
    <path d="M630 170H586V214H630" stroke="#0f766e"/>
