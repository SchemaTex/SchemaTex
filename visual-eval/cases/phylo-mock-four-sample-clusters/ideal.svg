    <text x="578" y="183" style="fill:#0f766e">0.4</text>
    <text x="534" y="303" style="fill:#2563eb">0.8</text>
    <text x="512" y="423" style="fill:#a16207">1.0</text>
    <text x="490" y="543" style="fill:#64748b">1.2</text>
    <text x="72" y="183">5.0</text>
  </g>
  <path d="M465 150V615" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 5"/>
  <text x="454" y="145" text-anchor="end" class="height" style="fill:#64748b">cut 1.5</text>
  <g class="label">
    <text x="684" y="175">A1</text><text x="684" y="219">A2</text>
    <text x="684" y="295">B1</text><text x="684" y="339">B2</text>
    <text x="684" y="415">C1</text><text x="684" y="459">C2</text>
    <text x="684" y="535">D1</text><text x="684" y="579">D2</text>
  </g>
  <g fill="none" stroke-width="1.4">
    <path d="M945 158H952V226H945" stroke="#0f766e"/>
    <path d="M945 278H952V346H945" stroke="#2563eb"/>
    <path d="M945 398H952V466H945" stroke="#a16207"/>
    <path d="M945 518H952V586H945" stroke="#64748b"/>
