  <text x="355" y="657" text-anchor="middle" class="note">cluster distance</text>
  <text x="684" y="620" class="note">Cut at 1.5: four clusters, two samples each.</text>
  <text x="684" y="643" class="note">Leaves align at 0; node values show merge height.</text>
  <path d="M48 668H1092" stroke="#dbe1e9"/>
  <text x="48" y="689" class="note">Mock dataset · synthetic samples and authored merge heights, not empirical data or an inferred analysis.</text>
