<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 879 1114" width="879" height="1114" role="img">
<title>Industrial 11 kV Customer Substation</title>
<desc>The 11 kV utility incomer runs through the 52-HV vacuum circuit breaker, the protection current transformers and the revenue meter into the 2500 kVA Dyn11 transformer. The overcurrent and earth-fault relay sits off to the side and trips the breaker over a dashed control link rather than a power conductor. On the low-voltage side the 4000 A main air circuit breaker feeds the 415 V main switchboard, which serves MCC-1 — and through it a 315 kW process motor — and the plant distribution board.</desc>
