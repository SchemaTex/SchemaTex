<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2520 690" width="2520" height="690">
<title>Bridge Construction — precedence network in days</title>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
 <marker id="critical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b83b30"/></marker>
 <style>
 text{font-family:Helvetica,Arial,sans-serif;fill:#172b3a} .name{font-size:18px;font-weight:600} .meta{font-size:15px;fill:#596977} .code{font-size:14px;font-weight:700;letter-spacing:1px} .node{fill:#fff;stroke:#9aa7b2;stroke-width:2} .cp{fill:#fff7f4;stroke:#b83b30;stroke-width:2.5} .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)} .hot{fill:none;stroke:#b83b30;stroke-width:3;marker-end:url(#critical)}
 </style>
</defs>
<rect width="2520" height="690" fill="white"/>
<text x="50" y="62" font-size="34" font-weight="700">Bridge Construction</text>
<text x="50" y="96" font-size="17" fill="#596977">PRECEDENCE NETWORK · DAYS · LEFT TO RIGHT</text>
<path d="M1990 66H2048" class="hot"/><text x="2064" y="72" font-size="17">Critical path · 98 days</text>
<!-- Connections are routed before nodes, with separate arrivals at each merge. -->
<path d="M210 300H235V225H270" class="hot"/>
<path d="M210 300H235V415H270" class="edge"/>
<path d="M130 360V570H790" class="edge"/>
<path d="M470 225H510" class="hot"/>
<path d="M470 415H490V260H510" class="edge"/>
<path d="M710 225H750" class="hot"/>
<path d="M930 225H970" class="hot"/>
<path d="M1190 225H1230" class="hot"/>
<path d="M1010 570H1210V260H1230" class="edge"/>
<path d="M1410 225H1450" class="hot"/>
<path d="M1630 225H1670" class="hot"/>
<path d="M1870 225H1910" class="hot"/>
<path d="M2090 225H2130" class="hot"/>
<path d="M2280 225H2320" class="hot"/>
<!-- A milestone -->
<polygon points="130,240 210,300 130,360 50,300" class="cp"/>
<text x="130" y="288" text-anchor="middle" class="code">A</text>
<text x="130" y="310" text-anchor="middle" font-size="16" font-weight="700">START</text>
<text x="130" y="391" text-anchor="middle" class="name">Notice to proceed</text>
<text x="130" y="415" text-anchor="middle" class="meta">Milestone · day 0</text>
<!-- B -->
<rect x="270" y="165" width="200" height="120" rx="3" class="cp"/>
<text x="286" y="190" class="code">B</text>
<text x="286" y="215" class="name">Survey and</text><text x="286" y="237" class="name">setting out</text>
<text x="286" y="266" class="meta">8 days · engineering</text>
<!-- C -->
<rect x="270" y="355" width="200" height="120" rx="3" class="node"/>
<text x="286" y="380" class="code">C</text>
<text x="286" y="405" class="name">Environmental</text><text x="286" y="427" class="name">controls</text>
<text x="286" y="456" class="meta">6 days · compliance</text>
<!-- D -->
<rect x="510" y="165" width="200" height="120" rx="3" class="cp"/>
<text x="526" y="190" class="code">D</text>
<text x="526" y="215" class="name">Excavate</text><text x="526" y="237" class="name">foundations</text>
<text x="526" y="266" class="meta">12 days · civil</text>
<!-- E -->
<rect x="750" y="165" width="180" height="120" rx="3" class="cp"/>
<text x="766" y="190" class="code">E</text>
<text x="766" y="215" class="name">Pour</text><text x="766" y="237" class="name">foundations</text>
<text x="766" y="266" class="meta">10 days · civil</text>
<!-- F -->
<rect x="970" y="165" width="220" height="120" rx="3" class="cp"/>
<text x="986" y="190" class="code">F</text>
<text x="986" y="215" class="name">Build piers and</text><text x="986" y="237" class="name">abutments</text>
<text x="986" y="266" class="meta">18 days · civil</text>
<!-- G parallel fabrication -->
<rect x="790" y="510" width="220" height="120" rx="3" class="node"/>
<text x="806" y="535" class="code">G</text>
<text x="806" y="566" class="name">Fabricate girders</text>
<text x="806" y="610" class="meta">20 days · steel</text>
<!-- H -->
<rect x="1230" y="165" width="180" height="120" rx="3" class="cp"/>
<text x="1246" y="190" class="code">H</text>
<text x="1246" y="226" class="name">Erect girders</text>
<text x="1246" y="266" class="meta">8 days · steel</text>
<!-- I -->
<rect x="1450" y="165" width="180" height="120" rx="3" class="cp"/>
<text x="1466" y="190" class="code">I</text>
<text x="1466" y="215" class="name">Cast bridge</text><text x="1466" y="237" class="name">deck</text>
<text x="1466" y="266" class="meta">14 days · civil</text>
<!-- J -->
<rect x="1670" y="165" width="200" height="120" rx="3" class="cp"/>
<text x="1686" y="190" class="code">J</text>
<text x="1686" y="215" class="name">Install barriers</text><text x="1686" y="237" class="name">and drainage</text>
<text x="1686" y="266" class="meta">8 days · finishes</text>
<!-- K -->
<rect x="1910" y="165" width="180" height="120" rx="3" class="cp"/>
<text x="1926" y="190" class="code">K</text>
<text x="1926" y="215" class="name">Pave</text><text x="1926" y="237" class="name">approaches</text>
<text x="1926" y="266" class="meta">7 days · finishes</text>
<!-- L -->
<rect x="2130" y="165" width="150" height="120" rx="3" class="cp"/>
<text x="2146" y="190" class="code">L</text>
<text x="2146" y="226" class="name">Load test</text>
<text x="2146" y="266" class="meta">3 days · quality</text>
<!-- M milestone -->
<polygon points="2400,165 2480,225 2400,285 2320,225" class="cp"/>
<text x="2400" y="213" text-anchor="middle" class="code">M</text>
<text x="2400" y="237" text-anchor="middle" font-size="16" font-weight="700">FINISH</text>
<text x="2400" y="320" text-anchor="middle" class="name">Open to traffic</text>
<text x="2400" y="345" text-anchor="middle" class="meta">Milestone · day 98</text>
</svg>
