<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060">
  <title>Total aircraft hydraulic failure — fault tree</title>
  <rect width="1800" height="1060" fill="white"/>
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, sans-serif; fill: #172b3a; text-anchor: middle; }
      .event { fill: #fff; stroke: #263e4d; stroke-width: 2; }
      .gate { fill: #edf3f6; stroke: #263e4d; stroke-width: 2.2; }
      .wire { fill: none; stroke: #263e4d; stroke-width: 2.2; stroke-linejoin: round; }
      .label { font-size: 20px; }
      .basic { font-size: 18px; }
      .prob { font-size: 18px; fill: #405b6c; }
      .glabel { font-size: 19px; font-weight: 700; }
    </style>
  </defs>
  <text x="900" y="45" font-size="30" font-weight="700">Total aircraft hydraulic failure</text>
  <text x="900" y="76" font-size="17" fill="#405b6c">FAULT TREE · Combined supply loss and voting-control loss</text>

  <!-- Top event and conventional flat-bottom AND gate -->
  <rect class="event" x="665" y="108" width="470" height="68" rx="3"/>
  <text class="label" x="900" y="137">Total hydraulic actuation</text>
  <text class="label" x="900" y="162">unavailable</text>
  <path class="wire" d="M900 176 V195"/>
  <path class="gate" d="M866 263 V229 A34 34 0 0 1 68 0 V263 Z"/>
  <text class="glabel" x="900" y="246">AND</text>
  <path class="wire" d="M900 263 V290 M555 320 V290 H1420 V320"/>

  <!-- Two required intermediate events -->
  <rect class="event" x="305" y="320" width="500" height="70" rx="3"/>
  <text class="label" x="555" y="350">All independent hydraulic</text>
  <text class="label" x="555" y="376">systems lost</text>
  <path class="wire" d="M555 390 V414"/>
  <path class="gate" d="M521 482 V448 A34 34 0 0 1 68 0 V482 Z"/>
  <text class="glabel" x="555" y="465">AND</text>
  <path class="wire" d="M555 482 V515 M195 550 V515 H915 V550 M555 515 V550"/>

  <rect class="event" x="1190" y="320" width="460" height="70" rx="3"/>
  <text class="label" x="1420" y="350">Two of three actuator-control</text>
  <text class="label" x="1420" y="376">channels fail</text>
  <path class="wire" d="M1420 390 V414"/>
  <rect class="gate" x="1376" y="414" width="88" height="68" rx="3"/>
  <text x="1420" y="444" font-size="25" font-weight="700">2/3</text>
  <text x="1420" y="466" font-size="14">VOTING</text>
  <path class="wire" d="M1420 482 V730 M1200 784 V730 H1640 V784 M1420 730 V784"/>

  <!-- Hydraulic system A -->
  <rect class="event" x="65" y="550" width="260" height="65" rx="3"/>
  <text class="label" x="195" y="577">Hydraulic system A</text>
  <text class="label" x="195" y="601">lost</text>
  <path class="wire" d="M195 615 V643"/>
  <path class="gate" d="M195 643 Q230 662 233 711 Q195 697 157 711 Q160 662 195 643 Z"/>
  <text class="glabel" x="195" y="690">OR</text>
  <path class="wire" d="M195 704 V746 M105 784 V746 H285 V784"/>

  <!-- Hydraulic system B -->
  <rect class="event" x="425" y="550" width="260" height="65" rx="3"/>
  <text class="label" x="555" y="577">Hydraulic system B</text>
  <text class="label" x="555" y="601">lost</text>
  <path class="wire" d="M555 615 V643"/>
  <path class="gate" d="M555 643 Q590 662 593 711 Q555 697 517 711 Q520 662 555 643 Z"/>
  <text class="glabel" x="555" y="690">OR</text>
  <path class="wire" d="M555 704 V746 M465 784 V746 H645 V784"/>

  <!-- Hydraulic system C -->
  <rect class="event" x="785" y="550" width="260" height="65" rx="3"/>
  <text class="label" x="915" y="577">Hydraulic system C</text>
  <text class="label" x="915" y="601">lost</text>
  <path class="wire" d="M915 615 V643"/>
  <path class="gate" d="M915 643 Q950 662 953 711 Q915 697 877 711 Q880 662 915 643 Z"/>
  <text class="glabel" x="915" y="690">OR</text>
  <path class="wire" d="M915 704 V746 M825 784 V746 H1005 V784"/>

  <!-- Basic events, represented by circles -->
  <g class="event">
    <circle cx="105" cy="808" r="24"/><circle cx="285" cy="808" r="24"/>
    <circle cx="465" cy="808" r="24"/><circle cx="645" cy="808" r="24"/>
    <circle cx="825" cy="808" r="24"/><circle cx="1005" cy="808" r="24"/>
    <circle cx="1200" cy="808" r="24"/><circle cx="1420" cy="808" r="24"/><circle cx="1640" cy="808" r="24"/>
  </g>
  <g class="basic">
    <text x="105" y="864"><tspan x="105">Engine-driven</tspan><tspan x="105" dy="24">pump A fails</tspan></text>
    <text x="285" y="864"><tspan x="285">System A</tspan><tspan x="285" dy="24">reservoir leak</tspan></text>
    <text x="465" y="864"><tspan x="465">Engine-driven</tspan><tspan x="465" dy="24">pump B fails</tspan></text>
    <text x="645" y="864"><tspan x="645">System B</tspan><tspan x="645" dy="24">reservoir leak</tspan></text>
    <text x="825" y="864"><tspan x="825">Electric</tspan><tspan x="825" dy="24">pump C fails</tspan></text>
    <text x="1005" y="864"><tspan x="1005">System C</tspan><tspan x="1005" dy="24">reservoir leak</tspan></text>
    <text x="1200" y="864"><tspan x="1200">Control channel</tspan><tspan x="1200" dy="24">A fails</tspan></text>
    <text x="1420" y="864"><tspan x="1420">Control channel</tspan><tspan x="1420" dy="24">B fails</tspan></text>
    <text x="1640" y="864"><tspan x="1640">Control channel</tspan><tspan x="1640" dy="24">C fails</tspan></text>
  </g>
  <g class="prob">
    <text x="105" y="922">p = 0.003</text><text x="285" y="922">p = 0.001</text>
    <text x="465" y="922">p = 0.003</text><text x="645" y="922">p = 0.001</text>
    <text x="825" y="922">p = 0.004</text><text x="1005" y="922">p = 0.001</text>
    <text x="1200" y="922">p = 0.002</text><text x="1420" y="922">p = 0.002</text><text x="1640" y="922">p = 0.002</text>
  </g>
  <path d="M55 968 H1745" stroke="#ccd6dc"/>
  <text x="900" y="999" font-size="17">AND: all inputs required   ·   OR: any input sufficient   ·   2/3: at least two inputs required   ·   ○ Basic event</text>
  <text x="900" y="1030" font-size="16" fill="#405b6c">Assumptions: hydraulic systems are physically independent; voting-channel failures are independent.</text>
</svg>
