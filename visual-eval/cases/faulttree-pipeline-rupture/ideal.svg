<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1022" viewBox="0 0 1490 1022" role="img" font-family="Helvetica Neue, Helvetica, sans-serif"><title>Pipeline rupture</title><desc>Independent reference drawing following the current exemplar. Top-down failure logic · basic-event probabilities assumed independent</desc><rect width="1490" height="1022" fill="white"/><text x="40" y="45" font-size="25" fill="#0f172a" text-anchor="start" font-weight="600">Pipeline rupture</text><text x="40" y="73" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Top-down failure logic · basic-event probabilities assumed independent</text><text x="1450" y="107" font-size="18" fill="#2563eb" text-anchor="end" font-weight="600">P(top) = 5.293893e-03  · exact</text><rect x="620.0" y="150" width="250" height="70" rx="7" fill="#eef2f7" stroke="#1e293b" stroke-width="2.5"/><text x="745.0" y="188.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">Full-bore pipeline rupture</text><path d="M745.0 220V244" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M710.0 296Q714.0 257 745.0 244Q776.0 257 780.0 296Q745.0 279 710.0 296Z" stroke="#059669" stroke-width="2" fill="#dcfce7" /><text x="745.0" y="275" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">OR</text><path d="M745.0 287V355 M310.0 355H1325.0" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M310.0 355V410" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M890.0 355V410" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M1325.0 355V410" stroke="#334155" stroke-width="1.8" fill="none" /><rect x="185.0" y="410" width="250" height="70" rx="7" fill="#eef2f7" stroke="#334155" stroke-width="1.7"/><text x="310.0" y="437.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">Stress exceeds pipe</text><text x="310.0" y="459.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">capacity</text><path d="M310.0 480V504" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M278.0 556V534A32 30 0 0 1 342.0 534V556Z" stroke="#059669" stroke-width="2" fill="#dcfce7" /><text x="310.0" y="535" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">AND</text><path d="M310.0 557V615 M165.0 615H455.0" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M165.0 615V670" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M455.0 615V670" stroke="#334155" stroke-width="1.8" fill="none" /><circle cx="165.0" cy="702" r="32" fill="white" stroke="#334155" stroke-width="2"/><text x="165.0" y="708" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">B1</text><text x="165.0" y="754.5" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">Pressure-control failure</text><text x="165.0" y="775.5" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">causes overpressure</text><text x="165.0" y="809" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">p = 0.002</text><circle cx="455.0" cy="702" r="32" fill="white" stroke="#334155" stroke-width="2"/><text x="455.0" y="708" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">B2</text><text x="455.0" y="765.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">Low toughness pipe material</text><text x="455.0" y="809" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">p = 0.001</text><rect x="765.0" y="410" width="250" height="70" rx="7" fill="#eef2f7" stroke="#334155" stroke-width="1.7"/><text x="890.0" y="448.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">Critical defect present</text><path d="M890.0 480V504" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M855.0 556Q859.0 517 890.0 504Q921.0 517 925.0 556Q890.0 539 855.0 556Z" stroke="#059669" stroke-width="2" fill="#dcfce7" /><text x="890.0" y="535" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">OR</text><path d="M890.0 547V615 M745.0 615H1035.0" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M745.0 615V670" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M1035.0 615V670" stroke="#334155" stroke-width="1.8" fill="none" /><circle cx="745.0" cy="702" r="32" fill="white" stroke="#334155" stroke-width="2"/><text x="745.0" y="708" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">B3</text><text x="745.0" y="754.5" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">External corrosion</text><text x="745.0" y="775.5" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">penetrates wall</text><text x="745.0" y="809" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">p = 0.003</text><circle cx="1035.0" cy="702" r="32" fill="white" stroke="#334155" stroke-width="2"/><text x="1035.0" y="708" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">B4</text><text x="1035.0" y="765.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">Undetected girth-weld defect</text><text x="1035.0" y="809" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">p = 0.0008</text><circle cx="1325.0" cy="442" r="32" fill="white" stroke="#334155" stroke-width="2"/><text x="1325.0" y="448" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">B5</text><text x="1325.0" y="505.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">Excavator strikes pipeline</text><text x="1325.0" y="549" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="400">p = 0.0015</text><text x="40" y="880" font-size="15" fill="#c62828" text-anchor="start" font-weight="600">Minimal cut sets</text><text x="230" y="880" font-size="14" fill="#c62828" text-anchor="start" font-weight="400">{ B3 }</text><text x="230" y="903" font-size="14" fill="#c62828" text-anchor="start" font-weight="400">{ B5 }</text><text x="230" y="926" font-size="14" fill="#c62828" text-anchor="start" font-weight="400">{ B4 }</text><text x="230" y="949" font-size="14" fill="#c62828" text-anchor="start" font-weight="400">{ B2, B1 }</text><text x="40" y="1000" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">Basic-event IDs B1…Bn are local reference labels; event descriptions preserve source meaning.</text></svg>