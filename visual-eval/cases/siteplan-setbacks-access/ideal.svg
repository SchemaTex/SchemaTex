<svg xmlns="http://www.w3.org/2000/svg" width="1538" height="1600" viewBox="0 0 1538 1600">
<title>Parcel Setbacks and Access — Site Plan</title>
<defs>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1F2328;font-size:16px} .title{font-size:30px;font-weight:700}.subtitle{font-size:18px;fill:#727D8B}.section{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#727D8B}.th{font-size:13px;font-weight:700;letter-spacing:1px;fill:#727D8B}.note{font-size:15px;fill:#727D8B}.annotation{font-size:15px;fill:#55606C}.name{font-size:19px;font-weight:700;letter-spacing:1px}.rule{stroke:#A3ABB4;stroke-width:1}.dim{stroke:#A3ABB4;stroke-width:1.2;fill:none}.tick{stroke:#1F2328;stroke-width:2}.setback{stroke:#55606C;stroke-width:1.7;stroke-dasharray:13 7;fill:none}.paving{fill:#EDEFF2;stroke:#55606C;stroke-width:1.5}
</style>
</defs>
<rect width="1538" height="1600" fill="#FFFFFF"/>
<text x="61" y="77" class="title">Parcel Setbacks and Access — Site Plan</text>
<text x="61" y="111" class="subtitle">30 × 40 m parcel · 1,200 m² lot · building, setbacks and access · dimensions in metres</text>
<path d="M61 135H1477" class="rule"/>
<!-- All plan coordinates use 20 drawing units per metre. Rear is sheet-up. -->
<!-- Street: centreline y=45 m, width 6 m. -->
<path d="M70 1200H870V1320H70Z" fill="#EDEFF2"/>
<path d="M70 1200H870M70 1320H870" stroke="#55606C" stroke-width="1.7"/>
<path d="M70 1260H400M540 1260H870" stroke="#A3ABB4" stroke-width="1.2" stroke-dasharray="28 8 6 8"/>
<text x="470" y="1266" text-anchor="middle" class="name">STREET</text>
<!-- Access surfaces extend continuously to street centreline, meeting the building wall. -->
<path d="M540 920H600V1260H540Z" class="paving"/>
<path d="M378 920H402V1260H378Z" class="paving"/>
<!-- Closed parcel: continuous heavier boundary is intentional. -->
<rect x="170" y="360" width="600" height="800" fill="none" stroke="#1F2328" stroke-width="3.5"/>
<!-- Four separately identified setback lines, above paving at crossings. -->
<path d="M270 480H670" class="setback"/>
<path d="M270 1000H670" class="setback"/>
<path d="M270 480V1000" class="setback"/>
<path d="M670 480V1000" class="setback"/>
<text x="470" y="459" text-anchor="middle" class="annotation">Rear setback 6 m</text>
<text x="470" y="1031" text-anchor="middle" class="annotation" style="font-size:14px">Front setback 8 m</text>
<text x="247" y="682" transform="rotate(-90 247 682)" text-anchor="middle" class="annotation">West setback 5 m</text>
<text x="696" y="739" transform="rotate(-90 696 739)" text-anchor="middle" class="annotation">East setback 5 m</text>
<!-- Building: 8,10 to 22,28; all setbacks have positive clearance. -->
<rect x="330" y="560" width="280" height="360" fill="#D5DAE0" stroke="#1F2328" stroke-width="2.8"/>
<text x="470" y="735" text-anchor="middle" class="name">BUILDING</text>
<text x="470" y="761" text-anchor="middle" class="subtitle" style="font-size:16px">14 × 18 m · 252 m²</text>
<!-- Entrance at 11,28: 0.8 m marker centered on the building wall. -->
<rect x="382" y="912" width="16" height="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
<path d="M385 915L390 920L395 915" fill="none" stroke="#1F2328" stroke-width="1.5"/>
<!-- Callout label at 2,24 with orthogonal leader to the actual entrance. -->
<text x="210" y="840" class="annotation">Entrance</text>
<path d="M210 849V944H390V929" fill="none" stroke="#55606C" stroke-width="1.3"/>
<path d="M386 935L390 929L394 935" fill="none" stroke="#55606C" stroke-width="1.3"/>
<text x="571" y="1100" transform="rotate(-90 571 1100)" text-anchor="middle" class="annotation">DRIVEWAY · 3 m</text>
<text x="359" y="1090" transform="rotate(-90 359 1090)" text-anchor="middle" class="annotation">Pedestrian path · 1.2 m</text>
<!-- Overall dimensions terminate at extensions from parcel corners only. -->
<path d="M170 353V289M770 353V289M170 305H770" class="dim"/>
<path d="M163 312L177 298M763 312L777 298" class="tick"/>
<text x="470" y="286" text-anchor="middle">30 m parcel width</text>
<path d="M163 360H111M163 1160H111M124 360V1160" class="dim"/>
<path d="M117 367L131 353M117 1167L131 1153" class="tick"/>
<text x="105" y="760" transform="rotate(-90 105 760)" text-anchor="middle">40 m parcel depth</text>
<!-- Right-side tables follow the exemplar's typography and rule hierarchy. -->
<text x="861" y="216" class="section">SITE DATA</text>
<text x="861" y="247">Lot area 1,200 m² · 30.00 m × 40.00 m</text>
<text x="861" y="284" class="th">SURFACE (M²)</text><text x="1370" y="284" text-anchor="end" class="th">AREA</text><text x="1477" y="284" text-anchor="end" class="th">% OF LOT</text>
<path d="M861 294H1477" stroke="#55606C" stroke-width="1.2"/>
<text x="861" y="324">Building</text><text x="1370" y="324" text-anchor="end">252</text><text x="1477" y="324" text-anchor="end">21.0%</text>
<path d="M861 342H1477" class="rule"/>
<text x="861" y="372">Driveway within parcel</text><text x="1370" y="372" text-anchor="end">36</text><text x="1477" y="372" text-anchor="end">3.0%</text>
<text x="861" y="402">Pedestrian path within parcel</text><text x="1370" y="402" text-anchor="end">14.4</text><text x="1477" y="402" text-anchor="end">1.2%</text>
<path d="M861 420H1477" class="rule"/>
<text x="861" y="449" font-weight="700">Building and access</text><text x="1370" y="449" text-anchor="end" font-weight="700">302.4</text><text x="1477" y="449" text-anchor="end" font-weight="700">25.2%</text>
<text x="861" y="479">Remaining parcel area</text><text x="1370" y="479" text-anchor="end">897.6</text><text x="1477" y="479" text-anchor="end">74.8%</text>
<text x="861" y="511" class="note">Access surfaces beyond the property boundary are not counted.</text>
<text x="861" y="668" class="section">SETBACKS (M)</text>
<text x="861" y="702" class="th">LOT LINE</text><text x="1200" y="702" text-anchor="end" class="th">REQUIRED</text><text x="1477" y="702" text-anchor="end" class="th">BUILDING</text>
<path d="M861 713H1477" stroke="#55606C" stroke-width="1.2"/>
<text x="861" y="742">Front</text><text x="1200" y="742" text-anchor="end">8</text><text x="1477" y="742" text-anchor="end">12</text>
<text x="861" y="772">Rear</text><text x="1200" y="772" text-anchor="end">6</text><text x="1477" y="772" text-anchor="end">10</text>
<text x="861" y="802">Side (west)</text><text x="1200" y="802" text-anchor="end">5</text><text x="1477" y="802" text-anchor="end">8</text>
<text x="861" y="832">Side (east)</text><text x="1200" y="832" text-anchor="end">5</text><text x="1477" y="832" text-anchor="end">8</text>
<path d="M861 846H1477" class="rule"/>
<text x="861" y="879" class="note">Measured square to each lot line from the nearest wall.</text>
<text x="861" y="954" class="section">LEGEND</text>
<path d="M861 988H929" stroke="#1F2328" stroke-width="3.5"/><text x="947" y="994">Property line</text>
<path d="M861 1022H929" class="setback"/><text x="947" y="1028">Setback line</text>
<rect x="871" y="1047" width="49" height="22" fill="#D5DAE0" stroke="#1F2328" stroke-width="2.5"/><text x="947" y="1063">Building</text>
<rect x="1186" y="977" width="49" height="22" class="paving"/><text x="1263" y="994">Access paving</text>
<path d="M1186 1022H1235" class="dim"/><path d="M1182 1027L1190 1017M1231 1027L1239 1017" class="tick"/><text x="1263" y="1028">Dimension</text>
<rect x="1203" y="1049" width="16" height="16" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/><path d="M1206 1052L1211 1057L1216 1052" fill="none" stroke="#1F2328" stroke-width="1.5"/><text x="1263" y="1063">Entrance</text>
<!-- Graphic scale: each 100-unit segment equals 5 metres at the plan scale. -->
<g transform="translate(861 1493)">
<text x="0" y="-9" text-anchor="middle" class="note">0</text><text x="100" y="-9" text-anchor="middle" class="note">5</text><text x="200" y="-9" text-anchor="middle" class="note">10</text><text x="300" y="-9" text-anchor="middle" class="note">15</text><text x="400" y="-9" text-anchor="middle" class="note">20</text>
<path d="M0 0H400V9H0Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="1"/><path d="M0 0H100V9H0ZM200 0H300V9H200Z" fill="#1F2328"/>
<text x="418" y="9" class="note">m</text><text x="0" y="37" class="section">GRAPHIC SCALE</text>
</g>
<g transform="translate(1443 1496)">
<text x="0" y="-36" text-anchor="middle" font-size="18" font-weight="700">N</text><circle r="26" fill="#FFFFFF" stroke="#A3ABB4" stroke-width="1.5"/>
<path d="M0-21L-10 13L0 7Z" fill="#1F2328"/><path d="M0-21L10 13L0 7Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
</g>
</svg>
