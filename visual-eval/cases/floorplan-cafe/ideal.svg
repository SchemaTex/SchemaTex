<title>Neighbourhood Coffee Shop — Floor Plan</title>
<desc>Architectural plan of a 10 by 10 metre coffee shop with a separate prep and wash room and customer WC. Four two-person tables, a communal table, service counters and a clear marked queue. North is up.</desc>
