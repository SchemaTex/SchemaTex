<g class="person" data-id="II-2"><circle cx="400" cy="260" r="20" fill="none" stroke="#334155" stroke-width="2"/><text x="400" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-2</text></g>
