<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 615" width="660" height="615">
<title>Y-linked inheritance family</title>
<desc>Three-generation Y-linked pedigree showing father-to-son-only transmission. Affected male I-1 is mated to unaffected female I-2; their children are affected male II-1, unaffected female II-2 and affected male II-3, so every son is affected and the daughter is not. II-1 is mated to II-4, an unaffected female who married in; their children are affected male III-1, the proband, and unaffected female III-2. Every affected individual is a solid-filled square and no female in the pedigree is affected.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="660" height="615" fill="#ffffff"/>
<rect x="22" y="513" width="239.77999999999997" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="330" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">Y-linked inheritance family</text>
<text x="26" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
<text x="26" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">II</text>
<text x="26" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">III</text>
<line x1="305" y1="90" x2="365" y2="90" stroke="#334155" stroke-width="2"/>
<line x1="335" y1="90" x2="335" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="150" y1="170" x2="520" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="150" y1="170" x2="150" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="400" y1="170" x2="400" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="520" y1="170" x2="520" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="170" y1="260" x2="230" y2="260" stroke="#334155" stroke-width="2"/>
<line x1="200" y1="260" x2="200" y2="340" stroke="#334155" stroke-width="2"/>
<line x1="140" y1="340" x2="280" y2="340" stroke="#334155" stroke-width="2"/>
