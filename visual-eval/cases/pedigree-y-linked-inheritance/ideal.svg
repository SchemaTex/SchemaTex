<g class="person" data-id="I-2"><circle cx="385" cy="90" r="20" fill="none" stroke="#334155" stroke-width="2"/><text x="385" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">I-2</text></g>
