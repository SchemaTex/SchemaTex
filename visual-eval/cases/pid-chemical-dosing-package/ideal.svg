<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="985" viewBox="0 0 1600 985">
<title>Chemical Dosing Package — pH Control and Metering Calibration</title>
<desc>Prepared chemical flows from TK-701 through AG-701, P-701, C-701, XV-701, FV-701 and NRV-701 into V-702. AT-701 reports electrically to AIC-701, which pneumatically commands the fail-closed dosing valve. FT-701 reports calibration flow electrically to FI-701.</desc>
