<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020">
<title>Warehouse CCTV Installation — PoE cameras on one subnet, recording and viewing on another</title>
<desc>A warehouse surveillance network split across two labelled addressing boundaries. The video boundary, 192.168.60.0/24, holds the two PoE access switches and four cameras drawn as three distinguishable types: two ceiling domes, a bullet and a pan-tilt-zoom. Every camera drop is a green PoE link carrying its own cable type. The recording boundary, 192.168.50.0/24, holds the NVR, which feeds the video storage array over fiber and drives both a guard desk monitor and a guard workstation over copper. A security firewall and the security core switch above the two boundaries form the hierarchy into them.</desc>
