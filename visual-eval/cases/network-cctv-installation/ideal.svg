.wire{fill:none;stroke:#536979;stroke-width:3;stroke-linejoin:round}
.fiber{fill:none;stroke:#087d92;stroke-width:5;stroke-linejoin:round}
.poe{fill:none;stroke:#2f7d4f;stroke-width:3.5;stroke-linejoin:round}
.wan{fill:none;stroke:#304b60;stroke-width:4;stroke-linejoin:round}
.wireless{fill:none;stroke:#536979;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}
.oob{fill:none;stroke:#9aa9b4;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:9 6}
.vpn{fill:none;stroke:#6b3fa0;stroke-width:4;stroke-linejoin:round;stroke-dasharray:15 9}
.knock{stroke:none}
</style>
