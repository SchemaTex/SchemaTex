<g id="ap"><rect class="device" x="-30" y="0" width="60" height="20" rx="6"/><circle cx="0" cy="10" r="3" fill="#087d92"/><path d="M-14 -6a20 20 0 0 1 28 0 M-26 -18a37 37 0 0 1 52 0" fill="none" stroke="#304b60" stroke-width="2.5" stroke-linecap="round"/></g>
