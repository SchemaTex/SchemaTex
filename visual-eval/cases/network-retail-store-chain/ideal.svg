<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1160" viewBox="0 0 1520 1160">
<title>Retail Store Chain Network — Three stores on managed SD-WAN into one central service hub</title>
<desc>A retail chain drawn from the managed SD-WAN cloud at the top. The HQ security gateway and the retail service hub hang to the left of the cloud on an MPLS link; the north, south and west store routers hang below it on separate SD-WAN links. The north store is expanded to show its POS switch trunking three VLANs down to a POS terminal, a manager laptop and a guest Wi-Fi access point, each wearing a chip naming its VLAN, so payment, management and guest traffic are visibly separated.</desc>
