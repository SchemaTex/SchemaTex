<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-net" role="img" aria-label="Retail store chain network" width="669.6" height="613" viewBox="0 0 669.6 613" data-diagram-type="network"><title>Network diagram — Retail store chain network</title>
<desc>10 devices, 9 links, 3 boundaries. Topology: hierarchical. Links: 4 serial, 1 fiber, 3 copper, 1 poe.</desc>
<style>.sx-net { font-family: system-ui, -apple-system, sans-serif; }
.sx-net-body { fill: #1d6fb8; stroke: #0f3a5f; stroke-width: 2; }
