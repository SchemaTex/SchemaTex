.sx-net-sublabel { font: 10px sans-serif; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.sx-net-link { fill: none; stroke-width: 2; }
.sx-net-link-wireless, .sx-net-link-vpn { stroke-dasharray: 5 4; }
.sx-net-link-lag { stroke-width: 3; }
.sx-net-linklabel { font: 9px sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.sx-net-port { font: 8px sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 2.5px; stroke-linejoin: round; }
.sx-net-boundary-site { fill: none; stroke: #334155; stroke-width: 1.5; }
.sx-net-boundary-rack { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 1 2; }
.sx-net-boundary-subnet, .sx-net-boundary-vlan { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; stroke-dasharray: 5 3; }
.sx-net-boundary-zone, .sx-net-boundary-dmz { fill: none; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 3; }
.sx-net-boundary-label { font: 600 10px sans-serif; }
.sx-net-title { font: 700 16px sans-serif; fill: #0f172a; }</style>
