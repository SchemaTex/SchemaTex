<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title">
  <title id="title">Youth innovation grant eligibility</title>
  <rect width="1200" height="1000" fill="#ffffff"/>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, sans-serif; fill: #192b3b; text-anchor: middle; }
    .heading { font-size: 32px; font-weight: 700; }
    .label { font-size: 26px; font-weight: 700; }
    .explanation { font-size: 21px; }
  </style>
  <text class="heading" x="600" y="64">Youth innovation grant eligibility</text>
  <g stroke-width="3">
    <circle cx="430" cy="405" r="285" fill="#2b78b5" fill-opacity="0.12" stroke="#286a9b"/>
    <circle cx="770" cy="405" r="285" fill="#d99b26" fill-opacity="0.12" stroke="#a77416"/>
    <circle cx="600" cy="655" r="285" fill="#31966b" fill-opacity="0.12" stroke="#287b58"/>
  </g>
  <text class="label" x="330" y="250">City resident</text>
  <text class="label" x="870" y="250">Age 18–30</text>
  <text class="label" x="600" y="845">Eligible project proposal</text>
  <g class="explanation">
    <text x="315" y="365"><tspan x="315">Resident outside</tspan><tspan x="315" dy="29">age range</tspan></text>
    <text x="885" y="365"><tspan x="885">Age-qualified</tspan><tspan x="885" dy="29">non-resident</tspan></text>
    <text x="600" y="748"><tspan x="600">Proposal from</tspan><tspan x="600" dy="29">outside area</tspan></text>
    <text x="600" y="288"><tspan x="600">Eligible person;</tspan><tspan x="600" dy="29">proposal needed</tspan></text>
    <text x="401" y="562"><tspan x="401">Resident project</tspan><tspan x="401" dy="29">lead; age needed</tspan></text>
    <text x="799" y="562"><tspan x="799">Young proposer;</tspan><tspan x="799" dy="29">residency needed</tspan></text>
  </g>
  <text x="600" y="476" font-size="24" font-weight="700"><tspan x="600">Eligible</tspan><tspan x="600" dy="31">to apply</tspan></text>
</svg>
