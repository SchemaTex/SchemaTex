<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="520" viewBox="0 0 1528 520" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" role="img"><title>Embedded Telemetry Node</title><desc>Eight devices. The 3.3 V rail supplies MCU, both sensors and radio. Two sensors share I2C to MCU. MCU drives SPI flash and LoRa radio; radio feeds antenna. Power, I2C and SPI are named connections, not devices.</desc><defs><marker id="data" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#16202B"/></marker><marker id="power" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#C2410C"/></marker></defs><rect width="1528" height="520" fill="white"/><rect x="28" y="250" width="408" height="118" rx="10" fill="#FFF8F1" stroke="#FBD9B8"/>
