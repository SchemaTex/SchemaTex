<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-bd" viewBox="0 0 2179 290" width="2179" height="290" role="img" data-diagram-type="blockdiagram"><title>Embedded Telemetry Node</title>
<desc>Block diagram with 8 blocks, 0 summing junctions, 10 signals</desc>
<defs><style>.schematex-bd { font-family: "Inter", "Helvetica Neue", Helvetica, sans-serif; }
