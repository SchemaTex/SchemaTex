<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <title>Patient Referral</title>
  <defs>
    <marker id="sequence" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#253447"/></marker>
    <marker id="message" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#253447" stroke-width="1.5"/></marker>
    <g id="user"><circle cx="0" cy="-5" r="3.5"/><path d="M-6 6 V2 Q-6 -1 0 -1 Q6 -1 6 2 V6 Z"/></g>
    <g id="envelope"><rect x="-9" y="-6" width="18" height="12" fill="white"/><path d="M-9 -6 L0 1 L9 -6" fill="none"/></g>
  </defs>
  <rect width="1500" height="760" fill="white"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#253447">
    <text x="750" y="58" font-size="30" font-weight="600" text-anchor="middle">Patient Referral</text>
    <!-- Independent participants with one named lane each. -->
    <g fill="#fff" stroke="#253447" stroke-width="2">
      <rect x="40" y="110" width="1420" height="220"/>
      <path d="M90 110 V330 M140 110 V330"/>
      <rect x="40" y="460" width="1420" height="250"/>
      <path d="M90 460 V710 M140 460 V710"/>
    </g>
    <g font-size="20" text-anchor="middle">
      <text transform="translate(71 220) rotate(-90)" font-weight="600">Clinic</text>
      <text transform="translate(121 220) rotate(-90)">GP</text>
      <text transform="translate(71 585) rotate(-90)" font-weight="600">Specialist</text>
      <text transform="translate(121 585) rotate(-90)">Intake</text>
    </g>
    <!-- Solid sequence flows stay inside their respective pools. -->
    <g fill="none" stroke="#253447" stroke-width="2" marker-end="url(#sequence)">
      <path d="M244 220 H320"/>
      <path d="M510 220 H590"/>
      <path d="M780 220 H862"/>
      <path d="M709 585 H780"/>
      <path d="M970 585 H1012"/>
      <path d="M1088 585 H1130"/>
      <path d="M1320 585 H1376"/>
    </g>
    <!-- Clinic events and activities. -->
    <circle cx="220" cy="220" r="24" fill="white" stroke="#253447" stroke-width="2"/>
    <text x="220" y="269" font-size="18" text-anchor="middle">Referral needed</text>
    <rect x="320" y="178" width="190" height="84" rx="10" fill="#f5f8fc" stroke="#253447" stroke-width="2"/>
    <use href="#user" x="337" y="194" fill="#253447"/>
    <text x="415" y="227" font-size="19" text-anchor="middle">Prepare referral</text>
    <rect x="590" y="178" width="190" height="84" rx="10" fill="#f5f8fc" stroke="#253447" stroke-width="2"/>
    <g transform="translate(608 193)" stroke="#253447" stroke-width="1.5"><rect x="-8" y="-5" width="16" height="10" fill="#253447"/><path d="M-8 -5 L0 1 L8 -5" fill="none" stroke="white"/></g>
    <text x="685" y="227" font-size="19" text-anchor="middle">Send referral</text>
    <circle cx="888" cy="220" r="24" fill="white" stroke="#253447" stroke-width="4"/>
    <text x="888" y="269" font-size="18" text-anchor="middle">Referral sent</text>
    <!-- Specialist events and activities. -->
    <circle cx="685" cy="585" r="24" fill="white" stroke="#253447" stroke-width="2"/>
    <use href="#envelope" x="685" y="585" stroke="#253447" stroke-width="1.5"/>
    <text x="685" y="642" font-size="18" text-anchor="middle">Referral received</text>
    <rect x="780" y="543" width="190" height="84" rx="10" fill="#f5f8fc" stroke="#253447" stroke-width="2"/>
    <use href="#user" x="797" y="559" fill="#253447"/>
    <text x="875" y="592" font-size="19" text-anchor="middle">Triage referral</text>
    <!-- Event-based gateway: diamond enclosing double circle and pentagon. -->
    <path d="M1050 547 L1088 585 L1050 623 L1012 585 Z" fill="white" stroke="#253447" stroke-width="2"/>
    <g fill="none" stroke="#253447" stroke-width="1.6"><circle cx="1050" cy="585" r="19"/><circle cx="1050" cy="585" r="15.5"/><path d="M1050 573 L1061 581 L1057 594 L1043 594 L1039 581 Z"/></g>
    <text x="1050" y="653" font-size="18" text-anchor="middle"><tspan x="1050">Appointment</tspan><tspan x="1050" dy="23">response</tspan></text>
    <rect x="1130" y="543" width="190" height="84" rx="10" fill="#f5f8fc" stroke="#253447" stroke-width="2"/>
    <g transform="translate(1148 558)" stroke="#253447" stroke-width="1.5"><rect x="-8" y="-5" width="16" height="10" fill="#253447"/><path d="M-8 -5 L0 1 L8 -5" fill="none" stroke="white"/></g>
    <text x="1225" y="583" font-size="19" text-anchor="middle"><tspan x="1225">Confirm</tspan><tspan x="1225" dy="24">appointment</tspan></text>
    <circle cx="1402" cy="585" r="24" fill="white" stroke="#253447" stroke-width="4"/>
    <text x="1402" y="642" font-size="18" text-anchor="middle">Booked</text>
    <!-- Dashed inter-participant message flows with open source circles. -->
    <g fill="none" stroke="#253447" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#message)">
      <path d="M685 267 V559"/>
      <path d="M1225 538 V331"/>
    </g>
    <g fill="white" stroke="#253447" stroke-width="1.7"><circle cx="685" cy="263" r="5"/><circle cx="1225" cy="542" r="5"/></g>
    <text x="703" y="398" font-size="19">Referral</text>
    <text x="1207" y="398" font-size="19" text-anchor="end">Appointment</text>
  </g>
</svg>
