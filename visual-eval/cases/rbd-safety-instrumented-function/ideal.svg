<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <title>Safety instrumented function — reliability block diagram</title>
  <desc>Three stages in series: two parallel high-pressure sensors, a two-out-of-three logic solver group, and two parallel shutdown valves. Independent channel failures are assumed.</desc>
  <rect width="1440" height="760" fill="white"/>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, sans-serif; fill: #172b3a; }
    .title { font-size: 32px; font-weight: 700; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-size: 19px; }
    .id { font-size: 20px; font-weight: 700; }
    .note { font-size: 17px; fill: #51616b; }
    .wire { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linejoin: miter; }
    .block { fill: #eef2f7; stroke: #475569; stroke-width: 2; }
    .dot { fill: #475569; }
  </style>
  <text x="60" y="61" class="title">Safety instrumented function</text>
  <text x="60" y="95" class="note">Reliability block diagram · Sensor → logic solver → final element</text>

  <text x="275" y="155" text-anchor="middle" class="heading">SENSORS</text>
  <text x="275" y="185" text-anchor="middle" class="label">1oo2 · parallel</text>
  <text x="720" y="155" text-anchor="middle" class="heading">LOGIC SOLVERS</text>
  <text x="720" y="185" text-anchor="middle" class="label">2oo3 · voting group</text>
  <text x="1165" y="155" text-anchor="middle" class="heading">FINAL ELEMENTS</text>
  <text x="1165" y="185" text-anchor="middle" class="label">1oo2 · parallel</text>

  <!-- Series connections join the three stage ports. -->
  <path class="wire" d="M60 370H130 M420 370H500 M940 370H1020 M1310 370H1380"/>
  <circle cx="60" cy="370" r="6" fill="white" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1380" cy="370" r="6" fill="white" stroke="#475569" stroke-width="2.5"/>
  <text x="60" y="402" text-anchor="middle" class="note">IN</text>
  <text x="1380" y="402" text-anchor="middle" class="note">OUT</text>

  <!-- Sensor branches: either component supplies the stage path. -->
  <path class="wire" d="M130 370V285H155 M130 370V455H155 M395 285H420V455H395"/>
  <circle cx="130" cy="370" r="4" class="dot"/>
  <circle cx="420" cy="370" r="4" class="dot"/>
  <rect x="155" y="239" width="240" height="92" class="block"/>
  <text x="275" y="264" text-anchor="middle" class="id">PSH_A</text>
  <text x="275" y="290" text-anchor="middle" class="label">High-pressure sensor A</text>
  <text x="275" y="316" text-anchor="middle" class="label" fill="#2563eb">R = 0.985</text>
  <rect x="155" y="409" width="240" height="92" class="block"/>
  <text x="275" y="434" text-anchor="middle" class="id">PSH_B</text>
  <text x="275" y="460" text-anchor="middle" class="label">High-pressure sensor B</text>
  <text x="275" y="486" text-anchor="middle" class="label" fill="#2563eb">R = 0.985</text>

  <!-- Dashed boundary expresses the k-out-of-n subsystem, not another component. -->
  <rect x="500" y="208" width="440" height="349" rx="0" fill="#f5f8fa" stroke="#687e8c" stroke-width="1.8" stroke-dasharray="8 6"/>
  <rect x="659" y="197" width="122" height="30" fill="white"/>
  <text x="720" y="220" text-anchor="middle" class="heading">2/3</text>
  <path class="wire" d="M500 370H550 M550 270V470 M550 270H600 M550 370H600 M550 470H600 M840 270H890 M840 370H890 M840 470H890 M890 270V470 M890 370H940"/>
  <circle cx="550" cy="370" r="4" class="dot"/>
  <circle cx="890" cy="370" r="4" class="dot"/>
  <rect x="600" y="231" width="240" height="78" class="block"/>
  <text x="720" y="254" text-anchor="middle" class="id">LS_A</text>
  <text x="720" y="277" text-anchor="middle" class="label">Logic solver A</text>
  <text x="720" y="300" text-anchor="middle" class="label" fill="#2563eb">R = 0.999</text>
  <rect x="600" y="331" width="240" height="78" class="block"/>
  <text x="720" y="354" text-anchor="middle" class="id">LS_B</text>
  <text x="720" y="377" text-anchor="middle" class="label">Logic solver B</text>
  <text x="720" y="400" text-anchor="middle" class="label" fill="#2563eb">R = 0.999</text>
  <rect x="600" y="431" width="240" height="78" class="block"/>
  <text x="720" y="454" text-anchor="middle" class="id">LS_C</text>
  <text x="720" y="477" text-anchor="middle" class="label">Logic solver C</text>
  <text x="720" y="500" text-anchor="middle" class="label" fill="#2563eb">R = 0.999</text>
  <text x="720" y="539" text-anchor="middle" class="note">At least 2 of 3 must succeed</text>

  <!-- Final-element parallel branches. -->
  <path class="wire" d="M1020 370V285H1045 M1020 370V455H1045 M1285 285H1310V455H1285"/>
  <circle cx="1020" cy="370" r="4" class="dot"/>
  <circle cx="1310" cy="370" r="4" class="dot"/>
  <rect x="1045" y="239" width="240" height="92" class="block"/>
  <text x="1165" y="264" text-anchor="middle" class="id">SDV_A</text>
  <text x="1165" y="290" text-anchor="middle" class="label">Shutdown valve A</text>
  <text x="1165" y="316" text-anchor="middle" class="label" fill="#2563eb">R = 0.960</text>
  <rect x="1045" y="409" width="240" height="92" class="block"/>
  <text x="1165" y="434" text-anchor="middle" class="id">SDV_B</text>
  <text x="1165" y="460" text-anchor="middle" class="label">Shutdown valve B</text>
  <text x="1165" y="486" text-anchor="middle" class="label" fill="#2563eb">R = 0.960</text>

  <text x="275" y="589" text-anchor="middle" class="label" fill="#2563eb">R = 1 − (1 − 0.985)² = 0.999775</text>
  <text x="720" y="589" text-anchor="middle" class="label" fill="#2563eb">R = 3(0.999)² − 2(0.999)³ = 0.999997002</text>
  <text x="1165" y="589" text-anchor="middle" class="label" fill="#2563eb">R = 1 − (1 − 0.960)² = 0.998400</text>
  <line x1="60" y1="618" x2="1380" y2="618" stroke="#c7d2d9"/>
  <text x="60" y="655" class="heading" fill="#2563eb">System reliability = 0.999775 × 0.999997002 × 0.998400 ≈ 0.998172367 (99.81724%)</text>
  <text x="60" y="688" class="note">Success requires all three stages to succeed. Values are proof-test-interval reliabilities.</text>
  <text x="60" y="716" class="note">Assumption: independent channel failures.</text>
</svg>
