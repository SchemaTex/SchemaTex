<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850">
  <title>Seven by Nine Foot Bedroom — dimensioned floor plan</title>
  <rect width="760" height="850" fill="white"/>
  <defs>
    <style>
      .wall{fill:#292929}
      .line{fill:none;stroke:#292929;stroke-width:2}
      .thin{fill:none;stroke:#555;stroke-width:1.3}
      .dim{fill:none;stroke:#333;stroke-width:1.2}
      .label{font-family:Helvetica,Arial,sans-serif;fill:#292929;text-anchor:middle}
    </style>
  </defs>
  <!-- Interior: x=170..590, y=150..690. Scale: 60 SVG units/foot.
       DSL coordinates originate at the northwest interior corner. -->
  <!-- Half-foot exterior walls; north window spans x=290..470. -->
  <path class="wall" d="M140 120H290V150H170V690H194V720H140Z M470 120H620V720H344V690H590V150H470Z"/>
  <!-- Centered three-foot window, within the north wall. -->
  <path class="line" d="M290 120V150 M470 120V150 M290 124H470 M290 146H470"/>
  <path class="thin" d="M290 135H470"/>
  <!-- South entry: 0.4 ft from west; width 2.5 ft; left hinge, inward swing. -->
  <path class="line" d="M194 690V540H201V690 M194 690H201"/>
  <path class="thin" d="M194 540A150 150 0 0 1 344 690"/>
  <path class="line" d="M194 690V720 M344 690V720"/>
  <!-- Wardrobe: 1.8 x 2.0 ft, northwest offset 0.25 x 0.3 ft. -->
  <rect x="185" y="168" width="108" height="120" fill="#efefec" stroke="#292929" stroke-width="2"/>
  <path class="thin" d="M189 172L289 284 M289 172L189 284"/>
  <rect x="190" y="215" width="98" height="25" fill="#efefec"/>
  <text class="label" x="239" y="232" font-size="14">WARDROBE</text>
  <!-- Single bed: 3 x 6.25 ft, northwest offset 3.45 x 0.45 ft. -->
  <rect x="377" y="177" width="180" height="375" rx="2" fill="#f5f5f2" stroke="#292929" stroke-width="2"/>
  <path class="line" d="M377 185H557"/>
  <rect x="398" y="197" width="138" height="65" rx="10" fill="white" stroke="#555" stroke-width="1.5"/>
  <path class="thin" d="M377 285H557 M377 297H557 M388 297V541H546V297"/>
  <text class="label" x="467" y="428" font-size="17">SINGLE BED</text>
  <!-- Room name sits in the unobstructed circulation area. -->
  <text class="label" x="270" y="395" font-size="22">Bedroom</text>
  <!-- Interior-face dimensions, in feet and inches. -->
  <g class="dim">
    <path d="M170 112V65 M590 112V65 M170 80H590 M164 86L176 74 M584 86L596 74"/>
    <path d="M132 150H78 M132 690H78 M94 150V690 M88 156L100 144 M88 696L100 684"/>
  </g>
  <rect x="345" y="64" width="70" height="30" fill="white"/>
  <text class="label" x="380" y="88" font-size="25">7'0&quot;</text>
  <g transform="translate(94 420) rotate(-90)">
    <rect x="-37" y="-18" width="74" height="33" fill="white"/>
    <text class="label" x="0" y="9" font-size="25">9'0&quot;</text>
  </g>
  <text class="label" x="380" y="788" font-size="23" letter-spacing="1">SEVEN BY NINE FOOT BEDROOM</text>
</svg>
