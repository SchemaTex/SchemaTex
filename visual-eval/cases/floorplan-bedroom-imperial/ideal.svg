<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1820" viewBox="0 0 680 910">
  <title>Seven by Nine Foot Bedroom — dimensioned floor plan</title>
  <desc>One bedroom measuring 7 feet by 9 feet to wall centre-lines, with half-foot exterior walls. An inward-opening entry is on the south wall, a three-foot window is centered on the north wall, a single bed is at the northeast, and a wardrobe at the northwest. Clear floor connects the entry to both pieces of furniture.</desc>
  <style>
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif}
    .title{font-size:20px;font-weight:600;fill:#1F2328}
    .subtitle{font-size:12px;fill:#6E7782}
    .room{font-size:12px;font-weight:600;letter-spacing:.7px;fill:#1F2328}
    .area{font-size:11px;fill:#6E7782}
    .dim{font-size:11px;fill:#55606C;text-anchor:middle}
    .dimension{fill:none;stroke:#A3ABB4;stroke-width:.8}
    .tick{stroke:#1F2328;stroke-width:1.2}
    .furniture{fill:white;stroke:#55606C;stroke-width:1.1}
    .detail{fill:none;stroke:#55606C;stroke-width:.8}
    .scale{font-size:10px;fill:#6E7782;text-anchor:middle}
  </style>
  <rect width="680" height="910" fill="#FFFFFF"/>
  <text x="40" y="50" class="title">Seven by Nine Foot Bedroom</text>
  <text x="40" y="72" class="subtitle">1 room · 63.0 ft² · dimensions to wall centre-lines</text>
  <path d="M40 88H640" stroke="#A3ABB4" stroke-width=".8"/>

  <!-- Dimension lines reference the wall centre-line rectangle: 448 × 576 px at 64 px/ft. -->
  <g class="dimension">
    <path d="M160 160V108 M608 160V108 M160 116H608"/>
    <path d="M140 180H86 M140 756H86 M94 180V756"/>
    <path d="M160 776V812 M608 776V812 M160 804H608"/>
  </g>
  <g class="tick">
    <path d="M155 121L165 111 M603 121L613 111 M89 175L99 185 M89 751L99 761 M155 809L165 799 M603 809L613 799"/>
  </g>
  <text x="384" y="111" class="dim">7'0&quot;</text>
  <text x="89" y="468" class="dim" transform="rotate(-90 89 468)">9'0&quot;</text>
  <text x="384" y="799" class="dim">7'0&quot;</text>

  <!-- Half-foot exterior walls. Window north, entry south. -->
  <g fill="#1F2328">
    <path d="M144 164H288V196H176V740H185.6V772H144Z"/>
    <path d="M480 164H624V772H345.6V740H592V196H480Z"/>
  </g>
  <g fill="white" stroke="#1F2328" stroke-width=".9">
    <rect x="288" y="164" width="192" height="32"/>
  </g>
  <path d="M288 180H480" stroke="#4F86B0" stroke-width="1.8"/>

  <!-- Wardrobe: 1.8 × 2.0 ft, northwest corner. -->
  <rect x="176" y="199.2" width="115.2" height="128" class="furniture"/>
  <g class="detail">
    <path d="M189 215H278 M189 251H278 M189 287H278"/>
    <path d="M203 208V240 M217 208V240 M231 208V240 M245 208V240 M259 208V240"/>
    <path d="M198 246L204 258 M212 246L218 258 M226 246L232 258 M240 246L246 258 M254 246L260 258 M268 246L274 258"/>
  </g>
  <text x="233.6" y="312" text-anchor="middle" font-size="8" font-weight="600" letter-spacing=".5" fill="#55606C">WARDROBE</text>

  <!-- Single bed: 3 × 6.25 ft. Loose furniture remains white. -->
  <rect x="380.8" y="208.8" width="192" height="400" rx="4" class="furniture"/>
  <rect x="403.8" y="220.8" width="146" height="53" rx="4" class="furniture"/>
  <path d="M380.8 298.8H572.8 M380.8 326.8L572.8 308.8" class="detail"/>

  <text x="267" y="440" text-anchor="middle" class="room">BEDROOM</text>
  <text x="267" y="456" text-anchor="middle" class="area">63.0 ft²</text>

  <!-- Entry: 2.5 ft wide, hinge at west jamb, open inward 90 degrees. -->
  <path d="M185.6 740V596" stroke="#1F2328" stroke-width="1.6" fill="none"/>
  <path d="M185.6 596A160 160 0 0 1 345.6 756" stroke="#A3ABB4" stroke-width=".9" fill="none"/>
  <path d="M185.6 740V772H345.6V740" stroke="#1F2328" stroke-width=".8" fill="none"/>

  <!-- Alternating one-foot graphic scale and exemplar north point. -->
  <g class="scale">
    <text x="160" y="855">0</text><text x="224" y="855">1</text>
    <text x="288" y="855">2</text><text x="352" y="855">3</text>
    <text x="416" y="855">4</text><text x="480" y="855">5</text>
    <text x="496" y="866">ft</text>
  </g>
  <g stroke="#1F2328" stroke-width=".7">
    <rect x="160" y="860" width="64" height="6" fill="#1F2328"/>
    <rect x="224" y="860" width="64" height="6" fill="white"/>
    <rect x="288" y="860" width="64" height="6" fill="#1F2328"/>
    <rect x="352" y="860" width="64" height="6" fill="white"/>
    <rect x="416" y="860" width="64" height="6" fill="#1F2328"/>
  </g>
  <text x="160" y="884" font-size="9" font-weight="600" letter-spacing="1.2" fill="#6E7782">GRAPHIC SCALE</text>
  <g transform="translate(624 862)">
    <text x="0" y="-24" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">N</text>
    <circle r="17" fill="white" stroke="#A3ABB4" stroke-width="1"/>
    <path d="M0-14L-5.5 8L0 4Z" fill="#1F2328"/>
    <path d="M0-14L5.5 8L0 4Z" fill="white" stroke="#1F2328" stroke-width=".8"/>
  </g>
</svg>
