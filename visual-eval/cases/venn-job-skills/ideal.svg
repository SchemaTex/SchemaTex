  <g stroke-width="3">
    <circle cx="380" cy="340" r="225" fill="#4285c5" fill-opacity="0.17" stroke="#28689f"/>
    <circle cx="620" cy="340" r="225" fill="#d7a436" fill-opacity="0.17" stroke="#9c711a"/>
