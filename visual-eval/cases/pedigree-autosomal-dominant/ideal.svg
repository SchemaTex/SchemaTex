<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 780" width="620" height="780">
<title>Autosomal Dominant Family</title>
<desc>Four-generation autosomal dominant pedigree. Generation I: affected male I-1 mated to unaffected female I-2; their children are affected male II-1 and unaffected female II-3. II-1 is mated to unaffected female II-2; their children are affected male III-1 and unaffected female III-3. III-1 is mated to unaffected female III-2; their children are affected female IV-1, the proband, and unaffected male IV-2. Affected individuals are solid-filled and appear in every generation, including father-to-son transmission from I-1 to II-1 to III-1.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
