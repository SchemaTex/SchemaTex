<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1464" viewBox="0 0 1012 926" role="img" aria-labelledby="title desc">
  <title id="title">Give and go from the wing</title>
  <desc id="desc">Basketball four-out give-and-go, attacking the basket at the top. Player 1 starts with the ball in the right slot, passes to player 2 on the right wing, cuts to the rim, receives player 2's return pass and makes a layup. Players 3 and 4 space the left perimeter and player 5 occupies the left low block. Solid arrows show player movement; dashed arrows show the ball.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 5 0 10Z" fill="#15233B"/></marker>
    <style>
      text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#15233B}
      .court{fill:none;stroke:#9A6634;stroke-width:2}
      .move{fill:none;stroke:#15233B;stroke-width:2.4;stroke-linecap:round;marker-end:url(#arrow)}
      .pass{fill:none;stroke:#15233B;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .player{fill:#FFFFFF;stroke:#15233B;stroke-width:2.2}
      .number{font-size:11.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
      .action{font-size:12.5px;fill:#15233B}
      .legend{font-size:12px;fill:#5B6675}
    </style>
  </defs>
  <rect width="1012" height="926" fill="#FFFFFF"/>
  <text x="32" y="42" font-size="20" font-weight="600">Give and go from the wing</text>
  <text x="32" y="64" font-size="12.5" fill="#5B6675" style="fill:#5B6675">4-out set · Pass to the wing, cut to the rim, return pass, layup</text>

  <!-- NBA half court: 50 feet wide, cropped at 41 feet. -->
  <rect x="32" y="86" width="948" height="762" fill="#D3B083"/>
  <rect x="58" y="111" width="896" height="737" fill="#EFD9B2"/>
  <rect x="362" y="111" width="288" height="341" fill="#E5C595"/>
  <path d="M58 848V111H954V848" fill="none" stroke="#9A6634" stroke-width="3"/>
  <path class="court" d="M362 111V452H650V111"/>
  <path class="court" d="M398 452A108 108 0 0 0 614 452"/>
  <path class="court" d="M398 452A108 108 0 0 1 614 452" stroke-dasharray="9 7"/>
  <path class="court" d="M110 111V365A426 426 0 0 0 902 365V111"/>
  <path class="court" d="M434 182V204A72 72 0 0 0 578 204V182"/>
  <path d="M452 182H560" fill="none" stroke="#5B6675" stroke-width="3"/>
  <path d="M506 182V191" stroke="#E2621B" stroke-width="2"/>
  <circle cx="506" cy="204" r="13.5" fill="none" stroke="#E2621B" stroke-width="2.5"/>
  <path d="M350 236H362V254H350ZM650 236H662V254H650Z" fill="#9A6634"/>
  <path class="court" d="M353 308H362M650 308H659M353 362H362M650 362H659M58 614H110M902 614H954"/>

  <!-- 1: the initial pass, from the right slot to the right wing. -->
  <path class="pass" d="M627 663L885 440"/>
  <text class="action" x="790" y="556">1 · Pass to wing</text>

  <!-- 2: player 1 cuts from the original slot to the right side of the rim. -->
  <path class="move" d="M613 658L560 291"/>
  <text class="action" x="550" y="485" text-anchor="end">2 · Cut to rim</text>

  <!-- 3: the wing returns the ball to the cutter's destination. -->
  <path class="pass" d="M884 422L573 280"/>
  <text class="action" x="727" y="329">3 · Return pass</text>

  <!-- 4: a short ball-flight arc from the catch to the basket. -->
  <path class="pass" d="M560 280Q570 217 524 205" stroke-dasharray="6.9 4.8"/>
  <text class="action" x="592" y="233">4 · Layup</text>

  <!-- Four perimeter players and one interior player; ball at its first carrier. -->
  <g>
    <circle class="player" cx="615" cy="674" r="11"/>
    <text class="number" x="615" y="674">1</text>
    <circle cx="595.5" cy="674" r="4.6" fill="#E07A1F" stroke="#15233B" stroke-width="1.3"/>
    <circle class="player" cx="900" cy="430" r="11"/>
    <text class="number" x="900" y="430">2</text>
    <circle class="player" cx="112" cy="430" r="11"/>
    <text class="number" x="112" y="430">3</text>
    <circle class="player" cx="397" cy="674" r="11"/>
    <text class="number" x="397" y="674">4</text>
    <circle class="player" cx="405" cy="270" r="11"/>
    <text class="number" x="405" y="270">5</text>
  </g>

  <path d="M32 868H980" stroke="#DDE2E8" stroke-width="1"/>
  <g transform="translate(0 896)">
    <circle class="player" cx="47" cy="0" r="10"/>
    <text class="legend" x="70" y="4">Offense</text>
    <path class="move" d="M170 0H200"/>
    <text class="legend" x="208" y="4">Cut (player)</text>
    <path class="pass" d="M330 0H360"/>
    <text class="legend" x="368" y="4">Pass (ball)</text>
    <path class="pass" d="M488 4Q503 -15 520 0"/>
    <text class="legend" x="532" y="4">Shot (ball)</text>
    <circle cx="667" cy="0" r="4.6" fill="#E07A1F" stroke="#15233B" stroke-width="1.3"/>
    <text class="legend" x="690" y="4">Ball</text>
  </g>
</svg>
