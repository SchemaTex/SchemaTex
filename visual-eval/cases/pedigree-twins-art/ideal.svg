<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" width="820" height="660">
<title>Twins and Assisted Reproduction Family</title>
<desc>Three-generation pedigree with two twin pairs and an assisted-reproduction child. Deceased male I-1, marked with a diagonal slash, is mated to unaffected female I-2; their only child is male II-1. II-1 is mated to unaffected female II-2. Their sibship line carries three groups: monozygotic twin daughters III-1 and III-2, whose lines meet at a single point and are tied by a connecting bar; dizygotic twins III-3, male, and III-4, female, whose lines meet at a point with no bar; and III-5, a child of unknown sex conceived by IVF with donor sperm, drawn as a diamond and marked as the proband. Nobody in the family is affected.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="820" height="660" fill="#ffffff"/>
<rect x="22" y="563" width="765.755" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="410" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">Twins and Assisted Reproduction Family</text>
<text x="26" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
<text x="26" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">II</text>
<text x="26" y="475" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">III</text>
