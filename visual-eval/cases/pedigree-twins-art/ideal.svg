<text x="287.13" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Sex unknown</text>
<line x1="395.845" y1="575" x2="387.845" y2="593" stroke="#334155" stroke-width="1.5"/><line x1="395.845" y1="575" x2="403.845" y2="593" stroke="#334155" stroke-width="1.5"/><line x1="391.045" y1="585.8" x2="400.64500000000004" y2="585.8" stroke="#334155" stroke-width="1.5"/>
<text x="412.845" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Monozygotic twins</text>
<line x1="552.61" y1="575" x2="544.61" y2="593" stroke="#334155" stroke-width="1.5"/><line x1="552.61" y1="575" x2="560.61" y2="593" stroke="#334155" stroke-width="1.5"/>
<text x="569.61" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Dizygotic twins</text>
<line x1="681.975" y1="593" x2="696.975" y2="578" stroke="#334155" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="707.975" y="588" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Proband (P)</text>
