<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-petri" role="img" aria-label="Producer Consumer Buffer" width="558" height="254" viewBox="0 0 558 254" data-diagram-type="petri"><title>Petri net — Producer Consumer Buffer</title>
<desc>5 places, 2 transitions, 9 arcs. Marking {Empty:2, Ready:1, Consumer:1, Done:1}. Enabled: Produce.</desc>
<style>.sx-petri { font-family: system-ui, -apple-system, sans-serif; }
.sx-petri-place { fill: #ffffff; stroke: #334155; stroke-width: 2; }
