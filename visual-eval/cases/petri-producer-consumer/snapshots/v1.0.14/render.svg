<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-petri" role="img" aria-label="Producer Consumer Buffer" width="490" height="258" viewBox="0 0 490 258" data-diagram-type="petri"><title>Petri net — Producer Consumer Buffer</title>
<desc>5 places, 2 transitions, 9 arcs. Marking {Empty:2, Ready:1, Consumer:1, Done:1}. Enabled: Produce.</desc>
<style>.sx-petri { font-family: system-ui, -apple-system, sans-serif; }
.sx-petri-place { fill: #ffffff; stroke: #334155; stroke-width: 2; }
.sx-petri-place-cap { stroke-dasharray: 4 3; }
.sx-petri-token { fill: #0f172a; stroke: none; }
.sx-petri-token-num { font: 600 11px sans-serif; fill: #0f172a; }
.sx-petri-bar { fill: #334155; stroke: #334155; stroke-width: 2; }
.sx-petri-box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
.sx-petri-enabled { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
.sx-petri-dead .sx-petri-bar, .sx-petri-dead .sx-petri-box { stroke: #94a3b8; }
.sx-petri-dead { opacity: 0.7; }
.sx-petri-label { font: 12px sans-serif; fill: #0f172a; }
.sx-petri-sublabel { font: italic 10px sans-serif; fill: #475569; }
.sx-petri-cap { font: 9px sans-serif; fill: #475569; }
.sx-petri-rate { font: italic 9px sans-serif; fill: #475569; }
.sx-petri-arc { stroke: #334155; stroke-width: 2; fill: none; }
.sx-petri-arc-inhibitor, .sx-petri-arc-reset { stroke: #dc2626; }
.sx-petri-inhibitor-dot { fill: #ffffff; stroke: #dc2626; stroke-width: 2; }
.sx-petri-weight { font: 600 9px sans-serif; fill: #2563eb; }
.sx-petri-title { font: 700 16px sans-serif; fill: #0f172a; }</style>
