<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 610" width="700" height="610">
<title>Mitochondrial Transmission Family</title>
<desc>Three-generation mitochondrial pedigree showing maternal-only transmission. Unaffected male I-1 is mated to affected female I-2; both of their children, affected male II-1 and affected female II-3, are solid-filled. II-1 is mated to unaffected female II-2 and neither of their children, III-1 and III-2, is affected. II-3 is mated to unaffected male II-4 and both of their children, affected female III-3, the proband, and affected male III-4, are solid-filled.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
