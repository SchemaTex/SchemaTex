<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="982" viewBox="0 0 1140 700" role="img" aria-labelledby="title desc">
  <title id="title">Balanced classification (mock)</title>
  <desc id="desc">An eight-tip slanted cladogram of authored mock data. The root divides into two groups: Species A, B, C and D; and Species E, F, G and H. Sister pairs are A and B, C and D, E and F, and G and H. All tips share the same right-hand baseline. Branch lengths do not represent quantitative distances.</desc>
  <defs>
    <style>
      text { font-family: Verdana, sans-serif; fill: #1e293b; }
      .title { font-family: 'Trebuchet MS', sans-serif; font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #64748b; letter-spacing: .25px; }
      .section { font-size: 12px; fill: #64748b; letter-spacing: 1px; }
      .taxon { font-size: 16px; font-style: italic; }
      .note { font-size: 11px; fill: #64748b; letter-spacing: .1px; }
      .branch { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1140" height="700" fill="#ffffff"/>
  <text class="title" x="48" y="48">Balanced classification (mock)</text>
  <text class="subtitle" x="48" y="76">Slanted cladogram · eight tips and four sister pairs</text>
  <path d="M48 99H1092" stroke="#64748b" stroke-opacity=".22"/>
  <text class="section" x="80" y="133">PHYLOGENY</text>
  <text class="section" x="654" y="133">TAXON</text>

  <g fill="#0f766e" fill-opacity=".045">
    <rect x="638" y="148" width="454" height="88" rx="3"/>
    <rect x="638" y="268" width="454" height="88" rx="3"/>
  </g>
  <g fill="#2563eb" fill-opacity=".045">
    <rect x="638" y="388" width="454" height="88" rx="3"/>
    <rect x="638" y="508" width="454" height="88" rx="3"/>
  </g>

  <g class="branch" stroke="#0f766e">
    <path d="M80 372L290 252"/>
    <path d="M290 252L455 192L620 170"/>
    <path d="M455 192L620 214"/>
    <path d="M290 252L455 312L620 290"/>
    <path d="M455 312L620 334"/>
  </g>
  <g class="branch" stroke="#2563eb">
    <path d="M80 372L290 492"/>
    <path d="M290 492L455 432L620 410"/>
    <path d="M455 432L620 454"/>
    <path d="M290 492L455 552L620 530"/>
    <path d="M455 552L620 574"/>
  </g>
  <g stroke="#64748b" stroke-opacity=".45" stroke-width=".8" stroke-dasharray="2.5 4.5">
    <path d="M624 170H641M624 214H641M624 290H641M624 334H641M624 410H641M624 454H641M624 530H641M624 574H641"/>
  </g>
  <g class="taxon">
    <text x="654" y="175">Species A</text>
    <text x="654" y="219">Species B</text>
    <text x="654" y="295">Species C</text>
    <text x="654" y="339">Species D</text>
    <text x="654" y="415">Species E</text>
    <text x="654" y="459">Species F</text>
    <text x="654" y="535">Species G</text>
    <text x="654" y="579">Species H</text>
  </g>
  <text class="note" x="466" y="618">Topology only · branch lengths do not represent distance.</text>
  <text class="note" x="466" y="641">Dashed extensions align labels; they add no branch length.</text>
  <path d="M48 653H1092" stroke="#64748b" stroke-opacity=".22"/>
  <text class="note" x="48" y="678">Mock dataset · authored for visual evaluation; not user data or an inferred analysis.</text>
</svg>
