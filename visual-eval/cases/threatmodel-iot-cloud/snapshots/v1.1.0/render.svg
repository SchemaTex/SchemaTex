<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="723.5630067099082" height="556.9943165024615" viewBox="-20 -20 723.5630067099082 556.9943165024615" class="schematex schematex-threatmodel" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="IoT Cloud Backend STRIDE"><title>IoT Cloud Backend STRIDE</title>
<desc>STRIDE threat model: 2 external entities, 2 process(es), 2 data store(s), 6 data flow(s). 5 boundary-crossing flow(s): Device→Gateway, Owner→Gateway, Gateway→Control, Control→Device, Gateway→Telemetry. Device (external) → Spoofing, Repudiation. Owner (external) → Spoofing, Repudiation. Gateway (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Control (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Telemetry (store) → Tampering, Information disclosure, Denial of service. Audit (store) → Tampering, Repudiation, Information disclosure, Denial of service.</desc>
