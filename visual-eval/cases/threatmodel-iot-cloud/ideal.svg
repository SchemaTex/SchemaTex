<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1243 940" width="1243" height="940" role="img">
<title>IoT Cloud Backend STRIDE</title>
<desc>A STRIDE threat model of IoT Cloud Backend STRIDE, drawn as a data-flow diagram over 3 trust zones: Home Internet, Cloud Edge, Cloud Internal. 2 external entities are drawn as rectangles, 2 processes as circles, and 2 data stores as two parallel horizontal lines with the label between them. Each element carries the STRIDE letters that apply to its kind. Of the 6 data flows, 5 cross a trust boundary — Smart Thermostat to IoT Cloud Gateway, Homeowner App to IoT Cloud Gateway, IoT Cloud Gateway to Device Control Service, Device Control Service to Smart Thermostat, IoT Cloud Gateway to Telemetry Store — and those are the only ones drawn in red, because a boundary crossing is where the spoofing, tampering and disclosure threats actually bite.</desc>
