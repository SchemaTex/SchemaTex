<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="690" viewBox="0 0 1680 690" role="img" aria-labelledby="title desc">
<title id="title">Apex Components · Plant Organisation</title>
<desc id="desc">Renee Ford, Plant Manager, leads Production, Quality, Maintenance and EHS. Production has three shift supervisors. Quality has a QA Supervisor. Maintenance has Mechanical and Electrical supervisors. EHS has a Safety Coordinator. A dashed Quality release arrow runs from Quality to Shift A.</desc>
