<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">Clinical record schema — patients, care and results</title>
<desc id="desc">Five entities with five relationships. Each Patient and Clinician has zero or many Encounters. Each Encounter generates zero or many Prescriptions and records zero or many Lab Results. Each Clinician authorises zero or many Prescriptions. Every child has exactly one parent in each relationship.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:12px}
.structure{fill:none;stroke:#334155;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.entity{fill:#fff;stroke:#334155;stroke-width:1.5}
.name{font-size:13px;font-weight:600;letter-spacing:.35px;text-anchor:middle}
.type{fill:#475569;text-anchor:end}
.verb{fill:#475569;font-size:10.5px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}
.pk{font-weight:600;text-decoration:underline}
.tag{fill:white;font-size:10px;font-weight:700;text-anchor:middle}
</style>
<rect width="1000" height="840" fill="white"/>
<text x="44" y="43" font-size="20" style="font-size:20px;font-weight:600">Clinical record schema — patients, care and results</text>
<text x="44" y="65" style="font-size:10.5px;fill:#475569;letter-spacing:.2px">CROW'S-FOOT (IE) NOTATION · 5 TABLES · 5 RELATIONSHIPS</text>
