<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="973" viewBox="0 0 1120 681">
  <title>Fully remote and hybrid work</title>
  <rect width="1120" height="681" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1B2430; }
    .title { font-size:22px; font-weight:600; }
    .trait { font-size:13.5px; text-anchor:middle; }
    .subject { font-size:20px; font-weight:600; fill:#FFFFFF; text-anchor:middle; }
    .caption { font-size:13px; font-weight:600; text-anchor:middle; }
    .link { stroke:#ACB8C7; stroke-width:1.5; fill:none; }
    .left { fill:#E5EDF5; stroke:#28598C; stroke-width:1.25; }
    .right { fill:#EEE8F4; stroke:#6B4F8C; stroke-width:1.25; }
    .shared { fill:#FFFFFF; stroke:#5F6B7A; stroke-width:1.25; }
  </style>
  <text class="title" x="48" y="58">Fully remote and hybrid work</text>
  <!-- Edge-to-edge links: shared traits join both subjects. -->
  <g class="link">
    <path d="M290.61 281.59 L262.96 204.04"/>
    <path d="M244 352 L171 352"/>
    <path d="M290.61 422.41 L262.96 499.96"/>
    <path d="M829.39 281.59 L857.04 204.04"/>
    <path d="M876 352 L949 352"/>
    <path d="M829.39 422.41 L857.04 499.96"/>
    <path d="M375.12 306.53 L513.19 200.92"/>
    <path d="M390 352 L501 352"/>
    <path d="M375.12 397.47 L513.19 503.08"/>
    <path d="M744.88 306.53 L606.81 200.92"/>
    <path d="M730 352 L619 352"/>
    <path d="M744.88 397.47 L606.81 503.08"/>
  </g>
  <g>
    <circle class="left" cx="243" cy="149" r="59"/>
    <circle class="left" cx="112" cy="352" r="59"/>
    <circle class="left" cx="243" cy="555" r="59"/>
    <circle class="right" cx="877" cy="149" r="59"/>
    <circle class="right" cx="1008" cy="352" r="59"/>
    <circle class="right" cx="877" cy="555" r="59"/>
    <circle class="shared" cx="560" cy="165" r="59"/>
    <circle class="shared" cx="560" cy="352" r="59"/>
    <circle class="shared" cx="560" cy="539" r="59"/>
    <circle cx="317" cy="352" r="73" fill="#28598C"/>
    <circle cx="803" cy="352" r="73" fill="#6B4F8C"/>
  </g>
  <g class="trait">
    <text x="243" y="145"><tspan x="243">No commute</tspan><tspan x="243" dy="17">at all</tspan></text>
    <text x="112" y="348"><tspan x="112">Hire from</tspan><tspan x="112" dy="17">any region</tspan></text>
    <text x="243" y="551"><tspan x="243">Home-office</tspan><tspan x="243" dy="17">stipend</tspan></text>
    <text x="877" y="136"><tspan x="877">Set office</tspan><tspan x="877" dy="17">days each</tspan><tspan x="877" dy="17">week</tspan></text>
    <text x="1008" y="348"><tspan x="1008">In-person</tspan><tspan x="1008" dy="17">onboarding</tspan></text>
    <text x="877" y="551"><tspan x="877">Desk booking</tspan><tspan x="877" dy="17">needed</tspan></text>
    <text x="560" y="161"><tspan x="560">Flexible</tspan><tspan x="560" dy="17">working hours</tspan></text>
    <text x="560" y="348"><tspan x="560">Relies on</tspan><tspan x="560" dy="17">video meetings</tspan></text>
    <text x="560" y="526"><tspan x="560">Needs clear</tspan><tspan x="560" dy="17">written</tspan><tspan x="560" dy="17">updates</tspan></text>
  </g>
  <text class="subject" x="317" y="347"><tspan x="317">Fully</tspan><tspan x="317" dy="24">remote</tspan></text>
  <text class="subject" x="803" y="359">Hybrid</text>
  <text class="caption" x="223" y="642" style="fill:#28598C">Only Fully remote</text>
  <text class="caption" x="560" y="642" style="fill:#5F6B7A">Both</text>
  <text class="caption" x="897" y="642" style="fill:#6B4F8C">Only Hybrid</text>
</svg>
