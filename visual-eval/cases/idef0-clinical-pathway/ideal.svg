<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1399 894" width="1399" height="894" role="img">
<title>Clinical Pathway</title>
<desc>An IDEF0 function model of Clinical Pathway, drawn to FIPS PUB 183. 3 function boxes — Triage patient (1), Assess and test (2), Decide disposition (3) — step down a diagonal staircase from upper left to lower right, each carrying its box number in the lower-right interior corner. Every arrow occupies the edge its role requires: inputs enter the left edge, controls descend into the top, outputs leave the right, and mechanisms rise into the bottom. Each arrow's label sits outside the box at the arrow's open end, and every boundary arrow carries its ICOM code — I, C, M, O numbered along each edge — where it meets the diagram frame. The page carries the standard frame with a bottom title block of three cells: node, title and number.</desc>
