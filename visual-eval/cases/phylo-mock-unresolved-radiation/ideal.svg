<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1140 620">
  <title>Unresolved radiation (mock) — slanted phylogram</title>
  <desc>Illustrative Newick tree, not empirical data. Reef A, Reef B, Reef C, the ancestor of Reef D and Reef E, and Reef F meet at a single five-way root. Reef D and Reef E share a separate ancestor. Horizontal distances represent substitutions per site: A, B, C 0.12; D/E ancestor 0.04; ancestor to D 0.08 and to E 0.10; F 0.15.</desc>
  <defs>
    <style>
      text { font-family: Verdana, sans-serif; fill: #1e293b; }
      .title { font-family: 'Trebuchet MS', sans-serif; font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #64748b; letter-spacing: .3px; }
      .section { font-size: 12px; fill: #64748b; letter-spacing: 1px; }
      .taxon { font-size: 16px; font-style: italic; }
      .caption { font-size: 12px; }
      .note { font-size: 11px; fill: #64748b; }
      .branch { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .guide { fill: none; stroke: #64748b; stroke-opacity: .45; stroke-width: 1; stroke-dasharray: 2.5 4.5; }
    </style>
  </defs>
  <rect width="1140" height="620" fill="#ffffff"/>
  <text class="title" x="48" y="48">Unresolved radiation (mock)</text>
  <text class="subtitle" x="48" y="76">Slanted phylogram · unresolved five-way split and a resolved sister pair</text>
  <path d="M48 99H1092" stroke="#64748b" stroke-opacity=".22" stroke-width="1"/>
  <text class="section" x="80" y="133">PHYLOGENY</text>
  <text class="section" x="654" y="133">TAXON</text>
  <text class="section" x="967" y="133">CLADE</text>

  <rect x="638" y="312" width="454" height="88" rx="3" fill="#2563eb" fill-opacity=".045"/>

  <!-- One common root (80,312); five outgoing branches, no intermediate nodes. -->
  <!-- Horizontal scale: 3600 SVG units per substitution/site. -->
  <g class="branch" stroke="#0f766e">
    <path d="M80 312L512 170"/>
    <path d="M80 312L512 214"/>
    <path d="M80 312L512 258"/>
    <path d="M80 312L620 454"/>
  </g>
  <g class="branch" stroke="#2563eb">
    <path d="M80 312L224 356"/>
    <path d="M224 356L512 334"/>
    <path d="M224 356L584 378"/>
  </g>
  <g class="guide">
    <path d="M516 170H640"/>
    <path d="M516 214H640"/>
    <path d="M516 258H640"/>
    <path d="M516 334H640"/>
    <path d="M588 378H640"/>
    <path d="M624 454H640"/>
  </g>
  <g class="taxon" dominant-baseline="middle">
    <text x="654" y="170">Reef A</text>
    <text x="654" y="214">Reef B</text>
    <text x="654" y="258">Reef C</text>
    <text x="654" y="334">Reef D</text>
    <text x="654" y="378">Reef E</text>
    <text x="654" y="454">Reef F</text>
  </g>
  <path d="M945 322H952V390H945" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <text x="967" y="360" font-size="12" font-weight="700" style="fill:#2563eb">D/E sister pair</text>

  <path d="M80 521V531M80 526H260M260 521V531" fill="none" stroke="#1e293b" stroke-width="1.4"/>
  <text class="caption" x="80" y="551">0.05 substitutions/site</text>
  <text class="note" x="466" y="522">Horizontal distance: substitutions/site · root: five-way split</text>
  <text class="note" x="466" y="545">Dashed extensions align labels; they add no branch length.</text>
  <path d="M48 574H1092" stroke="#64748b" stroke-opacity=".22" stroke-width="1"/>
  <text class="note" x="48" y="599">Mock dataset · authored topology and branch distances; not empirical data or an inferred analysis.</text>
</svg>
