<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1300" viewBox="0 0 1680 1300">
<title>North Harbor Branch Office — ISP edge to user devices · four VLANs across two access switches</title>
<desc>A branch-office network drawn top-down. The Internet, the ISP router, the NGFW and the core switch are chained down the middle of the sheet; the core trunks to two access switches, which fan out to seven endpoints along the foot: an IP phone, two desktop PCs, two Wi-Fi access points, a laptop and a finance MFP. Every link carries its media and speed, uplinks carry the VLAN trunk list, PoE drops are drawn in green and the wireless hop as a dotted line. Each endpoint wears a coloured chip naming the VLAN it belongs to, and a key under the subtitle lists all four.</desc>
