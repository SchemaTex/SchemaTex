.sx-pb-motion-fill { fill: #e2e8f0; stroke: none; }
.sx-pb-o { fill: #ffffff; stroke: #13294b; stroke-width: 2; }
.sx-pb-gk { fill: #facc15; stroke: #13294b; stroke-width: 2; }
.sx-pb-o-text { font: 700 10.5px sans-serif; fill: #13294b; }
.sx-pb-x { fill: none; stroke: #ef4444; stroke-width: 2.6; stroke-linecap: round; }
.sx-pb-x-text { font: 700 9px sans-serif; fill: #ef4444; }
.sx-pb-ball { fill: #7c3a14; stroke: #ffffff; stroke-width: 0.8; }
.sx-pb-anno { font: 600 12px sans-serif; fill: #334155; }
.sx-pb-legend { font: 11px sans-serif; fill: #334155; }
.sx-pb-error-box { fill: #ffffff; stroke: #dc2626; stroke-width: 1.5; }
.sx-pb-error-title { font: 700 13px ui-monospace, Menlo, monospace; fill: #dc2626; }
