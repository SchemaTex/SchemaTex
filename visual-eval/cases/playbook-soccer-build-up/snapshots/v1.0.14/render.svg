<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 648 528" width="648" height="528" class="sx-pb" role="img"><title>Soccer Build Up</title>
<desc>football play. 11 offensive players, 11 defenders, 4 assignments.</desc>
<style>.sx-pb { font-family: system-ui, -apple-system, sans-serif; }
.sx-pb-title { font: 700 16px sans-serif; fill: #0f172a; }
.sx-pb-field, .sx-pb-turf { fill: #2f8f4e; }
.sx-pb-court { fill: #f1ddba; }
.sx-pb-surround { fill: #21683a; }
.sx-pb-surround-court { fill: #6b4f2c; }
.sx-pb-boundary { fill: none; stroke: #ffffff; stroke-width: 2.6; }
.sx-pb-boundary-court { fill: none; stroke: #b07c40; stroke-width: 2.6; }
.sx-pb-stripe { fill: #2b8549; }
.sx-pb-yard, .sx-pb-pitch-line, .sx-pb-goalbox { fill: none; stroke: rgba(255,255,255,0.62); stroke-width: 1.4; }
.sx-pb-court-line { fill: none; stroke: #b07c40; stroke-width: 1.5; }
.sx-pb-hash { fill: none; stroke: rgba(255,255,255,0.62); stroke-width: 1.2; }
.sx-pb-los, .sx-pb-goalline { fill: none; stroke: #ffffff; stroke-width: 2.4; }
.sx-pb-goalline { stroke: #fcd34d; }
.sx-pb-goalpost { fill: none; stroke: #fcd34d; stroke-width: 2.4; stroke-linecap: round; }
.sx-pb-endzone { fill: rgba(255,255,255,0.10); }
.sx-pb-yardnum { font: 600 11px sans-serif; fill: rgba(255,255,255,0.85); }
.sx-pb-rim { stroke: #f97316; stroke-width: 2.4; }
.sx-pb-pitch-dot { fill: #ffffff; }
.sx-pb-zone { fill: rgba(253,224,71,0.12); stroke: #fde047; stroke-width: 1.3; stroke-dasharray: 5 4; }
.sx-pb-zone-text { font: 9px sans-serif; fill: #fde047; }
.sx-pb-move { fill: none; stroke: #0b1f3a; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.sx-pb-move-dash { fill: none; stroke: #0b1f3a; stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linejoin: round; stroke-linecap: round; }
.sx-pb-shot { fill: none; stroke: #f59e0b; stroke-width: 3.4; stroke-linecap: round; }
.sx-pb-motion { fill: none; stroke: #e2e8f0; stroke-width: 1.9; stroke-dasharray: 4 3; }
.sx-pb-move-fill { fill: #0b1f3a; stroke: none; }
.sx-pb-shot-fill { fill: #f59e0b; stroke: none; }
.sx-pb-motion-fill { fill: #e2e8f0; stroke: none; }
.sx-pb-o { fill: #ffffff; stroke: #13294b; stroke-width: 2; }
.sx-pb-gk { fill: #facc15; stroke: #13294b; stroke-width: 2; }
.sx-pb-o-text { font: 700 10.5px sans-serif; fill: #13294b; }
.sx-pb-x { fill: none; stroke: #ef4444; stroke-width: 2.6; stroke-linecap: round; }
.sx-pb-x-text { font: 700 9px sans-serif; fill: #ef4444; }
.sx-pb-ball { fill: #7c3a14; stroke: #ffffff; stroke-width: 0.8; }
.sx-pb-anno { font: 600 12px sans-serif; fill: #334155; }
.sx-pb-legend { font: 11px sans-serif; fill: #334155; }
.sx-pb-error-box { fill: #ffffff; stroke: #dc2626; stroke-width: 1.5; }
.sx-pb-error-title { font: 700 13px ui-monospace, Menlo, monospace; fill: #dc2626; }
.sx-pb-error-line { font: 12px ui-monospace, Menlo, monospace; fill: #dc2626; }</style>
