<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800">
<title>Congestion-pricing stakeholder map</title>
<desc>Power increases upward and interest increases rightward. Bubble area represents stakeholder scale. Mayor's office and Freight association belong in Manage closely; Regional press and Neighborhood councils in Keep satisfied; Transit riders coalition in Keep informed; Occasional visitors in Monitor.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1e293b} .title{font-size:22px;font-weight:600}.subtitle{font-size:13px;fill:#475569}.quadrant{font-size:13px;font-weight:600;fill:#475569}.action{font-size:11px;fill:#64748b}.name{font-size:12px;font-weight:500}.value{font-size:10.5px;fill:#475569}.axis{font-size:12px;font-weight:600}.end{font-size:11px;fill:#475569}.head{font-size:11px;font-weight:600;letter-spacing:.6px;fill:#475569}.key{font-size:12px}.rule{stroke:#e2e8f0;stroke-width:1;fill:none}.bubble{fill-opacity:.85;stroke-width:1.5}
</style>
<rect width="1060" height="800" fill="#ffffff"/>
<text x="48" y="46" class="title">Congestion-pricing stakeholder map</text>
<text x="48" y="74" class="subtitle">Bubble area = relative stakeholder scale. Interest increases to the right; power increases upward.</text>
<!-- A true 600 by 600 matrix; coordinates map directly from the source. -->
<rect x="132" y="124" width="300" height="300" fill="#F6F5F4"/>
<rect x="432" y="124" width="300" height="300" fill="#E6E9ED"/>
<rect x="132" y="424" width="300" height="300" fill="#FCFBFB"/>
<rect x="432" y="424" width="300" height="300" fill="#F1F3F6"/>
<rect x="132" y="124" width="600" height="600" class="rule"/>
<path d="M432 124V724 M132 424H732" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<path d="M132 724V108 M132 724H749" fill="none" stroke="#1e293b" stroke-width="1.3"/>
<path d="M132 100L127.5 110H136.5Z M757 724L747 719.5V728.5Z" fill="#1e293b"/>
<text x="148" y="152" class="quadrant">Keep satisfied</text>
<text x="148" y="167" class="action">High power · Low interest</text>
<text x="716" y="390" text-anchor="end" class="quadrant">Manage closely</text>
<text x="716" y="405" text-anchor="end" class="action">High power · High interest</text>
<text x="148" y="690" class="quadrant">Monitor</text>
<text x="148" y="705" class="action">Low power · Low interest</text>
<text x="716" y="690" text-anchor="end" class="quadrant">Keep informed</text>
<text x="716" y="705" text-anchor="end" class="action">Low power · High interest</text>
<!-- Circle radii = 46 × sqrt(size / 6). -->
<circle cx="600" cy="184" r="46" fill="#24618c" stroke="#194660" class="bubble"/>
<text x="542" y="181" text-anchor="end" class="name">Mayor's office</text>
<text x="542" y="194" text-anchor="end" class="value">6</text>
<circle cx="528" cy="268" r="41.99" fill="#c08a2e" stroke="#896222" class="bubble"/>
<text x="582" y="265" class="name">Freight association</text>
<text x="582" y="278" class="value">5</text>
<circle cx="642" cy="472" r="41.99" fill="#3f8f7a" stroke="#2d6658" class="bubble"/>
<text x="588" y="469" text-anchor="end" class="name">Transit riders coalition</text>
<text x="588" y="482" text-anchor="end" class="value">5</text>
<circle cx="402" cy="412" r="37.56" fill="#3f8f7a" stroke="#2d6658" class="bubble"/>
<text x="352" y="399" text-anchor="end" class="name">Neighborhood councils</text>
<text x="352" y="412" text-anchor="end" class="value">4</text>
<circle cx="324" cy="340" r="32.53" fill="#a1543f" stroke="#733e30" class="bubble"/>
<text x="279" y="337" text-anchor="end" class="name">Regional press</text>
<text x="279" y="350" text-anchor="end" class="value">3</text>
<circle cx="240" cy="616" r="26.56" fill="#475569" stroke="#334155" class="bubble"/>
<text x="279" y="613" class="name">Occasional visitors</text>
<text x="279" y="626" class="value">2</text>
<text x="104" y="124" transform="rotate(-90 104 124)" text-anchor="end" class="end">High power</text>
<text x="104" y="724" transform="rotate(-90 104 724)" class="end">Low power</text>
<text x="78" y="424" transform="rotate(-90 78 424)" text-anchor="middle" class="axis">Power</text>
<text x="132" y="750" class="end">Low interest</text>
<text x="732" y="750" text-anchor="end" class="end">High interest</text>
<text x="432" y="774" text-anchor="middle" class="axis">Interest</text>
<!-- External category and nested, bottom-tangent area legend. -->
<rect x="776" y="124" width="236" height="430" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
<text x="794" y="150" class="head">CATEGORY</text>
<g class="bubble">
<circle cx="801" cy="168" r="6.5" fill="#24618c" stroke="#194660"/>
<circle cx="801" cy="194" r="6.5" fill="#c08a2e" stroke="#896222"/>
<circle cx="801" cy="220" r="6.5" fill="#3f8f7a" stroke="#2d6658"/>
<circle cx="801" cy="246" r="6.5" fill="#a1543f" stroke="#733e30"/>
<circle cx="801" cy="272" r="6.5" fill="#475569" stroke="#334155"/>
</g>
<g class="key"><text x="814" y="172">Government</text><text x="814" y="198">Business</text><text x="814" y="224">Community</text><text x="814" y="250">Media</text><text x="814" y="276">Public</text></g>
<path d="M794 302H994" class="rule"/>
<text x="794" y="330" class="head">STAKEHOLDER SCALE</text>
<g fill="none" stroke="#94a3b8" stroke-width="1"><circle cx="846" cy="394" r="46"/><circle cx="846" cy="402.44" r="37.56"/><circle cx="846" cy="413.44" r="26.56"/></g>
<path d="M846 348H912 M846 364.88H912 M846 386.88H912" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
<g class="value"><text x="918" y="352">6</text><text x="918" y="369">4</text><text x="918" y="391">2</text></g>
<path d="M794 464H994" class="rule"/>
<text x="794" y="492" class="head">STAKEHOLDERS</text>
<text x="794" y="514" font-size="13" font-weight="600">6 stakeholder groups</text>
<text x="794" y="532" class="value">across 5 categories</text>
</svg>
