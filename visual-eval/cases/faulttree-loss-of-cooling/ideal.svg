<text x="850" y="755.5" class="label">bus unavailable</text>
<text x="850" y="785" class="id">NORMAL_BUS_FAIL</text>
<path class="wire" d="M 850 795 V 809"/>
<circle class="box" cx="850" cy="831" r="22"/>
<text x="850" y="878" class="prob">p = 0.008</text>
<rect class="box" x="967.5" y="695" width="225" height="100" rx="2"/>
<text x="1080" y="732.5" class="label">Standby diesel generator</text>
<text x="1080" y="755.5" class="label">fails to supply</text>
<text x="1080" y="785" class="id">DG_FAIL</text>
<path class="wire" d="M 1080 795 V 809"/>
<circle class="box" cx="1080" cy="831" r="22"/>
<text x="1080" y="878" class="prob">p = 0.015</text>
<rect class="box" x="447.5" y="475" width="235" height="100" rx="2"/>
<text x="565" y="501.0" class="label">Pump-house flood</text>
<text x="565" y="524.0" class="label">disables pumps</text>
<text x="565" y="547.0" class="label">and switchgear</text>
<text x="565" y="565" class="id">PUMP_HOUSE_FLOOD</text>
<path class="wire" d="M 565 575 V 589"/>
<circle class="box" cx="565" cy="611" r="22"/>
<text x="565" y="658" class="prob">p = 0.001</text>
<rect class="box" x="1167.5" y="475" width="235" height="100" rx="2"/>
<text x="1285" y="501.0" class="label">Pump-house flood</text>
<text x="1285" y="524.0" class="label">disables pumps</text>
<text x="1285" y="547.0" class="label">and switchgear</text>
<text x="1285" y="565" class="id">PUMP_HOUSE_FLOOD</text>
<path class="wire" d="M 1285 575 V 589"/>
<circle class="box" cx="1285" cy="611" r="22"/>
<text x="1285" y="658" class="prob">p = 0.001</text>
<text x="565" y="686" class="id">Same shared event F</text>
<text x="1285" y="686" class="id">Same shared event F</text>
<rect x="40" y="909" width="1360" height="96" rx="4" fill="#eef4f6" stroke="#cedbe1"/>
<text x="720" y="936" class="label">Minimal cut sets: {F}, {Pump A, Pump B}, {Normal bus, Standby diesel}</text>
<text x="720" y="964" class="prob">P(TOP) = 1 − (1 − 0.001)(1 − 0.012²)(1 − 0.008 × 0.015) = 0.001263718737280 ≈ 0.126372%</text>
<text x="720" y="989" class="id">Demand failures are independent except for shared flood F; the repeated flood symbol is counted once.</text>
</svg>