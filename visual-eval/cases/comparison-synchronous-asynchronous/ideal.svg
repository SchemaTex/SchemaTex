<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="973" viewBox="0 0 1600 973" role="img" aria-labelledby="title">
<title id="title">Synchronous and asynchronous communication</title>
<desc>A double-bubble comparison. Synchronous communication has instant answers, meetings and calls, everyone online at once, and suits sensitive conversations. Asynchronous communication lets people reply when ready, works across time zones, and leaves a written record. Both move work forward and need a shared tool.</desc>
<rect width="1600" height="973" fill="#FFFFFF"/>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1B2430; }
.title { font-size:32px; font-weight:600; }
.trait { font-size:19px; font-weight:400; text-anchor:middle; }
.subject { font-size:26px; font-weight:600; fill:#FFFFFF; text-anchor:middle; }
.caption { font-size:18px; font-weight:600; text-anchor:middle; }
.link { stroke:#ADB9C9; stroke-width:2.2; fill:none; }
.bubble { stroke-width:1.8; }
</style>
<text class="title" x="68" y="82">Synchronous and asynchronous communication</text>
<g class="link">
<path d="M 423.24 402.77 L 395.62 303.06"/>
<path d="M 353.03 468.09 L 266.30 437.19"/>
<path d="M 354.77 542.45 L 264.95 579.27"/>
<path d="M 423.33 603.25 L 395.55 703.92"/>
<path d="M 1176.76 402.77 L 1204.38 303.06"/>
<path d="M 1246.97 468.09 L 1333.70 437.19"/>
<path d="M 1245.23 542.45 L 1335.05 579.27"/>
<path d="M 547.71 464.76 L 724.67 394.78"/>
<path d="M 1052.29 464.76 L 875.33 394.78"/>
<path d="M 547.62 541.48 L 724.75 612.03"/>
<path d="M 1052.38 541.48 L 875.25 612.03"/>
</g>
<g><circle class="bubble" cx="374" cy="225" r="81" fill="#E5EDF5" stroke="#28598C"/>
<text class="trait" x="374" y="231">
<tspan x="374" dy="0">Instant answers</tspan>
</text></g>
<g><circle class="bubble" cx="190" cy="410" r="81" fill="#E5EDF5" stroke="#28598C"/>
<text class="trait" x="190" y="404">
<tspan x="190" dy="0">Meetings</tspan>
<tspan x="190" dy="24">and calls</tspan>
</text></g>
<g><circle class="bubble" cx="190" cy="610" r="81" fill="#E5EDF5" stroke="#28598C"/>
<text class="trait" x="190" y="604">
<tspan x="190" dy="0">Everyone online</tspan>
<tspan x="190" dy="24">at once</tspan>
</text></g>
<g><circle class="bubble" cx="374" cy="782" r="81" fill="#E5EDF5" stroke="#28598C"/>
<text class="trait" x="374" y="776">
<tspan x="374" dy="0">Suits sensitive</tspan>
<tspan x="374" dy="24">conversations</tspan>
</text></g>
<g><circle class="bubble" cx="1226" cy="225" r="81" fill="#EEE8F3" stroke="#6B4F8C"/>
<text class="trait" x="1226" y="219">
<tspan x="1226" dy="0">Reply when</tspan>
<tspan x="1226" dy="24">ready</tspan>
</text></g>
<g><circle class="bubble" cx="1410" cy="410" r="81" fill="#EEE8F3" stroke="#6B4F8C"/>
<text class="trait" x="1410" y="404">
<tspan x="1410" dy="0">Works across</tspan>
<tspan x="1410" dy="24">time zones</tspan>
</text></g>
<g><circle class="bubble" cx="1410" cy="610" r="81" fill="#EEE8F3" stroke="#6B4F8C"/>
<text class="trait" x="1410" y="604">
<tspan x="1410" dy="0">Leaves a</tspan>
<tspan x="1410" dy="24">written record</tspan>
</text></g>
<g><circle class="bubble" cx="800" cy="365" r="81" fill="#FFFFFF" stroke="#5F6B7A"/>
<text class="trait" x="800" y="359">
<tspan x="800" dy="0">Moves work</tspan>
<tspan x="800" dy="24">forward</tspan>
</text></g>
<g><circle class="bubble" cx="800" cy="642" r="81" fill="#FFFFFF" stroke="#5F6B7A"/>
<text class="trait" x="800" y="636">
<tspan x="800" dy="0">Needs a</tspan>
<tspan x="800" dy="24">shared tool</tspan>
</text></g>
<g><circle cx="451" cy="503" r="104" fill="#28598C"/><text class="subject" x="451" y="512">Synchronous</text></g>
<g><circle cx="1149" cy="503" r="104" fill="#6B4F8C"/><text class="subject" x="1149" y="512">Asynchronous</text></g>
<text class="caption" x="319" y="917" style="fill:#28598C">Only Synchronous</text>
<text class="caption" x="800" y="917" style="fill:#5F6B7A">Both</text>
