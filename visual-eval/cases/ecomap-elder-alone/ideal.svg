<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 1058" width="836" height="1058">
  <title>Mr. Lewis Living Independently — social-work ecomap</title>
  <desc>A Hartman ecomap for Mr. Lewis Living Independently. At the centre, a dashed blue boundary holds Mr. Lewis, age 82, with the name above a secondary age label. 5 outside systems sit on one ring around it: Senior Center, Next-door Neighbors, Daughter, Home Health Nurse, Paratransit. Each is joined to the centre by a single straight spoke whose drawn form states the quality of the tie: three parallel lines for a strong tie, two for a moderate one, one plain line for an ordinary tie, a thin dashed line for a tenuous tie, a red zigzag for a stressful tie, and a line broken by two ticks for a cut-off tie. Solid triangles show which way support flows. A legend at the foot lists the system tints and every connection code.</desc>
  <rect x="0" y="0" width="836" height="1058" fill="#ffffff"/>
  <text x="46" y="68" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1e293b">Mr. Lewis Living Independently</text>
  <text x="46" y="91" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Social-work ecomap — an older adult living alone with health care, neighbors, and a tenuous transport connection</text>
