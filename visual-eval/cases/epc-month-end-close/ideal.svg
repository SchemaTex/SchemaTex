<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060">
  <title>Month End Close — Event-driven process chain</title>
  <rect width="1200" height="1060" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111">
    <text x="40" y="69" font-size="54" font-weight="700">Month End Close</text>
    <text x="42" y="111" font-size="29">Event-driven process chain (EPC)</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="2.7" stroke-linejoin="miter" marker-end="url(#arrow)">
    <path d="M600 242 V292"/>
    <path d="M600 376 V421"/>
    <path d="M567 454 H340 V542"/>
    <path d="M633 454 H860 V542"/>
    <path d="M340 630 V696"/>
    <path d="M860 630 V696"/>
    <path d="M340 780 V846"/>
    <path d="M860 780 V846"/>
  </g>
  <g fill="white" stroke="#111" stroke-width="2.7">
    <path id="E1" d="M505 154 H695 L725 198 L695 242 H505 L475 198 Z"/>
    <rect id="F1" x="480" y="292" width="240" height="84" rx="12"/>
    <circle id="X1" cx="600" cy="454" r="33"/>
    <path id="E2" d="M245 542 H435 L465 586 L435 630 H245 L215 586 Z"/>
    <path id="E3" d="M765 542 H955 L985 586 L955 630 H765 L735 586 Z"/>
    <rect id="F2" x="220" y="696" width="240" height="84" rx="12"/>
    <rect id="F3" x="740" y="696" width="240" height="84" rx="12"/>
    <path id="E4" d="M245 846 H435 L465 890 L435 934 H245 L215 890 Z"/>
    <path id="E5" d="M765 846 H955 L985 890 L955 934 H765 L735 890 Z"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#111">
    <text x="600" y="190"><tspan x="600">Request</tspan><tspan x="600" dy="29">received</tspan></text>
    <text x="600" y="343">Assess request</text>
    <text x="600" y="467" font-size="38">×</text>
    <text x="340" y="578"><tspan x="340">Request</tspan><tspan x="340" dy="29">approved</tspan></text>
    <text x="860" y="578"><tspan x="860">Request</tspan><tspan x="860" dy="29">rejected</tspan></text>
    <text x="340" y="747">Perform service</text>
    <text x="860" y="747">Notify requester</text>
    <text x="340" y="882"><tspan x="340">Service</tspan><tspan x="340" dy="29">completed</tspan></text>
    <text x="860" y="882"><tspan x="860">Request</tspan><tspan x="860" dy="29">closed</tspan></text>
  </g>
</svg>
