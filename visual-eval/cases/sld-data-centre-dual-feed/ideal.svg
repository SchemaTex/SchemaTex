<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 1101" width="1206" height="1101" role="img">
<title>Data Centre · Dual Feed Critical Power</title>
<desc>Two independent 11 kV utility feeds, drawn as two columns that never share a conductor. On the critical side, feed A passes through transformer A and incomer A into the critical automatic transfer switch, whose emergency side is fed by the 1500 kVA standby generator; the transfer switch feeds the 500 kVA UPS, PDU A and data hall IT load A. On the redundant side, feed B passes through transformer B and incomer B straight to PDU B and data hall IT load B. There is no bus tie between the two systems.</desc>
