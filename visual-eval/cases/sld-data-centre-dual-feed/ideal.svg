<text x="46" y="1035" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">System A and System B are electrically separate — there is no bus tie between them.</text>
<text x="46" y="1055" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">ATS Critical A is drawn in its normal position: closed on Utility Feed A, with Generator G1 on standby.</text>
