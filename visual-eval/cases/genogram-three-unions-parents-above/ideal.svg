<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img">
<title>Three unions, with parents above</title>
<desc>Dana&#x27;s parents Hal and Jo and Chris&#x27;s parents Gus and Fay sit one generation up. Dana&#x27;s union with Mark runs above Chris; Gus and Fay&#x27;s line down to Chris passes under it with a small hop, and the union&#x27;s leg into Dana lands beside the line from her own parents rather than on top of it.</desc>
