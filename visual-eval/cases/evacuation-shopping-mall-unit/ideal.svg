<path d="M1227 287h48" stroke="#00A651" stroke-width="10" stroke-dasharray="19 6"/><use href="#arrow" transform="translate(1239 287) scale(.65)"/><text class="body" x="1287" y="292">Alternative escape route</text>
<text class="section" x="1227" y="325">EXITS AND ASSEMBLY</text>
<use href="#exitRight" transform="translate(1239 349) scale(.75)"/><text class="body" x="1287" y="367">Final exit (ISO 7010 E001/E002)</text>
<use href="#assembly" transform="translate(1239 398) scale(.55)"/><text class="body" x="1287" y="416">Assembly point (E007)</text>
<text class="section" x="1227" y="457">FIRE EQUIPMENT</text>
<use href="#fire" transform="translate(1239 480) scale(.75)"/><text class="body" x="1287" y="497">Fire extinguisher (F001), class marked</text>
<text class="section" x="1227" y="540">YOUR POSITION</text>
<use href="#here" transform="translate(1251 573) scale(.6)"/><text class="body" x="1287" y="577">You are here (ISO 23601 marker)</text>
<text class="section" x="1227" y="623">BUILDING</text>
<path d="M1237 671V648M1237 648a23 23 0 0 1 23 23" class="swing"/><path d="M1237 671V648" class="part"/><text class="body" x="1287" y="666">Door and swing</text>
<path d="M1227 702h17m16 0h15" stroke="#B4BBC2" stroke-width="3.5"/><text class="body" x="1287" y="706">Open connection</text>
<text class="small" x="1227" y="763">Lists every symbol used on this plan (ISO 23601 §6).</text>
<text class="small" x="46" y="807">Original symbol geometry drawn to the visual grammar described in ISO 7010 and ISO 3864-1. Occupant information only — not a fire-service pre-incident plan.</text><text class="small" x="1577" y="807" text-anchor="end">Sheet 1 of 1</text>
