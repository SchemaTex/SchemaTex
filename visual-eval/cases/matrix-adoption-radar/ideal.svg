<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880">
  <title>Learning-technology adoption radar</title>
  <desc>A maturity and instructional-value matrix. Bubble areas are proportional to scale: AI feedback assistant 5, learning management system 9, virtual reality lab 3, and classroom clickers 4.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#172b3a">
    <text x="600" y="61" text-anchor="middle" font-size="32" font-weight="700">Learning-technology adoption radar</text>

    <!-- Plot bounds: x 180–1100; y 150–690. Positions map directly from the DSL. -->
    <path d="M 180 150 H 1100 V 690" fill="none" stroke="#d8e0e6" stroke-width="1.5"/>
    <path d="M 640 150 V 690 M 180 420 H 1100" fill="none" stroke="#d8e0e6" stroke-width="1.5" stroke-dasharray="6 7"/>
    <path d="M 180 690 H 1123 M 180 690 V 124" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 180 690 H 1123" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="180" y="733" font-size="22">Emerging</text>
    <text x="1100" y="733" text-anchor="end" font-size="22">Mature</text>
    <text x="640" y="788" text-anchor="middle" font-size="25" font-weight="600">Maturity →</text>
    <text x="158" y="163" text-anchor="end" font-size="22">High</text>
    <text x="158" y="691" text-anchor="end" font-size="22">Low</text>
    <text transform="translate(66 420) rotate(-90)" text-anchor="middle" font-size="25" font-weight="600">Instructional value →</text>

    <!-- Area = scale × pi × 256. Pilot bubbles share amber styling. -->
    <circle cx="400.8" cy="268.8" r="35.777" fill="#fce9bc" stroke="#a76a0a" stroke-width="2.5"/>
    <text x="400.8" y="276.8" text-anchor="middle" font-size="23" font-weight="700">5</text>
    <text x="400.8" y="334" text-anchor="middle" font-size="23" font-weight="600">AI feedback assistant</text>
    <text x="400.8" y="362" text-anchor="middle" font-size="18" fill="#80520c">pilot</text>

    <circle cx="952.8" cy="247.2" r="48" fill="#245a76" stroke="#173e54" stroke-width="2.5"/>
    <text x="952.8" y="255.2" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">9</text>
    <text x="952.8" y="326" text-anchor="middle" font-size="23" font-weight="600">Learning management</text>
    <text x="952.8" y="354" text-anchor="middle" font-size="23" font-weight="600">system</text>
    <text x="952.8" y="382" text-anchor="middle" font-size="18" fill="#245a76">core</text>

    <circle cx="456" cy="463.2" r="27.713" fill="#fce9bc" stroke="#a76a0a" stroke-width="2.5"/>
    <text x="456" y="471.2" text-anchor="middle" font-size="23" font-weight="700">3</text>
    <text x="456" y="522" text-anchor="middle" font-size="23" font-weight="600">Virtual reality lab</text>
    <text x="456" y="550" text-anchor="middle" font-size="18" fill="#80520c">pilot</text>

    <circle cx="897.6" cy="430.8" r="32" fill="#dce9e6" stroke="#52766c" stroke-width="2.5"/>
    <text x="897.6" y="438.8" text-anchor="middle" font-size="23" font-weight="700">4</text>
    <text x="897.6" y="495" text-anchor="middle" font-size="23" font-weight="600">Classroom clickers</text>
    <text x="897.6" y="523" text-anchor="middle" font-size="18" fill="#426459">established</text>
    <text x="640" y="841" text-anchor="middle" font-size="17" fill="#566675">Bubble area represents relative scale; numbers show size.</text>
  </g>
</svg>
