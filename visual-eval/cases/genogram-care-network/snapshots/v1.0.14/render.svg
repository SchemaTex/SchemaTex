<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1260 554" class="schematex-diagram schematex-genogram" width="1260" height="554"><title>Genogram</title>
<desc>Genogram diagram with 11 individuals across 3 generations</desc>
<defs></defs>
<style>
.schematex-genogram {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
}
.schematex-genogram-shape { fill: #ffffff; stroke: #334155; stroke-width: 2; stroke-linejoin: round; }
.schematex-genogram-male .schematex-genogram-shape { fill: #dbeafe; }
.schematex-genogram-female .schematex-genogram-shape { fill: #fce7f3; }
.schematex-genogram-unknown .schematex-genogram-shape { fill: #f5f5f5; }
.schematex-genogram-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; text-anchor: middle; fill: #0f172a; }
.schematex-genogram-vitals { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
.schematex-genogram-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; fill: #475569; }
.schematex-genogram-edge { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.schematex-genogram-edge-cohabiting path { stroke-dasharray: 6,4; }
.schematex-genogram-edge-cohabiting-ended path { stroke-dasharray: 6,4; }
.schematex-genogram-edge-divorced .schematex-genogram-divorce-mark { stroke: #94a3b8; stroke-width: 2; }
.schematex-genogram-edge-separated .schematex-genogram-separation-mark { stroke: #94a3b8; stroke-width: 2; }
.schematex-genogram-edge-cohabiting-ended .schematex-genogram-separation-mark { stroke: #94a3b8; stroke-width: 2; }
/* Secondary parent-child link (foster/adopted "current caregiver") — dotted, muted */
.schematex-genogram-edge-secondary path { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 2,4; fill: none; opacity: 0.85; }
/* Sibling-of bracket (known relative, unknown ancestry) — dashed */
.schematex-genogram-sibling-of path { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,3; fill: none; opacity: 0.7; }
.schematex-genogram-unknown-siblings-mark { fill: #0f172a; pointer-events: none; }
.schematex-genogram-deceased-mark { stroke: #b71c1c; stroke-width: 2; stroke-linecap: round; }
/* Inline fill on each .schematex-genogram-condition-fill element comes from cond.color. The CSS only sets a default for elements that did not receive an inline fill attribute. */
.schematex-genogram-condition-fill:not([fill]) { fill: #1565c0; }
.schematex-genogram-age { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; pointer-events: none; }
.schematex-genogram-title { fill: #0f172a; }
.schematex-genogram-edge-label { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; }
.schematex-genogram-index-border { stroke: #d97706; stroke-width: 3; fill: none; }
</style>
<g><g><g class="schematex-genogram-edges"><g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="grandfather" data-to="grandmother"><path d="M 140 60 L 220 60" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="grandfather" data-to="grandmother"><path d="M 180 60 L 180 141" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="grandfather+grandmother" data-to="mother"><path d="M 180 60 L 180 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="father" data-to="mother"><path d="M 80 226 L 160 226" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="father" data-to="mother"><path d="M 120 226 L 120 307" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="father+mother" data-to="child"><path d="M 120 226 L 120 372" class="schematex-genogram-edge-path"/></g></g>
<g class="schematex-genogram-sibling-of-edges"></g>
<g class="schematex-genogram-emotional-edges"></g>
<g class="schematex-genogram-generation schematex-genogram-generation-0" data-generation="0"><g class="schematex-genogram-node schematex-genogram-male" data-individual-id="grandfather" transform="translate(120, 60)"><title>偉明 (1948)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="grandmother" transform="translate(240, 60)"><title>美玲 (1950)</title>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="counsellor" transform="translate(400, 60)"><title>學校輔導員 陳老師</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="caseworker" transform="translate(560, 60)"><title>個案社工 王女士</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="neighbour" transform="translate(720, 60)"><title>鄰居 張阿姨</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="child -close- counsellor" transform="translate(880, 60)"><title>學校支持</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="mother -friendship- caseworker" transform="translate(1040, 60)"><title>個案支持</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-unknown" data-individual-id="child -close- neighbour" transform="translate(1200, 60)"><title>鄰里照顧</title>
<polygon points="0,-20 20,0 0,20 -20,0" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-1" data-generation="1"><g class="schematex-genogram-node schematex-genogram-male" data-individual-id="father" transform="translate(60, 226)"><title>建國 (1975)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="mother" transform="translate(180, 226)"><title>麗華 (1977)</title>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-2" data-generation="2"><g class="schematex-genogram-node schematex-genogram-female schematex-genogram-index-person" data-individual-id="child" transform="translate(120, 392)"><title>小安 (2008)</title>
<circle cx="0" cy="0" r="24" class="schematex-genogram-index-border"/>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-labels"><text x="120" y="98" class="schematex-genogram-label" data-individual-id="grandfather">偉明 (b. 1948)</text>
<text x="240" y="98" class="schematex-genogram-label" data-individual-id="grandmother">美玲 (b. 1950)</text>
<text x="400" y="98" class="schematex-genogram-label" data-individual-id="counsellor">學校輔導員 陳老師</text>
<text x="560" y="98" class="schematex-genogram-label" data-individual-id="caseworker">個案社工 王女士</text>
<text x="720" y="98" class="schematex-genogram-label" data-individual-id="neighbour">鄰居 張阿姨</text>
<text x="880" y="98" class="schematex-genogram-label" data-individual-id="child -close- counsellor">學校支持</text>
<text x="1040" y="98" class="schematex-genogram-label" data-individual-id="mother -friendship- caseworker">個案支持</text>
<text x="1200" y="98" class="schematex-genogram-label" data-individual-id="child -close- neighbour">鄰里照顧</text>
<text x="60" y="264" class="schematex-genogram-label" data-individual-id="father">建國 (b. 1975)</text>
<text x="180" y="264" class="schematex-genogram-label" data-individual-id="mother">麗華 (b. 1977)</text>
<text x="120" y="430" class="schematex-genogram-label" data-individual-id="child">小安 (b. 2008)</text></g>
<g class="schematex-genogram-edge-labels"></g></g></g>
<g class="schematex-legend"><style>
.schematex-legend { font-family: system-ui, -apple-system, sans-serif; }
.schematex-legend-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
.schematex-legend-section { font-size: 9px; font-weight: 600; fill: #475569; letter-spacing: 0.6px; }
.schematex-legend-label { font-size: 11px; fill: #0f172a; dominant-baseline: alphabetic; }
</style>
<text x="16" y="514.5" class="schematex-legend-section">SYMBOLS</text>
<g class="schematex-legend-row" data-legend-key="sex.unknown" data-legend-section="symbols"><polygon points="94.55,506 99.55,511 94.55,516 89.55,511" fill="#f5f5f5" stroke="#334155"/>
<text x="113.55" y="514.5" class="schematex-legend-label">Unknown</text></g>
<g class="schematex-legend-row" data-legend-key="sex.other" data-legend-section="symbols"><polygon points="189.55,506 194.55,511 189.55,516 184.55,511" fill="#f5f5f5" stroke="#334155"/>
<text x="208.55" y="514.5" class="schematex-legend-label">Other</text></g>
<text x="16" y="532.5" class="schematex-legend-section">MARKERS</text>
<g class="schematex-legend-row" data-legend-key="marker.index-person" data-legend-section="markers"><rect x="86.55" y="526" width="16" height="6" fill="#fef3c7" stroke="#334155"/><rect x="84.55" y="524" width="20" height="10" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="113.55" y="532.5" class="schematex-legend-label">Index person (focal subject)</text></g></g></svg>