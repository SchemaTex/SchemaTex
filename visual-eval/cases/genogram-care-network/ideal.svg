<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 647" width="925" height="647" role="img">
<title>Care Network</title>
<desc>偉明與美玲是麗華的父母，建國與麗華是焦點人物小安的父母；建國沒有連到上一代的子女支線。虛線菱形標示三位外部聯絡人，小安以雙線弧線連到學校輔導員 陳老師（學校支持）及鄰居 張阿姨（鄰里照顧），麗華以虛線弧線連到個案社工 王女士（個案支持）。</desc>
