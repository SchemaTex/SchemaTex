<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-diagram schematex-phylo" viewBox="0 0 443.20000000000005 160" width="443.20000000000005" height="160"><title>Phylogenetic Tree</title>
<desc>Phylogenetic tree with 5 taxa, phylogram mode, rectangular layout</desc>
<style>.schematex-phylo {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
  font-family: system-ui, -apple-system, sans-serif;
}
.schematex-phylo-branch { fill: none; stroke: #0f172a; stroke-width: 2; stroke-linecap: round; }
.schematex-phylo-branch-connector { fill: none; stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-dendro-axis line { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-dendro-axis text { font-size: 10px; fill: #475569; text-anchor: middle; }
.schematex-phylo-dendro-cut { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.schematex-phylo-dendro-cut-label { font-size: 10px; fill: #dc2626; text-anchor: start; }

.schematex-phylo-tip-label { font-size: 12px; fill: #0f172a; dominant-baseline: central; }
.schematex-phylo-tip-label-italic { font-style: italic; }
.schematex-phylo-support-label { font-size: 9px; fill: #475569; text-anchor: middle; dominant-baseline: auto; }
.schematex-phylo-support-dot { stroke: none; }
.schematex-phylo-scale-bar line { stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-scale-bar text { font-size: 10px; fill: #0f172a; text-anchor: middle; }
.schematex-phylo-scale-tick { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-title { font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
.schematex-phylo-clade-label { font-size: 13px; font-weight: bold; }
.schematex-phylo-root-marker { fill: none; stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-clade-Proteobacteria { stroke: #1565C0; }
.schematex-phylo-clade-bg-Proteobacteria { fill: #1565C0; fill-opacity: 0.12; }
.schematex-phylo-clade-label-Proteobacteria { fill: #1565C0; }</style>
<g class="schematex-phylo-branches"><path d="M 20,30 V 100" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 20,30 H 120.80000000000001" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Proteobacteria" stroke="#1565C0"/>
<path d="M 20,70 H 112.40000000000002" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 20,100 H 230.00000000000003" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 120.80000000000001,20 V 40" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 120.80000000000001,20 H 188.00000000000003" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Proteobacteria" stroke="#1565C0"/>
<path d="M 120.80000000000001,40 H 196.40000000000003" class="schematex-phylo-branch schematex-phylo-branch-internal schematex-phylo-clade-Proteobacteria" stroke="#1565C0"/>
<path d="M 112.40000000000002,60 V 80" class="schematex-phylo-branch schematex-phylo-branch-connector"/>
<path d="M 112.40000000000002,60 H 221.60000000000002" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 112.40000000000002,80 H 230.00000000000006" class="schematex-phylo-branch schematex-phylo-branch-internal"/></g>
<g class="schematex-phylo-nodes"><circle cx="20" cy="65" r="5" class="schematex-phylo-root-marker"/></g>
<g class="schematex-phylo-labels"><text x="194.00000000000003" y="20" class="schematex-phylo-tip-label" data-taxon-id="Escherichia_coli">Escherichia_coli</text>
<text x="202.40000000000003" y="40" class="schematex-phylo-tip-label" data-taxon-id="Pseudomonas_aeruginosa">Pseudomonas_aeruginosa</text>
<text x="227.60000000000002" y="60" class="schematex-phylo-tip-label" data-taxon-id="Bacillus_subtilis">Bacillus_subtilis</text>
<text x="236.00000000000006" y="80" class="schematex-phylo-tip-label" data-taxon-id="Staphylococcus_aureus">Staphylococcus_aureus</text>
<text x="236.00000000000003" y="100" class="schematex-phylo-tip-label" data-taxon-id="Mycobacterium_tuberculosis">Mycobacterium_tuberculosis</text></g>
<g><g class="schematex-phylo-scale-bar"><line x1="20" y1="140" x2="104.00000000000001" y2="140" class="schematex-phylo-scale-bar"/>
<line x1="20" y1="136" x2="20" y2="144" class="schematex-phylo-scale-tick"/>
<line x1="104.00000000000001" y1="136" x2="104.00000000000001" y2="144" class="schematex-phylo-scale-tick"/>
<text x="62.00000000000001" y="156" text-anchor="middle" class="schematex-phylo-scale-bar">0.1</text>
<text x="62.00000000000001" y="168" text-anchor="middle" font-size="9" fill="#475569">substitutions/site</text></g></g></svg>