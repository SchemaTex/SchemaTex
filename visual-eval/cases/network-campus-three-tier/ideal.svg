<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1400" viewBox="0 0 1520 1400">
<title>University Campus Three-Tier Network — WAN edge · core · distribution · access, with three user VLANs</title>
<desc>A campus network drawn as four labelled tier bands stacked down the sheet — edge, core, distribution and access — with the research and Internet WAN above them and the user endpoints below. The campus edge router and the perimeter firewall sit in the edge band, the core switch pair in the core band, the science and library distribution switches in the distribution band, and the two access switches plus the campus Wi-Fi access point in the access band. Every link is annotated with media, speed and either its VLAN trunk list or its access VLAN, and each endpoint wears a chip naming its VLAN.</desc>
