<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-net" role="img" aria-label="University campus three-tier network" width="592.6" height="717" viewBox="0 0 592.6 717" data-diagram-type="network"><title>Network diagram — University campus three-tier network</title>
<desc>12 devices, 11 links, 3 boundaries. Topology: hierarchical. Links: 1 serial, 2 fiber, 6 copper, 1 poe, 1 wireless.</desc>
<style>.sx-net { font-family: system-ui, -apple-system, sans-serif; }
.sx-net-body { fill: #1d6fb8; stroke: #0f3a5f; stroke-width: 2; }
.sx-net-detail { fill: none; stroke: #0f3a5f; stroke-width: 1; }
.sx-net-glyph { fill: #bfe0f7; stroke: none; }
.sx-net-glyph-line { fill: none; stroke: #bfe0f7; stroke-width: 1.4; }
.sx-net-icontext { font: 700 8px sans-serif; fill: #bfe0f7; }
.sx-net-icontag { font: 700 8px sans-serif; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 2.5px; stroke-linejoin: round; }
.sx-net-cloud-body { fill: #ffffff; stroke: #334155; stroke-width: 2; }
.sx-net-cloudtext { font: 600 13px sans-serif; fill: #0f172a; }
.sx-net-bus { stroke: #0f3a5f; stroke-width: 4; stroke-linecap: round; }
.sx-net-label { font: 12px sans-serif; fill: #0f172a; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.sx-net-sublabel { font: 10px sans-serif; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.sx-net-link { fill: none; stroke-width: 2; }
.sx-net-link-wireless, .sx-net-link-vpn { stroke-dasharray: 5 4; }
.sx-net-link-lag { stroke-width: 3; }
.sx-net-linklabel { font: 9px sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.sx-net-port { font: 8px sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 2.5px; stroke-linejoin: round; }
.sx-net-boundary-site { fill: none; stroke: #334155; stroke-width: 1.5; }
.sx-net-boundary-rack { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 1 2; }
.sx-net-boundary-subnet, .sx-net-boundary-vlan { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; stroke-dasharray: 5 3; }
.sx-net-boundary-zone, .sx-net-boundary-dmz { fill: none; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 3; }
.sx-net-boundary-label { font: 600 10px sans-serif; }
.sx-net-title { font: 700 16px sans-serif; fill: #0f172a; }</style>
