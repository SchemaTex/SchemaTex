<desc>12 devices, 11 links, 4 boundaries. Topology: hierarchical. Links: 1 serial, 2 fiber, 6 copper, 1 poe, 1 wireless.</desc>
<style>.sx-net { font-family: Inter, "Helvetica Neue", sans-serif; }
.sx-net-body { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; }
