<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800">
  <title>Warehouse coaching: skill and will</title>
  <desc>Current observations for a warehouse shift. Skill increases to the right and will increases upward. Rina is in Delegate and develop; Mateo is in Coach skills; Jordan is in Address motivation; Sam is in Direct closely.</desc>
  <defs>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 22px; font-weight: 600; }
      .subtitle { font-size: 13px; fill: #475569; }
      .quadrant { font-size: 13px; font-weight: 600; fill: #475569; }
      .employee { font-size: 12px; font-weight: 500; }
      .axis-title { font-size: 12px; font-weight: 600; }
      .axis-end { font-size: 11px; fill: #475569; }
      .legend-head { font-size: 11px; font-weight: 600; letter-spacing: .7px; fill: #475569; }
      .point { fill: #24618c; fill-opacity: .85; stroke: #1b4963; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1060" height="800" fill="#ffffff"/>
  <text x="48" y="46" class="title">Warehouse coaching: skill and will</text>
  <text x="48" y="74" class="subtitle">Current observations for the warehouse shift. Skill increases to the right; will increases upward.</text>

  <rect x="132" y="124" width="300" height="300" fill="#E6E9ED"/>
  <rect x="432" y="124" width="300" height="300" fill="#F6F5F4"/>
  <rect x="132" y="424" width="300" height="300" fill="#F1F3F6"/>
  <rect x="432" y="424" width="300" height="300" fill="#FCFBFB"/>
  <rect x="132" y="124" width="600" height="600" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M432 124V724 M132 424H732" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <text x="148" y="152" class="quadrant">Coach skills</text>
  <text x="716" y="152" text-anchor="end" class="quadrant">Delegate and develop</text>
  <text x="148" y="690" class="quadrant">Direct closely</text>
  <text x="716" y="690" text-anchor="end" class="quadrant">Address motivation</text>

  <circle cx="624" cy="232" r="20" class="point"/>
  <text x="624" y="271" text-anchor="middle" class="employee">Rina — forklift lead</text>
  <circle cx="288" cy="280" r="20" class="point"/>
  <text x="288" y="319" text-anchor="middle" class="employee">Mateo — new picker</text>
  <circle cx="600" cy="556" r="20" class="point"/>
  <text x="600" y="595" text-anchor="middle" class="employee">Jordan — experienced picker</text>
  <circle cx="276" cy="580" r="20" class="point"/>
  <text x="276" y="619" text-anchor="middle" class="employee">Sam — new starter</text>

  <path d="M132 109V724H748" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <path d="M132 100L127.5 110H136.5Z M756 724L746 719.5V728.5Z" fill="#1e293b"/>
  <text x="132" y="750" class="axis-end">Low skill</text>
  <text x="732" y="750" text-anchor="end" class="axis-end">High skill</text>
  <text x="432" y="774" text-anchor="middle" class="axis-title">Skill</text>
  <text transform="translate(104 124) rotate(-90)" text-anchor="end" class="axis-end">High will</text>
  <text transform="translate(104 724) rotate(-90)" class="axis-end">Low will</text>
  <text transform="translate(78 424) rotate(-90)" text-anchor="middle" class="axis-title">Will</text>

  <rect x="776" y="124" width="236" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="794" y="150" class="legend-head">CATEGORY</text>
  <circle cx="801" cy="168" r="6.5" class="point"/>
  <text x="814" y="172" font-size="12">Team</text>
</svg>
