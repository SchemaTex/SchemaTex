<path class="rule" d="M861 294H1477"/>
<g><text x="861" y="324">Lot 1</text><text x="1175" y="324">140 × 96</text><text x="1476" y="324" text-anchor="end">13,440</text>
<text x="861" y="354">Lot 2</text><text x="1175" y="354">140 × 96</text><text x="1476" y="354" text-anchor="end">13,440</text>
<text x="861" y="384">Lot 3</text><text x="1175" y="384">140 × 96</text><text x="1476" y="384" text-anchor="end">13,440</text>
<text x="861" y="414">Lot 4</text><text x="1175" y="414">140 × 96</text><text x="1476" y="414" text-anchor="end">13,440</text></g>
<path class="rule" d="M861 426H1477"/>
<text x="861" y="456" font-weight="700">Total lot area</text><text x="1476" y="456" text-anchor="end" font-weight="700">53,760</text>
