<text class="head" x="861" y="550">FEATURE</text><text class="head" x="1476" y="550" text-anchor="end">WIDTH (FT)</text>
<path class="rule" d="M861 562H1477"/>
<text x="861" y="591">Willow Grove Drive</text><text x="1476" y="591" text-anchor="end">24</text>
<text x="861" y="621">Cedar Lane</text><text x="1476" y="621" text-anchor="end">22</text>
<text x="861" y="651">Utility easement · continuous north–south</text><text x="1476" y="651" text-anchor="end">10</text>
<text class="head" x="861" y="719">SETBACKS (FT)</text>
<text class="head" x="861" y="753">LOT LINE</text><text class="head" x="1260" y="753">PARCEL</text><text class="head" x="1476" y="753" text-anchor="end">DISTANCE</text>
<path class="rule" d="M861 765H1477"/>
