<svg xmlns="http://www.w3.org/2000/svg" width="1538" height="1600" viewBox="0 0 1538 1600">
<title>Willow Grove Subdivision — Early-planning site plan</title>
<defs>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1F2328;font-size:17px} .title{font-size:32px;font-weight:700}.sub{font-size:19px;fill:#737D8A}.head{font-size:14px;letter-spacing:1.5px;fill:#737D8A;font-weight:700}.small{font-size:15px;fill:#737D8A}.label{font-size:20px;font-weight:700;letter-spacing:1px}.note{font-size:16px;fill:#55606C}.rule{stroke:#A3ABB4;stroke-width:1}.boundary{stroke:#1F2328;stroke-width:3.5;stroke-dasharray:34 7 6 7 6 7;fill:none}.setback{stroke:#55606C;stroke-width:1.8;stroke-dasharray:13 8;fill:none}.ease{stroke:#55606C;stroke-width:1.8;stroke-dasharray:25 7 6 7;fill:none}.dim{stroke:#A3ABB4;stroke-width:1.2;fill:none}.tick{stroke:#1F2328;stroke-width:2.3}.street{font-size:17px;font-weight:700;letter-spacing:1.8px}
</style>
</defs>
<rect width="1538" height="1600" fill="#FFFFFF"/>
<text class="title" x="61" y="77">Willow Grove Subdivision — Site Plan</text>
<text class="sub" x="61" y="112">Willow Grove tract · 66,000 sf · four-lot subdivision · dimensions in feet</text>
<path class="rule" d="M61 135H1477"/>
<!-- Plan: 2.1 drawing units per foot; north up; DSL origin at lower left. -->
<rect x="122" y="420" width="630" height="462" fill="#F7F5EF"/>
<!-- Four fully enclosed lots -->
<g fill="#E8F5E9" stroke="#1F2328" stroke-width="2">
<rect x="122" y="680.4" width="294" height="201.6"/>
<rect x="458" y="680.4" width="294" height="201.6"/>
<rect x="122" y="420" width="294" height="201.6"/>
<rect x="458" y="420" width="294" height="201.6"/>
</g>
<!-- Continuous intersecting roads, exact widths 24 and 22 feet -->
<path d="M80 625.8H413.9V378H460.1V625.8H794V676.2H460.1V924H413.9V676.2H80Z" fill="#EDEFF2" stroke="#55606C" stroke-width="1.7"/>
<path d="M80 651H794 M437 378V924" fill="none" stroke="#A3ABB4" stroke-width="1.1" stroke-dasharray="28 8 6 8"/>
<!-- Utility easement centerline extends continuously from tract edge to edge -->
<path class="ease" d="M426.5 420V882"/>
<!-- Tract perimeter -->
<rect class="boundary" x="122" y="420" width="630" height="462"/>
<!-- Lot 1 setback lines at y=25 and y=76 -->
<path class="setback" d="M122 829.5H416 M122 722.4H416"/>
<text class="note" x="269" y="713" text-anchor="middle">20 ft rear setback</text>
<text class="note" x="269" y="853" text-anchor="middle">25 ft front setback</text>
<!-- Lot labels -->
<g text-anchor="middle">
<text class="label" x="269" y="771">LOT 1</text><text class="small" x="269" y="797">140′ × 96′ · 13,440 sf</text>
<text class="label" x="605" y="775">LOT 2</text><text class="small" x="605" y="801">140′ × 96′ · 13,440 sf</text>
<text class="label" x="269" y="516">LOT 3</text><text class="small" x="269" y="542">140′ × 96′ · 13,440 sf</text>
<text class="label" x="605" y="516">LOT 4</text><text class="small" x="605" y="542">140′ × 96′ · 13,440 sf</text>
</g>
<!-- Street name masks only the road centerline -->
<rect x="145" y="638" width="249" height="25" fill="#EDEFF2"/>
<text class="street" x="269" y="657" text-anchor="middle">WILLOW GROVE DRIVE</text>
<g transform="translate(448 516) rotate(-90)"><rect x="-70" y="-13" width="140" height="25" fill="#EDEFF2"/><text class="street" text-anchor="middle" y="6">CEDAR LANE</text></g>
<!-- Easement annotation inside its corridor; continuous stroke remains visible -->
<g transform="translate(435 785) rotate(-90)"><text x="0" y="0" text-anchor="middle" style="font-size:13px;fill:#55606C">10 ft utility easement</text></g>
<!-- Overall dimension 14 feet below origin -->
<path class="dim" d="M122 888V922 M752 888V922 M122 911.4H752"/>
<path class="tick" d="M115 918.4l14 -14 M745 918.4l14 -14"/>
<rect x="352" y="898" width="170" height="26" fill="white"/>
<text x="437" y="918" text-anchor="middle">300 ft overall</text>
<!-- Plan qualification below drawing -->
<text class="small" x="122" y="983">Early-planning subdivision diagram.</text>
<text class="small" x="122" y="1008">Lot and setback dimensions are illustrative,</text>
<text class="small" x="122" y="1033">not survey or permit data.</text>
<!-- Right side information, same hierarchy as exemplar -->
