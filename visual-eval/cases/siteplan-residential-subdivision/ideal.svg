<g transform="translate(861 1493)">
<g class="small" text-anchor="middle"><text x="0" y="-8">0</text><text x="105" y="-8">50</text><text x="210" y="-8">100</text><text x="315" y="-8">150</text></g>
<rect width="105" height="9" fill="#1F2328"/><rect x="105" width="105" height="9" fill="white"/><rect x="210" width="105" height="9" fill="#1F2328"/><rect width="315" height="9" fill="none" stroke="#1F2328"/>
<text class="small" x="333" y="9">ft</text><text class="head" y="37">GRAPHIC SCALE</text>
</g>
<g transform="translate(1443 1496)"><text x="0" y="-35" text-anchor="middle" font-weight="700" font-size="20">N</text><circle r="26" fill="none" stroke="#A3ABB4" stroke-width="1.5"/><path d="M0 -21L-9 12L0 7Z" fill="#1F2328"/><path d="M0 -21L9 12L0 7Z" fill="white" stroke="#1F2328" stroke-width="1.5"/></g>
