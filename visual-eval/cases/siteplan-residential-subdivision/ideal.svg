<path class="boundary" d="M861 988H930"/><text x="947" y="994">Tract boundary</text>
<path d="M861 1022H930" stroke="#1F2328" stroke-width="2"/><text x="947" y="1028">Lot boundary</text>
<path class="setback" d="M861 1056H930"/><text x="947" y="1062">Setback line</text>
