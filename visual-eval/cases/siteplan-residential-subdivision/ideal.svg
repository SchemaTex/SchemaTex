<rect x="1186" y="977" width="49" height="22" fill="#E8F5E9" stroke="#1F2328" stroke-width="2"/><text x="1263" y="994">Subdivision lot</text>
<rect x="1186" y="1011" width="49" height="22" fill="#EDEFF2" stroke="#55606C" stroke-width="1.5"/><text x="1263" y="1028">Road paving</text>
<path d="M1186 1056H1250" stroke="#A3ABB4" stroke-width="1.2" stroke-dasharray="28 7 6 7"/><text x="1263" y="1062">Road centreline</text>
