<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1029 1082" width="1029" height="1082" role="img">
<title>Commercial PV Interconnection</title>
<desc>Three PV arrays land on a 600 V DC combiner, then run through the DC isolator into the 200 kW grid-tie inverter. On the AC side the inverter feeds the 400 A breaker and the production meter onto the 400 V main switchboard, which the utility also supplies; the building loads hang below the switchboard. The dashed rule marks where the DC section ends and the AC section begins.</desc>
