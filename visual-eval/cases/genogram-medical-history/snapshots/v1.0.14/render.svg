<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940.4 572" class="schematex-diagram schematex-genogram" width="940.4" height="572"><title>Genogram</title>
<desc>Genogram diagram with 12 individuals across 3 generations</desc>
<defs><clipPath id="schematex-genogram-clip-half-left-rect" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0.5" height="1"/></clipPath>
<clipPath id="schematex-genogram-clip-half-left-circle" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0.5" height="1"/></clipPath>
<clipPath id="schematex-genogram-clip-half-right-rect" clipPathUnits="objectBoundingBox"><rect x="0.5" y="0" width="0.5" height="1"/></clipPath>
