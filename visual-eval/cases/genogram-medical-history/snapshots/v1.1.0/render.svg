<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 592.7799999999997 651" class="schematex-diagram schematex-genogram" width="592.7799999999997" height="651"><title>Genogram: The Wilson Family Medical History</title>
<desc>Genogram diagram with 7 individuals across 3 generations</desc>
