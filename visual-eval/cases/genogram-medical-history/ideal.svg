<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 713" width="584" height="713" role="img">
<title>The Wilson Family Medical History</title>
<desc>Three Wilson generations show Robert’s crossed, split-colour square and Emma’s split-colour index circle, with full fills for single diagnoses and a colour-keyed medical legend. Names, life dates, and haloed ages remain readable. Robert and Helen are parents of David and Linda; David and Susan are parents of Emma and James. Robert has coronary artery disease and type 2 diabetes; Helen and Susan have major depressive disorder; David has type 2 diabetes; Linda has asthma; Emma has major depressive disorder and asthma; James has no condition fill.</desc>
