<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1010" viewBox="0 0 2200 1010" role="img" font-family="Helvetica Neue, Helvetica, sans-serif"><title>Patient medication error</title><desc>Independent reference drawing following the current exemplar. Threats and prevention on the left · consequences and mitigation on the right</desc><rect width="2200" height="1010" fill="white"/><text x="40" y="45" font-size="25" fill="#0f172a" text-anchor="start" font-weight="600">Patient medication error</text><text x="40" y="73" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Threats and prevention on the left · consequences and mitigation on the right</text><rect x="890.0" y="95" width="420" height="58" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="1100.0" y="127.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="400">High-alert intravenous medication</text><path d="M1100.0 153V350.0" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M260 220H724L1015.0 450.0" stroke="#334155" stroke-width="1.8" fill="none" /><rect x="40" y="182" width="220" height="76" rx="7" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><text x="150.0" y="214.5" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">Look-alike or sound-alike</text><text x="150.0" y="235.5" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="400">drug selection</text><rect x="310" y="182" width="190" height="76" rx="7" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="405.0" y="214.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400">Tall-man lettering and</text><text x="405.0" y="234.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400">segregated storage</text><rect x="534" y="182" width="190" height="76" rx="7" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="629.0" y="224.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="400">Pharmacy verification