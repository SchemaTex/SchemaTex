<style>.sx-fc { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.sx-fc-node { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; stroke-linejoin: round; }
.sx-fc-node-stadium { fill: #dbeafe; stroke: #334155; }
.sx-fc-node-diamond { fill: #fef3c7; stroke: #334155; }
.sx-fc-node-round { fill: #dcfce7; stroke: #334155; }
.sx-fc-node-text { fill: #0f172a; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
.sx-fc-icon { stroke: #0f172a; fill: none; }
.sx-fc-icon-fill { fill: #0f172a; stroke: none; }
/* Semantic class presets (applied via 'class A start') — override shape fills */
.sx-fc-class-start    > .sx-fc-node { fill: #f0ece0; stroke: #9a8b6a; }
.sx-fc-class-start    > .sx-fc-node-text { fill: #5c4e2e; font-weight: 600; }
.sx-fc-class-process  > .sx-fc-node { fill: #e8e4ff; stroke: #8b7dd8; }
.sx-fc-class-process  > .sx-fc-node-text { fill: #4c3a8f; font-weight: 600; }
.sx-fc-class-decision > .sx-fc-node { fill: #fde8c8; stroke: #d4985c; }
.sx-fc-class-decision > .sx-fc-node-text { fill: #8a5a1f; font-weight: 600; }
.sx-fc-class-success  > .sx-fc-node { fill: #d4f0e0; stroke: #7bc19a; }
.sx-fc-class-success  > .sx-fc-node-text { fill: #1e5a3a; font-weight: 600; }
.sx-fc-class-danger   > .sx-fc-node { fill: #fbe0dc; stroke: #d89181; }
.sx-fc-class-danger   > .sx-fc-node-text { fill: #8a3525; font-weight: 600; }
.sx-fc-class-neutral  > .sx-fc-node { fill: #ececec; stroke: #a0a0a0; }
.sx-fc-class-neutral  > .sx-fc-node-text { fill: #555555; font-weight: 600; }
.sx-fc-edge { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sx-fc-edge-thick { stroke: #334155; stroke-width: 2.4; }
.sx-fc-edge-dashed { stroke-dasharray: 5 3; }
.sx-fc-edge-dotted { stroke-dasharray: 1.5 3; }
.sx-fc-edge-label { fill: #475569; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
.sx-fc-edge-label-bg { fill: #ffffff; fill-opacity: 0.96; stroke: #94a3b8; stroke-width: 0.5; }
.sx-fc-title { fill: #0f172a; font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
/* Shape sub-elements */
.sx-fc-node-subline { fill: none; stroke: #334155; stroke-width: 1.5; }
.sx-fc-node-arc { fill: none; stroke: #334155; stroke-width: 1.5; }
.sx-fc-node-ring { fill: none; stroke: #334155; stroke-width: 1.8; }
/* Cluster (subgraph) */
.sx-fc-cluster { fill: #f1f5f9; fill-opacity: 0.35; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5,3; }
.sx-fc-cluster-title { fill: #475569; font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; }</style>
