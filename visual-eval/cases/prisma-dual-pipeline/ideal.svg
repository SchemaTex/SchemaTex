<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510">
<title>Community interventions for heat-health protection — PRISMA 2020 dual-source systematic review</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="1400" height="1510" fill="white"/>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#172b3a;font-size:22px} .box{fill:#fff;stroke:#334155;stroke-width:2} .head{font-weight:700;font-size:24px} .small{font-size:19px} .line{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)} .stage{fill:#eaf0f4;stroke:#334155;stroke-width:1.5}</style>
<text x="700" y="51" text-anchor="middle" font-size="32" font-weight="700">Community interventions for heat-health protection</text>
<text x="700" y="87" text-anchor="middle">Systematic review · PRISMA 2020 · Dual-source identification</text>
<!-- Identification: separate source boxes -->
<rect class="stage" x="30" y="125" width="65" height="415" rx="4"/>
<text transform="translate(71 333) rotate(-90)" text-anchor="middle" class="head">Identification</text>
<rect class="box" x="135" y="125" width="520" height="175" rx="5"/>
<text x="160" y="163" class="head">Records identified from databases</text>
<text x="160" y="197">n = 1,800</text>
<text x="160" y="231">MEDLINE = 700 · Embase = 600</text>
<text x="160" y="265">Scopus = 500</text>
<rect class="box" x="830" y="125" width="520" height="175" rx="5"/>
<text x="855" y="163" class="head">Records identified from other sources</text>
<text x="855" y="197">n = 120</text>
<text x="855" y="231">Trial registers = 70</text>
<text x="855" y="265">Citation search = 50</text>
<rect class="box" x="830" y="335" width="520" height="165" rx="5"/>
<text x="855" y="373" class="head">Database records removed</text>
<text x="855" y="409">Duplicates removed: n = 360</text>
<text x="855" y="445">Ineligible by automation: n = 40</text>
<text x="855" y="479" class="small">Total removed: 400</text>
<path class="line" d="M395 300 V580"/>
<path class="line" d="M395 335 H800 V365 H830"/>
<text x="155" y="454" class="small">Database records remaining:</text>
<text x="155" y="485" font-weight="700">1,800 − 360 − 40 = 1,400</text>
<!-- Other records merge, while preserving the supplied screened count -->
<path class="line" d="M1090 300 H1380 V557 H675 V625 H655"/>
<text x="915" y="546" class="small">120 other-source records</text>
<rect class="stage" x="30" y="580" width="65" height="335" rx="4"/>
<text transform="translate(71 748) rotate(-90)" text-anchor="middle" class="head">Screening</text>
<rect class="box" x="135" y="580" width="520" height="145" rx="5"/>
<text x="160" y="619" class="head">Records screened</text>
<text x="160" y="658">n = 1,400 (as supplied)</text>
<text x="160" y="698" class="small">Both identification routes feed this pipeline.</text>
<rect class="box" x="830" y="580" width="520" height="170" rx="5"/>
<text x="855" y="618" class="head">Records excluded: n = 1,100</text>
<text x="855" y="654">Irrelevant title = 700</text>
<text x="855" y="690">Wrong geography = 220</text>
<text x="855" y="726">Duplicate = 180</text>
<path class="line" d="M655 673 H830"/>
<path class="line" d="M395 725 V805"/>
<text x="415" y="777" class="small">1,400 − 1,100 = 300</text>
<rect class="box" x="135" y="805" width="520" height="100" rx="5"/>
<text x="160" y="843" class="head">Reports sought for retrieval</text>
<text x="160" y="879">n = 300</text>
<rect class="box" x="830" y="805" width="520" height="100" rx="5"/>
<text x="855" y="843" class="head">Reports not retrieved</text>
<text x="855" y="879">n = 20</text>
<path class="line" d="M655 855 H830"/>
<path class="line" d="M395 905 V985"/>
<text x="415" y="955" class="small">300 − 20 = 280</text>
<rect class="stage" x="30" y="985" width="65" height="180" rx="4"/>
<text transform="translate(71 1075) rotate(-90)" text-anchor="middle" class="head">Eligibility</text>
<rect class="box" x="135" y="985" width="520" height="115" rx="5"/>
<text x="160" y="1027" class="head">Full-text reports assessed for eligibility</text>
<text x="160" y="1069">n = 280</text>
<rect class="box" x="830" y="985" width="520" height="180" rx="5"/>
<text x="855" y="1023" class="head">Reports excluded: n = 230</text>
<text x="855" y="1061">Wrong intervention = 100</text>
<text x="855" y="1099">Wrong outcome = 75</text>
<text x="855" y="1137">Wrong design = 55</text>
<path class="line" d="M655 1043 H830"/>
<path class="line" d="M395 1100 V1220"/>
<rect class="stage" x="30" y="1220" width="65" height="125" rx="4"/>
<text transform="translate(71 1283) rotate(-90)" text-anchor="middle" class="head">Included</text>
<rect x="135" y="1220" width="520" height="125" rx="5" fill="#eaf0f4" stroke="#334155" stroke-width="2.5"/>
<text x="160" y="1260" class="head">Included in review</text>
<text x="160" y="1305" font-size="27" font-weight="700">50 studies · 54 reports</text>
<!-- The supplied DSL contains two count inconsistencies; expose rather than invent data. -->
<text x="135" y="1400" class="small" font-weight="700">Count notes — supplied values retained:</text>
<text x="135" y="1431" class="small">The databases yield 1,400 records before merging; the 120 other-source records are not reconciled in the screened total.</text>
<text x="135" y="1462" class="small">280 assessed − 230 excluded = 50 reports, whereas the supplied inclusion total is 54 reports across 50 studies.</text>
</svg>
