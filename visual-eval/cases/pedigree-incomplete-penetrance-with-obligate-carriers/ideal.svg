<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 615" width="640" height="615">
<title>Incomplete penetrance with obligate carriers</title>
<desc>Three-generation autosomal dominant pedigree with incomplete penetrance. Affected male I-1 is mated to unaffected female I-2; their children are II-1, a clinically unaffected female drawn with a central dot as an obligate carrier, and affected male II-2. II-1 is mated to unaffected male II-3, who married into the family; their children are affected male III-1, the proband, and unaffected female III-2. The variant therefore passes from I-1 through the unaffected carrier II-1 to the affected III-1.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="640" height="615" fill="#ffffff"/>
<rect x="22" y="513" width="358.25" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="320" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">Incomplete penetrance with obligate carriers</text>
<text x="26" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
<text x="26" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">II</text>
<text x="26" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">III</text>
<line x1="295" y1="90" x2="355" y2="90" stroke="#334155" stroke-width="2"/>
<line x1="325" y1="90" x2="325" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="250" y1="170" x2="400" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="250" y1="170" x2="250" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="400" y1="170" x2="400" y2="240" stroke="#334155" stroke-width="2"/>
<line x1="160" y1="260" x2="230" y2="260" stroke="#334155" stroke-width="2"/>
<line x1="195" y1="260" x2="195" y2="340" stroke="#334155" stroke-width="2"/>
<line x1="140" y1="340" x2="280" y2="340" stroke="#334155" stroke-width="2"/>
<line x1="140" y1="340" x2="140" y2="410" stroke="#334155" stroke-width="2"/>
<line x1="280" y1="340" x2="280" y2="410" stroke="#334155" stroke-width="2"/>
<g class="person" data-id="I-1"><rect x="255" y="70" width="40" height="40" fill="#1565c0"/><rect x="255" y="70" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="275" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">I-1</text></g>
<g class="person" data-id="I-2"><circle cx="375" cy="90" r="20" fill="none" stroke="#334155" stroke-width="2"/><text x="375" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">I-2</text></g>
<g class="person" data-id="II-3"><rect x="120" y="240" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="140" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-3</text></g>
<g class="person" data-id="II-1"><circle cx="250" cy="260" r="20" fill="none" stroke="#334155" stroke-width="2"/><circle cx="250" cy="260" r="4.5" fill="#1565c0"/><text x="250" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-1</text></g>
<g class="person" data-id="II-2"><rect x="380" y="240" width="40" height="40" fill="#1565c0"/><rect x="380" y="240" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="400" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">II-2</text></g>
<g class="person" data-id="III-1"><rect x="120" y="410" width="40" height="40" fill="#1565c0"/><rect x="120" y="410" width="40" height="40" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="140" y="468" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">III-1</text></g>
