<line x1="92" y1="478" x2="116" y2="454" stroke="#334155" stroke-width="2" marker-end="url(#pa)"/><text x="80" y="483" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">P</text>
