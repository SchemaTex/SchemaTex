<circle cx="263.92" cy="534" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><circle cx="263.92" cy="534" r="3.2" fill="#1565c0"/>
<text x="280.92" y="538" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Obligate carrier</text>
<text x="34" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.6" fill="#475569">SYMBOLS</text>
<line x1="156" y1="573" x2="171" y2="558" stroke="#334155" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="182" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#0f172a">Proband (P)</text>
