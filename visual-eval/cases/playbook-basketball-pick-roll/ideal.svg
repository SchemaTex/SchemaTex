<title>High pick and roll — centre screens, rolls and finishes the pocket pass</title>
<desc>Spread pick-and-roll against man defense. 5 screens for 1, 1 dribbles to the right at 11,17, 5 rolls to the rim, 3 cuts to the right corner, and 1 delivers a pocket pass to 5 for a shot.</desc>
