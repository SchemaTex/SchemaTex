<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 1034" width="812" height="1034">
  <title>Garcia Family After Job Loss — social-work ecomap</title>
  <desc>A Hartman ecomap for Garcia Family After Job Loss. At the centre, a dashed blue boundary holds the household, Garcia Family. 6 outside systems sit on one ring around it: Children's School, Workforce Center, Landlord, Food Bank, Extended Family, Unemployment Benefits. Each is joined to the centre by a single straight spoke whose drawn form states the quality of the tie: three parallel lines for a strong tie, two for a moderate one, one plain line for an ordinary tie, a thin dashed line for a tenuous tie, a red zigzag for a stressful tie, and a line broken by two ticks for a cut-off tie. Solid triangles show which way support flows. A legend at the foot lists the system tints and every connection code.</desc>
  <rect x="0" y="0" width="812" height="1034" fill="#ffffff"/>
  <text x="46" y="68" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1e293b">Garcia Family After Job Loss</text>
  <text x="46" y="91" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Social-work ecomap — family after job loss, showing financial strain alongside family, benefits, and employment support</text>
