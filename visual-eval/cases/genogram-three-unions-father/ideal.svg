<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640" role="img">
<title>One parent, three marriages</title>
<desc>Walter married Ruth in 1962 (she died in 1975), Carol in 1977 (divorced 1983, no children) and June in 1985. Ruth and Carol stand to Walter&#x27;s left in order, June to his right. The marriage to Ruth passes over Carol; it ends in Ruth&#x27;s death, so it carries no divorce slashes. Paul and Anne descend from Walter and Ruth, Ben and Lucy from Walter and June.</desc>
