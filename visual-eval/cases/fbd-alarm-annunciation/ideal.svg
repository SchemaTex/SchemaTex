<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1260" viewBox="0 0 1140 1260" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><title>Pressure alarm annunciation</title><desc>Hand-authored IEC FBD reference; source blocks, expressions, negations and literals preserved.</desc><rect width="1140" height="1260" fill="white"/><text x="48" y="51" font-size="25" font-weight="600" text-anchor="start" fill="#20272B">Pressure alarm annunciation</text>
