<text x="48" y="1212" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">Open input circle = logical inversion.  Triangle at CU = rising-edge counter input.</text>
<text x="48" y="1232" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">Instance names sit above blocks; named variables connect separate networks.</text></svg>