<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1092" width="680" height="1092" role="img">
<title>Battery Energy Storage Plant</title>
<desc>A 33 kV grid point of connection feeds the POC breaker and the 33 kV collector bus. A 10 MVA 33 kV / 690 V step-up transformer and the PCS AC breaker carry the AC side down to the bidirectional 5 MW / 10 MWh power conversion system. Below it, on the DC side of the section divide, the plant splits into two 1000 V DC battery strings, each through its own 1600 A DC isolator.</desc>
