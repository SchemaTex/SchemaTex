<g transform="translate(34, 128)" data-block-id="control" data-block-role="controller"><rect width="197" height="54" fill="#dbeafe" class="schematex-bd-block" rx="4"/>
<text x="98.5" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="98.5" dy="0">Streaming Control Plane</tspan></text></g></g>
<g class="schematex-bd-branches"><circle cx="231" cy="155" r="3.5" class="schematex-bd-branch"/></g></g></svg>