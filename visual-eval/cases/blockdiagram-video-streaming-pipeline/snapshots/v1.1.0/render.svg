<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-bd" viewBox="0 0 2233 290" width="2233" height="290" role="img" data-diagram-type="blockdiagram"><title>Video streaming pipeline</title>
<desc>Block diagram with 7 blocks, 0 summing junctions, 7 signals</desc>
<defs><style>.schematex-bd { font-family: "Inter", "Helvetica Neue", Helvetica, sans-serif; }
.schematex-bd-block { stroke: #16202b; stroke-width: 1.5; }
.schematex-bd-tf { font-size: 14px; font-weight: 600; fill: #16202b; }
.schematex-bd-block-name { font: 10px sans-serif; fill: #63707f; }
.schematex-bd-sum { fill: #ffffff; stroke: #16202b; stroke-width: 1.5; }
.schematex-bd-sum-sign { font: bold 11px sans-serif; fill: #16202b; }
.schematex-bd-signal { stroke: #16202b; stroke-width: 1.5; fill: none; }
.schematex-bd-signal-discrete { stroke: #16202b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
.schematex-bd-signal-label-bg { fill: #ffffff; opacity: .94; stroke: none; }
.schematex-bd-signal-label { font-size: 12px; font-style: italic; fill: #63707f; }
.schematex-bd-port-label { font-size: 13px; fill: #16202b; }
.schematex-bd-title { font-size: 16px; font-weight: 700; fill: #16202b; }
.schematex-bd-branch { fill: #16202b; stroke: none; }</style>
<marker id="lt-bd-arrow" markerWidth="9" markerUnits="userSpaceOnUse" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#16202b"/></marker></defs>
<text x="34" y="24" text-anchor="start" class="schematex-bd-title">Video streaming pipeline</text>
<g transform="translate(0, 40)"><g class="schematex-bd-signals"><path d="M 211 59 L 328 59 L 328 107 L 445 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="source" data-to="ingest"/>
<rect x="339" y="82" width="95" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="386.5" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="386.5" dy="0">RTMP / SRT</tspan></text>
<path d="M 576 107 L 717 107 L 717 98 L 858 98" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="ingest" data-to="encoder"/>
<rect x="723" y="73" width="129" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="787.5" y="85" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="787.5" dy="0">mezzanine stream</tspan></text>
<path d="M 1061 107 L 1309 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="encoder" data-to="origin"/>
<rect x="1129" y="82" width="112" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1185" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1185" dy="0">HLS renditions</tspan></text>
<path d="M 1440 107 L 1534 107 L 1534 98 L 1628 98" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="origin" data-to="cdn"/>
<rect x="1540" y="73" width="82" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1581" y="85" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1581" dy="0">origin pull</tspan></text>
<path d="M 1833 107 L 2071 107" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="cdn" data-to="viewer"/>
