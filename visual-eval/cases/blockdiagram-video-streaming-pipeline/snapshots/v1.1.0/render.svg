<g transform="translate(445, 80)" data-block-id="ingest" data-block-role="generic"><rect width="131" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="65.5" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="65.5" dy="0">Ingest Gateway</tspan></text></g>
<g transform="translate(858, 80)" data-block-id="encoder" data-block-role="generic"><rect width="203" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="101.5" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="101.5" dy="0">Adaptive Bitrate Encoder</tspan></text></g>
<g transform="translate(1309, 80)" data-block-id="origin" data-block-role="generic"><rect width="131" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="65.5" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="65.5" dy="0">Origin Storage</tspan></text></g>
<g transform="translate(1628, 80)" data-block-id="cdn" data-block-role="generic"><rect width="205" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
