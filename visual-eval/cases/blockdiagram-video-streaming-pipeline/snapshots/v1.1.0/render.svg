<rect x="700" y="131" width="127" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="763.5" y="143" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="763.5" dy="0">encoding profiles</tspan></text>
<path d="M 231 164 L 255 164 L 255 172 L 1604 172 L 1604 116 L 1628 116" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="control" data-to="cdn"/>
<rect x="1464" y="135" width="133" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1530.5" y="147" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1530.5" dy="0">distribution policy</tspan></text></g>
<g class="schematex-bd-nodes"><g transform="translate(54, 32)" data-block-id="source" data-block-role="input"><rect width="157" height="54" fill="#e0f2fe" class="schematex-bd-block" rx="4"/>
