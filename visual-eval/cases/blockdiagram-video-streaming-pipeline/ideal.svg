<text x="46" y="48" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#16202B">Video streaming pipeline</text>
<text x="46" y="70" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#63707F">one live source is encoded into adaptive bitrate renditions before CDN delivery</text>
