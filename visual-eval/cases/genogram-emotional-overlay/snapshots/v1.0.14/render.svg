<text x="207.39999999999998" y="430" class="schematex-genogram-label" data-individual-id="ben">Ben Carter (b. 1999)</text>
<text x="327.4" y="430" class="schematex-genogram-label" data-individual-id="grace">Grace Carter (b. 2003)</text></g>
