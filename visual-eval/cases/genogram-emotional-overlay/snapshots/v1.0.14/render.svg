<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 472 554" class="schematex-diagram schematex-genogram" width="472" height="554"><title>Genogram</title>
<desc>Genogram diagram with 7 individuals across 3 generations</desc>
<defs></defs>
<style>
.schematex-genogram {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
}
.schematex-genogram-shape { fill: #ffffff; stroke: #334155; stroke-width: 2; stroke-linejoin: round; }
.schematex-genogram-male .schematex-genogram-shape { fill: #dbeafe; }
.schematex-genogram-female .schematex-genogram-shape { fill: #fce7f3; }
.schematex-genogram-unknown .schematex-genogram-shape { fill: #f5f5f5; }
.schematex-genogram-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; text-anchor: middle; fill: #0f172a; }
.schematex-genogram-vitals { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle; fill: #475569; }
.schematex-genogram-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; fill: #475569; }
.schematex-genogram-edge { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.schematex-genogram-edge-cohabiting path { stroke-dasharray: 6,4; }
.schematex-genogram-edge-cohabiting-ended path { stroke-dasharray: 6,4; }
.schematex-genogram-edge-divorced .schematex-genogram-divorce-mark { stroke: #94a3b8; stroke-width: 2; }
.schematex-genogram-edge-separated .schematex-genogram-separation-mark { stroke: #94a3b8; stroke-width: 2; }
.schematex-genogram-edge-cohabiting-ended .schematex-genogram-separation-mark { stroke: #94a3b8; stroke-width: 2; }
/* Secondary parent-child link (foster/adopted "current caregiver") — dotted, muted */
.schematex-genogram-edge-secondary path { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 2,4; fill: none; opacity: 0.85; }
/* Sibling-of bracket (known relative, unknown ancestry) — dashed */
.schematex-genogram-sibling-of path { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,3; fill: none; opacity: 0.7; }
.schematex-genogram-unknown-siblings-mark { fill: #0f172a; pointer-events: none; }
.schematex-genogram-deceased-mark { stroke: #b71c1c; stroke-width: 2; stroke-linecap: round; }
/* Inline fill on each .schematex-genogram-condition-fill element comes from cond.color. The CSS only sets a default for elements that did not receive an inline fill attribute. */
.schematex-genogram-condition-fill:not([fill]) { fill: #1565c0; }
.schematex-genogram-age { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; pointer-events: none; }
.schematex-genogram-title { fill: #0f172a; }
.schematex-genogram-edge-label { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; }
.schematex-genogram-index-border { stroke: #d97706; stroke-width: 3; fill: none; }
</style>
<g transform="translate(10.5, 0)"><g><g class="schematex-genogram-edges"><g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="arthur" data-to="ruth"><path d="M 107.39999999999999 60 L 187.39999999999998 60" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur" data-to="ruth"><path d="M 147.39999999999998 60 L 147.39999999999998 141" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="arthur+ruth" data-to="michael"><path d="M 147.39999999999998 60 L 147.39999999999998 206" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-married" data-from="michael" data-to="claire"><path d="M 167.39999999999998 226 L 247.39999999999998 226" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="michael" data-to="claire"><path d="M 207.39999999999998 226 L 207.39999999999998 307" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="michael" data-to="claire"><path d="M 87.39999999999999 307 L 327.4 307" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="michael+claire" data-to="anna"><path d="M 87.39999999999999 307 L 87.39999999999999 372" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="michael+claire" data-to="ben"><path d="M 207.39999999999998 307 L 207.39999999999998 372" class="schematex-genogram-edge-path"/></g>
<g class="schematex-genogram-edge schematex-genogram-edge-parent-child" data-from="michael+claire" data-to="grace"><path d="M 327.4 307 L 327.4 372" class="schematex-genogram-edge-path"/></g></g>
<g class="schematex-genogram-sibling-of-edges"></g>
<g class="schematex-genogram-emotional-edges"><g class="schematex-genogram-emotional schematex-genogram-emotional-cutoff" data-from="arthur" data-to="anna" data-relationship-type="cutoff"><path d="M 87.39999999999999 60 Q 137.39999999999998 226 87.39999999999999 392" fill="none" stroke="#e53935" stroke-width="2" style="stroke-dasharray: 2,8;"/></g>
<g class="schematex-genogram-emotional schematex-genogram-emotional-fused" data-from="ruth" data-to="michael" data-relationship-type="fused"><path d="M 207.39999999999998 60 Q 257.4 143 147.39999999999998 226" fill="none" stroke="#9c27b0" stroke-width="4"/></g>
<g class="schematex-genogram-emotional schematex-genogram-emotional-conflict" data-from="michael" data-to="grace" data-relationship-type="conflict"><path d="M 147.39999999999998 226 Q 377.4 309 327.4 392" fill="none" stroke="#e53935" stroke-width="2" style="stroke-dasharray: 8,3,2,3;"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-0" data-generation="0"><g class="schematex-genogram-node schematex-genogram-male" data-individual-id="arthur" transform="translate(87.39999999999999, 60)"><title>Arthur Carter (1942)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="ruth" transform="translate(207.39999999999998, 60)"><title>Ruth Carter (1945)</title>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-1" data-generation="1"><g class="schematex-genogram-node schematex-genogram-male" data-individual-id="michael" transform="translate(147.39999999999998, 226)"><title>Michael Carter (1970)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="claire" transform="translate(267.4, 226)"><title>Claire Carter (1973)</title>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-2" data-generation="2"><g class="schematex-genogram-node schematex-genogram-female schematex-genogram-index-person" data-individual-id="anna" transform="translate(87.39999999999999, 392)"><title>Anna Carter (1996)</title>
<circle cx="0" cy="0" r="24" class="schematex-genogram-index-border"/>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-male" data-individual-id="ben" transform="translate(207.39999999999998, 392)"><title>Ben Carter (1999)</title>
<rect x="-20" y="-20" width="40" height="40" class="schematex-genogram-shape"/></g>
<g class="schematex-genogram-node schematex-genogram-female" data-individual-id="grace" transform="translate(327.4, 392)"><title>Grace Carter (2003)</title>
<circle cx="0" cy="0" r="20" class="schematex-genogram-shape"/></g></g>
<g class="schematex-genogram-labels"><text x="87.39999999999999" y="98" class="schematex-genogram-label" data-individual-id="arthur">Arthur Carter (b. 1942)</text>
<text x="207.39999999999998" y="98" class="schematex-genogram-label" data-individual-id="ruth">Ruth Carter (b. 1945)</text>
<text x="147.39999999999998" y="264" class="schematex-genogram-label" data-individual-id="michael">Michael Carter (b. 1970)</text>
<text x="267.4" y="264" class="schematex-genogram-label" data-individual-id="claire">Claire Carter (b. 1973)</text>
