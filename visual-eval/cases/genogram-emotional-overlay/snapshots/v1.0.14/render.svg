<text x="159.45" y="514.5" class="schematex-legend-label">Conflict</text></g>
<g class="schematex-legend-row" data-legend-key="cutoff" data-legend-section="relationships"><line x1="231.45" y1="511" x2="251.45" y2="511" stroke="#e53935" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,8"/>
