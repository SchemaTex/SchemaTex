<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800">
<title>Hospital operations — this week's priorities</title>
<desc>Eisenhower matrix. Urgency increases to the right and importance increases upward. Do now: Restore medication scanner and Approve staffing roster. Schedule: Review infection dashboard. Delegate: Reply to vendor survey. Eliminate: Reformat old slides.</desc>
<defs><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1e293b} .title{font-size:22px;font-weight:600}.subtitle{font-size:13px;fill:#475569}.quadrant{font-size:13px;font-weight:600;fill:#475569}.action{font-size:11px;fill:#64748b}.item{font-size:12px;font-weight:500}.axis{font-size:12px;font-weight:600}.end{font-size:11px;fill:#475569}.head{font-size:11px;font-weight:600;letter-spacing:.6px;fill:#475569}.key{font-size:12px}.note{font-size:10.5px;fill:#475569}.rule{stroke:#e2e8f0;stroke-width:1;fill:none}.dot{fill-opacity:.85;stroke-width:1.5}
</style></defs>
<rect width="1060" height="800" fill="#ffffff"/>
<text x="48" y="46" class="title">Hospital operations — this week's priorities</text>
<text x="48" y="74" class="subtitle">Agreed priorities. Urgency increases to the right; importance increases upward.</text>
<!-- Four action quadrants, with the exemplar's slate and warm washes. -->
<rect x="132" y="124" width="300" height="300" fill="#E6E9ED"/>
<rect x="432" y="124" width="300" height="300" fill="#F6F5F4"/>
<rect x="132" y="424" width="300" height="300" fill="#F1F3F6"/>
<rect x="432" y="424" width="300" height="300" fill="#FCFBFB"/>
<rect x="132" y="124" width="600" height="600" class="rule"/>
<path d="M432 124V724 M132 424H732" fill="none" stroke="#cbd5e1" stroke-width="1"/>
<text x="148" y="152" class="quadrant">Schedule</text>
<text x="148" y="167" class="action">Plan time for important work</text>
<text x="716" y="152" class="quadrant" text-anchor="end">Do now</text>
<text x="716" y="167" class="action" text-anchor="end">Act on urgent, important work</text>
<text x="148" y="690" class="quadrant">Eliminate</text>
<text x="148" y="705" class="action">Drop low-priority work</text>
<text x="716" y="690" class="quadrant" text-anchor="end">Delegate</text>
<text x="716" y="705" class="action" text-anchor="end">Assign urgent, less important work</text>
<!-- Equal circles: no size quantity is declared. Centers follow the given coordinates. -->
<circle cx="660" cy="184" r="13.5" fill="#24618c" stroke="#19465f" class="dot"/>
<text x="638" y="201" text-anchor="end" class="item">Restore medication scanner</text>
<circle cx="582" cy="268" r="13.5" fill="#3f8f7a" stroke="#2b6354" class="dot"/>
<text x="560" y="272" text-anchor="end" class="item">Approve staffing roster</text>
<circle cx="300" cy="250" r="13.5" fill="#c08a2e" stroke="#896221" class="dot"/>
<text x="322" y="247" class="item"><tspan x="322">Review infection</tspan><tspan x="322" dy="15">dashboard</tspan></text>
<circle cx="564" cy="568" r="13.5" fill="#a1543f" stroke="#713c2d" class="dot"/>
<text x="586" y="565" class="item"><tspan x="586">Reply to vendor</tspan><tspan x="586" dy="15">survey</tspan></text>
<circle cx="252" cy="616" r="13.5" fill="#a1543f" stroke="#713c2d" class="dot"/>
<text x="274" y="620" class="item">Reformat old slides</text>
<!-- Directional axes. -->
<path d="M132 108V724H748" fill="none" stroke="#1e293b" stroke-width="1.3"/>
<path d="M132 100L127.5 110H136.5Z M756 724L746 719.5V728.5Z" fill="#1e293b"/>
<text x="104" y="124" transform="rotate(-90 104 124)" text-anchor="end" class="end">High importance</text>
<text x="104" y="724" transform="rotate(-90 104 724)" class="end">Low importance</text>
<text x="78" y="424" transform="rotate(-90 78 424)" text-anchor="middle" class="axis">Importance</text>
<text x="132" y="750" class="end">Low urgency</text>
<text x="732" y="750" text-anchor="end" class="end">High urgency</text>
<text x="432" y="774" text-anchor="middle" class="axis">Urgency</text>
<!-- Boxed key in the same location and rhythm as the exemplar. -->
<rect x="776" y="124" width="236" height="404" rx="6" class="rule"/>
<text x="794" y="150" class="head">CATEGORY</text>
<circle cx="801" cy="168" r="6.5" fill="#24618c" stroke="#19465f" class="dot"/><text x="814" y="172" class="key">Safety</text>
<circle cx="801" cy="194" r="6.5" fill="#3f8f7a" stroke="#2b6354" class="dot"/><text x="814" y="198" class="key">Operations</text>
<circle cx="801" cy="220" r="6.5" fill="#c08a2e" stroke="#896221" class="dot"/><text x="814" y="224" class="key">Quality</text>
<circle cx="801" cy="246" r="6.5" fill="#a1543f" stroke="#713c2d" class="dot"/><text x="814" y="250" class="key">Admin</text>
<path d="M794 278H994 M794 442H994" class="rule"/>
<text x="794" y="306" class="head">READING THE MATRIX</text>
<text x="794" y="334" class="note">Right = more urgent</text>
<text x="794" y="357" class="note">Up = more important</text>
<circle cx="808" cy="395" r="13.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
<text x="834" y="392" class="note"><tspan x="834">One circle per task</tspan><tspan x="834" dy="15">Equal size; agreed position</tspan></text>
<text x="794" y="470" class="head">THIS WEEK</text>
<text x="794" y="492" font-size="13" font-weight="600">5 work items</text>
<text x="794" y="510" class="note">across 4 categories</text>
</svg>
