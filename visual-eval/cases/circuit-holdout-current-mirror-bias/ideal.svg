<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<title>Current-Mirror Differential-Pair Bias</title>
<rect width="1400" height="1000" fill="white"/>
<style>
 wire{fill:none} .w{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .dot{fill:#17212b} .t{font-family:Helvetica,Arial,sans-serif;fill:#17212b;font-size:22px} .small{font-size:18px} .head{font-size:32px;font-weight:bold} .net{font-size:20px;font-weight:bold;fill:#245a80}
</style>
<g class="t">
<text x="65" y="60" class="head">Current-Mirror Differential-Pair Bias</text>
<text x="65" y="93" class="small">Diode-connected NPN reference and current-mirror tail sink</text>
</g>
<!-- Supply rail and voltage source V1 -->
<g class="w">
<path d="M110 150H1180 M110 150V625 M110 695V900"/>
<circle cx="110" cy="660" r="35"/>
<path d="M101 647H119 M110 638V656 M101 675H119"/>
<path d="M110 900H1180"/>
<path d="M690 900V925 M670 925H710 M677 934H703 M685 943H695"/>
</g>
<g class="t"><text x="1150" y="133" class="net">VCC · 5 V</text><text x="58" y="729">V1</text><text x="48" y="759">5 V</text><text x="130" y="620">VCC</text><text x="722" y="938" class="net">GND</text></g>
<!-- RREF -->
<g class="w">
<path d="M350 150V280 L338 290 362 310 338 330 362 350 338 370 362 390 350 400 V600"/>
</g>
<g class="t"><text x="383" y="320">R1 · RREF</text><text x="383" y="352">4.3 kΩ, 1%</text></g>
<!-- Collector loads -->
<g class="w">
<path d="M800 150V210 L788 220 812 240 788 260 812 280 788 300 812 320 800 330 V410"/>
<path d="M1060 150V210 L1048 220 1072 240 1048 260 1072 280 1048 300 1072 320 1060 330 V410"/>
</g>
<g class="t"><text x="669" y="255">R2 · RC1</text><text x="681" y="285">2.2 kΩ</text><text x="1093" y="255">R3 · RC2</text><text x="1093" y="285">2.2 kΩ</text><text x="812" y="374" class="net">COL1</text><text x="1072" y="374" class="net">COL2</text></g>
<!-- Q3 faces left: collector 800,410 base 740,450 emitter 800,490 -->
<g class="w">
<circle cx="775" cy="450" r="45"/>
<path d="M758 423V477 M758 435L800 410 M758 465L800 490 M740 450H758"/>
</g>
<path d="M794 486L779 483L786 472Z" class="dot"/>
<!-- Q4 mirrored symbol, base facing right -->
<g class="w">
<circle cx="1085" cy="450" r="45"/>
<path d="M1102 423V477 M1102 435L1060 410 M1102 465L1060 490 M1102 450H1120"/>
</g>
<path d="M1066 486L1074 472L1081 483Z" class="dot"/>
<!-- Common emitters feed exactly one tail -->
<g class="w"><path d="M800 490V560H1060V490 M930 560V710"/></g>
<g class="t"><text x="836" y="431">Q3</text><text x="830" y="461" class="small">2N3904</text><text x="970" y="431">Q4</text><text x="952" y="461" class="small">2N3904</text><text x="946" y="596" class="net">TAIL</text></g>
<!-- Two independent AC inputs -->
<g class="w">
<path d="M740 450H635V625 M635 695V750 M615 750H655 M622 759H648 M630 768H640 M1120 450H1255V625 M1255 695V865H1180V900"/>
<circle cx="635" cy="660" r="35"/>
<path d="M613 660C619 638 628 638 635 660S651 682 657 660"/>
<circle cx="1255" cy="660" r="35"/>
<path d="M1233 660C1239 638 1248 638 1255 660S1271 682 1277 660"/>
</g>
<g class="t"><text x="649" y="430" class="net">INP</text><text x="1170" y="430" class="net">INN</text><text x="685" y="646">V2 · VIN+</text><text x="685" y="678">10 mV</text><text x="1163" y="730">V3 · VIN−</text><text x="1193" y="761">10 mV</text></g>
<!-- Q1 diode connection: collector drops from reference node; base loops left -->
<g class="w">
<path d="M350 600V710 M350 600H240V750H290"/>
<circle cx="325" cy="750" r="45"/>
<path d="M308 723V777 M308 735L350 710 M308 765L350 790 M290 750H308 M350 790V900"/>
<!-- Shared base wire has no intersection with the input source wiring -->
<path d="M240 750V835H830V750H888"/>
<!-- Q2 mirror output collector is connected directly to TAIL -->
<circle cx="905" cy="750" r="45"/>
<path d="M888 723V777 M888 735L930 710 M888 765L930 790 M930 790V900"/>
</g>
<path d="M344 786L329 783L336 772Z M924 786L909 783L916 772Z" class="dot"/>
<g class="t"><text x="389" y="728">Q1</text><text x="389" y="758">2N3904</text><text x="389" y="785" class="small">DIODE-CONNECTED</text><text x="977" y="727">Q2</text><text x="977" y="757">2N3904</text><text x="977" y="786" class="small">MIRROR OUTPUT</text><text x="422" y="863" class="net">BBASE</text></g>
<!-- Electrical junctions -->
<g class="dot"><circle cx="350" cy="150" r="5"/><circle cx="800" cy="150" r="5"/><circle cx="1060" cy="150" r="5"/><circle cx="350" cy="600" r="5"/><circle cx="240" cy="750" r="5"/><circle cx="930" cy="560" r="5"/><circle cx="350" cy="900" r="5"/><circle cx="690" cy="900" r="5"/><circle cx="930" cy="900" r="5"/></g>
</svg>
