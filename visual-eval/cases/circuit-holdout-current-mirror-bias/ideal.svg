<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1073" viewBox="0 0 1360 912">
<title>Current-Mirror Differential-Pair Bias</title>
<desc>A 5 V supply powers a 4.3 kiloohm reference branch and two 2.2 kiloohm collector loads. Diode-connected Q1 shares BBASE with Q2. Q2 sinks the common TAIL current of Q3 and Q4. Separate AC sources drive the two input bases. All transistors are NPN 2N3904.</desc>
