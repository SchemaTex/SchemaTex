.schematex-phylo-clade-Fur { stroke: #AB47BC; }
.schematex-phylo-clade-bg-Fur { fill: #AB47BC; fill-opacity: 0.12; }
.schematex-phylo-clade-label-Fur { fill: #AB47BC; }</style>
