<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-diagram schematex-phylo" viewBox="0 0 380.8 230" width="380.8" height="230"><title>Phylogenetic Tree: Chordate Trait Evolution</title>
