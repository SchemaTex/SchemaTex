<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 1004" width="812" height="1004">
  <title>Maya's Family Support Network — social-work ecomap</title>
  <desc>A Hartman ecomap for Maya's Family Support Network. At the centre, a dashed blue boundary holds the household, Maya + children. 5 outside systems sit on one ring around it: Early Childhood Center, Grocery Job, Neighbors, Grandmother, Pediatric Clinic. Each is joined to the centre by a single straight spoke whose drawn form states the quality of the tie: three parallel lines for a strong tie, two for a moderate one, one plain line for an ordinary tie, a thin dashed line for a tenuous tie, a red zigzag for a stressful tie, and a line broken by two ticks for a cut-off tie. A legend at the foot lists the system tints and every connection code.</desc>
  <rect x="0" y="0" width="812" height="1004" fill="#ffffff"/>
  <text x="46" y="68" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1e293b">Maya's Family Support Network</text>
  <text x="46" y="91" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Social-work ecomap — single parent Maya and two young children, balancing strong kin support and school stress</text>
  <line x1="46" y1="104" x2="766" y2="104" stroke="#dbe2ea" stroke-width="1"/>
