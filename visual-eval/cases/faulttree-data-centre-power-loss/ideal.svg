<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1259" viewBox="0 0 1490 1259" role="img" font-family="Helvetica Neue, Helvetica, sans-serif"><title>Data centre critical power loss</title><desc>Independent reference drawing following the current exemplar. Top-down failure logic · basic-event probabilities assumed independent</desc><rect width="1490" height="1259" fill="white"/><text x="40" y="45" font-size="25" fill="#0f172a" text-anchor="start" font-weight="600">Data centre critical power loss</text><text x="40" y="73" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Top-down failure logic · basic-event probabilities assumed independent</text><text x="1450" y="107" font-size="18" fill="#2563eb" text-anchor="end" font-weight="600">P(top) = 8.637988e-04  · exact</text><rect x="620.0" y="150" width="250" height="70" rx="7" fill="#eef2f7" stroke="#1e293b" stroke-width="2.5"/><text x="745.0" y="177.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">Critical IT load</text><text x="745.0" y="199.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">de-energised</text><path d="M745.0 220V244" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M710.0 296Q714.0 257 745.0 244Q776.0 257 780.0 296Q745.0 279 710.0 296Z" stroke="#059669" stroke-width="2" fill="#dcfce7" /><text x="745.0" y="275" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">OR</text><path d="M745.0 287V355 M455.0 355H1180.0" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M455.0 355V410" stroke="#334155" stroke-width="1.8" fill="none" /><path d="M1180.0 355V410" stroke="#334155" stroke-width="1.8" fill="none" /><rect x="330.0" y="410" width="250" height="70" rx="7" fill="#eef2f7" stroke="#334155" stroke-width="1.7"/><text x="455.0" y="448.0" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="600">UPS output unavailable</text><path d="M455.0 480V504" stroke="#334155" stroke-width="1.8" fill="