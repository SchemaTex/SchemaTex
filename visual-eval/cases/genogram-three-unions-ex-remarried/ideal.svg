<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img">
<title>Three unions, and an ex-partner who remarried</title>
<desc>Dana&#x27;s unions: Mark (m. 1995 · div. 2004), Chris (m. 2006 · div. 2015), Rick (together since 2018). Mark later married Lisa. Lisa stands on Mark&#x27;s far side, away from Dana, so every gap between neighbours belongs to one union: Zoe hangs from Lisa and Mark, Maya from Mark and Dana&#x27;s union over Chris, Leo from Chris and Dana, Tess from Dana and Rick.</desc>
