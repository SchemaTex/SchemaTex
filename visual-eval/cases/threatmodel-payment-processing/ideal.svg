<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1243 940" width="1243" height="940" role="img">
<title>Payment Processing STRIDE</title>
<desc>A STRIDE threat model of Payment Processing STRIDE, drawn as a data-flow diagram over 3 trust zones: Public Internet, Merchant, PCI Zone. 2 external entities are drawn as rectangles, 2 processes as circles, and 2 data stores as two parallel horizontal lines with the label between them. Each element carries the STRIDE letters that apply to its kind. Of the 6 data flows, 4 cross a trust boundary — Online Shopper to Merchant Checkout, Merchant Checkout to Payment Gateway, Payment Gateway to Card Acquirer, Merchant Checkout to Payment Audit Log — and those are the only ones drawn in red, because a boundary crossing is where the spoofing, tampering and disclosure threats actually bite.</desc>
