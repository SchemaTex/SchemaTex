<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="712.1120502068329" height="520.8890929440785" viewBox="-20 -20 712.1120502068329 520.8890929440785" class="schematex schematex-threatmodel" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Payment Processing STRIDE"><title>Payment Processing STRIDE</title>
<desc>STRIDE threat model: 2 external entities, 2 process(es), 2 data store(s), 6 data flow(s). 4 boundary-crossing flow(s): Shopper→Checkout, Checkout→Gateway, Gateway→Acquirer, Checkout→Audit. Shopper (external) → Spoofing, Repudiation. Acquirer (external) → Spoofing, Repudiation. Checkout (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Gateway (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Tokens (store) → Tampering, Information disclosure, Denial of service. Audit (store) → Tampering, Repudiation, Information disclosure, Denial of service.</desc>
<style>.sx-tm-bg { fill: #ffffff; }
.sx-tm-title { fill: #0f172a; font-size: 16px; font-weight: 700; }
.sx-tm-external { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
.sx-tm-process { fill: #ffffff; stroke: #334155; stroke-width: 2; }
.sx-tm-store-line { fill: none; stroke: #334155; stroke-width: 2; }
.sx-tm-store-bg { fill: #ffffff; stroke: none; }
.sx-tm-label { fill: #0f172a; font-size: 12px; font-weight: 600; }
.sx-tm-flow { fill: none; stroke: #334155; stroke-width: 2; }
.sx-tm-flow[data-crossing="true"] { stroke: #dc2626; stroke-width: 2; }
.sx-tm-arrow { fill: #334155; stroke: none; }
.sx-tm-arrow[data-crossing="true"] { fill: #dc2626; }
.sx-tm-flow-label { fill: #0f172a; font-size: 9px; }
.sx-tm-flow-label[data-crossing="true"] { fill: #dc2626; font-weight: 700; }
.sx-tm-flow-halo { fill: #ffffff; stroke: none; }
.sx-tm-boundary { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 4; }
.sx-tm-boundary-label { fill: #475569; font-size: 9px; font-weight: 700; }
.sx-tm-badge { fill: #2563eb; }
.sx-tm-badge[data-cond-r="true"] { fill: #dc2626; }
.sx-tm-badge-text { fill: #ffffff; font-size: 9px; font-weight: 700; }</style>
