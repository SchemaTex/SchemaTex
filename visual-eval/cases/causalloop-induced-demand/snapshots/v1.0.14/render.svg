.sx-cld-glyph-head { fill: #1d6fd6; stroke: none; }
.sx-cld-glyph-label { fill: #1d6fd6; font-size: 12px; font-weight: 700; }
.sx-cld-glyph-phrase { fill: #1d6fd6; font-size: 10px; font-style: italic; }
.sx-cld-title { fill: #1a1a1a; font-size: 16px; font-weight: 700; }</style>
