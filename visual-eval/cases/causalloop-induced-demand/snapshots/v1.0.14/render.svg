<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="506" height="449" viewBox="0 0 506 449" role="img" aria-label="Causal loop diagram" data-diagram-type="causalloop"><title>Causal loop diagram</title>
<desc>Causal loop diagram: 5 variables, 5 causal links. 1 feedback loop: 0 reinforcing (R), 1 balancing (B). B1 &quot;Induced demand&quot; (balancing, 1 negative link): Travel time → Driving attractiveness → Vehicle trips → Congestion → Travel time. Not in any loop: Road capacity. Line 3: unrecognised line: &quot;causalloop &quot;Urban traffic induced demand&quot;&quot;</desc>
