 <g transform="translate(1091 339)"><text x="0" y="-62" text-anchor="middle" font-size="21" font-weight="bold">N</text><path d="M0-48L-12-8 0-16 12-8Z" fill="#344650"/><path d="M0-16V31" stroke="#344650" stroke-width="2"/></g>
