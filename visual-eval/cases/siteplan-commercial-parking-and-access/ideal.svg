  <path d="M244 498H354M244 466v32m22-32v32m22-32v32m22-32v32m22-32v32M468 498H820M468 466v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32m22-32v32"/>
 </g>
 <text x="543" y="450" text-anchor="middle" font-size="22" font-weight="bold">North Parking · 54 bays</text>
