 <path d="M611 910h28" stroke="#276b62" stroke-width="7"/><path d="M611 910h28" stroke="#f6fffa" stroke-width="3"/><text x="650" y="916" font-size="14">Accessible route</text>
 <text x="880" y="881" font-size="14" font-weight="bold">SCALE · FEET</text>
 <path d="M880 898h50v12h-50z" fill="#344650"/><path d="M930 898h50v12h-50z" fill="white" stroke="#344650"/>
 <text x="880" y="930" font-size="13" text-anchor="middle">0</text><text x="930" y="930" font-size="13" text-anchor="middle">25</text><text x="980" y="930" font-size="13" text-anchor="middle">50</text>
 <text x="70" y="970" font-size="13" fill="#637078">Concept layout. Bay counts indicate design intent and are not a code-compliance certification.</text>
</g>
