<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="374" viewBox="0 0 420 374" role="img" aria-label="Causal loop diagram" data-diagram-type="causalloop"><title>Causal loop diagram</title>
<desc>Causal loop diagram: 5 variables, 6 causal links. 2 feedback loops: 2 reinforcing (R), 0 balancing (B). R1 &quot;Staffing pressure&quot; (reinforcing, 0 negative links): Workload → Overtime → Burnout → Absenteeism → Workload. R2 (reinforcing, 2 negative links): Burnout → Recovery time → Burnout. Loop phrase &quot;Recovery response&quot; names B1, but no such loop was detected. Line 3: unrecognised line: &quot;causalloop &quot;Nurse burnout dynamics&quot;&quot;</desc>
