<g class="schematex-genogram-emotional schematex-genogram-emotional-conflict" data-from="peter" data-to="susan" data-relationship-type="conflict"><path d="M 83.6 246 Q 143.6 276 203.6 246" fill="none" stroke="#e53935" stroke-width="2" style="stroke-dasharray: 8,3,2,3;"/></g></g>
<g class="schematex-genogram-generation schematex-genogram-generation-0" data-generation="0"><g class="schematex-genogram-node schematex-genogram-male schematex-genogram-deceased" data-individual-id="arthur" transform="translate(143.6, 60)"><title>Arthur Morris (1945-2015)</title>
