<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="452" height="1340" viewBox="0 0 452 1340" role="img" aria-label="Event-driven process chain" data-diagram-type="epc"><title>Event-driven process chain</title>
<desc>Event-driven process chain: 7 events, 6 functions, 3 connectors. 1 warning. XOR-split &quot;X1&quot; reconverges at a AND-join, not a XOR-join. Mismatched split/join types can cause a deadlock; verify this is intended.</desc>
<style>.sx-epc-bg { fill: #ffffff; }
