<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 940" width="1220" height="940" role="img">
<title>Healthcare Records STRIDE</title>
<desc>A STRIDE threat model of Healthcare Records STRIDE, drawn as a data-flow diagram over 3 trust zones: Public, Hospital DMZ, Clinical Network. 2 external entities are drawn as rectangles, 2 processes as circles, and 2 data stores as two parallel horizontal lines with the label between them. Each element carries the STRIDE letters that apply to its kind. Of the 5 data flows, 3 cross a trust boundary — Patient Portal User to Patient Portal, Patient Portal to Clinical EHR Service, Clinical EHR Service to Insurance Payer — and those are the only ones drawn in red, because a boundary crossing is where the spoofing, tampering and disclosure threats actually bite.</desc>
