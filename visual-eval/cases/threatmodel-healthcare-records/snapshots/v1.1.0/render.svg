<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="749.4769502920618" height="554.3498122999674" viewBox="-20 -20 749.4769502920618 554.3498122999674" class="schematex schematex-threatmodel" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Healthcare Records STRIDE"><title>Healthcare Records STRIDE</title>
<desc>STRIDE threat model: 2 external entities, 2 process(es), 2 data store(s), 5 data flow(s). 3 boundary-crossing flow(s): Patient→Portal, Portal→EHR, EHR→Insurer. Patient (external) → Spoofing, Repudiation. Insurer (external) → Spoofing, Repudiation. Portal (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. EHR (process) → Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. Records (store) → Tampering, Information disclosure, Denial of service. Audit (store) → Tampering, Repudiation, Information disclosure, Denial of service.</desc>
