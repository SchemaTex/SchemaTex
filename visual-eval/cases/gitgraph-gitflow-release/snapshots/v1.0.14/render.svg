<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="356" height="222" viewBox="0 0 356 222" role="img" aria-label="Git commit graph"><title>Git commit graph</title>
<desc>Git commit graph: 3 commits across 2 branches, 1 merge, orientation LR.</desc>
<style>.sx-gg-bg { fill: #ffffff; }
.sx-gg-lane { stroke-width: 3; stroke-linecap: round; opacity: 0.9; }
.sx-gg-pill { stroke: none; }
.sx-gg-pill-text { font-size: 12px; font-weight: 700; }
.sx-gg-edge { fill: none; stroke-width: 2; }
.sx-gg-edge-merge { stroke-dasharray: none; }
.sx-gg-node { stroke-width: 2; }
.sx-gg-dot { stroke: none; }
.sx-gg-merge { fill: #ffffff; stroke-width: 3; }
.sx-gg-highlight { fill: none; stroke-width: 3; }
.sx-gg-reverse-mark { stroke: #ffffff; stroke-width: 2; stroke-linecap: round; }
.sx-gg-cherry { fill: none; stroke-width: 2; }
.sx-gg-id { fill: #333333; font-size: 10px; font-weight: 600; }
.sx-gg-tag { fill: #fff4cc; stroke: #caa83a; stroke-width: 1; }
.sx-gg-tag-text { fill: #7a5b00; font-size: 9px; font-weight: 700; }
.sx-gg-c0 { stroke: #3a6ea5; }
.sx-gg-stroke-c0 { stroke: #3a6ea5; }
.sx-gg-fill-c0 { fill: #3a6ea5; }
.sx-gg-ink-c0 { fill: #ffffff; }
.sx-gg-c1 { stroke: #6aa84f; }
.sx-gg-stroke-c1 { stroke: #6aa84f; }
.sx-gg-fill-c1 { fill: #6aa84f; }
.sx-gg-ink-c1 { fill: #ffffff; }
.sx-gg-c2 { stroke: #c98a2b; }
.sx-gg-stroke-c2 { stroke: #c98a2b; }
.sx-gg-fill-c2 { fill: #c98a2b; }
.sx-gg-ink-c2 { fill: #ffffff; }
.sx-gg-c3 { stroke: #a64d79; }
.sx-gg-stroke-c3 { stroke: #a64d79; }
.sx-gg-fill-c3 { fill: #a64d79; }
.sx-gg-ink-c3 { fill: #ffffff; }
.sx-gg-c4 { stroke: #45818e; }
.sx-gg-stroke-c4 { stroke: #45818e; }
.sx-gg-fill-c4 { fill: #45818e; }
.sx-gg-ink-c4 { fill: #ffffff; }
.sx-gg-c5 { stroke: #8e7cc3; }
.sx-gg-stroke-c5 { stroke: #8e7cc3; }
.sx-gg-fill-c5 { fill: #8e7cc3; }
.sx-gg-ink-c5 { fill: #ffffff; }
.sx-gg-c6 { stroke: #cc4125; }
.sx-gg-stroke-c6 { stroke: #cc4125; }
.sx-gg-fill-c6 { fill: #cc4125; }
.sx-gg-ink-c6 { fill: #ffffff; }
.sx-gg-c7 { stroke: #666666; }
.sx-gg-stroke-c7 { stroke: #666666; }
.sx-gg-fill-c7 { fill: #666666; }
.sx-gg-ink-c7 { fill: #ffffff; }</style>
<rect x="0" y="0" width="356" height="222" class="sx-gg-bg"/>
<g class="sx-gg-root" transform="translate(20, 20)" data-diagram-type="gitgraph" font-family="system-ui, -apple-system, sans-serif"><g class="sx-gg-lane-group"><line x1="92" y1="74" x2="232" y2="74" class="sx-gg-lane sx-gg-c0" data-branch="main"/>
<g class="sx-gg-pill-group" data-branch="main"><rect x="56" y="64" width="44" height="20" rx="10" class="sx-gg-pill sx-gg-fill-c0"/>
<text x="78" y="74" class="sx-gg-pill-text sx-gg-ink-c0" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif">main</text></g></g>
<g class="sx-gg-lane-group">
<g class="sx-gg-pill-group" data-branch="feature"><rect x="45.5" y="120" width="65" height="20" rx="10" class="sx-gg-pill sx-gg-fill-c1"/>
<text x="78" y="130" class="sx-gg-pill-text sx-gg-ink-c1" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif">feature</text></g></g>
<path d="M 120 74 C 148 74, 148 130, 176 130" class="sx-gg-edge sx-gg-edge-elbow sx-gg-stroke-c1" fill="none"/>
<line x1="120" y1="74" x2="232" y2="74" class="sx-gg-edge sx-gg-edge-straight sx-gg-stroke-c0"/>
<path d="M 176 130 C 204 130, 204 74, 232 74" class="sx-gg-edge sx-gg-edge-merge sx-gg-stroke-c1" fill="none"/>
<g class="sx-gg-commit" data-commit-id="initial" data-branch="main" data-seq="0"><circle cx="120" cy="74" r="9" class="sx-gg-node sx-gg-dot sx-gg-fill-c0"/>
<text x="120" y="91" class="sx-gg-id" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" transform="rotate(45 120 91)">initial</text></g>
<g class="sx-gg-commit" data-commit-id="feature-work" data-branch="feature" data-seq="1"><circle cx="176" cy="130" r="9" class="sx-gg-node sx-gg-dot sx-gg-fill-c1"/>
<text x="176" y="147" class="sx-gg-id" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" transform="rotate(45 176 147)">feature-work</text></g>
<g class="sx-gg-commit" data-commit-id="merge-feature" data-branch="main" data-seq="2" data-merge="true" data-tag="v1.0"><circle cx="232" cy="74" r="9" class="sx-gg-node sx-gg-merge sx-gg-stroke-c0"/>
<g class="sx-gg-tag-group"><rect x="213" y="43" width="38" height="16" rx="3" class="sx-gg-tag"/>
<text x="232" y="51" class="sx-gg-tag-text" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif">v1.0</text></g>
<text x="232" y="91" class="sx-gg-id" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" transform="rotate(45 232 91)">merge-feature</text></g></g></svg>