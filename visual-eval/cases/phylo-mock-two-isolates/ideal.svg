<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420">
  <title>Two isolates (mock)</title>
  <desc>Illustrative mock phylogram. Isolate A and Isolate B branch directly from one root. Their horizontal branch distances are 0.02 and 0.05 substitutions per site respectively. Dashed extensions align labels and add no branch length.</desc>
  <rect width="1120" height="420" fill="#ffffff"/>
  <text x="48" y="48" fill="#1e293b" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="700">Two isolates (mock)</text>
  <text x="48" y="76" fill="#64748b" font-family="Verdana, sans-serif" font-size="13" letter-spacing="0.3">Slanted phylogram · branch distances</text>
  <path d="M48 98H1072" stroke="#dbe1e8" stroke-width="1"/>
  <g fill="#64748b" font-family="Verdana, sans-serif" font-size="12" letter-spacing="1">
    <text x="80" y="132">PHYLOGENY</text>
    <text x="650" y="132">TAXON</text>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 210L280 188"/>
    <path d="M80 210L580 232"/>
  </g>
  <g fill="none" stroke="#b5c1d2" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round">
    <path d="M285 188H636"/>
    <path d="M585 232H636"/>
  </g>
  <g fill="#1e293b" font-family="Verdana, sans-serif" font-size="16">
    <text x="650" y="193">Isolate A</text>
    <text x="650" y="237">Isolate B</text>
  </g>
  <g stroke="#1e293b" stroke-width="1.4" fill="none">
    <path d="M80 316H280M80 311V321M280 311V321"/>
  </g>
  <text x="80" y="341" fill="#1e293b" font-family="Verdana, sans-serif" font-size="12">0.02 substitutions/site</text>
  <g fill="#64748b" font-family="Verdana, sans-serif" font-size="11">
    <text x="458" y="317">Horizontal distance: substitutions/site</text>
    <text x="458" y="340">Dashed extensions align labels; they add no branch length.</text>
  </g>
  <path d="M48 365H1072" stroke="#dbe1e8" stroke-width="1"/>
  <text x="48" y="390" fill="#64748b" font-family="Verdana, sans-serif" font-size="11">Mock dataset · illustrative branch distances, not an empirical or inferred analysis.</text>
</svg>
