<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="schematex-diagram schematex-phylo" viewBox="0 0 414.8 134" width="414.8" height="134"><title>Phylogenetic Tree: Two isolates (mock)</title>
<desc>Phylogenetic tree with 2 taxa, phylogram mode, slanted layout. Dotted tip extensions align labels and do not represent branch distance.</desc>
<style>.schematex-phylo {
  --schematex-bg: #ffffff;
  --schematex-text: #0f172a;
  --schematex-text-muted: #475569;
  --schematex-stroke: #334155;
  --schematex-fill: #ffffff;
  --schematex-fill-muted: #f1f5f9;
  --schematex-accent: #2563eb;
  --schematex-positive: #059669;
  --schematex-negative: #dc2626;
  --schematex-neutral: #94a3b8;
  --schematex-warn: #d97706;
  --schematex-font-title: 16px;
  --schematex-font-label: 12px;
  --schematex-font-small: 9px;
  --schematex-stroke-thin: 1;
  --schematex-stroke-normal: 2;
  --schematex-stroke-thick: 3;
  font-family: system-ui, -apple-system, sans-serif;
}
.schematex-phylo-branch { fill: none; stroke: #0f172a; stroke-width: 2; stroke-linecap: round; }
.schematex-phylo-branch-connector { fill: none; stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-dendro-axis line { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-dendro-axis text { font-size: 10px; fill: #475569; text-anchor: middle; }
.schematex-phylo-dendro-cut { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.schematex-phylo-dendro-cut-label { font-size: 10px; fill: #dc2626; text-anchor: start; }

.schematex-phylo-tip-label { font-size: 12px; fill: #0f172a; dominant-baseline: central; }
.schematex-phylo-tip-label-italic { font-style: italic; }
.schematex-phylo-support-label { font-size: 9px; fill: #475569; text-anchor: end; dominant-baseline: auto; }
.schematex-phylo-support-dot { stroke: none; }
.schematex-phylo-scale-bar line { stroke: #0f172a; stroke-width: 2; }
.schematex-phylo-scale-bar text { font-size: 10px; fill: #0f172a; text-anchor: start; }
.schematex-phylo-scale-tick { stroke: #0f172a; stroke-width: 1; }
.schematex-phylo-title { font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
.schematex-phylo-clade-label { font-size: 13px; font-weight: bold; }
.schematex-phylo-root-marker { fill: none; stroke: #0f172a; stroke-width: 2; }</style>
<text x="207.4" y="20" class="schematex-phylo-title">Two isolates (mock)</text>
<g class="schematex-phylo-branches" transform="translate(0,30)"><path d="M 32,36 L 144,31.397260273972602" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<path d="M 32,36 L 312,47.50684931506849" class="schematex-phylo-branch schematex-phylo-branch-internal"/>
<line x1="144" y1="31.397260273972602" x2="324" y2="24" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/>
<line x1="312" y1="47.50684931506849" x2="324" y2="48" stroke="#475569" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 4" class="schematex-phylo-tip-guide"/></g>
<g class="schematex-phylo-nodes" transform="translate(0,30)"><circle cx="32" cy="36" r="2.5" class="schematex-phylo-root-marker"/></g>
<g class="schematex-phylo-labels" transform="translate(0,30)"><text x="330" y="24" class="schematex-phylo-tip-label" data-taxon-id="Isolate_A">Isolate A</text>
<text x="330" y="48" class="schematex-phylo-tip-label" data-taxon-id="Isolate_B">Isolate B</text></g>
<g transform="translate(0,30)"><g class="schematex-phylo-scale-bar"><line x1="20" y1="68" x2="76" y2="68" class="schematex-phylo-scale-bar"/>
<line x1="20" y1="64" x2="20" y2="72" class="schematex-phylo-scale-tick"/>
<line x1="76" y1="64" x2="76" y2="72" class="schematex-phylo-scale-tick"/>
<text x="20" y="84" text-anchor="start" class="schematex-phylo-scale-bar">0.01</text>
<text x="20" y="96" text-anchor="start" font-size="9" fill="#475569">substitutions/site</text></g></g></svg>