<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 194" width="960" height="194" class="st-timeline st-timeline-swimlane" data-diagram-type="timeline" data-style="swimlane" role="graphics-document"><title>Timeline — Northstar Analytics Milestones</title>
<desc>Schematex timeline diagram</desc>
<defs><style>
    .st-timeline { 
