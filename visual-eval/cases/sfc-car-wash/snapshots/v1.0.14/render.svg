<text class="lt-sfc-transition-condition" x="270" y="106.5">CarInBay</text>
<g class="lt-sfc-step" data-step-id="S0" data-step-kind="initial"><rect class="lt-sfc-step-body" x="160" y="40" width="160" height="36"/>
<rect class="lt-sfc-step-inner" x="164" y="44" width="152" height="28"/>
<text class="lt-sfc-step-name" x="240" y="62" text-anchor="middle">S0</text></g>
<line class="lt-sfc-wire" x1="320" y1="58" x2="328" y2="58"/>
<g class="lt-sfc-step" data-step-id="S1" data-step-kind="normal"><rect class="lt-sfc-step-body" x="160" y="132" width="160" height="36"/>
<text class="lt-sfc-step-name" x="240" y="154" text-anchor="middle">Pre-soak</text></g>
<line class="lt-sfc-wire" x1="320" y1="150" x2="328" y2="150"/>
<g class="lt-sfc-step" data-step-id="S2" data-step-kind="normal"><rect class="lt-sfc-step-body" x="60" y="340" width="160" height="36"/>
<text class="lt-sfc-step-name" x="140" y="362" text-anchor="middle">Brush body</text></g>
<line class="lt-sfc-wire" x1="220" y1="358" x2="228" y2="358"/>
<g class="lt-sfc-step" data-step-id="S3" data-step-kind="normal"><rect class="lt-sfc-step-body" x="260" y="340" width="160" height="36"/>
<text class="lt-sfc-step-name" x="340" y="362" text-anchor="middle">Wash wheels</text></g>
<line class="lt-sfc-wire" x1="420" y1="358" x2="428" y2="358"/>
<g class="lt-sfc-step" data-step-id="S4" data-step-kind="normal"><rect class="lt-sfc-step-body" x="160" y="548" width="160" height="36"/>
<text class="lt-sfc-step-name" x="240" y="570" text-anchor="middle">Rinse and dry</text></g>
<line class="lt-sfc-wire" x1="320" y1="566" x2="328" y2="566"/>
<g class="lt-sfc-action-block-g" data-step-id="S0" data-action-index="0" data-qualifier="N"><rect class="lt-sfc-action-qualifier" x="328" y="40" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="354" y="40" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="341" y="56" text-anchor="middle">N</text>
<text class="lt-sfc-action-body" x="360" y="56">EntryLightGreen</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S1" data-action-index="0" data-qualifier="D"><rect class="lt-sfc-action-qualifier" x="328" y="132" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="354" y="132" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="341" y="148" text-anchor="middle">D</text>
<text class="lt-sfc-action-body" x="360" y="148">SoapPump</text>
<rect class="lt-sfc-action-block" x="328" y="156" width="200" height="14"/>
<text class="lt-sfc-action-time" x="334" y="167">T#20s</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S2" data-action-index="0" data-qualifier="N"><rect class="lt-sfc-action-qualifier" x="228" y="340" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="254" y="340" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="241" y="356" text-anchor="middle">N</text>
<text class="lt-sfc-action-body" x="260" y="356">BrushMotors</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S3" data-action-index="0" data-qualifier="L"><rect class="lt-sfc-action-qualifier" x="428" y="340" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="454" y="340" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="441" y="356" text-anchor="middle">L</text>
<text class="lt-sfc-action-body" x="460" y="356">WheelJets</text>
<rect class="lt-sfc-action-block" x="428" y="364" width="200" height="14"/>
<text class="lt-sfc-action-time" x="434" y="375">T#30s</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S4" data-action-index="0" data-qualifier="N"><rect class="lt-sfc-action-qualifier" x="328" y="548" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="354" y="548" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="341" y="564" text-anchor="middle">N</text>
<text class="lt-sfc-action-body" x="360" y="564">RinseArch</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S4" data-action-index="1" data-qualifier="D"><rect class="lt-sfc-action-qualifier" x="328" y="572" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="354" y="572" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="341" y="588" text-anchor="middle">D</text>
<text class="lt-sfc-action-body" x="360" y="588">Blowers</text>
<rect class="lt-sfc-action-block" x="328" y="596" width="200" height="14"/>
<text class="lt-sfc-action-time" x="334" y="607">T#5s</text></g>
<path class="lt-sfc-jump" d="M 160 566 L 24 566 L 24 58 L 160 58"/>
<text class="lt-sfc-jump-label" x="16" y="312" text-anchor="middle">DryDone  → S0</text></svg>