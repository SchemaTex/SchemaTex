<g class="lt-sfc-action-block-g" data-step-id="S0" data-action-index="0" data-qualifier="N"><rect class="lt-sfc-action-qualifier" x="228" y="40" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="254" y="40" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="241" y="56" text-anchor="middle">N</text>
<text class="lt-sfc-action-body" x="260" y="56">Idle</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S1" data-action-index="0" data-qualifier="N"><rect class="lt-sfc-action-qualifier" x="228" y="132" width="26" height="24"/>
<rect class="lt-sfc-action-block" x="254" y="132" width="174" height="24"/>
<text class="lt-sfc-action-qualifier-text" x="241" y="148" text-anchor="middle">N</text>
<text class="lt-sfc-action-body" x="260" y="148">PrepareOutput</text></g>
<g class="lt-sfc-action-block-g" data-step-id="S2" data-action-index="0" data-qualifier="D"><rect class="lt-sfc-action-qualifier" x="228" y="224" width="26" height="24"/>
