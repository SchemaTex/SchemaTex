</text>
<path fill="#C08A2E" d="M 290.4,722.2 C 222.2,722.2 222.2,730.4 154,730.4 L 154,731.6 C 222.2,731.6 222.2,723.8 290.4,723.8 Z"/>
<path d="M 73.39999999999999 731 H 154" fill="none" stroke="#C08A2E" stroke-width="1.3"/>
