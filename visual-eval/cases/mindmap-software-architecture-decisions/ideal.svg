<text x="346" y="301" class="decision" text-anchor="end">
<tspan x="346" dy="0">Resilience</tspan>
</text>
<path fill="#6E8B3D" d="M 270.0,308.2 C 212.0,308.2 212.0,316.4 154,316.4 L 154,317.6 C 212.0,317.6 212.0,309.8 270.0,309.8 Z"/>
<path d="M 85.8 317 H 154" fill="none" stroke="#6E8B3D" stroke-width="1.3"/>
<text x="154" y="293" class="detail" text-anchor="end">
<tspan x="154" dy="0">Timeouts</tspan>
<tspan x="154" dy="16">and retries</tspan>
</text>
<path fill="#C08A2E" d="M 630,458.5 C 596.0,458.5 596.0,654.5 562,654.5 L 562,657.5 C 596.0,657.5 596.0,469.5 630,469.5 Z"/>
<rect x="468" y="641" width="94" height="30" rx="15" fill="#C08A2E"/>
<text x="515.0" y="661" class="branch" text-anchor="middle">
<tspan x="515.0" dy="0">Security</tspan>
</text>
<path fill="#C08A2E" d="M 468,654.7 C 407.0,654.7 407.0,588.15 346,588.15 L 346,589.85 C 407.0,589.85 407.0,657.3 468,657.3 Z"/>
<path d="M 283.6 589 H 346" fill="none" stroke="#C08A2E" stroke-width="2"/>
<text x="346" y="581" class="decision" text-anchor="end">
<tspan x="346" dy="0">Identity</tspan>
</text>
<path fill="#C08A2E" d="M 283.6,588.2 C 218.8,588.2 218.8,596.4 154,596.4 L 154,597.6 C 218.8,597.6 218.8,589.8 283.6,589.8 Z"/>
<path d="M 98.19999999999999 597 H 154" fill="none" stroke="#C08A2E" stroke-width="1.3"/>
<text x="154" y="573" class="detail" text-anchor="end">
<tspan x="154" dy="0">OAuth 2.0</tspan>
<tspan x="154" dy="16">and OIDC</tspan>
</text>
<path fill="#C08A2E" d="M 468,654.7 C 407.0,654.7 407.0,722.15 346,722.15 L 346,723.85 C 407.0,723.85 407.0,657.3 468,657.3 Z"/>
<path d="M 290.4 723 H 346" fill="none" stroke="#C08A2E" stroke-width="2"/>
<text x="346" y="715" class="decision" text-anchor="end">
