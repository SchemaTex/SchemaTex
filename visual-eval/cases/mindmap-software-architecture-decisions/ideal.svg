<text x="505.0" y="247" class="branch" text-anchor="middle">
<tspan x="505.0" dy="0">Reliability</tspan>
</text>
<path fill="#6E8B3D" d="M 448,240.7 C 397.0,240.7 397.0,174.15 346,174.15 L 346,175.85 C 397.0,175.85 397.0,243.3 448,243.3 Z"/>
<path d="M 249.60000000000002 175 H 346" fill="none" stroke="#6E8B3D" stroke-width="2"/>
