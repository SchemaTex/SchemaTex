<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="897" viewBox="0 0 1600 897">
<title>Software Architecture Decisions</title>
<desc>A balanced architecture decision mind map with System Boundaries, Data and Integration, Reliability, and Security, each with two decisions and their supporting details.</desc>
<rect width="1600" height="897" fill="#FFFFFF"/>
<style>text{font-family:Helvetica,Arial,sans-serif} .root{font-size:18px;font-weight:700;fill:#FFFFFF}.branch{font-size:14px;font-weight:600;fill:#FFFFFF}.decision{font-size:13px;fill:#2B3440}.detail{font-size:12px;fill:#5A6472}</style>
<path fill="#3A6EA5" d="M 970,428.5 C 1004.0,428.5 1004.0,240.5 1038,240.5 L 1038,243.5 C 1004.0,243.5 1004.0,439.5 970,439.5 Z"/>
<rect x="1038" y="227" width="174" height="30" rx="15" fill="#3A6EA5"/>
<text x="1125.0" y="247" class="branch" text-anchor="middle">
<tspan x="1125.0" dy="0">System Boundaries</tspan>
</text>
<path fill="#3A6EA5" d="M 1212,240.7 C 1233.0,240.7 1233.0,174.15 1254,174.15 L 1254,175.85 C 1233.0,175.85 1233.0,243.3 1212,243.3 Z"/>
<path d="M 1254 175 H 1370.8" fill="none" stroke="#3A6EA5" stroke-width="2"/>
<text x="1254" y="167" class="decision" text-anchor="start">
<tspan x="1254" dy="0">Modular monolith</tspan>
</text>
<path fill="#3A6EA5" d="M 1370.8,174.2 C 1410.4,174.2 1410.4,182.4 1450,182.4 L 1450,183.6 C 1410.4,183.6 1410.4,175.8 1370.8,175.8 Z"/>
<path d="M 1450 183 H 1543.0" fill="none" stroke="#3A6EA5" stroke-width="1.3"/>
<text x="1450" y="159" class="detail" text-anchor="start">
<tspan x="1450" dy="0">Extract only</tspan>
<tspan x="1450" dy="16">proven hotspots</tspan>
</text>
<path fill="#3A6EA5" d="M 1212,240.7 C 1233.0,240.7 1233.0,308.15 1254,308.15 L 1254,309.85 C 1233.0,309.85 1233.0,243.3 1212,243.3 Z"/>
<path d="M 1254 309 H 1330.0" fill="none" stroke="#3A6EA5" stroke-width="2"/>
<text x="1254" y="301" class="decision" text-anchor="start">
<tspan x="1254" dy="0">Public API</tspan>
</text>
<path fill="#3A6EA5" d="M 1330.0,308.2 C 1390.0,308.2 1390.0,316.4 1450,316.4 L 1450,317.6 C 1390.0,317.6 1390.0,309.8 1330.0,309.8 Z"/>
<path d="M 1450 317 H 1505.8" fill="none" stroke="#3A6EA5" stroke-width="1.3"/>
<text x="1450" y="293" class="detail" text-anchor="start">
<tspan x="1450" dy="0">Versioned</tspan>
<tspan x="1450" dy="16">contracts</tspan>
</text>
<path fill="#2F8B77" d="M 970,458.5 C 1004.0,458.5 1004.0,654.5 1038,654.5 L 1038,657.5 C 1004.0,657.5 1004.0,469.5 970,469.5 Z"/>
<rect x="1038" y="641" width="184" height="30" rx="15" fill="#2F8B77"/>
<text x="1130.0" y="661" class="branch" text-anchor="middle">
<tspan x="1130.0" dy="0">Data and Integration</tspan>
</text>
<path fill="#2F8B77" d="M 1222,654.7 C 1238.0,654.7 1238.0,588.15 1254,588.15 L 1254,589.85 C 1238.0,589.85 1238.0,657.3 1222,657.3 Z"/>
<path d="M 1254 589 H 1330.0" fill="none" stroke="#2F8B77" stroke-width="2"/>
<text x="1254" y="581" class="decision" text-anchor="start">
<tspan x="1254" dy="0">PostgreSQL</tspan>
</text>
<path fill="#2F8B77" d="M 1330.0,588.2 C 1390.0,588.2 1390.0,596.4 1450,596.4 L 1450,597.6 C 1390.0,597.6 1390.0,589.8 1330.0,589.8 Z"/>
<path d="M 1450 597 H 1543.0" fill="none" stroke="#2F8B77" stroke-width="1.3"/>
<text x="1450" y="573" class="detail" text-anchor="start">
