<tspan x="154" dy="16">and logs</tspan>
</text>
<path fill="#6E8B3D" d="M 448,240.7 C 397.0,240.7 397.0,308.15 346,308.15 L 346,309.85 C 397.0,309.85 397.0,243.3 448,243.3 Z"/>
