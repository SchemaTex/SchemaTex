</text>
<path fill="#2F8B77" d="M 1323.2,722.2 C 1386.6,722.2 1386.6,730.4 1450,730.4 L 1450,731.6 C 1386.6,731.6 1386.6,723.8 1323.2,723.8 Z"/>
<path d="M 1450 731 H 1530.6" fill="none" stroke="#2F8B77" stroke-width="1.3"/>
<text x="1450" y="707" class="detail" text-anchor="start">
<tspan x="1450" dy="0">Asynchronous</tspan>
<tspan x="1450" dy="16">domain events</tspan>
</text>
<path fill="#6E8B3D" d="M 630,428.5 C 596.0,428.5 596.0,240.5 562,240.5 L 562,243.5 C 596.0,243.5 596.0,439.5 630,439.5 Z"/>
