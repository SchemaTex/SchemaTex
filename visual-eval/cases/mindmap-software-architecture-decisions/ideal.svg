<tspan x="346" dy="0">Observability</tspan>
</text>
<path fill="#6E8B3D" d="M 249.60000000000002,174.2 C 201.8,174.2 201.8,182.4 154,182.4 L 154,183.6 C 201.8,183.6 201.8,175.8 249.60000000000002,175.8 Z"/>
<path d="M 54.8 183 H 154" fill="none" stroke="#6E8B3D" stroke-width="1.3"/>
<text x="154" y="159" class="detail" text-anchor="end">
