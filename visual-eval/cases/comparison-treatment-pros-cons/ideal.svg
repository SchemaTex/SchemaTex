<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="668" viewBox="0 0 1600 668">
  <title>Start direct oral anticoagulation? — Pros and Cons</title>
  <defs>
    <g id="pro-mark">
      <circle r="16" fill="#2E7A4E" fill-opacity="0.12" stroke="#2E7A4E" stroke-width="1.8"/>
      <path d="M-7 0 L-1 6 L8-5" fill="none" stroke="#2E7A4E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="con-mark">
      <circle r="16" fill="#B03A3A" fill-opacity="0.12" stroke="#B03A3A" stroke-width="1.8"/>
      <path d="M-5.5-5.5 L5.5 5.5 M5.5-5.5 L-5.5 5.5" fill="none" stroke="#B03A3A" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1600" height="668" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1B2430">
    <text x="77" y="93" font-size="36" font-weight="600">Start direct oral anticoagulation?</text>
    <circle cx="94.5" cy="178.3" r="17.5" fill="#2E7A4E"/>
    <path d="M87 178 L93 184 L103 173" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="186" font-size="27" font-weight="600">Pros</text>
    <text x="758" y="186" text-anchor="end" font-size="23" font-weight="600" fill="#2E7A4E">3</text>
    <path d="M77 213.5 H758" stroke="#2E7A4E" stroke-width="3"/>
    <circle cx="859.3" cy="178.3" r="17.5" fill="#B03A3A"/>
    <path d="M853.3 172.3 L865.3 184.3 M865.3 172.3 L853.3 184.3" fill="none" stroke="#FFFFFF" stroke-width="3.3" stroke-linecap="round"/>
    <text x="890" y="186" font-size="27" font-weight="600">Cons</text>
    <text x="1523" y="186" text-anchor="end" font-size="23" font-weight="600" fill="#B03A3A">3</text>
    <path d="M842 213.5 H1523" stroke="#B03A3A" stroke-width="3"/>
    <g font-size="22">
      <use href="#pro-mark" x="93" y="251.5"/>
      <text x="128" y="259">Reduces stroke risk in atrial fibrillation</text>
      <use href="#pro-mark" x="93" y="327"/>
      <text x="128" y="334.5">No routine INR monitoring</text>
      <use href="#pro-mark" x="93" y="402.5"/>
      <text x="128" y="410">Fixed daily dosing</text>
      <use href="#con-mark" x="858" y="251.5"/>
      <text x="893" y="259">Bleeding risk requires counselling</text>
      <use href="#con-mark" x="858" y="327"/>
      <text x="893" y="334.5">Cost may exceed warfarin</text>
      <use href="#con-mark" x="858" y="402.5"/>
      <text x="893" y="410">Renal function needs periodic review</text>
    </g>
    <g fill="none" stroke="#E4E9EE" stroke-width="1.6">
      <path d="M128 289.2 H758 M128 364.7 H758"/>
      <path d="M893 289.2 H1523 M893 364.7 H1523"/>
    </g>
  </g>
</svg>
