<g class="schematex-timing-labels"><g transform="translate(120, 0)"></g>
<g transform="translate(120, 0)"><text x="180" y="98" class="schematex-timing-bus-label" text-anchor="middle">D0</text><text x="420" y="98" class="schematex-timing-bus-label" text-anchor="middle">D1</text><text x="660" y="98" class="schematex-timing-bus-label" text-anchor="middle">D2</text><text x="900" y="98" class="schematex-timing-bus-label" text-anchor="middle">D3</text></g>
<g transform="translate(120, 0)"><text x="360" y="134" class="schematex-timing-bus-label" text-anchor="middle">D0</text><text x="600" y="134" class="schematex-timing-bus-label" text-anchor="middle">D1</text><text x="840" y="134" class="schematex-timing-bus-label" text-anchor="middle">D2</text></g></g>
<g class="schematex-timing-names"><text x="112" y="62" class="schematex-timing-name" text-anchor="end">CLK</text>
<text x="112" y="98" class="schematex-timing-name" text-anchor="end">D</text>
<text x="112" y="134" class="schematex-timing-name" text-anchor="end">Q</text></g>
<g class="sx-native-handles"></g>
<text x="550" y="24" text-anchor="middle" class="schematex-timing-title">D flip-flop setup and hold</text></svg>