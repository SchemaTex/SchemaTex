<text x="2162" y="94" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="2162" dy="0">decoded data</tspan></text>
<path d="M 226 146 L 250 146 L 250 164 L 1106 164 L 1106 116 L 1130 116" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="control" data-to="satellite"/>
<rect x="1113" y="143" width="131" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="1178.5" y="155" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="1178.5" dy="0">payload allocation</tspan></text>
<path d="M 226 164 L 250 164 L 250 172 L 790 172 L 790 116 L 814 116" class="schematex-bd-signal" marker-end="url(#lt-bd-arrow)" data-from="control" data-to="antennatx"/>
<rect x="657" y="135" width="126" height="18" rx="2" class="schematex-bd-signal-label-bg"/>
<text x="720" y="147" text-anchor="middle" class="schematex-bd-signal-label"><tspan x="720" dy="0">pointing command</tspan></text></g>
<g class="schematex-bd-nodes"><g transform="translate(46, 32)" data-block-id="source" data-block-role="input"><rect width="168" height="54" fill="#e0f2fe" class="schematex-bd-block" rx="4"/>
<text x="84" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="84" dy="0">Ground Data Source</tspan></text></g>
<g transform="translate(462, 80)" data-block-id="modem" data-block-role="generic"><rect width="126" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
<text x="63" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="63" dy="0">Uplink Modem</tspan></text></g>
<g transform="translate(814, 80)" data-block-id="antennatx" data-block-role="actuator"><rect width="186" height="54" fill="#dcfce7" class="schematex-bd-block" rx="4"/>
<text x="93" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="93" dy="0">Ground Uplink Antenna</tspan></text></g>
<g transform="translate(1130, 80)" data-block-id="satellite" data-block-role="generic"><rect width="199" height="54" fill="#ffffff" class="schematex-bd-block" rx="4"/>
