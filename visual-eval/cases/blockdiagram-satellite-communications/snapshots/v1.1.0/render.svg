<g transform="translate(2273, 80)" data-block-id="destination" data-block-role="output"><rect width="138" height="54" fill="#ecfccb" class="schematex-bd-block" rx="4"/>
<text x="69" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="69" dy="0">Remote Network</tspan></text></g>
<g transform="translate(34, 128)" data-block-id="control" data-block-role="controller"><rect width="192" height="54" fill="#dbeafe" class="schematex-bd-block" rx="4"/>
<text x="96" y="31" text-anchor="middle" class="schematex-bd-tf"><tspan x="96" dy="0">Network Control Centre</tspan></text></g></g>
<g class="schematex-bd-branches"><circle cx="226" cy="155" r="3.5" class="schematex-bd-branch"/></g></g></svg>