<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1737 1046" width="1737" height="1046" role="img">
<title>Procurement</title>
<desc>An IDEF0 function model of Procurement, drawn to FIPS PUB 183. 4 function boxes — Approve requisition (1), Select supplier (2), Place purchase order (3), Match and pay invoice (4) — step down a diagonal staircase from upper left to lower right, each carrying its box number in the lower-right interior corner. Every arrow occupies the edge its role requires: inputs enter the left edge, controls descend into the top, outputs leave the right, and mechanisms rise into the bottom. Each arrow's label sits outside the box at the arrow's open end, and every boundary arrow carries its ICOM code — I, C, M, O numbered along each edge — where it meets the diagram frame. The page carries the standard frame with a bottom title block of three cells: node, title and number.</desc>
