<text x="875" y="707" class="sx-idef0-icom" text-anchor="middle">M4</text></g>
<g class="sx-idef0-arrow-g" data-role="output" data-side="right" data-icom="O1"><path d="M 950 570 L 1020 570" class="sx-idef0-arrow"/>
<polygon points="1020,570 1011,565.5 1011,574.5" class="sx-idef0-head"/>
