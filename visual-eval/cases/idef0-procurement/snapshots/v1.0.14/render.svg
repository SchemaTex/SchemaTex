<text x="875" y="467" class="sx-idef0-icom" text-anchor="middle">C4</text></g>
<g class="sx-idef0-arrow-g" data-role="mechanism" data-side="bottom" data-icom="M4"><path d="M 875 680 L 875 610" class="sx-idef0-arrow"/>
<polygon points="875,610 870.5,601 879.5,601" class="sx-idef0-head"/>
