<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="794" viewBox="0 0 1100 794" role="img" aria-label="IDEF0 function model" data-diagram-type="idef0"><title>IDEF0 function model</title>
<desc>IDEF0 function model (node A0): 4 functions on a diagonal staircase. ICOM arrows: 5 input, 4 control, 4 mechanism, 1 output. Boxes: 1. Approve requisition (A1); 2. Select supplier (A2); 3. Place purchase order (A3); 4. Match and pay invoice (A4). Line 3: unrecognised line: &quot;idef0 &quot;Procurement&quot;&quot;</desc>
<style>.sx-idef0-bg { fill: #ffffff; }
.sx-idef0-frame { fill: none; stroke: #334155; stroke-width: 2; }
.sx-idef0-box { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
.sx-idef0-box-name { fill: #0f172a; font-size: 12px; font-weight: 600; }
.sx-idef0-box-num { fill: #475569; font-size: 10px; font-weight: 700; }
.sx-idef0-arrow { fill: none; stroke: #334155; stroke-width: 2; }
.sx-idef0-arrow[data-margin="true"] { stroke: #2563eb; }
.sx-idef0-arrow[data-tunneled="true"] { stroke-dasharray: 5 3; }
.sx-idef0-head { fill: #334155; }
.sx-idef0-arrow[data-margin="true"] + .sx-idef0-head, .sx-idef0-head[data-margin="true"] { fill: #2563eb; }
.sx-idef0-label { fill: #0f172a; font-size: 10px; }
.sx-idef0-icom { fill: #475569; font-size: 9px; font-weight: 700; }
.sx-idef0-title { fill: #0f172a; font-size: 16px; font-weight: 700; }
.sx-idef0-meta { fill: #475569; font-size: 10px; }
.sx-idef0-tb { fill: none; stroke: #334155; stroke-width: 1; }
.sx-idef0-tb-text { fill: #0f172a; font-size: 10px; }
.sx-idef0-tb-key { fill: #475569; font-size: 9px; font-weight: 700; }</style>
