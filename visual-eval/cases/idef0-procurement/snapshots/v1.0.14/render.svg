<text x="415" y="310" class="sx-idef0-box-name" text-anchor="middle" dominant-baseline="middle"><tspan x="415" dy="0">Select supplier</tspan></text>
<text x="484" y="344" class="sx-idef0-box-num" text-anchor="end">2</text></g>
