<g transform="translate(20, 20)" font-family="system-ui, -apple-system, sans-serif"><g class="sx-idef0-arrow-g" data-role="input" data-side="left" data-icom="I1"><path d="M 40 180 L 110 180" class="sx-idef0-arrow"/>
<polygon points="110,180 119,175.5 119,184.5" class="sx-idef0-head"/>
