<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 1058" width="930" height="1058">
  <title>Jordan's Recovery Supports — social-work ecomap</title>
  <desc>A Hartman ecomap for Jordan's Recovery Supports. At the centre, a dashed blue boundary holds Jordan, age 31, with the name above a secondary age label. 7 outside systems sit on one ring around it: Employer, Sister, Recovery Group, Sponsor, Using Peers, Counselor, Probation Officer. Each is joined to the centre by a single straight spoke whose drawn form states the quality of the tie: three parallel lines for a strong tie, two for a moderate one, one plain line for an ordinary tie, a thin dashed line for a tenuous tie, a red zigzag for a stressful tie, and a line broken by two ticks for a cut-off tie. Solid triangles show which way support flows. A legend at the foot lists the system tints and every connection code.</desc>
  <rect x="0" y="0" width="930" height="1058" fill="#ffffff"/>
  <text x="46" y="68" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1e293b">Jordan's Recovery Supports</text>
  <text x="46" y="91" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Social-work ecomap — person in addiction recovery with strong recovery supports and a cut-off high-risk peer relationship</text>
