<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 634" width="1125" height="634" role="img">
<title>Generator Transfer Distribution</title>
<desc>A 480 V open-transition transfer scheme. The utility supply and the 250 kVA standby generator each run through their own breaker into the two sides of a 400 A automatic transfer switch: the arm is drawn closed on the normal source, with the emergency side dashed. Below the switch the load splits onto the normal-load bus and the essential-load bus.</desc>
