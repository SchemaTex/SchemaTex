<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="1305" viewBox="0 0 1056 870" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">Library lending schema — members, loans, copies, titles, authors, and reservations</title>
<desc>Seven entities and seven relationships in crow's-foot notation. A member borrows zero or many loans, a copy appears in zero or many loans, and a title has one or many copies. Members and titles each have zero or many reservations. Authors contribute to zero or many title-author records, and titles credit one or many title-author records.</desc>
