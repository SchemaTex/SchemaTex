.caption { font-size:10.5px; fill:#475569; paint-order:stroke; stroke:white; stroke-width:4; stroke-linejoin:round; }
.type { font-size:12px; fill:#475569; }
.field { font-size:12px; }
.key { font-weight:600; text-decoration:underline; }
.tag { font-size:10px; font-weight:700; fill:white; }
</style>
