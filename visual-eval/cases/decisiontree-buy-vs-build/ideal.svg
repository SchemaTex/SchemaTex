<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" width="1800" height="1180">
  <title>Buy vs Build Decision</title>
  <rect width="1800" height="1180" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:Verdana, Geneva, sans-serif;fill:#172b42;text-anchor:middle;font-size:22px}
      .decision{fill:#eef5fa;stroke:#334155;stroke-width:2.5}
      .outcome{fill:#f5f8f6;stroke:#334155;stroke-width:2.5}
      .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font-size:21px;font-weight:bold;paint-order:stroke;stroke:white;stroke-width:9px;stroke-linejoin:round}
    </style>
  </defs>
  <text x="900" y="53" style="font-size:34px;font-weight:bold">Buy vs Build Decision</text>

  <!-- Orthogonal branches -->
  <g class="line">
    <path d="M620 180H440V290"/>
    <path d="M1180 180H1360V290"/>
    <path d="M440 490V630"/>
    <path d="M180 390H155V530"/>
    <path d="M1360 490V630"/>
    <path d="M1620 390H1645V530"/>
    <path d="M195 730H150V985"/>
    <path d="M440 830V900H650V985"/>
    <path d="M1360 830V900H1150V985"/>
    <path d="M1605 730H1650V985"/>
  </g>

  <!-- Root -->
  <path class="decision" d="M900 85L1180 180L900 275L620 180Z"/>
  <text x="900" y="172"><tspan x="900">Does a product meet</tspan><tspan x="900" dy="29">critical requirements?</tspan></text>

  <!-- Vendor path -->
  <path class="decision" d="M440 290L700 390L440 490L180 390Z"/>
  <text x="440" y="368"><tspan x="440">Can vendor pass security</tspan><tspan x="440" dy="29">and compliance review?</tspan></text>

  <rect class="outcome" x="25" y="530" width="290" height="100" rx="5"/>
  <text x="170" y="561"><tspan x="170">Build internally or use</tspan><tspan x="170" dy="29">a compliant platform</tspan></text>

  <path class="decision" d="M440 630L685 730L440 830L195 730Z"/>
  <text x="440" y="708"><tspan x="440">Is total cost within</tspan><tspan x="440" dy="29">the approved budget?</tspan></text>

  <!-- Internal build path -->
  <path class="decision" d="M1360 290L1620 390L1360 490L1100 390Z"/>
  <text x="1360" y="354"><tspan x="1360">Can the team build a safe</tspan><tspan x="1360" dy="29">MVP before the deadline?</tspan></text>

  <rect class="outcome" x="1495" y="530" width="280" height="120" rx="5"/>
  <text x="1635" y="563"><tspan x="1635">Buy adjacent capability</tspan><tspan x="1635" dy="29">and defer custom</tspan><tspan x="1635" dy="29">features</tspan></text>

  <path class="decision" d="M1360 630L1605 730L1360 830L1115 730Z"/>
  <text x="1360" y="708"><tspan x="1360">Is long-term ownership</tspan><tspan x="1360" dy="29">capacity funded?</tspan></text>

  <!-- Terminal outcomes -->
  <rect class="outcome" x="25" y="985" width="280" height="105" rx="5"/>
  <text x="165" y="1045">Buy and integrate</text>
  <rect class="outcome" x="480" y="985" width="340" height="105" rx="5"/>
  <text x="650" y="1030"><tspan x="650">Negotiate or seek</tspan><tspan x="650" dy="29">another vendor</tspan></text>
  <rect class="outcome" x="1010" y="985" width="280" height="105" rx="5"/>
  <text x="1150" y="1045">Build in-house</text>
  <rect class="outcome" x="1480" y="985" width="295" height="105" rx="5"/>
  <text x="1627.5" y="1030"><tspan x="1627.5">Reduce scope or use</tspan><tspan x="1627.5" dy="29">a managed service</tspan></text>

  <g class="label">
    <text x="523" y="165">Yes</text>
    <text x="1274" y="165">No</text>
    <text x="467" y="554">Yes</text>
    <text x="128" y="472">No</text>
    <text x="1388" y="554">Yes</text>
    <text x="1672" y="472">No</text>
    <text x="124" y="884">Yes</text>
    <text x="547" y="885">No</text>
    <text x="1247" y="885">Yes</text>
    <text x="1678" y="884">No</text>
  </g>
</svg>
