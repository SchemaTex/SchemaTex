<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-uc" role="img" aria-label="Smart Home" width="992" height="598" viewBox="0 0 992 598" data-diagram-type="usecase"><title>Use Case Diagram — Smart Home</title>
<desc>Subject: Smart Home Hub. 5 actors, 7 use cases, 4 include, 1 extend.</desc>
<style>.sx-uc { font-family: system-ui, -apple-system, sans-serif; }
.sx-uc-subject rect { stroke: #c2cede; stroke-width: 1.4; fill: #fafbfd; }
