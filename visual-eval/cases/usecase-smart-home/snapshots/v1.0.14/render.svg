.sx-uc-name { font: 600 12px sans-serif; fill: #0f172a; }
.sx-uc-stereotype { font: italic 10px sans-serif; fill: #475569; }
.sx-uc-extpoint-head { font: italic 10px sans-serif; fill: #475569; }
.sx-uc-extpoint { font: 10px sans-serif; fill: #475569; }
.sx-uc-div { stroke: #5b85c0; stroke-width: 1; opacity: 0.5; }
.sx-uc-assoc { stroke: #475569; stroke-width: 1.4; fill: none; }
.sx-uc-include { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
.sx-uc-extend { stroke: #2563eb; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
.sx-uc-general { stroke: #475569; stroke-width: 1.4; fill: none; }
.sx-uc-pill { fill: #ffffff; opacity: 0.92; }
.sx-uc-edge-label { font: italic 10px sans-serif; fill: #475569; }
.sx-uc-edge-label-accent { fill: #2563eb; }
.sx-uc-mult { font: 10px sans-serif; fill: #475569; }
.sx-uc-title { font: 700 16px sans-serif; fill: #0f172a; }</style>
