.sx-uc-actor circle, .sx-uc-actor line { stroke: #334155; stroke-width: 1.6; fill: none; stroke-linecap: round; }
.sx-uc-actor-head { fill: #ffffff; }
.sx-uc-actor-name { font: 600 12px sans-serif; fill: #0f172a; }
.sx-uc-actor-system rect { stroke: #5b85c0; stroke-width: 1.4; fill: #eaf2fc; }
