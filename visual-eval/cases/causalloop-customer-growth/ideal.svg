<text x="46" y="609.62" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#63707F">+  same direction     −  opposite direction     ||  delay     R  reinforcing loop     B  balancing loop</text>
