<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" role="img">
<title>Customer growth and capacity</title>
<desc>A causal-loop diagram of Customer growth and capacity. 6 variables are joined by 7 causal links, each carrying its polarity beside the arrowhead. The engine's job here is to find the feedback loops and classify them by Sterman's even/odd rule, and this drawing shows that answer: B1 runs Active customers → Support workload → Response time → Customer satisfaction → Customer referrals → New customers → Active customers with 1 negative link, so it balances; R1 runs Active customers → Customer referrals → New customers → Active customers with 0 negative links, so it reinforces. Each loop glyph is a circular arrow curling in the loop's own direction, labelled with the computed letter and the loop's name.</desc>
