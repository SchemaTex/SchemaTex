<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-net" role="img" aria-label="Hospital segmented clinical network" width="819.9" height="613" viewBox="0 0 819.9 613" data-diagram-type="network"><title>Network diagram — Hospital segmented clinical network</title>
<desc>11 devices, 10 links, 4 boundaries. Topology: hierarchical. Links: 1 serial, 1 fiber, 6 copper, 1 poe, 1 wireless.</desc>
<style>.sx-net { font-family: system-ui, -apple-system, sans-serif; }
.sx-net-body { fill: #1d6fb8; stroke: #0f3a5f; stroke-width: 2; }
.sx-net-detail { fill: none; stroke: #0f3a5f; stroke-width: 1; }
.sx-net-glyph { fill: #bfe0f7; stroke: none; }
