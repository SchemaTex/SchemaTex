<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sx-net" role="img" aria-label="Hospital segmented clinical network" width="940.89" height="768" viewBox="-2.05 0 940.89 768" data-diagram-type="network"><title>Network diagram — Hospital segmented clinical network</title>
<desc>11 devices, 10 links, 5 boundaries. Topology: hierarchical. Links: 1 serial, 1 fiber, 6 copper, 1 poe, 1 wireless.</desc>
<style>.sx-net { font-family: Inter, "Helvetica Neue", sans-serif; }
.sx-net-body { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; }
.sx-net-detail { fill: none; stroke: #334155; stroke-width: 1; }
