<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1260" viewBox="0 0 1620 1260">
<title>Hospital Segmented Clinical Network — One NGFW, one clinical core, four separated segments</title>
<desc>A hospital network drawn as three labelled tier bands — edge, core and access — with the Internet and health-exchange WAN above and representative endpoints below. A single healthcare next-generation firewall sits in the edge band and the clinical core switch in the core band; the clinical, biomedical and administrative access switches and the patient guest Wi-Fi access point sit in the access band. Each downlink is annotated with its VLAN and speed, and each endpoint wears a chip naming the segment it belongs to, so clinical, biomedical, administrative and guest traffic can be told apart at a glance.</desc>
<defs><style>
text{font-family:Verdana, sans-serif;fill:#182b3b;font-size:18px}
.title{font-size:30px;font-weight:bold}
.deck{font-size:18px;fill:#536979}
.zone{font-size:23px;font-weight:bold}
.name{font-size:18px;font-weight:bold}
.small{font-size:16px;fill:#536979}
.link{font-size:17px}
.device{fill:white;stroke:#304b60;stroke-width:2.5}
.wire{fill:none;stroke:#536979;stroke-width:3;stroke-linejoin:round}
.fiber{fill:none;stroke:#087d92;stroke-width:5;stroke-linejoin:round}
.poe{fill:none;stroke:#2f7d4f;stroke-width:3.5;stroke-linejoin:round}
.wan{fill:none;stroke:#304b60;stroke-width:4;stroke-linejoin:round}
.wireless{fill:none;stroke:#536979;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}
.oob{fill:none;stroke:#9aa9b4;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:9 6}
.vpn{fill:none;stroke:#6b3fa0;stroke-width:4;stroke-linejoin:round;stroke-dasharray:15 9}
.knock{stroke:none}
</style>
