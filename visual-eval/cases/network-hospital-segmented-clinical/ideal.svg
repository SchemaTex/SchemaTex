<g id="ipphone"><rect class="device" x="-32" y="-8" width="64" height="38" rx="4"/><rect x="-24" y="0" width="26" height="16" fill="#e4edf2"/><path class="device" d="M-30 -26h60v14h-60z" /><path d="M8 6h18 M8 14h18" stroke="#304b60" stroke-width="2"/></g>
