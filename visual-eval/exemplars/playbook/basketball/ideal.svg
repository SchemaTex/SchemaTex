<title>Horns Pick-and-Roll: Skip to the Corner</title>
<desc>Basketball half-court play diagram: Horns pick-and-roll. From the Horns set, 5 sets a ball screen for 1 and rolls to the rim while 4 pops to the left slot; 1 dribbles off the screen to the right wing. When X2 leaves the left corner to tag the roller, 1 throws the skip pass to 2 in that corner.</desc>
