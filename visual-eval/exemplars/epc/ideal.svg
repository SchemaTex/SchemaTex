<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 951 1268" width="951" height="1268" role="img">
  <title>Purchase to Pay — event-driven process chain (eEPC)</title>
  <desc>An ARIS event-driven process chain read top to bottom. A purchase requisition is raised, purchasing checks budget and supplier, then an exclusive-or connector splits the flow: within the spending limit the cost centre owner approves, above it the finance head approves, and an exclusive-or join merges the two paths back into one approved requisition. A purchase order is issued, after which an AND connector runs two branches in parallel — the warehouse posts the goods receipt while accounts payable captures the supplier invoice — and an AND join synchronises them before the three-way match releases payment. Events are lilac hexagons, functions are green rounded rectangles, logical connectors are small grey circles, and the departments and documents attached to each function hang off its side on thin lines.</desc>
