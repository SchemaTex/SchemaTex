<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 1183" width="1122" height="1183">
  <title>The Okafor Household — social-work ecomap</title>
  <desc>A Hartman ecomap for a two-parent household raising a child with additional needs. At the centre, a dashed blue circle holds a mini genogram of the four household members: Daniel (40) and Amara (38) joined by a couple line, with their children Chidi (10, drawn as a shaded square because he is the child with additional needs) and Zora (6) hanging below on a sibship line. Nine outside systems sit on one ring around the household, each a tinted circle whose colour gives its type: grandparents, school, developmental pediatrics, speech and occupational therapy, Amara's employer, the disability benefits office, the housing authority, the parish community and a parent support group. Each system is joined to the household by a single straight spoke whose drawn form states the quality of the tie: three parallel lines for a strong tie (the grandparents), two for a moderate one (parish, parent group), one plain line for an ordinary tie (school), a thin dashed line for a tenuous tie (the employer), and a red zigzag for a stressful tie (benefits and housing). Arrowheads show the direction support flows: one pointing inward from the therapy service, and one at each end of the pediatrics spoke for a reciprocal exchange. A short grey note beside each system says what the tie consists of, and a legend at the foot lists the system tints and the connection codes.</desc>
