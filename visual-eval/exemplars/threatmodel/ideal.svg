<text x="473" y="594.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1e293b">Trust boundary</text>
<line x1="587" y1="590" x2="613" y2="590" stroke="#1e293b" stroke-width="1.6"/><path d="M 621 590 L 612 586.4 L 612 593.6 Z" fill="#1e293b"/>
<text x="631" y="594.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1e293b">Data flow within a zone</text>
<line x1="791" y1="590" x2="817" y2="590" stroke="#b02a37" stroke-width="1.9"/><path d="M 825 590 L 816 586.4 L 816 593.6 Z" fill="#b02a37"/>
<text x="835" y="594.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1e293b">Data flow crossing a boundary</text>
<text x="48" y="632" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">Badges list the STRIDE threats that apply to each element: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.</text>
<text x="48" y="652" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">R? marks repudiation as conditional on a data store; every data flow is exposed to T · I · D.</text>
