<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1256" width="1000" height="1256" role="img">
<title>Accounts-payable invoice approval</title>
<desc>A top-to-bottom process flowchart for approving and paying a supplier invoice. An invoice arrives, is scanned and captured, then looked up against the purchase-order system. If no purchase order matches, the flow steps out to a left-hand exception lane to request one from the buyer and loops back to the lookup. Once matched, the amount decides who approves: invoices over ten thousand dollars go to the CFO, smaller ones to the department head, both inside a boxed Approval group. A rejected approval branches left to a vendor dispute notice and ends as a rejected invoice; an approved one continues straight down the centre through payment scheduling, ledger posting, remittance advice, and ends as a paid invoice.</desc>
