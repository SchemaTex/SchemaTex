<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Animals, vertebrate classes and powered flight</title>
<desc>Euler diagram: vertebrates inside animals; mammals, birds and fish inside vertebrates and apart from each other; powered flight inside animals, partly overlapping vertebrates, mammals and birds, and apart from fish.</desc>
<rect width="880" height="800" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#1F2933">Animals, vertebrate classes and powered flight</text>
<text x="40" y="70" font-size="13" fill="#52606D">Euler diagram · nested outlines are subsets, separate outlines share no members, crossing outlines partly overlap</text>
<ellipse cx="445" cy="425" rx="390" ry="300" fill="#5F6B7A" fill-opacity="0.05"/>
<ellipse cx="380" cy="440" rx="245" ry="245" fill="#2B6CB0" fill-opacity="0.08"/>
<ellipse cx="265" cy="388" rx="98" ry="98" fill="#B7791F" fill-opacity="0.16"/>
<ellipse cx="498" cy="404" rx="102" ry="102" fill="#2F855A" fill-opacity="0.16"/>
<ellipse cx="380" cy="588" rx="78" ry="78" fill="#2C7A7B" fill-opacity="0.16"/>
<ellipse cx="475" cy="282" rx="278" ry="108" fill="#6B46C1" fill-opacity="0.1"/>
<defs><pattern id="empty-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#4A5563" stroke-width="1.3"/></pattern>
<clipPath id="clip-vert"><ellipse cx="380" cy="440" rx="245" ry="245"/></clipPath><clipPath id="clip-flight"><ellipse cx="475" cy="282" rx="278" ry="108"/></clipPath>
<mask id="not-mammal-bird"><rect width="880" height="800" fill="#fff"/><circle cx="265" cy="388" r="98" fill="#000"/><circle cx="498" cy="404" r="102" fill="#000"/></mask></defs>
<g clip-path="url(#clip-vert)"><g clip-path="url(#clip-flight)"><rect width="880" height="800" fill="url(#empty-hatch)" fill-opacity="0.55" mask="url(#not-mammal-bird)"/></g></g>
<ellipse cx="445" cy="425" rx="390" ry="300" fill="none" stroke="#5F6B7A" stroke-width="2"/>
<ellipse cx="380" cy="440" rx="245" ry="245" fill="none" stroke="#2B6CB0" stroke-width="2"/>
<ellipse cx="265" cy="388" rx="98" ry="98" fill="none" stroke="#B7791F" stroke-width="2"/>
<ellipse cx="498" cy="404" rx="102" ry="102" fill="none" stroke="#2F855A" stroke-width="2"/>
<ellipse cx="380" cy="588" rx="78" ry="78" fill="none" stroke="#2C7A7B" stroke-width="2"/>
<ellipse cx="475" cy="282" rx="278" ry="108" fill="none" stroke="#6B46C1" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="40" y="758" width="28" height="16" fill="url(#empty-hatch)" fill-opacity="0.55" stroke="#4A5563" stroke-width="1"/>
<text x="80" y="771" font-size="12.5" fill="#52606D">Hatched area has no members: every vertebrate capable of powered flight is a mammal or a bird</text>
<text x="136" y="301.0" font-size="15" font-weight="600" fill="#5F6B7A" text-anchor="middle">Animals</text>
<text x="252" y="605.0" font-size="15" font-weight="600" fill="#2B6CB0" text-anchor="middle">Vertebrates</text>
<text x="664" y="256.0" font-size="15" font-weight="600" fill="#6B46C1" text-anchor="middle">Powered flight</text>
<text x="232" y="445.0" font-size="15" font-weight="600" fill="#B7791F" text-anchor="middle">Mammals</text>
<text x="496" y="425.0" font-size="15" font-weight="600" fill="#2F855A" text-anchor="middle">Birds</text>
<text x="380" y="573.0" font-size="15" font-weight="600" fill="#2C7A7B" text-anchor="middle">Fish</text>
<text x="700" y="276.5" font-size="13" font-weight="400" font-style="italic" fill="#52606D" text-anchor="middle">Insects</text>
<text x="288" y="344.5" font-size="13" font-weight="400" font-style="italic" fill="#52606D" text-anchor="middle">Bats</text>
<text x="496" y="328.5" font-size="13" font-weight="400" font-style="italic" fill="#52606D" text-anchor="middle">Most birds</text>
<text x="496" y="443.5" font-size="13" font-weight="400" font-style="italic" fill="#52606D" text-anchor="middle">Penguins, ostriches</text>
</svg>
