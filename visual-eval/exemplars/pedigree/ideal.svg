  <text x="360" y="64" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#475569">X-linked recessive; drawn to NSGC standardised pedigree nomenclature (Bennett)</text>
