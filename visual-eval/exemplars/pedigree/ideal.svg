<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" width="720" height="824" role="img">
  <title>Haemophilia A — Four-Generation Family</title>
  <desc>A clinical pedigree of an X-linked recessive bleeding disorder across four generations. The affected great-grandfather in generation I, marked with a diagonal slash for deceased, passes his X chromosome to both daughters, who are therefore obligate carriers shown as circles filled with a blue diagonal hatch. One grandson is affected and one granddaughter is a confirmed carrier; she and her first cousin marry, drawn as a double line for a consanguineous union. Their four pregnancies are an affected son who is the proband, a spontaneous loss drawn as a small triangle, and identical twin daughters who are both carriers, drawn on a twin fork with a horizontal bar. Generations are labelled I to IV down the left margin and individuals are numbered left to right; a boxed key at the foot explains every symbol used.</desc>
  <defs><pattern id="carrier-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#1565c0" stroke-width="1.6"/></pattern></defs>
