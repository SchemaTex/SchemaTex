<text x="44" y="50" font-size="20" font-weight="600" fill="#0F172A">Checkout with a saved card</text>
<text x="44" y="74" font-size="11" fill="#64748B">UML 2.5.1 SEQUENCE DIAGRAM · 7 LIFELINES · ALT, LOOP AND OPT FRAGMENTS</text>
