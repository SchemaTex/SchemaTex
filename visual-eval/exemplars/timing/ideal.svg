<text x="24" y="428" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">S start and P stop: SDA changes while SCL is high.  Sr repeated start.  ACK: the receiver pulls SDA low; NACK: SDA is left high.</text>
<text x="24" y="446" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">Byte fields are compressed: the eight data clocks of each byte are drawn as two.</text>
</svg>
