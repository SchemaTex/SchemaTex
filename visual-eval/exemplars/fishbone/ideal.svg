<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2003 716" width="2003" height="716" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>SMT solder-bridge defect analysis</title>
<desc>Ishikawa (fishbone) cause-and-effect diagram drawn as a fish in outline. A forked tail at the far left starts a straight horizontal spine that runs right and ends in an arrowhead entering the fish head: a single closed outline with a curved back tapering to a blunt nose, drawn in dark slate on a near-white fill, with one hairline gill curve and no eye or mouth. The head carries the effect statement "Solder bridging on SMT line 3 at 1,850 DPPM" under a small letterspaced EFFECT label. Six category bones leave the spine at 60 degrees in three mirrored pairs that meet the spine at shared V junctions: Man above and Method below, Machine above and Measurement below, Material above and Mother Nature below. Each category owns one colour, used for its bone, its cause rules and its sub-cause twigs, with the category name in white on a solid pill of that colour at the bone tip. Eighteen causes are horizontal rules that underline their text and end in an arrowhead touching the bone. Fifteen sub-causes hang off those rules as short twigs slanted at the same 60 degrees as the bone, pointing back toward the spine, each with its label sitting at the free end. Colour appears only on the bones, rules and twigs; the fish, the effect statement and all cause text are neutral slate.</desc>
<rect width="2003" height="716" fill="#FFFFFF"/>
