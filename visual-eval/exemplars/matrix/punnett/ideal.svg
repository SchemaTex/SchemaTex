<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="650" viewBox="0 0 1060 650" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Dihybrid cross — seed shape and colour in peas</title>
<desc>A 4 by 4 Punnett square for the dihybrid pea cross RrYy × RrYy. The four pollen gametes RY, Ry, rY and ry run across the top and the four ovule gametes down the left. Each of the 16 boxes gives the offspring genotype and its phenotype and is shaded by phenotype: 9 round yellow, 3 round green, 3 wrinkled yellow, 1 wrinkled green. A key states the 9:3:3:1 phenotype ratio and the 1:2:1:2:4:2:1:2:1 genotype ratio.</desc>
<rect x="0" y="0" width="1060" height="650" fill="#ffffff"/>
<text x="48" y="46" font-size="22" font-weight="600" text-anchor="start" fill="#1e293b">Dihybrid cross — seed shape and colour in peas</text>
<text x="48" y="74" font-size="13" font-weight="400" text-anchor="start" fill="#475569">Punnett square for RrYy × RrYy. Round (R) is dominant to wrinkled (r); yellow (Y) is dominant to green (y).</text>
