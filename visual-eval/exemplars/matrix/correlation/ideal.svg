<svg xmlns="http://www.w3.org/2000/svg" width="912" height="818" viewBox="0 0 912 818" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Cardiometabolic risk factors — correlation matrix</title>
<desc>Lower-triangle Pearson correlation matrix of eight cardiometabolic screening measures: age, BMI, waist circumference, systolic blood pressure, LDL cholesterol, HDL cholesterol, fasting glucose and weekly exercise. Each variable is named in a grey diagonal cell; each off-diagonal cell shows the coefficient and is coloured on a diverging blue-white-red scale centred on zero. The strongest relationship is BMI with waist circumference at 0.86; HDL cholesterol and weekly exercise correlate negatively with most other measures. A colour bar legend sits in the empty upper triangle.</desc>
<defs><linearGradient id="rdbu" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2166ac"/><stop offset="0.25" stop-color="#92c5de"/><stop offset="0.5" stop-color="#f7f7f7"/><stop offset="0.75" stop-color="#f4a582"/><stop offset="1" stop-color="#b2182b"/></linearGradient></defs>
