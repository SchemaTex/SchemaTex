<text x="504" y="240" font-size="11" font-weight="400" text-anchor="start" fill="#475569">The matrix is symmetric: r(A, B) = r(B, A), so the upper</text>
<text x="504" y="256" font-size="11" font-weight="400" text-anchor="start" fill="#475569">triangle repeats these values and the diagonal is r = 1.</text>
<text x="504" y="272" font-size="11" font-weight="400" text-anchor="start" fill="#475569">With n = 1,248, |r| ≥ 0.06 is significant at p &lt; 0.05.</text>
<text x="48" y="776" font-size="11" font-weight="400" text-anchor="start" fill="#475569">Read a coefficient at the row of one variable and the column</text>
