<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="715" viewBox="0 0 1300 715" role="img">
<title>B2B order fulfilment · SIPOC</title>
<desc>A Six Sigma SIPOC table scoping the B2B order fulfilment process. Five labelled columns read left to right — Suppliers, Inputs, Process, Outputs, Customers. The Process column holds six numbered high-level steps (Receive and enter order, Check credit and stock, Pick items, Pack and label, Ship with carrier, Issue invoice) inside a dashed process boundary that starts at &quot;Order received in ERP&quot; and ends at &quot;Invoice sent to buyer&quot;. Suppliers line up with the inputs they provide, and outputs line up with the customers who receive them.</desc>
<rect x="0" y="0" width="1300" height="715" fill="#ffffff"/>
<g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="44" y="46" font-size="22" font-weight="600" fill="#1e293b" text-anchor="start">B2B order fulfilment · SIPOC</text>
<text x="44" y="74" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Define-phase scope for the late-shipment improvement project: six high-level steps from order received to invoice sent.</text>
