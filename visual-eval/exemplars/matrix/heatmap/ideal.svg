<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>EHR migration — project risk matrix</title>
<desc>A five-by-five risk matrix for an electronic health record migration. Likelihood rises from Rare to Almost certain up the vertical axis and consequence from Insignificant to Severe along the horizontal axis. Each cell shows its score, likelihood times consequence, and is coloured by rating band: green Low 1–3, yellow Moderate 4–6, orange High 8–12, red Extreme 15–25. Eleven risks are plotted by ID and listed in a register ordered by score.</desc>
