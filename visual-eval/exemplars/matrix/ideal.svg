<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800" role="img">
<title>Consumer Health portfolio — FY26 review</title>
<desc>A Boston Consulting Group growth-share matrix reviewing nine consumer-health products. The square plot is split into four tinted quadrants — Stars, Question Marks, Cash Cows and Dogs — with relative market share increasing to the left and market growth increasing upward. Each product is a circle whose area is proportional to its FY26 net revenue, coloured by category, with its name and revenue set beside it. A boxed panel on the right lists the four categories and gives three nested reference circles for reading bubble size.</desc>
