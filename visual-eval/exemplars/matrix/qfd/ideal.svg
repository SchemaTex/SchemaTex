<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="938" viewBox="0 0 1236 938" role="img">
<title>Drip coffee maker · House of Quality</title>
<desc>A House of Quality for a drip coffee maker. Five customer requirements with importance weights sit on the left; six technical characteristics with direction-of-improvement arrows run across the top. The relationship matrix uses filled circles (strong, 9), open circles (medium, 3) and triangles (weak, 1). A triangular roof records correlations between characteristics. Computed rows give technical importance Heater power (W) 60, Brew time (min) 45, Carafe heat loss (°C/h) 55, Pump noise (dBA) 31, Removable parts (count) 36, Standby power (W) 23, their share of 250, and priority rank. A right-hand panel compares customer ratings of our model with two competitors.</desc>
