<text x="600" y="141" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">P(fail) = 0.02</text>
<text x="760" y="108" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Containment</text>
