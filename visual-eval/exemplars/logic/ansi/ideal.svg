<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="706" viewBox="0 0 1290 706" role="img">
<title>2-bit Magnitude Comparator</title>
<desc>A gate-level logic diagram of a 2-bit magnitude comparator drawn with ANSI/IEEE Std 91 distinctive-shape symbols. The four inputs A1, B1, A0 and B0 enter as labelled stubs on the left margin; signal flow runs strictly left to right through five columns of gates ordered by logic depth. Two exclusive-OR gates detect a difference on each bit pair, a NOR gate combines them into the equal output, inverters supply the complemented B bits and the bit-1 equality term, an AND pair and a three-input AND form the greater-than product terms, an OR gate sums them into the greater-than output, and a final NOR gate derives less-than from greater-than and equal. All wires are orthogonal; filled dots mark fan-out junctions and plain crossings mark wires that pass without connecting. The three outputs GT, EQ and LT leave on the right margin.</desc>
