<g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="46" y="56" font-size="20" fill="#1E293B" text-anchor="start" font-weight="600">2-bit Magnitude Comparator</text>
<text x="46" y="80" font-size="11.5" fill="#64748B" text-anchor="start">ANSI / IEEE Std 91 distinctive-shape gates · signal flow left to right</text>
<text x="54" y="122.5" font-size="13" fill="#1E293B" text-anchor="end">A1</text>
<text x="54" y="146.5" font-size="13" fill="#1E293B" text-anchor="end">B1</text>
<text x="54" y="474.5" font-size="13" fill="#1E293B" text-anchor="end">A0</text>
<text x="54" y="498.5" font-size="13" fill="#1E293B" text-anchor="end">B0</text>
<text x="1160" y="310.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">GT</text>
<text x="1200" y="310.5" font-size="10" fill="#64748B" text-anchor="start">A &gt; B</text>
<text x="1160" y="398.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">EQ</text>
<text x="1200" y="398.5" font-size="10" fill="#64748B" text-anchor="start">A = B</text>
<text x="1160" y="486.5" font-size="13" fill="#1E293B" text-anchor="start" font-weight="600">LT</text>
<text x="1200" y="486.5" font-size="10" fill="#64748B" text-anchor="start">A &lt; B</text>
<text x="54" y="168" font-size="10" fill="#64748B" text-anchor="end">MSB</text>
<text x="54" y="520" font-size="10" fill="#64748B" text-anchor="end">LSB</text>
<text x="300" y="123" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">d1</text>
<text x="260" y="299" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">nB1</text>
<text x="449" y="123" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">e1</text>
<text x="560" y="211" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">g1</text>
<text x="287" y="475" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">d0</text>
<text x="380" y="563" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">nB0</text>
<text x="661" y="475" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="0.4">g0</text>
<text x="46" y="664" font-size="11.5" fill="#64748B" text-anchor="start">GT = A1·B1′ + (A1 XNOR B1)·A0·B0′</text>
<text x="340" y="664" font-size="11.5" fill="#64748B" text-anchor="start">EQ = (A1 XNOR B1)·(A0 XNOR B0)</text>
<text x="620" y="664" font-size="11.5" fill="#64748B" text-anchor="start">LT = (GT + EQ)′</text>
<text x="1244" y="80" font-size="11.5" fill="#64748B" text-anchor="end">filled dot = junction · plain crossing = no connection</text>
</g>
</svg>
