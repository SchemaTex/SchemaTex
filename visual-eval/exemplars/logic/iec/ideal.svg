<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="706" viewBox="0 0 1290 706" role="img">
<title>2-bit Magnitude Comparator</title>
<desc>A gate-level logic diagram of a 2-bit magnitude comparator drawn with IEC 60617-12 rectangular binary-logic symbols. Every gate is a rectangle with its qualifying symbol inside: =1 for exclusive-OR, &amp; for AND, ≥1 for OR and 1 for the buffer; a small negation circle at the output turns ≥1 into NOR and 1 into an inverter. The four inputs A1, B1, A0 and B0 enter on the left; two exclusive-OR elements detect a difference on each bit pair, a negated ≥1 element forms the equal output, inverters supply the complemented B bits and the bit-1 equality term, an AND pair and a three-input AND form the greater-than product terms, a ≥1 element sums them into GT, and a final negated ≥1 element derives LT from GT and EQ. All wires are orthogonal; filled dots mark fan-out junctions and plain crossings do not connect.</desc>
<rect x="0" y="0" width="1290" height="706" fill="#FFFFFF"/>
<line x1="46" y1="96" x2="1244" y2="96" stroke="#E2E8F0" stroke-width="1"/>
<line x1="46" y1="636" x2="1244" y2="636" stroke="#E2E8F0" stroke-width="1"/>
