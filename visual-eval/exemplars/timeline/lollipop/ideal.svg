<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="660" viewBox="0 0 1320 660" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Milestones of Human Spaceflight</title>
<desc>Lollipop timeline of twelve human spaceflight firsts with stems alternating above and below a decade axis.</desc>
<rect width="1320" height="660" fill="#FFFFFF"/>


<text x="40" y="50" font-size="22" font-weight="600" text-anchor="start" fill="#1F2933">Milestones of Human Spaceflight</text>
<text x="40" y="74" font-size="13" font-weight="400" text-anchor="start" fill="#5F6B76">Twelve firsts, 1957 – 2020, on a proportional year scale · red marks the four turning points</text>
<rect x="40" y="340" width="1240" height="40" rx="3" fill="#2B3440" stroke="none" stroke-width="1"/>
<text x="154.28571428571428" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">1960</text>
<text x="322.85714285714283" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">1970</text>
<text x="491.42857142857144" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">1980</text>
<text x="660" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">1990</text>
<text x="828.5714285714287" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">2000</text>
<text x="997.1428571428571" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">2010</text>
<text x="1165.7142857142858" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">2020</text>
<line x1="1172.6726679712965" y1="340" x2="1172.6726679712965" y2="310" stroke="#B42318" stroke-width="2"/>
<circle cx="1172.6726679712965" cy="310" r="6" fill="#B42318" stroke="#B42318" stroke-width="2"/>
<text x="1160.6726679712965" y="278" font-size="11" font-weight="600" text-anchor="end" fill="#B42318">May 30, 2020</text>
<text x="1160.6726679712965" y="294" font-size="12" font-weight="600" text-anchor="end" fill="#1F2933">Crew Dragon Demo-2</text>
<text x="1160.6726679712965" y="310" font-size="12" font-weight="400" text-anchor="end" fill="#1F2933">commercial crew</text>
<line x1="1037.5846053489868" y1="380" x2="1037.5846053489868" y2="410" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="1037.5846053489868" cy="410" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="1049.5846053489868" y="414" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">May 25, 2012</text>
<text x="1049.5846053489868" y="430" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Dragon</text>
<text x="1049.5846053489868" y="446" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first commercial ISS berthing</text>
<line x1="892.4322896281783" y1="380" x2="892.4322896281783" y2="410" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="892.4322896281783" cy="410" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="904.4322896281783" y="414" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Oct 15, 2003</text>
<text x="904.4322896281783" y="430" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Yang Liwei</text>
<text x="904.4322896281783" y="446" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">China's first astronaut</text>
<line x1="809.7822570123915" y1="340" x2="809.7822570123915" y2="310" stroke="#B42318" stroke-width="2"/>
<circle cx="809.7822570123915" cy="310" r="6" fill="#B42318" stroke="#B42318" stroke-width="2"/>
<text x="821.7822570123915" y="278" font-size="11" font-weight="600" text-anchor="start" fill="#B42318">Nov 20, 1998</text>
<text x="821.7822570123915" y="294" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">First ISS module</text>
<text x="821.7822570123915" y="310" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">Zarya</text>
<line x1="665.2765166340507" y1="380" x2="665.2765166340507" y2="410" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="665.2765166340507" cy="410" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="677.2765166340507" y="414" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Apr 24, 1990</text>
<text x="677.2765166340507" y="430" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Hubble Space Telescope launched</text>
<line x1="513.0080234833663" y1="340" x2="513.0080234833663" y2="310" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="513.0080234833663" cy="310" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="525.0080234833663" y="278" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Apr 12, 1981</text>
<text x="525.0080234833663" y="294" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">STS-1</text>
<text x="525.0080234833663" y="310" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first Space Shuttle flight</text>
<line x1="344.75988258316966" y1="380" x2="344.75988258316966" y2="410" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="344.75988258316966" cy="410" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="356.75988258316966" y="414" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Apr 19, 1971</text>
<text x="356.75988258316966" y="430" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Salyut 1</text>
<text x="356.75988258316966" y="446" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first space station</text>
<line x1="315.30606653620225" y1="340" x2="315.30606653620225" y2="310" stroke="#B42318" stroke-width="2"/>
<circle cx="315.30606653620225" cy="310" r="6" fill="#B42318" stroke="#B42318" stroke-width="2"/>
<text x="327.30606653620225" y="278" font-size="11" font-weight="600" text-anchor="start" fill="#B42318">Jul 20, 1969</text>
<text x="327.30606653620225" y="294" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Apollo 11</text>
<text x="327.30606653620225" y="310" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first crewed Moon landing</text>
<line x1="242.1660795825193" y1="380" x2="242.1660795825193" y2="486" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="242.1660795825193" cy="486" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="254.1660795825193" y="490" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Mar 18, 1965</text>
<text x="254.1660795825193" y="506" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Alexei Leonov</text>
<text x="254.1660795825193" y="522" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first spacewalk</text>
<line x1="212.5737116764541" y1="340" x2="212.5737116764541" y2="234" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="212.5737116764541" cy="234" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="224.5737116764541" y="202" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Jun 16, 1963</text>
<text x="224.5737116764541" y="218" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Valentina Tereshkova</text>
<text x="224.5737116764541" y="234" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first woman in space</text>
<line x1="175.86516634050906" y1="380" x2="175.86516634050906" y2="562" stroke="#B42318" stroke-width="2"/>
<circle cx="175.86516634050906" cy="562" r="6" fill="#B42318" stroke="#B42318" stroke-width="2"/>
<text x="187.86516634050906" y="566" font-size="11" font-weight="600" text-anchor="start" fill="#B42318">Apr 12, 1961</text>
<text x="187.86516634050906" y="582" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Yuri Gagarin</text>
<text x="187.86516634050906" y="598" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first human in orbit</text>
<line x1="116.49569471624447" y1="340" x2="116.49569471624447" y2="158" stroke="#2B3440" stroke-width="1.25"/>
<circle cx="116.49569471624447" cy="158" r="4.5" fill="#FFFFFF" stroke="#2B3440" stroke-width="2"/>
<text x="128.4956947162445" y="126" font-size="11" font-weight="600" text-anchor="start" fill="#5F6B76">Oct 4, 1957</text>
<text x="128.4956947162445" y="142" font-size="12" font-weight="600" text-anchor="start" fill="#1F2933">Sputnik 1</text>
<text x="128.4956947162445" y="158" font-size="12" font-weight="400" text-anchor="start" fill="#1F2933">first artificial satellite</text>
</svg>
