<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>Semaphore Mutual Exclusion</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#000"/></marker>
  </defs>
  <rect width="1536" height="1024" fill="white"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#000" text-anchor="middle">
    <text x="768" y="68" font-size="54">Semaphore Mutual Exclusion</text>
    <text x="333" y="184" font-size="34">ReadyA</text>
    <text x="1203" y="184" font-size="34">ReadyB</text>
    <text x="768" y="413" font-size="34">Semaphore</text>
    <text x="395" y="603" font-size="32" text-anchor="start">CriticalA</text>
    <text x="1141" y="603" font-size="32" text-anchor="end">CriticalB</text>
    <text x="150" y="422" font-size="32" text-anchor="end">EnterA</text>
    <text x="1386" y="422" font-size="32" text-anchor="start">EnterB</text>
    <text x="277" y="775" font-size="32" text-anchor="end">ExitA</text>
    <text x="1267" y="775" font-size="32" text-anchor="start">ExitB</text>
  </g>
  <!-- Directed arcs: each connects one place and one transition. -->
  <g fill="none" stroke="#000" stroke-width="3.3" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M333 305 V401"/>
    <path d="M333 423 V543"/>
    <path d="M333 641 V753"/>
    <path d="M333 775 V833 H167 V256 H284"/>
    <path d="M711 500 H560 V412 H395"/>
    <path d="M395 764 H560 V540 H727"/>
    <path d="M1203 305 V401"/>
    <path d="M1203 423 V543"/>
    <path d="M1203 641 V753"/>
    <path d="M1203 775 V833 H1368 V256 H1252"/>
    <path d="M825 500 H976 V412 H1141"/>
    <path d="M1141 764 H976 V540 H809"/>
  </g>
  <!-- Places. -->
  <g fill="white" stroke="#000" stroke-width="3.3">
    <circle cx="333" cy="256" r="49"/>
    <circle cx="1203" cy="256" r="49"/>
    <circle cx="333" cy="592" r="49"/>
    <circle cx="1203" cy="592" r="49"/>
    <circle cx="768" cy="500" r="57"/>
  </g>
  <!-- Initial marking. -->
  <g fill="#000">
    <circle cx="333" cy="256" r="13"/>
    <circle cx="1203" cy="256" r="13"/>
    <circle cx="768" cy="500" r="13"/>
    <rect x="289" y="401" width="106" height="22"/>
    <rect x="1141" y="401" width="106" height="22"/>
    <rect x="296" y="753" width="99" height="22"/>
    <rect x="1141" y="753" width="99" height="22"/>
  </g>
  <text x="768" y="942" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#000">Firing sequence: EnterA → ExitA → EnterB</text>
</svg>
