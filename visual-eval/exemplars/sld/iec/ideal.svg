<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1372" width="1580" height="1372" role="img">
<title>Distribution Centre · 11 kV Primary Service</title>
<desc>An 11 kV network infeed passes through revenue meter -P1, incoming disconnector -Q0, vacuum circuit-breaker -Q1 and current transformer -T11 into the 1600 kVA Dyn11 service transformer -T1, whose star point is earthed. Overcurrent relay -F11 (I&gt;, I&gt;&gt;) and earth-fault relay -F12 (I0&gt;) take current from -T11 and trip -Q1 over dashed linkages. On the 400/230 V side the 2500 A main circuit-breaker -Q2 feeds main switchboard -MSB, which serves Panel HA, chiller motor CH-1, isolation transformer -T2 through disconnector -Q5 and fuse -F5 to Panel LA, and the normal side of ATS-1. Standby generator -G1 reaches the emergency side of ATS-1 through breaker -Q7; ATS-1 supplies the standby panel. All symbols follow IEC 60617: breakers as switches with a cross, disconnectors with a bar, the fuse as a rectangle, transformers as two overlapping circles.</desc>
<rect width="1580" height="1372" fill="#ffffff"/>
