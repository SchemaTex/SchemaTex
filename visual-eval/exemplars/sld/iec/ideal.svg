<text x="46" y="1318" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Dashed lines are relay trip linkages and the thin line from -T11 is the CT secondary; neither carries load current. ATS-1 is shown in its normal position.</text>
<text x="46" y="1336" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Device designations follow IEC 81346 (-Q switching device, -F protection, -T transformer, -P meter). Earth-fault protection on -Q2 is the G element of its LSIG trip unit.</text>
