<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="960" viewBox="0 0 1560 960" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Vessel Level Control with High-Level Shutdown</title>
<desc>Piping and instrumentation diagram of a vessel level control loop with an independent high-level shutdown, drawn with ISA-5.1 instrument symbols on ISO 10628 equipment. Process flow runs left to right: the atmospheric feed tank TK-100 discharges through the solenoid-operated fail-closed shutoff valve XV-202 and over the top into the vertical surge vessel V-101, which is protected by the spring relief valve PSV-105 venting to atmosphere. V-101 drains through the manual gate valve HV-103 to the centrifugal transfer pump P-101, then through the swing check valve CV-104 and the diaphragm-operated fail-open control valve LV-101 into the product tank TK-102. Two level paths leave the vessel and never touch each other: the level transmitter LT-101 senses V-101 through a capillary line and reports on an electric signal to LIC-101, a shared-display controller drawn above the control-room divide, which modulates LV-101 on a pneumatic signal; separately the high-high level switch LSHH-202 senses the vessel and trips XV-202 through the hardwired interlock I-202 on electric signals, with no path through the DCS. A local pressure gauge PI-106 taps the pump discharge. Line weight and line decoration carry the whole hierarchy: heavy solid for process piping, light solid for the minor relief line, dashed for electric signals, hashed for pneumatic signals and dotted for capillary sensing lines, with a legend along the bottom edge.</desc>
