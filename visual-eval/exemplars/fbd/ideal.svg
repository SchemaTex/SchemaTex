<line x1="48" y1="912" x2="992" y2="912" stroke="#CBD1D6" stroke-width="1"/>
<text x="48" y="938" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">Instance name above each block, block type inside the top, formal parameter names inside at their pins.</text>
<text x="48" y="956" font-size="12" font-weight="400" text-anchor="start" fill="#59636B">An inward wedge marks an edge-triggered input (CTU.CU); a small circle marks a negated input.</text>
