<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="978" viewBox="0 0 1040 978" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><title>Bottle counter — IEC 61131-3 FBD</title><rect width="1040" height="978" fill="#FFFFFF"/>
<text x="48" y="56" font-size="25" font-weight="600" text-anchor="start" fill="#20272B">Bottle counter</text>
<text x="48" y="82" font-size="13" font-weight="400" text-anchor="start" fill="#59636B">PROGRAM BottleCounter  ·  IEC 61131-3 function block diagram</text>
