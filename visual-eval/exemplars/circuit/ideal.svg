<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="912" viewBox="0 0 1360 912" role="img">
<title>555 LED Flasher</title>
<desc>Circuit schematic drawn with IEEE 315 symbols. A 9 V battery BT1 feeds a +9 V rail across the top and a GND return rail along the bottom, with C3 100 nF decoupling across them. An NE555 timer U1 runs astable: R1 1 kilohm from +9 V to DISCH pin 7, R2 68 kilohm from DISCH to the joined THR pin 6 and TRIG pin 2, and the 10 microfarad electrolytic C1 from that node to ground; RESET pin 4 and VCC pin 8 go to +9 V, GND pin 1 to ground, and CTRL pin 5 is bypassed by C2 10 nF. OUT pin 3 drives the base of the 2N3904 NPN transistor Q1 through R3 4.7 kilohm; Q1 switches a red LED D1 in series with R4 330 ohm from the +9 V rail to its collector, and its emitter returns to ground. Dots mark T-junctions; no wires cross.</desc>
