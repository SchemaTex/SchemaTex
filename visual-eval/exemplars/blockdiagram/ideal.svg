<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1364 638" width="1364" height="638" role="img">
  <title>BLDC Joint Servo — Closed-Loop Speed Control</title>
  <desc>Functional block diagram of a robot-joint servo drive. A motion command enters a summing junction where the measured joint speed is subtracted; the resulting error runs left to right through the digital control subsystem (PID speed controller, current limiter, PWM modulator), folds down into the power stage (gate driver and three-phase MOSFET inverter), then drives the BLDC motor, the gearbox and joint load, and finally the joint-speed output. A pickoff on the output feeds the lower return path — quadrature encoder into a speed estimator and low-pass filter — which returns to the negative input of the summing junction. Forward signals are drawn in black; the feedback path is drawn in a single accent colour. Two dashed frames mark the control-electronics and power-stage subsystems.</desc>
