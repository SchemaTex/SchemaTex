  <text x="58" y="68" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#63707F">Functional block diagram · 20 kHz current loop, 2 kHz speed loop · negative-feedback speed regulation</text>
