<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="556" viewBox="0 0 1320 556" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" stroke-linecap="butt" stroke-linejoin="miter">
<title>Greenhouse Climate Telemetry Node</title>
<desc>Hardware block diagram of a battery-powered greenhouse telemetry node, read left to right. A Li-ion cell feeds a VBAT branch to a 3.3 V buck and a 5 V boost regulator. The 3V3 rail rises to one top trunk and taps down into the three sensors, the microcontroller, the SPI flash and the LoRa transceiver; the 5V rail runs in a channel just below the sensing and compute frames to the fan driver. Temperature/humidity, CO2 and ambient-light sensors share one I2C bus trunk into the microcontroller; the light sensor also raises an interrupt. The microcontroller drives one SPI trunk shared by the flash log and the LoRa transceiver, which feeds the antenna, and a PWM line to the fan driver and vent fan. An SWD debug header and the fan PWM line leave the bottom of the microcontroller. Power lines are orange, data lines ink, the interrupt dashed; junction dots mark every branch.</desc>
