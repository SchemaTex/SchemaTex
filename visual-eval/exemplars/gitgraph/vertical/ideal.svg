<svg xmlns="http://www.w3.org/2000/svg" width="920" height="694" viewBox="0 0 920 694" role="img" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Git Flow release history</title>
<desc>Git branch graph with one coloured lane per branch and one row per commit, newest at the top. main is tagged v2.3.0; develop branches from it and feature/saved-carts branches from develop with two commits. hotfix/2.3.1 branches from main with a highlighted fix, merges into main as v2.3.1 and into develop. The feature merges into develop, release/2.4 branches from develop with two commits and merges into main as v2.4.0 and back into develop.</desc>
