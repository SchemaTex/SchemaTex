<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="687" viewBox="0 0 1130 687" role="img">
<title>Mitosis and meiosis</title>
<desc>A double-bubble map comparing Mitosis and Meiosis. The two subjects are large circles, Mitosis in blue on the left and Meiosis in plum on the right. The 4 traits they share stand in a column between them, each joined to both; the 5 traits unique to Mitosis fan out to its left and the 5 unique to Meiosis fan out to its right.</desc>
