<svg xmlns="http://www.w3.org/2000/svg" width="966" height="488" viewBox="0 0 966 488" role="img">
<title>Laptop class for the field-inspection team</title>
<desc>A comparison matrix of 4 options (Ultrabook, Rugged, 2-in-1 tablet, Mobile workstation) against 6 criteria. Cells hold either a measured value or a yes, partly or no mark on a tinted disc; a key under the table names the marks.</desc>
<rect x="0" y="0" width="966" height="488" fill="#ffffff"/>
<text x="48" y="58" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2430">Laptop class for the field-inspection team</text>
<text x="354.5" y="121" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="middle">Ultrabook</text>
<text x="515.5" y="121" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="middle">Rugged</text>
<text x="676.5" y="121" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="middle">2-in-1 tablet</text>
<text x="837.5" y="121" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="middle">Mobile workstation</text>
<text x="64" y="165.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1B2430">Weight</text>
<text x="354.5" y="165.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="middle">1.2 kg</text>
<text x="515.5" y="165.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="middle">3.4 kg</text>
<text x="676.5" y="165.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="middle">1.1 kg</text>
<text x="837.5" y="165.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="middle">2.6 kg</text>
<rect x="48" y="184" width="870" height="46" fill="#F4F6F9"/>
<text x="64" y="211.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1B2430">Survives a 1.2 m drop</text>
<text x="64" y="257.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1B2430">Readable in direct sunlight</text>
<rect x="48" y="276" width="870" height="46" fill="#F4F6F9"/>
<text x="64" y="303.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1B2430">Pen input for markup</text>
<text x="64" y="349.8" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1B2430">Runs the CAD viewer smoothly</text>
<rect x="48" y="368" width="870" height="46" fill="#F4F6F9"/>
