<svg xmlns="http://www.w3.org/2000/svg" width="996" height="416" viewBox="0 0 996 416" role="img">
<title>Move the data warehouse to a managed cloud service?</title>
<desc>Pros and cons for "Move the data warehouse to a managed cloud service?": 5 pros in a green-headed column on the left, 3 cons in a red-headed column on the right, each point marked with a tick or a cross.</desc>
<rect x="0" y="0" width="996" height="416" fill="#ffffff"/>
<text x="48" y="58" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2430">Move the data warehouse to a managed cloud service?</text>
<circle cx="59" cy="111" r="11" fill="#2E7A4E"/><path d="M54.16 111.33 L57.57 114.74 L64.06 107.37" fill="none" stroke="#ffffff" stroke-width="2.09" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="116" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B2430">Pros</text>
<text x="472" y="116" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2E7A4E" text-anchor="end">5</text>
<line x1="48" y1="133" x2="472" y2="133" stroke="#2E7A4E" stroke-width="2"/>
<circle cx="535" cy="111" r="11" fill="#B03A3A"/><path d="M531.26 107.26 L538.74 114.74 M538.74 107.26 L531.26 114.74" fill="none" stroke="#ffffff" stroke-width="2.09" stroke-linecap="round" stroke-linejoin="round"/>
<text x="554" y="116" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B2430">Cons</text>
<text x="948" y="116" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#B03A3A" text-anchor="end">3</text>
<line x1="524" y1="133" x2="948" y2="133" stroke="#B03A3A" stroke-width="2"/>
<circle cx="58" cy="156.5" r="10" fill="#E3F1E8" stroke="#2E7A4E" stroke-width="1.2"/><path d="M53.6 156.8 L56.7 159.9 L62.6 153.2" fill="none" stroke="#2E7A4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="161" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">Storage and compute scale independently</text>
<line x1="80" y1="180" x2="472" y2="180" stroke="#E4E9EE" stroke-width="1"/>
<circle cx="534" cy="156.5" r="10" fill="#F7E4E3" stroke="#B03A3A" stroke-width="1.2"/><path d="M530.6 153.1 L537.4 159.9 M537.4 153.1 L530.6 159.9" fill="none" stroke="#B03A3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="556" y="161" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">Egress fees on every dataset that leaves the platform</text>
<line x1="556" y1="180" x2="948" y2="180" stroke="#E4E9EE" stroke-width="1"/>
<circle cx="58" cy="203.5" r="10" fill="#E3F1E8" stroke="#2E7A4E" stroke-width="1.2"/><path d="M53.6 203.8 L56.7 206.9 L62.6 200.2" fill="none" stroke="#2E7A4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="208" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">No hardware refresh in the 2027 budget</text>
<line x1="80" y1="227" x2="472" y2="227" stroke="#E4E9EE" stroke-width="1"/>
<circle cx="534" cy="203.5" r="10" fill="#F7E4E3" stroke="#B03A3A" stroke-width="1.2"/><path d="M530.6 200.1 L537.4 206.9 M537.4 200.1 L530.6 206.9" fill="none" stroke="#B03A3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="556" y="208" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">Twelve years of ETL jobs need rewriting</text>
<line x1="556" y1="227" x2="948" y2="227" stroke="#E4E9EE" stroke-width="1"/>
<circle cx="58" cy="250.5" r="10" fill="#E3F1E8" stroke="#2E7A4E" stroke-width="1.2"/><path d="M53.6 250.8 L56.7 253.9 L62.6 247.2" fill="none" stroke="#2E7A4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="255" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">The vendor handles patching, backups and failover</text>
<line x1="80" y1="274" x2="472" y2="274" stroke="#E4E9EE" stroke-width="1"/>
<circle cx="534" cy="250.5" r="10" fill="#F7E4E3" stroke="#B03A3A" stroke-width="1.2"/><path d="M530.6 247.1 L537.4 253.9 M537.4 247.1 L530.6 253.9" fill="none" stroke="#B03A3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="556" y="255" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">Monthly query costs are harder to forecast</text>
<circle cx="58" cy="297.5" r="10" fill="#E3F1E8" stroke="#2E7A4E" stroke-width="1.2"/><path d="M53.6 297.8 L56.7 300.9 L62.6 294.2" fill="none" stroke="#2E7A4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="302" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">Analysts can create sandboxes in minutes</text>
<line x1="80" y1="321" x2="472" y2="321" stroke="#E4E9EE" stroke-width="1"/>
<circle cx="58" cy="344.5" r="10" fill="#E3F1E8" stroke="#2E7A4E" stroke-width="1.2"/><path d="M53.6 344.8 L56.7 347.9 L62.6 341.2" fill="none" stroke="#2E7A4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="349" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430">Pay-per-query absorbs the month-end spike</text>
