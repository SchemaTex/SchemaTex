<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1383 1352" width="1383" height="1352" role="img">
  <title>Four-day work week becomes standard — futures wheel</title>
  <desc>A futures wheel. The central change, "Four-day work week becomes standard", sits in a dark oval in the middle. Five first-order consequences sit on the first ring, each a filled oval in its own colour joined to the centre by a single line. Each has two second-order consequences on the second ring in tinted ovals joined by double lines, and five of those lead to a third-order consequence on the outer ring in an outlined oval joined by triple lines. The rings are labelled at the bottom and a key in the lower-left corner explains the line styles. Nothing overlaps.</desc>
