<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0ea5e9"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- outer walls -->
    <rect x="6" y="6" width="20" height="20" rx="1"/>
    <!-- interior walls: vertical divider -->
    <line x1="16" y1="6" x2="16" y2="20"/>
    <!-- interior walls: horizontal divider -->
    <line x1="6" y1="20" x2="26" y2="20"/>
    <!-- door gap on vertical wall -->
    <line x1="16" y1="12" x2="16" y2="15"/>
  </g>
</svg>
